tinian had Hagia Sophia built by the mathematician-architects Anthemius of Tralles and Isidore of Miletus.", "detail": ["The dome, about 31 metres across, sits on a square plan thanks to pendentives, a major innovation. It collapsed in an earthquake in 558 and was rebuilt higher."]}, "id": "x-12-6", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1305, "era": {"tr": "14. yüzyıl", "fr": "14e siècle", "en": "14th century"}, "region": "europe", "medium": "painting", "tags": ["medieval", "renaissance", "painting", "r-europe"], "topics": ["medieval", "renaissance", "painting", "r-europe"], "search": {"commons": "Giotto Scrovegni Chapel", "wiki": {"en": "Giotto Scrovegni Chapel"}}, "answer": true, "tr": {"q": "Giotto'nun Padova'daki Scrovegni Şapeli freskleri, tefeci olarak tanınan bir ailenin günahlarını bağışlatma amacıyla yaptırılmıştı.", "exp": "Doğru. Enrico Scrovegni, Dante'nin Cehennem'de tefeci olarak andığı babası Reginaldo'nun günahlarına karşılık şapeli yaptırdı.", "detail": ["Giotto yaklaşık 1305'te Meryem'in ve İsa'nın hayatını anlatan freskleri bitirdi. Hacmi, duyguyu ve mekânı gösterme biçimiyle Bizans geleneğinden kopup Rönesans'a giden yolu açtı."]}, "fr": {"q": "Les fresques de Giotto à la chapelle des Scrovegni, à Padoue, ont été commandées pour racheter les péchés d'une famille connue pour l'usure.", "exp": "Vrai. Enrico Scrovegni fait construire la chapelle pour expier les péchés de son père Reginaldo, que Dante place parmi les usuriers dans l'Enfer.", "detail": ["Giotto achève vers 1305 les fresques sur la vie de la Vierge et du Christ. Par sa manière de montrer le volume, l'émotion et l'espace, il quitte la tradition byzantine et ouvre la voie à la Renaissance."]}, "en": {"q": "Giotto's frescoes in the Scrovegni Chapel in Padua were commissioned to make up for the sins of a family known for usury.", "exp": "True. Enrico Scrovegni built the chapel to atone for the sins of his father Reginaldo, whom Dante placed among the usurers in Hell.", "detail": ["Giotto finished the frescoes on the lives of the Virgin and Christ around 1305. His way of showing volume, emotion and space broke with Byzantine tradition and opened the road to the Renaissance."]}, "id": "x-12-7", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1150, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "europe", "medium": "design", "tags": ["medieval", "women", "r-europe"], "topics": ["medieval", "women", "r-europe"], "search": {"commons": "Hildegard of Bingen Scivias", "wiki": {"en": "Hildegard of Bingen Scivias"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["12. yüzyılda Almanya'da bir manastırın başrahibesiydim.", "Gördüğüm vizyonları 'Scivias' adlı kitapta anlattım ve resimlendirdim.", "Besteci, doğa bilimci ve yazar olarak da tanınırım; 2012'de Kilise Doktoru ilan edildim."], "opts": ["Herrad of Landsberg", "Christine de Pizan", "Bingenli Hildegard", "Ende"], "exp": "Cevap Bingenli Hildegard'dır. Ortaçağın en çok yönlü kadınlarından biridir.", "detail": ["Scivias'ın resimli el yazmasının orijinali İkinci Dünya Savaşı'nda kayboldu; bugün 1920'lerde yapılmış bir kopyası bilinir. Hildegard'ın müziği de bugün hâlâ kaydedilir ve seslendirilir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Au XIIe siècle, j'étais abbesse d'un monastère en Allemagne.", "J'ai décrit et fait illustrer mes visions dans un livre appelé « Scivias ».", "Je suis aussi connue comme compositrice, naturaliste et écrivaine ; j'ai été proclamée docteure de l'Église en 2012."], "opts": ["Herrade de Landsberg", "Christine de Pizan", "Hildegarde de Bingen", "Ende"], "exp": "La réponse est Hildegarde de Bingen, l'une des femmes les plus polyvalentes du Moyen Âge.", "detail": ["Le manuscrit illustré original du Scivias a disparu pendant la Seconde Guerre mondiale ; on connaît une copie faite dans les années 1920. Sa musique est encore enregistrée et jouée aujourd'hui."]}, "en": {"q": "Who am I?", "clues": ["In the 12th century I was abbess of a convent in Germany.", "I described and had illustrated my visions in a book called 'Scivias'.", "I am also known as a composer, naturalist and writer; I was declared a Doctor of the Church in 2012."], "opts": ["Herrad of Landsberg", "Christine de Pizan", "Hildegard of Bingen", "Ende"], "exp": "The answer is Hildegard of Bingen, one of the most versatile women of the Middle Ages.", "detail": ["The original illustrated manuscript of Scivias was lost in the Second World War; a copy made in the 1920s survives. Her music is still recorded and performed today."]}, "id": "x-12-8", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1486, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "Botticelli The Birth of Venus", "wiki": {"en": "The Birth of Venus"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Tiziano – Urbino Venüsü", "Botticelli – Venüs'ün Doğuşu", "Giorgione – Uyuyan Venüs", "Raffaello – Galatea'nın Zaferi"], "exp": "Sandro Botticelli'nin Venüs'ün Doğuşu (1480'ler), denizden doğan tanrıçanın bir deniz kabuğu üzerinde kıyıya gelişini gösterir.", "detail": ["Tablo, Medici çevresindeki Neoplatonik fikirlerle ilişkilendirilir. Antik mitolojiden büyük ölçekli bir çıplak kadın figürü, Rönesans'ta yeni bir cesaretti. Eser Floransa'daki Uffizi'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Titien – La Vénus d'Urbin", "Botticelli – La Naissance de Vénus", "Giorgione – Vénus endormie", "Raphaël – Le Triomphe de Galatée"], "exp": "La Naissance de Vénus de Sandro Botticelli (années 1480) montre la déesse née de la mer qui arrive sur le rivage sur une coquille.", "detail": ["Le tableau est lié aux idées néoplatoniciennes du cercle des Médicis. Un grand nu féminin venu de la mythologie antique était une nouveauté audacieuse. L'œuvre est aux Offices, à Florence."]}, "en": {"q": "Which work is this?", "opts": ["Titian – Venus of Urbino", "Botticelli – The Birth of Venus", "Giorgione – Sleeping Venus", "Raphael – The Triumph of Galatea"], "exp": "Sandro Botticelli's The Birth of Venus (1480s) shows the sea-born goddess arriving on the shore on a shell.", "detail": ["The painting is linked to Neoplatonic ideas in the Medici circle. A large female nude from ancient myth was a bold novelty. The work is in the Uffizi in Florence."]}, "id": "x-12-9", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1512, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "Sistine Chapel ceiling", "wiki": {"en": "Sistine Chapel ceiling"}}, "answer": 3, "tr": {"q": "Michelangelo Sistina Şapeli'nin tavan fresklerini hangi papanın siparişiyle yaptı?", "opts": ["X. Leo", "VI. Aleksandr", "III. Paulus", "II. Julius"], "exp": "Papa II. Julius, Michelangelo'ya 1508'de tavanı sipariş etti; fresk 1512'de tamamlandı.", "detail": ["Michelangelo kendini heykeltıraş olarak görüyordu ve bu işi istemeyerek kabul etti. Tavanda Yaratılış'tan sahneler vardır; en ünlüsü 'Âdem'in Yaratılışı'dır. Arka duvardaki 'Kıyamet Günü'nü ise yıllar sonra, Papa III. Paulus için yaptı."]}, "fr": {"q": "Pour quel pape Michel-Ange a-t-il peint le plafond de la chapelle Sixtine ?", "opts": ["Léon X", "Alexandre VI", "Paul III", "Jules II"], "exp": "Le pape Jules II commande le plafond à Michel-Ange en 1508 ; la fresque est achevée en 1512.", "detail": ["Michel-Ange se voyait comme sculpteur et accepte ce travail à contrecœur. Le plafond montre des scènes de la Genèse, dont la célèbre « Création d'Adam ». Il peint le « Jugement dernier », sur le mur du fond, des années plus tard pour Paul III."]}, "en": {"q": "For which pope did Michelangelo paint the Sistine Chapel ceiling?", "opts": ["Leo X", "Alexander VI", "Paul III", "Julius II"], "exp": "Pope Julius II commissioned the ceiling from Michelangelo in 1508; the fresco was finished in 1512.", "detail": ["Michelangelo saw himself as a sculptor and took on the job unwillingly. The ceiling shows scenes from Genesis, the most famous being 'The Creation of Adam'. He painted the 'Last Judgement' on the altar wall years later for Paul III."]}, "id": "x-12-10", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1503, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "Mona Lisa", "wiki": {"en": "Mona Lisa"}}, "answer": true, "tr": {"q": "Mona Lisa 1911'de Louvre'dan çalındı ve iki yıl sonra Floransa'da bulundu.", "exp": "Doğru. İtalyan işçi Vincenzo Peruggia tabloyu 1911'de çaldı; 1913'te Floransa'da satmaya çalışırken yakalandı.", "detail": ["Hırsızlık, tabloyu dünya çapında ünlü yaptı; gazeteler aylarca boş duvarın fotoğraflarını bastı. Bir ara Picasso ve Apollinaire bile sorgulandı. Tablo 1503 civarında başlandı ve Leonardo onu yıllarca yanında taşıdı."]}, "fr": {"q": "La Joconde a été volée au Louvre en 1911 et retrouvée deux ans plus tard à Florence.", "exp": "Vrai. L'ouvrier italien Vincenzo Peruggia la vole en 1911 ; il est arrêté en 1913 à Florence en essayant de la vendre.", "detail": ["Le vol rend le tableau célèbre dans le monde entier : les journaux publient pendant des mois des photos du mur vide. Picasso et Apollinaire ont même été interrogés. Léonard l'a commencé vers 1503 et l'a gardé avec lui des années."]}, "en": {"q": "The Mona Lisa was stolen from the Louvre in 1911 and found two years later in Florence.", "exp": "True. The Italian worker Vincenzo Peruggia stole it in 1911; he was caught in 1913 in Florence trying to sell it.", "detail": ["The theft made the painting world-famous; newspapers printed photos of the empty wall for months. Even Picasso and Apollinaire were questioned. Leonardo began it around 1503 and kept it with him for years."]}, "id": "x-12-11", "t": 1794800000000}, {"type": "match", "level": 2, "year": 1500, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "europe", "medium": "sculpture", "tags": ["renaissance", "sculpture", "r-europe"], "topics": ["renaissance", "sculpture", "r-europe"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Rönesans sanatçılarını eserleriyle eşleştir.", "left": ["Donatello", "Michelangelo", "Lorenzo Ghiberti", "Filippo Brunelleschi"], "right": ["Bronz Davut", "Mermer Davut", "Floransa Vaftizhanesi'nin 'Cennet Kapıları'", "Floransa Katedrali'nin kubbesi"], "exp": "Dördü de Floransa'da çalışan Rönesans ustalarıdır.", "detail": ["Donatello'nun bronz Davut'u (1440'lar) antik çağdan beri ilk serbest duran çıplak bronz heykellerden biridir. Michelangelo'nun mermer Davut'u 1504'te bitti. Ghiberti kapılar üzerinde yaklaşık 27 yıl çalıştı; Michelangelo onları 'Cennet Kapıları' diye andı."]}, "fr": {"q": "Associe chaque artiste de la Renaissance à son œuvre.", "left": ["Donatello", "Michel-Ange", "Lorenzo Ghiberti", "Filippo Brunelleschi"], "right": ["Le David en bronze", "Le David en marbre", "La « Porte du Paradis » du baptistère de Florence", "La coupole de la cathédrale de Florence"], "exp": "Ces quatre maîtres de la Renaissance ont travaillé à Florence.", "detail": ["Le David en bronze de Donatello (années 1440) est l'un des premiers nus en bronze autonomes depuis l'Antiquité. Le David de Michel-Ange est achevé en 1504. Ghiberti a travaillé environ 27 ans sur les portes, que Michel-Ange appelait la « Porte du Paradis »."]}, "en": {"q": "Match each Renaissance artist with his work.", "left": ["Donatello", "Michelangelo", "Lorenzo Ghiberti", "Filippo Brunelleschi"], "right": ["The bronze David", "The marble David", "The 'Gates of Paradise' of the Florence Baptistery", "The dome of Florence Cathedral"], "exp": "All four were Renaissance masters working in Florence.", "detail": ["Donatello's bronze David (1440s) is one of the first free-standing bronze nudes since antiquity. Michelangelo's marble David was finished in 1504. Ghiberti worked about 27 years on the doors, which Michelangelo called the 'Gates of Paradise'."]}, "id": "x-12-12", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1434, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "Arnolfini Portrait", "wiki": {"en": "Arnolfini Portrait"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Bruges'de çalıştım ve Burgonya Dükü İyi Philippe'in saray ressamıydım.", "Yağlıboyayı çok ince katmanlarla kullanarak mücevher gibi parlak ayrıntılar elde ettim.", "1434'te bir çifti, arkalarındaki dışbükey aynada yansıyan iki figürle resmettim ve duvara 'buradaydım' yazdım."], "opts": ["Jan van Eyck", "Rogier van der Weyden", "Hans Memling", "Hieronymus Bosch"], "exp": "Cevap Jan van Eyck'tir. 'Arnolfini Portresi' (1434) Londra'daki National Gallery'dedir.", "detail": ["Aynanın üstündeki Latince yazı 'Jan van Eyck buradaydı 1434' anlamına gelir. Van Eyck, yağlıboyayı icat etmedi ama onu yeni bir ustalık düzeyine taşıdı. Kardeşi Hubert ile birlikte Gent Sunağı'nı da yaptı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai travaillé à Bruges et j'étais peintre de cour du duc de Bourgogne Philippe le Bon.", "J'utilisais la peinture à l'huile en couches très fines pour obtenir des détails brillants comme des bijoux.", "En 1434, j'ai peint un couple, avec deux figures reflétées dans un miroir convexe, et j'ai écrit au mur « j'étais ici »."], "opts": ["Jan van Eyck", "Rogier van der Weyden", "Hans Memling", "Jérôme Bosch"], "exp": "La réponse est Jan van Eyck. « Les Époux Arnolfini » (1434) sont à la National Gallery de Londres.", "detail": ["L'inscription latine au-dessus du miroir signifie « Jan van Eyck était ici, 1434 ». Il n'a pas inventé la peinture à l'huile, mais il l'a portée à un niveau nouveau. Avec son frère Hubert, il a aussi peint le retable de Gand."]}, "en": {"q": "Who am I?", "clues": ["I worked in Bruges and was court painter to Philip the Good, Duke of Burgundy.", "I used oil paint in very thin layers to get jewel-like, glowing details.", "In 1434 I painted a couple, with two figures reflected in a convex mirror behind them, and wrote 'I was here' on the wall."], "opts": ["Jan van Eyck", "Rogier van der Weyden", "Hans Memling", "Hieronymus Bosch"], "exp": "The answer is Jan van Eyck. 'The Arnolfini Portrait' (1434) is in the National Gallery in London.", "detail": ["The Latin words above the mirror mean 'Jan van Eyck was here 1434'. He did not invent oil painting, but raised it to a new level. With his brother Hubert he also made the Ghent Altarpiece."]}, "id": "x-12-13", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1642, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "Rembrandt The Night Watch", "wiki": {"en": "The Night Watch"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Vermeer – Delft Manzarası", "Frans Hals – Aziz George Milis Subaylarının Ziyafeti", "Rembrandt – Gece Devriyesi", "Velázquez – Breda'nın Teslimi"], "exp": "Rembrandt'ın Gece Devriyesi (1642), Kaptan Frans Banninck Cocq'un milis birliğini hareket hâlinde, güçlü ışık-gölge karşıtlıklarıyla gösterir.", "detail": ["Tablo aslında gündüz sahnesidir; adını sonradan koyulaşan vernikten aldı. 1715'te bir salona sığdırmak için kenarları kesildi. Amsterdam'daki Rijksmuseum'da 'Operation Night Watch' adıyla kamuya açık biçimde restore edildi."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Vermeer – Vue de Delft", "Frans Hals – Banquet des officiers de la garde civique de Saint-Georges", "Rembrandt – La Ronde de nuit", "Velázquez – La Reddition de Breda"], "exp": "La Ronde de nuit de Rembrandt (1642) montre la compagnie de milice du capitaine Frans Banninck Cocq en mouvement, avec de forts contrastes d'ombre et de lumière.", "detail": ["C'est en réalité une scène de jour ; son nom vient du vernis qui a noirci. En 1715, on a coupé ses bords pour la faire entrer dans une salle. Elle a été restaurée devant le public au Rijksmuseum d'Amsterdam (« Operation Night Watch »)."]}, "en": {"q": "Which work is this?", "opts": ["Vermeer – View of Delft", "Frans Hals – Banquet of the Officers of the St George Militia", "Rembrandt – The Night Watch", "Velázquez – The Surrender of Breda"], "exp": "Rembrandt's The Night Watch (1642) shows Captain Frans Banninck Cocq's militia company in motion, with strong contrasts of light and shadow.", "detail": ["It is actually a daytime scene; the name comes from darkened varnish. In 1715 its edges were cut to fit it into a room. It was restored in public view at the Rijksmuseum in Amsterdam ('Operation Night Watch')."]}, "id": "x-12-14", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1620, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "women", "r-europe"], "topics": ["baroque", "painting", "women", "r-europe"], "search": {"commons": "Artemisia Gentileschi Judith Slaying Holofernes", "wiki": {"en": "Judith Slaying Holofernes (Artemisia Gentileschi)"}}, "answer": 1, "tr": {"q": "Floransa Desen Akademisi'ne kabul edilen ilk kadın ve 'Holofernes'in Başını Kesen Judith' tablosunun ressamı kimdir?", "opts": ["Sofonisba Anguissola", "Artemisia Gentileschi", "Judith Leyster", "Elisabetta Sirani"], "exp": "Artemisia Gentileschi 1616'da Floransa'daki Accademia delle Arti del Disegno'ya kabul edilen ilk kadın oldu.", "detail": ["Caravaggio'nun ışık-gölge anlayışından etkilendi ve güçlü kadın kahramanları dramatik bir şiddetle resmetti. 'Holofernes'in Başını Kesen Judith'in bir versiyonu Uffizi'dedir. Eserleri son yıllarda büyük sergilerle yeniden keşfedildi."]}, "fr": {"q": "Qui a été la première femme admise à l'Académie du dessin de Florence et a peint « Judith décapitant Holopherne » ?", "opts": ["Sofonisba Anguissola", "Artemisia Gentileschi", "Judith Leyster", "Elisabetta Sirani"], "exp": "Artemisia Gentileschi devient en 1616 la première femme admise à l'Accademia delle Arti del Disegno de Florence.", "detail": ["Influencée par le clair-obscur du Caravage, elle peint des héroïnes fortes avec une violence dramatique. Une version de « Judith décapitant Holopherne » est aux Offices. Son œuvre a été redécouverte ces dernières années par de grandes expositions."]}, "en": {"q": "Who was the first woman admitted to the Florence Academy of Design and painted 'Judith Slaying Holofernes'?", "opts": ["Sofonisba Anguissola", "Artemisia Gentileschi", "Judith Leyster", "Elisabetta Sirani"], "exp": "Artemisia Gentileschi became in 1616 the first woman admitted to the Accademia delle Arti del Disegno in Florence.", "detail": ["Influenced by Caravaggio's light and shadow, she painted strong heroines with dramatic violence. A version of 'Judith Slaying Holofernes' is in the Uffizi. Her work has been rediscovered in recent years through major exhibitions."]}, "id": "x-12-15", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1656, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "Las Meninas Velázquez", "wiki": {"en": "Las Meninas Velázquez"}}, "answer": true, "tr": {"q": "Velázquez'in 'Nedimeler' (Las Meninas) tablosunda ressamın kendisi de tuvalinin başında çalışırken görünür.", "exp": "Doğru. Velázquez solda, büyük bir tuvalin önünde fırçasıyla durur; arka duvardaki aynada kral ve kraliçe yansır.", "detail": ["1656 tarihli tablo, kimin kime baktığı sorusuyla izleyiciyi sahnenin içine çeker. Picasso 1957'de bu tablonun 58 çeşitlemesini yaptı. Eser Madrid'deki Prado Müzesi'ndedir."]}, "fr": {"q": "Dans « Les Ménines » de Velázquez, le peintre lui-même apparaît au travail devant sa toile.", "exp": "Vrai. Velázquez se tient à gauche, pinceau à la main, devant une grande toile ; le roi et la reine se reflètent dans un miroir au fond.", "detail": ["Le tableau de 1656 fait entrer le spectateur dans la scène avec la question : qui regarde qui ? Picasso en a peint 58 variations en 1957. L'œuvre est au musée du Prado, à Madrid."]}, "en": {"q": "In Velázquez's 'Las Meninas', the painter himself appears working at his canvas.", "exp": "True. Velázquez stands on the left with his brush before a large canvas; the king and queen are reflected in a mirror at the back.", "detail": ["The 1656 painting pulls the viewer into the scene with the question of who is looking at whom. Picasso made 58 variations of it in 1957. The work is in the Prado in Madrid."]}, "id": "x-12-16", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1652, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "sculpture", "tags": ["baroque", "sculpture", "r-europe"], "topics": ["baroque", "sculpture", "r-europe"], "search": {"commons": "Bernini Ecstasy of Saint Teresa", "wiki": {"en": "Bernini Ecstasy of Saint Teresa"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Napoli'de doğdum ve Roma'nın Barok yüzünü şekillendirdim.", "Aziz Petrus Bazilikası'nın önündeki sütunlu meydanı ve içindeki bronz baldakeni tasarladım.", "Santa Maria della Vittoria kilisesindeki 'Azize Teresa'nın Vecdi'ni yaptım."], "opts": ["Francesco Borromini", "Alessandro Algardi", "Pietro da Cortona", "Gian Lorenzo Bernini"], "exp": "Cevap Gian Lorenzo Bernini'dir. Heykel, mimari ve ışığı tek bir tiyatral deneyimde birleştirdi.", "detail": ["'Azize Teresa'nın Vecdi' (1647–52) Cornaro Şapeli'nde gizli bir pencereden gelen ışıkla aydınlanır. Bernini'nin rakibi Borromini, daha karmaşık ve kıvrımlı bir mimari diliyle tanınır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Naples et j'ai façonné le visage baroque de Rome.", "J'ai dessiné la place à colonnades devant la basilique Saint-Pierre et le baldaquin en bronze à l'intérieur.", "J'ai sculpté « L'Extase de sainte Thérèse » dans l'église Santa Maria della Vittoria."], "opts": ["Francesco Borromini", "Alessandro Algardi", "Pierre de Cortone", "Gian Lorenzo Bernini"], "exp": "La réponse est Gian Lorenzo Bernini (le Bernin). Il réunit sculpture, architecture et lumière dans une seule expérience théâtrale.", "detail": ["« L'Extase de sainte Thérèse » (1647–1652), dans la chapelle Cornaro, est éclairée par une fenêtre cachée. Son rival Borromini est connu pour une architecture plus complexe et ondulante."]}, "en": {"q": "Who am I?", "clues": ["I was born in Naples and shaped the Baroque face of Rome.", "I designed the colonnaded square in front of St Peter's Basilica and the bronze baldachin inside.", "I made 'The Ecstasy of Saint Teresa' in the church of Santa Maria della Vittoria."], "opts": ["Francesco Borromini", "Alessandro Algardi", "Pietro da Cortona", "Gian Lorenzo Bernini"], "exp": "The answer is Gian Lorenzo Bernini. He combined sculpture, architecture and light into a single theatrical experience.", "detail": ["'The Ecstasy of Saint Teresa' (1647–52), in the Cornaro Chapel, is lit by a hidden window. His rival Borromini is known for a more complex, undulating architecture."]}, "id": "x-12-17", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1665, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "Vermeer Girl with a Pearl Earring", "wiki": {"en": "Girl with a Pearl Earring"}}, "answer": 0, "tr": {"q": "Vermeer'in 'İnci Küpeli Kız' tablosu gerçek bir portre değil, bir 'tronie'dir. Tronie nedir?", "opts": ["Hayalî ya da tip bir yüzün, kostümlü olarak resmedildiği karakter çalışması", "Kilise için yapılan küçük bir sunak resmi", "Bir ailenin bütün üyelerini gösteren grup portresi", "Ölümü hatırlatan natürmort"], "exp": "Tronie, belirli bir kişiyi değil, bir karakter tipini ya da ifadeyi gösteren Hollanda'ya özgü bir resim türüdür.", "detail": ["Kızın türbanı ve büyük incisi egzotik bir kostümün parçasıdır; modelin kimliği bilinmez. Tablo yaklaşık 1665 tarihlidir ve Lahey'deki Mauritshuis'tedir. 2018'deki araştırma, arka planın aslında yeşil bir perde olduğunu gösterdi."]}, "fr": {"q": "« La Jeune Fille à la perle » de Vermeer n'est pas un vrai portrait, mais une « tronie ». Qu'est-ce qu'une tronie ?", "opts": ["Une étude de personnage, un visage imaginaire ou typique peint en costume", "Un petit retable pour une église", "Un portrait de groupe d'une famille entière", "Une nature morte qui rappelle la mort"], "exp": "La tronie est un genre hollandais qui montre un type de personnage ou une expression, et non une personne précise.", "detail": ["Le turban et la grosse perle font partie d'un costume exotique ; on ne connaît pas l'identité du modèle. Le tableau date d'environ 1665 et se trouve au Mauritshuis de La Haye. Une étude de 2018 a montré que le fond était à l'origine un rideau vert."]}, "en": {"q": "Vermeer's 'Girl with a Pearl Earring' is not a real portrait but a 'tronie'. What is a tronie?", "opts": ["A character study of an imaginary or typical face in costume", "A small altarpiece for a church", "A group portrait of a whole family", "A still life that reminds us of death"], "exp": "A tronie is a Dutch genre showing a character type or expression rather than a specific person.", "detail": ["The turban and large pearl are part of an exotic costume; the model's identity is unknown. The painting dates from about 1665 and is in the Mauritshuis in The Hague. A 2018 study showed that the background was originally a green curtain."]}, "id": "x-12-18", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1831, "era": {"tr": "1830'ler", "fr": "Années 1830", "en": "1830s"}, "region": "asia", "medium": "print", "tags": ["r-fareast", "c19", "painting"], "topics": ["r-fareast", "c19", "painting"], "search": {"commons": "Hokusai The Great Wave off Kanagawa", "wiki": {"en": "The Great Wave off Kanagawa"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Hiroshige – Ōhashi'de Ani Yağmur", "Utamaro – Üç Güzel", "Sharaku – Ōtani Oniji", "Hokusai – Kanagawa Açıklarında Büyük Dalga"], "exp": "Katsushika Hokusai'nin Büyük Dalga'sı (yaklaşık 1831), 'Fuji Dağı'nın Otuz Altı Manzarası' serisinin bir ahşap baskısıdır.", "detail": ["Dev dalga, küçük teknelerdeki kürekçilerin üzerine kıvrılır; arkada Fuji Dağı küçük görünür. Baskıda Avrupa'dan gelen 'Prusya mavisi' kullanıldı. Binlerce kopya basıldı; birçok müzede örnekleri vardır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Hiroshige – Averse soudaine sur le pont Ōhashi", "Utamaro – Trois beautés", "Sharaku – Ōtani Oniji", "Hokusai – La Grande Vague de Kanagawa"], "exp": "La Grande Vague de Katsushika Hokusai (vers 1831) est une estampe sur bois de la série « Trente-six vues du mont Fuji ».", "detail": ["La vague géante se courbe au-dessus des rameurs dans de petites barques ; le mont Fuji paraît minuscule au fond. L'estampe utilise le « bleu de Prusse », venu d'Europe. Des milliers d'exemplaires ont été imprimés ; beaucoup de musées en possèdent."]}, "en": {"q": "Which work is this?", "opts": ["Hiroshige – Sudden Shower over Ōhashi Bridge", "Utamaro – Three Beauties", "Sharaku – Ōtani Oniji", "Hokusai – The Great Wave off Kanagawa"], "exp": "Katsushika Hokusai's Great Wave (about 1831) is a woodblock print from the series 'Thirty-six Views of Mount Fuji'.", "detail": ["The giant wave curls over rowers in small boats; Mount Fuji looks tiny in the background. The print uses 'Prussian blue', imported from Europe. Thousands of copies were printed and many museums own one."]}, "id": "x-13-0", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1867, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "asia", "medium": "print", "tags": ["r-fareast", "c19", "impressionism", "postimpressionism"], "topics": ["r-fareast", "c19", "impressionism", "postimpressionism"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "19. yüzyılın sonunda Japon sanatının, özellikle ukiyo-e baskılarının Avrupa sanatı üzerindeki etkisine ne ad verilir?", "opts": ["Chinoiserie", "Japonizm", "Oryantalizm", "Primitivizm"], "exp": "'Japonisme' (Japonizm) terimi, 1872'de Fransız eleştirmen Philippe Burty tarafından kullanıldı.", "detail": ["1867 Paris Dünya Fuarı'ndan sonra Japon baskıları Avrupa'da çok popüler oldu. Monet, Degas, Van Gogh, Whistler ve Toulouse-Lautrec düz renk alanlarından, alışılmadık kadrajlardan ve günlük yaşam konularından etkilendi. Van Gogh, Hiroshige baskılarını yağlıboyayla kopyaladı."]}, "fr": {"q": "Comment appelle-t-on l'influence de l'art japonais, surtout des estampes ukiyo-e, sur l'art européen de la fin du XIXe siècle ?", "opts": ["La chinoiserie", "Le japonisme", "L'orientalisme", "Le primitivisme"], "exp": "Le terme « japonisme » est utilisé en 1872 par le critique français Philippe Burty.", "detail": ["Après l'Exposition universelle de Paris de 1867, les estampes japonaises deviennent très populaires en Europe. Monet, Degas, Van Gogh, Whistler et Toulouse-Lautrec s'inspirent des aplats de couleur, des cadrages inhabituels et des scènes quotidiennes. Van Gogh a copié des estampes de Hiroshige à l'huile."]}, "en": {"q": "What is the influence of Japanese art, especially ukiyo-e prints, on late 19th-century European art called?", "opts": ["Chinoiserie", "Japonisme", "Orientalism", "Primitivism"], "exp": "The term 'Japonisme' was used in 1872 by the French critic Philippe Burty.", "detail": ["After the 1867 Paris World's Fair, Japanese prints became very popular in Europe. Monet, Degas, Van Gogh, Whistler and Toulouse-Lautrec drew on flat colour areas, unusual framing and everyday subjects. Van Gogh copied Hiroshige prints in oil."]}, "id": "x-13-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1499, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "asia", "medium": "arch", "tags": ["r-fareast", "renaissance", "architecture"], "topics": ["r-fareast", "renaissance", "architecture"], "search": {"commons": "Ryoan-ji rock garden", "wiki": {"en": "Ryoan-ji rock garden"}}, "answer": true, "tr": {"q": "Kyoto'daki Ryōan-ji tapınağının ünlü taş bahçesinde 15 taş vardır, ama bahçenin hiçbir noktasından hepsi aynı anda görülemez.", "exp": "Doğru. Taşlar öyle düzenlenmiştir ki verandanın neresinden bakılırsa bakılsın en az biri gizli kalır.", "detail": ["Bahçe beyaz çakıl ve yosunlu taş gruplarından oluşan bir 'karesansui' (kuru manzara) bahçesidir; 15. yüzyılın sonuna tarihlenir ama yapımcısı kesin bilinmez. Zen düşüncesiyle ilişkilendirilir ve UNESCO listesindedir."]}, "fr": {"q": "Le célèbre jardin de pierres du temple Ryōan-ji à Kyoto contient 15 pierres, mais on ne peut jamais les voir toutes en même temps.", "exp": "Vrai. Les pierres sont placées de sorte qu'au moins une reste cachée, quel que soit l'endroit de la véranda d'où l'on regarde.", "detail": ["C'est un jardin « karesansui » (paysage sec) de gravier blanc et de groupes de pierres avec de la mousse ; il date de la fin du XVe siècle, mais on ne connaît pas son auteur avec certitude. Il est lié à la pensée zen et classé à l'UNESCO."]}, "en": {"q": "The famous rock garden of Ryōan-ji temple in Kyoto has 15 stones, but you can never see all of them at once.", "exp": "True. The stones are placed so that at least one stays hidden from any point on the veranda.", "detail": ["It is a 'karesansui' (dry landscape) garden of white gravel and mossy stone groups; it dates from the late 15th century, but its maker is not known for sure. It is linked to Zen thought and is on the UNESCO list."]}, "id": "x-13-2", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1965, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "asia", "medium": "sculpture", "tags": ["r-fareast", "postwar", "contemporary", "sculpture", "women", "popart"], "topics": ["r-fareast", "postwar", "contemporary", "sculpture", "women", "popart"], "search": {"commons": "Yayoi Kusama Infinity Mirror Room", "wiki": {"en": "Yayoi Kusama Infinity Mirror Room"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Japonya'nın Matsumoto şehrinde doğdum ve 1958'de New York'a taşındım.", "Puantiyeler ve sonsuz ağ desenleri eserlerimin imzasıdır.", "1965'ten beri yaptığım 'Sonsuzluk Ayna Odaları' dünyanın en çok ziyaret edilen yerleştirmelerindendir; 1977'den beri Tokyo'da kendi isteğimle bir klinikte yaşıyorum."], "opts": ["Yayoi Kusama", "Yoko Ono", "Mariko Mori", "Atsuko Tanaka"], "exp": "Cevap Yayoi Kusama'dır. Puantiye ve sonsuzluk temaları, çocukluğundan beri yaşadığı halüsinasyonlardan beslenir.", "detail": ["New York'ta Warhol ve Oldenburg ile aynı sahnede çalıştı; bazı fikirlerinin taklit edildiğini düşündü. Tokyo'da 2017'de açılan Yayoi Kusama Müzesi vardır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Matsumoto, au Japon, et je suis partie à New York en 1958.", "Les pois et les motifs de filets infinis sont ma signature.", "Mes « Infinity Mirror Rooms », créées depuis 1965, sont parmi les installations les plus visitées au monde ; depuis 1977, je vis par choix dans une clinique à Tokyo."], "opts": ["Yayoi Kusama", "Yoko Ono", "Mariko Mori", "Atsuko Tanaka"], "exp": "La réponse est Yayoi Kusama. Ses pois et son thème de l'infini viennent des hallucinations qu'elle vit depuis l'enfance.", "detail": ["À New York, elle travaille sur la même scène que Warhol et Oldenburg, et pense que certaines de ses idées ont été copiées. Un musée Yayoi Kusama a ouvert à Tokyo en 2017."]}, "en": {"q": "Who am I?", "clues": ["I was born in Matsumoto, Japan, and moved to New York in 1958.", "Polka dots and infinite net patterns are my signature.", "My 'Infinity Mirror Rooms', made since 1965, are among the most visited installations in the world; since 1977 I have lived by choice in a clinic in Tokyo."], "opts": ["Yayoi Kusama", "Yoko Ono", "Mariko Mori", "Atsuko Tanaka"], "exp": "The answer is Yayoi Kusama. Her dots and infinity themes grow from hallucinations she has had since childhood.", "detail": ["In New York she worked on the same scene as Warhol and Oldenburg and felt some of her ideas were copied. The Yayoi Kusama Museum opened in Tokyo in 2017."]}, "id": "x-13-3", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1100, "era": {"tr": "11. yüzyıl", "fr": "11e siècle", "en": "11th century"}, "region": "asia", "medium": "painting", "tags": ["r-fareast", "medieval", "painting"], "topics": ["r-fareast", "medieval", "painting"], "search": {"commons": "Along the River During the Qingming Festival", "wiki": {"en": "Along the River During the Qingming Festival"}}, "answer": 2, "tr": {"q": "Kuzey Song hanedanı başkenti Kaifeng'in gündelik hayatını gösteren ünlü uzun el tomarı hangisidir?", "opts": ["Fuchun Dağlarında Yaşam", "Erken Bahar", "Qingming Festivalinde Nehir Boyunca", "Jiangshan'ın Bin Lisi"], "exp": "'Qingming Festivalinde Nehir Boyunca', Zhang Zeduan'a atfedilir ve 12. yüzyıl başına tarihlenir. Beş metreden uzun tomarda yüzlerce insan, tekne ve dükkân vardır.", "detail": ["Tomar sağdan sola açılarak kırsal alandan kalabalık köprüye ve şehir kapısına doğru bir yolculuk gibi izlenir. Orijinali Pekin'deki Saray Müzesi'ndedir ve çok nadiren sergilenir. Sonraki yüzyıllarda birçok kopyası yapıldı."]}, "fr": {"q": "Quel célèbre long rouleau montre la vie quotidienne de Kaifeng, capitale des Song du Nord ?", "opts": ["Séjour dans les monts Fuchun", "Début du printemps", "Le Long de la rivière pendant la fête de Qingming", "Mille li de rivières et de montagnes"], "exp": "« Le Long de la rivière pendant la fête de Qingming » est attribué à Zhang Zeduan et date du début du XIIe siècle. Le rouleau, long de plus de cinq mètres, montre des centaines de personnes, de bateaux et de boutiques.", "detail": ["On le déroule de droite à gauche, comme un voyage de la campagne jusqu'au pont animé et à la porte de la ville. L'original est au musée du Palais à Pékin et n'est montré que rarement. Il a été copié de nombreuses fois."]}, "en": {"q": "Which famous long handscroll shows everyday life in Kaifeng, capital of the Northern Song?", "opts": ["Dwelling in the Fuchun Mountains", "Early Spring", "Along the River During the Qingming Festival", "A Thousand Li of Rivers and Mountains"], "exp": "'Along the River During the Qingming Festival' is attributed to Zhang Zeduan and dates from the early 12th century. The scroll, over five metres long, shows hundreds of people, boats and shops.", "detail": ["It is unrolled from right to left like a journey from the countryside to a busy bridge and the city gate. The original is in the Palace Museum in Beijing and is rarely shown. It was copied many times in later centuries."]}, "id": "x-13-4", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 2008, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "asia", "medium": "concept", "tags": ["r-fareast", "contemporary", "sculpture"], "topics": ["r-fareast", "contemporary", "sculpture"], "search": {"commons": "Ai Weiwei Sunflower Seeds Tate", "wiki": {"en": "Ai Weiwei Sunflower Seeds Tate"}}, "answer": true, "tr": {"q": "Ai Weiwei'nin 2010'da Tate Modern'in Türbin Salonu'nu dolduran 'Ayçiçeği Tohumları' eseri, elle boyanmış porselen tohumlardan oluşur.", "exp": "Doğru. Jingdezhen'deki yüzlerce zanaatkâr, yaklaşık 100 milyon porselen tohumu tek tek elle şekillendirip boyadı.", "detail": ["Ayçiçeği tohumları, Mao döneminin propaganda imgelerini ve yoksulluk yıllarında paylaşılan yiyecekleri çağrıştırır. Ziyaretçiler başta tohumların üzerinde yürüyebiliyordu, ama porselen tozu sağlık riski taşıdığı için bu durduruldu."]}, "fr": {"q": "L'œuvre « Sunflower Seeds » d'Ai Weiwei, qui remplissait le Turbine Hall de la Tate Modern en 2010, est faite de graines en porcelaine peintes à la main.", "exp": "Vrai. Des centaines d'artisans de Jingdezhen ont façonné et peint à la main environ 100 millions de graines en porcelaine.", "detail": ["Les graines de tournesol évoquent les images de propagande de l'époque de Mao et la nourriture partagée pendant les années de pauvreté. Au début, les visiteurs pouvaient marcher dessus, mais on a arrêté à cause de la poussière de porcelaine."]}, "en": {"q": "Ai Weiwei's 'Sunflower Seeds', which filled Tate Modern's Turbine Hall in 2010, is made of hand-painted porcelain seeds.", "exp": "True. Hundreds of craftspeople in Jingdezhen shaped and painted about 100 million porcelain seeds by hand.", "detail": ["Sunflower seeds recall Mao-era propaganda images and the food shared in years of poverty. At first visitors could walk on the seeds, but this was stopped because porcelain dust was a health risk."]}, "id": "x-13-5", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1653, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "asia", "medium": "arch", "tags": ["r-southasia", "r-islam", "baroque", "architecture"], "topics": ["r-southasia", "r-islam", "baroque", "architecture"], "search": {"commons": "Taj Mahal", "wiki": {"en": "Taj Mahal"}}, "answer": 1, "tr": {"q": "Bu yapı hangisi?", "opts": ["Humayun Türbesi", "Tac Mahal", "Bibi Ka Maqbara", "Kutub Minar"], "exp": "Tac Mahal, Babür İmparatoru Şah Cihan'ın eşi Mümtaz Mahal için Agra'da yaptırdığı beyaz mermer türbedir (yaklaşık 1632–1653).", "detail": ["Yapının baş mimarı genellikle Ustad Ahmad Lahauri olarak kabul edilir. Mermer yüzeyler değerli taşlarla yapılan 'pietra dura' kakmalarla süslenmiştir. Delhi'deki Humayun Türbesi Tac Mahal'in öncüllerinden biridir."]}, "fr": {"q": "Quel est ce monument ?", "opts": ["Le tombeau d'Humayun", "Le Taj Mahal", "Le Bibi Ka Maqbara", "Le Qutb Minar"], "exp": "Le Taj Mahal est le mausolée de marbre blanc que l'empereur moghol Shah Jahan a fait construire à Agra pour son épouse Mumtaz Mahal (vers 1632–1653).", "detail": ["On attribue généralement l'architecture à Ustad Ahmad Lahauri. Les surfaces de marbre sont décorées de marqueterie de pierres précieuses (pietra dura). Le tombeau d'Humayun à Delhi est l'un de ses modèles."]}, "en": {"q": "Which building is this?", "opts": ["Humayun's Tomb", "The Taj Mahal", "Bibi Ka Maqbara", "Qutb Minar"], "exp": "The Taj Mahal is the white marble mausoleum that the Mughal emperor Shah Jahan built in Agra for his wife Mumtaz Mahal (about 1632–1653).", "detail": ["Its chief architect is usually said to be Ustad Ahmad Lahauri. The marble surfaces are decorated with 'pietra dura' inlay of precious stones. Humayun's Tomb in Delhi was one of its models."]}, "id": "x-13-6", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1947, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "asia", "medium": "painting", "tags": ["r-southasia", "postwar", "painting"], "topics": ["r-southasia", "postwar", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "1947'de, Hindistan'ın bağımsızlığı yılında Bombay'da kurulan ve M. F. Husain, S. H. Raza ve F. N. Souza'nın üye olduğu modernist grup hangisidir?", "opts": ["Progresif Sanatçılar Grubu", "Bengal Okulu", "Kalküta Grubu", "Santiniketan Okulu"], "exp": "Bombay Progresif Sanatçılar Grubu, F. N. Souza'nın önderliğinde 1947'de kuruldu ve Hint sanatını uluslararası modernizme açmak istedi.", "detail": ["Grup, ulusalcı Bengal Okulu'nun romantik geçmişe bakışından ayrıldı. Raza daha sonra Paris'e yerleşip 'bindu' (nokta) temalı soyut eserler yaptı. Husain, Hindistan'ın en ünlü ve en tartışmalı ressamlarından biri oldu."]}, "fr": {"q": "Quel groupe moderniste, fondé à Bombay en 1947, l'année de l'indépendance de l'Inde, réunissait M. F. Husain, S. H. Raza et F. N. Souza ?", "opts": ["Le Progressive Artists' Group", "L'école du Bengale", "Le Calcutta Group", "L'école de Santiniketan"], "exp": "Le Progressive Artists' Group de Bombay est fondé en 1947 sous l'impulsion de F. N. Souza ; il veut ouvrir l'art indien au modernisme international.", "detail": ["Le groupe s'éloigne du regard romantique vers le passé de l'école nationaliste du Bengale. Raza s'installe ensuite à Paris et peint des œuvres abstraites autour du « bindu » (point). Husain devient l'un des peintres indiens les plus célèbres et les plus controversés."]}, "en": {"q": "Which modernist group, founded in Bombay in 1947, the year of India's independence, included M. F. Husain, S. H. Raza and F. N. Souza?", "opts": ["The Progressive Artists' Group", "The Bengal School", "The Calcutta Group", "The Santiniketan School"], "exp": "The Bombay Progressive Artists' Group was founded in 1947, led by F. N. Souza, to open Indian art to international modernism.", "detail": ["The group broke with the nationalist Bengal School's romantic look at the past. Raza later settled in Paris and made abstract works on the 'bindu' (dot). Husain became one of India's most famous and controversial painters."]}, "id": "x-13-7", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1150, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "asia", "medium": "arch", "tags": ["r-southasia", "medieval", "architecture"], "topics": ["r-southasia", "medieval", "architecture"], "search": {"commons": "Angkor Wat west entrance", "wiki": {"en": "Angkor Wat west entrance"}}, "answer": true, "tr": {"q": "Angkor Wat, büyük Khmer tapınaklarının çoğunun aksine batıya, yani batan güneşe bakar.", "exp": "Doğru. Çoğu Khmer tapınağı doğuya bakarken Angkor Wat'ın ana girişi batıdadır.", "detail": ["Bu yön, batıyla ilişkilendirilen tanrı Vişnu'ya adanmasıyla ya da bir cenaze tapınağı olmasıyla açıklanır. Gün doğumunda güneş, tapınağın kulelerinin arkasından yükselir; bu manzara çok ünlüdür."]}, "fr": {"q": "Contrairement à la plupart des grands temples khmers, Angkor Vat est tourné vers l'ouest, vers le soleil couchant.", "exp": "Vrai. La plupart des temples khmers regardent vers l'est, mais l'entrée principale d'Angkor Vat est à l'ouest.", "detail": ["On explique cette orientation par sa dédicace à Vishnou, associé à l'ouest, ou par une fonction funéraire. Au lever du soleil, celui-ci monte derrière les tours du temple ; cette vue est très célèbre."]}, "en": {"q": "Unlike most great Khmer temples, Angkor Wat faces west, towards the setting sun.", "exp": "True. Most Khmer temples face east, but Angkor Wat's main entrance is on the west.", "detail": ["This is explained by its dedication to Vishnu, linked with the west, or by a funerary role. At sunrise the sun rises behind the temple's towers, a very famous view."]}, "id": "x-13-8", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1550, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "africa", "medium": "sculpture", "tags": ["r-africa", "renaissance", "sculpture"], "topics": ["r-africa", "renaissance", "sculpture"], "search": {"commons": "Benin Bronzes plaques British Museum", "wiki": {"en": "Benin Bronzes"}}, "answer": 2, "tr": {"q": "Bu tür pirinç levhalar ve heykeller hangi krallığa aittir?", "opts": ["Aksum Krallığı", "Mali İmparatorluğu", "Benin Krallığı", "Büyük Zimbabve"], "exp": "Bunlar, bugünkü Nijerya'daki Benin Krallığı'nın saray sanatçılarının yaptığı 'Benin Bronzları'dır; çoğu 16. ve 17. yüzyıllara tarihlenir.", "detail": ["1897'de İngiliz askerî seferi Benin City'yi yağmaladı ve binlerce eseri Avrupa'ya götürdü. Bugün bu eserlerin iadesi önemli bir tartışmadır; Almanya 2022'de yüzlerce eseri Nijerya'ya iade etmeye başladı."]}, "fr": {"q": "À quel royaume appartiennent ces plaques et sculptures en laiton ?", "opts": ["Le royaume d'Aksoum", "L'empire du Mali", "Le royaume du Bénin", "Le Grand Zimbabwe"], "exp": "Ce sont les « bronzes du Bénin », faits par les artistes de cour du royaume du Bénin, dans l'actuel Nigeria ; la plupart datent des XVIe et XVIIe siècles.", "detail": ["En 1897, une expédition militaire britannique pille Benin City et emporte des milliers d'œuvres en Europe. Leur restitution est aujourd'hui un grand débat ; l'Allemagne a commencé à rendre des centaines d'objets au Nigeria en 2022."]}, "en": {"q": "Which kingdom do these brass plaques and sculptures belong to?", "opts": ["The Kingdom of Aksum", "The Mali Empire", "The Kingdom of Benin", "Great Zimbabwe"], "exp": "These are the 'Benin Bronzes', made by court artists of the Kingdom of Benin in present-day Nigeria; most date from the 16th and 17th centuries.", "detail": ["In 1897 a British military expedition looted Benin City and took thousands of works to Europe. Their return is now a major debate; Germany began returning hundreds of objects to Nigeria in 2022."]}, "id": "x-13-9", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1907, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "africa", "medium": "sculpture", "tags": ["r-africa", "modern", "cubism", "sculpture"], "topics": ["r-africa", "modern", "cubism", "sculpture"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "Picasso ve Matisse gibi sanatçıların 20. yüzyıl başında Afrika ve Okyanusya sanatından etkilenmesine verilen, bugün sorunlu bulunan ad nedir?", "opts": ["Japonizm", "Egzotizm", "Oryantalizm", "Primitivizm"], "exp": "Bu etkilenme 'Primitivizm' olarak adlandırıldı; ancak terim, Avrupa dışı sanatı 'ilkel' sayan sömürgeci bakış nedeniyle bugün eleştirilir.", "detail": ["1984'te MoMA'daki ''Primitivism' in 20th Century Art' sergisi, Afrika eserlerinin adsız 'esin kaynağı' olarak gösterilmesi nedeniyle sert eleştiriler aldı. Bugün bu eserler kendi kültürel bağlamları ve sanatçılarıyla incelenir."]}, "fr": {"q": "Quel nom, aujourd'hui jugé problématique, a-t-on donné à l'influence de l'art africain et océanien sur des artistes comme Picasso et Matisse au début du XXe siècle ?", "opts": ["Le japonisme", "L'exotisme", "L'orientalisme", "Le primitivisme"], "exp": "On a appelé cette influence le « primitivisme », mais le terme est critiqué aujourd'hui, car il reflète un regard colonial qui voit l'art non européen comme « primitif ».", "detail": ["En 1984, l'exposition « 'Primitivism' in 20th Century Art » au MoMA a été très critiquée parce qu'elle présentait les œuvres africaines comme des « sources » anonymes. Aujourd'hui, on les étudie dans leur contexte culturel, avec leurs artistes."]}, "en": {"q": "What name, now seen as problematic, was given to the influence of African and Oceanic art on artists like Picasso and Matisse in the early 20th century?", "opts": ["Japonisme", "Exoticism", "Orientalism", "Primitivism"], "exp": "This influence was called 'Primitivism', but the term is now criticised for reflecting a colonial view that saw non-European art as 'primitive'.", "detail": ["In 1984 MoMA's show ''Primitivism' in 20th Century Art' was strongly criticised for presenting African works as anonymous 'sources'. Today these works are studied in their own cultural context, with their makers."]}, "id": "x-13-10", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 2007, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "africa", "medium": "sculpture", "tags": ["r-africa", "contemporary", "sculpture"], "topics": ["r-africa", "contemporary", "sculpture"], "search": {"commons": "El Anatsui bottle cap sculpture", "wiki": {"en": "El Anatsui bottle cap sculpture"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Gana'da doğdum ve uzun yıllar Nijerya'daki Nsukka Üniversitesi'nde ders verdim.", "Bakır tellerle birbirine bağlanmış binlerce şişe kapağından, kumaş gibi dökülen dev metal 'perdeler' yaptım.", "2015'te Venedik Bienali'nde Altın Aslan Yaşam Boyu Başarı Ödülü'nü aldım; 2023'te Tate Modern'in Türbin Salonu'nda eser gösterdim."], "opts": ["Yinka Shonibare", "El Anatsui", "Romuald Hazoumè", "Ibrahim Mahama"], "exp": "Cevap El Anatsui'dir. Atık malzemeyi tüketim, ticaret ve sömürge tarihi üzerine düşündüren şiirsel yüzeylere dönüştürür.", "detail": ["Eserlerinin her sergilenişte farklı biçimde asılmasına izin verir; böylece eser her seferinde yeniden şekillenir. Şişe kapakları, Afrika'ya Avrupa'dan gelen içki ticaretini de hatırlatır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né au Ghana et j'ai longtemps enseigné à l'université de Nsukka, au Nigeria.", "Avec des milliers de capsules de bouteilles reliées par du fil de cuivre, j'ai créé d'immenses « tentures » de métal qui tombent comme du tissu.", "J'ai reçu le Lion d'or pour l'ensemble de ma carrière à la Biennale de Venise en 2015 ; en 2023, j'ai exposé dans le Turbine Hall de la Tate Modern."], "opts": ["Yinka Shonibare", "El Anatsui", "Romuald Hazoumè", "Ibrahim Mahama"], "exp": "La réponse est El Anatsui. Il transforme des déchets en surfaces poétiques qui font penser à la consommation, au commerce et à l'histoire coloniale.", "detail": ["Il laisse ses œuvres être accrochées différemment à chaque exposition ; elles changent donc de forme à chaque fois. Les capsules rappellent aussi le commerce de l'alcool venu d'Europe en Afrique."]}, "en": {"q": "Who am I?", "clues": ["I was born in Ghana and taught for many years at the University of Nigeria, Nsukka.", "With thousands of bottle caps joined by copper wire, I made huge metal 'hangings' that fall like cloth.", "I received the Golden Lion for Lifetime Achievement at the 2015 Venice Biennale; in 2023 I showed in Tate Modern's Turbine Hall."], "opts": ["Yinka Shonibare", "El Anatsui", "Romuald Hazoumè", "Ibrahim Mahama"], "exp": "The answer is El Anatsui. He turns waste into poetic surfaces that make us think about consumption, trade and colonial history.", "detail": ["He lets his works be hung differently each time, so they take a new shape at every show. The bottle caps also recall the liquor trade that came to Africa from Europe."]}, "id": "x-13-11", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1327, "era": {"tr": "14. yüzyıl", "fr": "14e siècle", "en": "14th century"}, "region": "africa", "medium": "arch", "tags": ["r-africa", "medieval", "architecture", "r-islam"], "topics": ["r-africa", "medieval", "architecture", "r-islam"], "search": {"commons": "Djinguereber Mosque Timbuktu", "wiki": {"en": "Djinguereber Mosque Timbuktu"}}, "answer": true, "tr": {"q": "Timbuktu'daki Djinguereber Camii, 14. yüzyılda Mali İmparatoru Mansa Musa döneminde yapıldı.", "exp": "Doğru. Mansa Musa, 1324'teki ünlü hac yolculuğundan sonra Endülüslü mimar Es-Sahili'ye bu camiyi yaptırdığı kabul edilir.", "detail": ["Kerpiç ve ahşaptan yapılan cami, Sahel'in çamur mimarisinin önemli bir örneğidir ve her yıl yeniden sıvanır. Timbuktu, ortaçağda büyük bir İslam bilim ve el yazması merkeziydi; UNESCO Dünya Mirası'dır."]}, "fr": {"q": "La mosquée Djingareyber de Tombouctou a été construite au XIVe siècle sous l'empereur du Mali Mansa Moussa.", "exp": "Vrai. Après son célèbre pèlerinage de 1324, Mansa Moussa aurait fait construire la mosquée par l'architecte andalou Es-Saheli.", "detail": ["En terre crue et en bois, la mosquée est un grand exemple de l'architecture de terre du Sahel ; elle est réenduite chaque année. Tombouctou était au Moyen Âge un grand centre islamique de savoir et de manuscrits ; elle est classée à l'UNESCO."]}, "en": {"q": "The Djinguereber Mosque in Timbuktu was built in the 14th century under Mansa Musa, emperor of Mali.", "exp": "True. After his famous pilgrimage of 1324, Mansa Musa is said to have had the Andalusian architect Es-Saheli build the mosque.", "detail": ["Made of mud brick and wood, the mosque is a major example of Sahel earthen architecture and is re-plastered every year. Timbuktu was a great medieval centre of Islamic learning and manuscripts; it is a UNESCO World Heritage site."]}, "id": "x-13-12", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1965, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "africa", "medium": "photo", "tags": ["r-africa", "postwar", "photo"], "topics": ["r-africa", "postwar", "photo"], "search": {"commons": "Seydou Keïta portrait", "wiki": {"en": "Seydou Keïta portrait"}}, "answer": 0, "tr": {"q": "1950'lerde Bamako'daki stüdyosunda çektiği şık, desenli arka planlı portrelerle tanınan Malili fotoğrafçı kimdir?", "opts": ["Seydou Keïta", "Malick Sidibé", "Samuel Fosso", "J. D. 'Okhai Ojeikere"], "exp": "Seydou Keïta, 1949'da Bamako'da stüdyosunu açtı ve kentli Malilileri modern kıyafetler ve desenli kumaş arka planlarla fotoğrafladı.", "detail": ["Keïta'nın eserleri 1990'larda Avrupa'da keşfedilip büyük sergilerle tanındı. Malick Sidibé ise daha çok Bamako'nun gece hayatını ve dans partilerini çekti. Samuel Fosso Orta Afrika Cumhuriyeti'nde, Ojeikere Nijerya'da çalıştı."]}, "fr": {"q": "Quel photographe malien est connu pour ses portraits élégants sur fonds à motifs, réalisés dans son studio de Bamako dans les années 1950 ?", "opts": ["Seydou Keïta", "Malick Sidibé", "Samuel Fosso", "J. D. 'Okhai Ojeikere"], "exp": "Seydou Keïta ouvre son studio à Bamako en 1949 et photographie les Maliens des villes avec des vêtements modernes devant des tissus à motifs.", "detail": ["Ses œuvres sont découvertes en Europe dans les années 1990 et montrées dans de grandes expositions. Malick Sidibé photographie plutôt la vie nocturne et les fêtes de Bamako. Samuel Fosso travaille en Centrafrique, Ojeikere au Nigeria."]}, "en": {"q": "Which Malian photographer is known for elegant portraits against patterned backdrops, taken in his Bamako studio in the 1950s?", "opts": ["Seydou Keïta", "Malick Sidibé", "Samuel Fosso", "J. D. 'Okhai Ojeikere"], "exp": "Seydou Keïta opened his studio in Bamako in 1949 and photographed urban Malians in modern clothes against patterned cloth backdrops.", "detail": ["His work was discovered in Europe in the 1990s and shown in major exhibitions. Malick Sidibé mostly photographed Bamako's nightlife and dance parties. Samuel Fosso worked in the Central African Republic and Ojeikere in Nigeria."]}, "id": "x-13-13", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1450, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "americas", "medium": "arch", "tags": ["r-latam", "renaissance", "architecture"], "topics": ["r-latam", "renaissance", "architecture"], "search": {"commons": "Machu Picchu", "wiki": {"en": "Machu Picchu"}}, "answer": 3, "tr": {"q": "Bu yer hangisi?", "opts": ["Teotihuacan", "Chichén Itzá", "Tikal", "Machu Picchu"], "exp": "Machu Picchu, Peru'da And Dağları'nda, 15. yüzyılda İnka imparatoru Pachacuti için yapıldığı düşünülen bir dağ kentidir.", "detail": ["İnka taş ustaları, harç kullanmadan birbirine tam oturan taş duvarlar ördü. Kent İspanyol fatihlerce bulunmadı; 1911'de Hiram Bingham tarafından uluslararası kamuoyuna tanıtıldı. UNESCO Dünya Mirası'dır."]}, "fr": {"q": "Quel est ce site ?", "opts": ["Teotihuacan", "Chichén Itzá", "Tikal", "Machu Picchu"], "exp": "Machu Picchu est une cité de montagne dans les Andes, au Pérou ; on pense qu'elle a été construite au XVe siècle pour l'empereur inca Pachacuti.", "detail": ["Les tailleurs de pierre incas ont construit des murs sans mortier où les pierres s'emboîtent parfaitement. Les conquistadors ne l'ont pas trouvée ; Hiram Bingham l'a fait connaître au monde en 1911. Le site est classé à l'UNESCO."]}, "en": {"q": "Which site is this?", "opts": ["Teotihuacan", "Chichén Itzá", "Tikal", "Machu Picchu"], "exp": "Machu Picchu is a mountain city in the Andes of Peru, thought to have been built in the 15th century for the Inca emperor Pachacuti.", "detail": ["Inca stonemasons built mortarless walls with perfectly fitting stones. The Spanish conquerors never found it; Hiram Bingham made it known worldwide in 1911. It is a UNESCO World Heritage site."]}, "id": "x-13-14", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1928, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "americas", "medium": "painting", "tags": ["r-latam", "modern", "painting", "women"], "topics": ["r-latam", "modern", "painting", "women"], "search": {"commons": "Tarsila do Amaral Abaporu", "wiki": {"en": "Abaporu"}}, "answer": 2, "tr": {"q": "Tarsila do Amaral'ın 1928 tarihli 'Abaporu' tablosu Brezilya'da hangi sanat manifestosuna ilham verdi?", "opts": ["Neo-Konkret Manifesto", "Tropicália Manifestosu", "Yamyamlık Manifestosu (Manifesto Antropófago)", "Muralist Manifesto"], "exp": "Tarsila, 'Abaporu'yu eşi şair Oswald de Andrade'ye hediye etti; Oswald bundan esinlenerek 1928'de 'Yamyamlık Manifestosu'nu yazdı.", "detail": ["Manifesto, Brezilya kültürünün Avrupa etkilerini 'yiyip sindirerek' kendine özgü bir şeye dönüştürmesi gerektiğini savundu. Abaporu, Tupi dilinde 'insan yiyen' anlamına gelir. Tablo Buenos Aires'teki MALBA müzesindedir."]}, "fr": {"q": "Quel manifeste artistique brésilien le tableau « Abaporu » (1928) de Tarsila do Amaral a-t-il inspiré ?", "opts": ["Le Manifeste néoconcret", "Le Manifeste tropicaliste", "Le Manifeste anthropophage", "Le Manifeste muraliste"], "exp": "Tarsila offre « Abaporu » à son mari, le poète Oswald de Andrade, qui s'en inspire pour écrire le « Manifeste anthropophage » en 1928.", "detail": ["Le manifeste dit que la culture brésilienne doit « dévorer » les influences européennes pour créer quelque chose de propre. Abaporu signifie « homme qui mange » en tupi. Le tableau est au MALBA, à Buenos Aires."]}, "en": {"q": "Which Brazilian art manifesto was inspired by Tarsila do Amaral's 1928 painting 'Abaporu'?", "opts": ["The Neo-Concrete Manifesto", "The Tropicália Manifesto", "The Cannibalist Manifesto (Manifesto Antropófago)", "The Muralist Manifesto"], "exp": "Tarsila gave 'Abaporu' to her husband, the poet Oswald de Andrade, who was inspired by it to write the 'Cannibalist Manifesto' in 1928.", "detail": ["The manifesto argued that Brazilian culture should 'devour' European influences and turn them into something of its own. Abaporu means 'man who eats' in Tupi. The painting is in the MALBA museum in Buenos Aires."]}, "id": "x-13-15", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1965, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "painting", "tags": ["r-latam", "postwar", "painting"], "topics": ["r-latam", "postwar", "painting"], "search": {"commons": "Fernando Botero", "wiki": {"en": "Fernando Botero"}}, "answer": false, "tr": {"q": "Fernando Botero, figürlerini uzun ve ince biçimde resmetmesiyle tanınır.", "exp": "Yanlış. Botero, insanları, hayvanları ve nesneleri iri, dolgun hacimlerle resmetmesiyle tanınır; buna 'Boterismo' denir.", "detail": ["Kolombiyalı sanatçı, bu abartılı hacimlerin şişmanlık değil, biçimin şehvetli bir yüceltilmesi olduğunu söyledi. Medellín'deki Botero Meydanı'nda 23 bronz heykeli vardır. 2004'te Ebu Gureyb işkencelerini anlatan bir seri de yaptı."]}, "fr": {"q": "Fernando Botero est connu pour peindre des figures longues et minces.", "exp": "Faux. Botero est connu pour ses personnes, animaux et objets aux volumes ronds et gonflés : on parle de « boterismo ».", "detail": ["L'artiste colombien disait que ces volumes ne représentent pas la gourmandise, mais une célébration sensuelle de la forme. La place Botero à Medellín présente 23 de ses sculptures en bronze. En 2004, il a aussi peint une série sur les tortures d'Abou Ghraib."]}, "en": {"q": "Fernando Botero is known for painting long, thin figures.", "exp": "False. Botero is known for people, animals and objects with round, swollen volumes, a style called 'Boterismo'.", "detail": ["The Colombian artist said these volumes were not about fatness but a sensual celebration of form. Botero Plaza in Medellín has 23 of his bronze sculptures. In 2004 he also made a series about the torture at Abu Ghraib."]}, "id": "x-13-16", "t": 1794800000000}, {"type": "clues", "level": 4, "year": 1990, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "americas", "medium": "concept", "tags": ["r-latam", "contemporary", "conceptual"], "topics": ["r-latam", "contemporary", "conceptual"], "search": {"commons": "Cildo Meireles Insertions into Ideological Circuits", "wiki": {"en": "Cildo Meireles Insertions into Ideological Circuits"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Brezilya'da doğdum ve askerî diktatörlük yıllarında çalıştım.", "1970'te Coca-Cola şişelerine siyasi mesajlar basıp onları yeniden dolaşıma soktum; bu esere 'İdeolojik Devrelere Müdahaleler' dedim.", "Daha sonra 'Babil' gibi yüzlerce radyodan oluşan büyük yerleştirmeler yaptım."], "opts": ["Hélio Oiticica", "Artur Barrio", "Waltercio Caldas", "Cildo Meireles"], "exp": "Cevap Cildo Meireles'tir. Gündelik dolaşım sistemlerini (şişe, banknot) sansürü aşan bir iletişim aracına dönüştürdü.", "detail": ["Mesajlar ancak şişe doluyken okunabiliyordu; böylece fark edilmeden elden ele geçiyordu. Banknotlara 'Vladimir Herzog'u kim öldürdü?' gibi sorular da damgaladı. Tate Modern 2008'de büyük bir retrospektifini düzenledi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né au Brésil et j'ai travaillé pendant la dictature militaire.", "En 1970, j'ai imprimé des messages politiques sur des bouteilles de Coca-Cola et je les ai remises en circulation ; j'ai appelé cela « Insertions dans des circuits idéologiques ».", "J'ai ensuite créé de grandes installations comme « Babel », faite de centaines de radios."], "opts": ["Hélio Oiticica", "Artur Barrio", "Waltercio Caldas", "Cildo Meireles"], "exp": "La réponse est Cildo Meireles. Il transforme des systèmes de circulation quotidiens (bouteilles, billets) en moyens de communiquer malgré la censure.", "detail": ["Les messages n'étaient lisibles que quand la bouteille était pleine ; ils passaient donc de main en main sans être remarqués. Il a aussi tamponné sur des billets des questions comme « Qui a tué Vladimir Herzog ? ». La Tate Modern lui a consacré une rétrospective en 2008."]}, "en": {"q": "Who am I?", "clues": ["I was born in Brazil and worked during the military dictatorship.", "In 1970 I printed political messages on Coca-Cola bottles and put them back into circulation; I called it 'Insertions into Ideological Circuits'.", "Later I made large installations such as 'Babel', made of hundreds of radios."], "opts": ["Hélio Oiticica", "Artur Barrio", "Waltercio Caldas", "Cildo Meireles"], "exp": "The answer is Cildo Meireles. He turned everyday circulation systems (bottles, banknotes) into ways of communicating despite censorship.", "detail": ["The messages could only be read when the bottle was full, so they passed from hand to hand unnoticed. He also stamped banknotes with questions like 'Who killed Vladimir Herzog?'. Tate Modern held a retrospective in 2008."]}, "id": "x-13-17", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1200, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "oceania", "medium": "sculpture", "tags": ["medieval", "sculpture"], "topics": ["medieval", "sculpture"], "search": {"commons": "Moai Rapa Nui", "wiki": {"en": "Moai"}}, "answer": 1, "tr": {"q": "Rapa Nui (Paskalya Adası) halkının yaptığı dev taş heykellere ne ad verilir?", "opts": ["Tiki", "Moai", "Malangan", "Hei-tiki"], "exp": "Moai'ler, Rapa Nui halkının yaklaşık 13. ile 16. yüzyıllar arasında volkanik tüften yonttuğu, ataları temsil eden heykellerdir.", "detail": ["Adada yaklaşık 900 moai vardır; çoğu Rano Raraku taş ocağında yontuldu ve 'ahu' denen taş platformlara taşındı. Bir moai olan Hoa Hakananai'a, 1868'den beri British Museum'dadır ve iadesi talep edilmektedir."]}, "fr": {"q": "Comment appelle-t-on les statues géantes en pierre faites par le peuple de Rapa Nui (île de Pâques) ?", "opts": ["Tiki", "Moaï", "Malangan", "Hei-tiki"], "exp": "Les moaï sont des statues d'ancêtres taillées dans le tuf volcanique par le peuple de Rapa Nui, environ entre le XIIIe et le XVIe siècle.", "detail": ["L'île compte environ 900 moaï ; la plupart ont été taillés dans la carrière de Rano Raraku puis transportés sur des plateformes de pierre appelées « ahu ». Le moaï Hoa Hakananai'a est au British Museum depuis 1868, et sa restitution est demandée."]}, "en": {"q": "What are the giant stone statues made by the people of Rapa Nui (Easter Island) called?", "opts": ["Tiki", "Moai", "Malangan", "Hei-tiki"], "exp": "Moai are ancestor statues carved from volcanic tuff by the Rapa Nui people, roughly between the 13th and 16th centuries.", "detail": ["The island has about 900 moai; most were carved in the Rano Raraku quarry and moved to stone platforms called 'ahu'. One moai, Hoa Hakananai'a, has been in the British Museum since 1868, and its return has been requested."]}, "id": "x-13-18", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1971, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "oceania", "medium": "painting", "tags": ["contemporary", "postwar", "painting"], "topics": ["contemporary", "postwar", "painting"], "search": {"commons": "Papunya Tula dot painting", "wiki": {"en": "Papunya Tula dot painting"}}, "answer": true, "tr": {"q": "Avustralya'daki çağdaş Aborjin 'nokta resmi' hareketi, 1971'de Papunya yerleşiminde bir okul duvar resmiyle başladı.", "exp": "Doğru. Öğretmen Geoffrey Bardon'un teşvikiyle yaşlı erkekler okul duvarına 'Bal Karıncası Rüyası'nı resmetti; ardından Papunya Tula sanatçılar kooperatifi kuruldu.", "detail": ["Bu resimler, kutsal bilgileri ve 'Rüya Zamanı' (Tjukurrpa) hikâyelerini noktalar ve simgelerle aktarır. Bazı gizli bilgilerin herkese gösterilmemesi için noktalar bir örtü işlevi de görür. Hareket bugün dünya çapında tanınır."]}, "fr": {"q": "Le mouvement contemporain de la « peinture à points » aborigène en Australie a commencé en 1971 avec une fresque d'école à Papunya.", "exp": "Vrai. Encouragés par l'enseignant Geoffrey Bardon, des hommes âgés ont peint le « Rêve de la fourmi à miel » sur un mur de l'école ; la coopérative Papunya Tula a ensuite été créée.", "detail": ["Ces peintures transmettent des savoirs sacrés et des récits du « Temps du rêve » (Tjukurrpa) par des points et des symboles. Les points servent aussi à voiler des informations secrètes. Le mouvement est aujourd'hui connu dans le monde entier."]}, "en": {"q": "The contemporary Aboriginal 'dot painting' movement in Australia began in 1971 with a school mural at Papunya.", "exp": "True. Encouraged by the teacher Geoffrey Bardon, older men painted the 'Honey Ant Dreaming' on a school wall; the Papunya Tula artists' cooperative was then founded.", "detail": ["These paintings pass on sacred knowledge and 'Dreaming' (Tjukurrpa) stories through dots and symbols. The dots also act as a veil to hide secret information. The movement is now known worldwide."]}, "id": "x-13-19", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1500, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "world", "medium": "sculpture", "tags": ["sculpture", "r-africa", "r-latam", "r-fareast"], "topics": ["sculpture", "r-africa", "r-latam", "r-fareast"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Bu eserleri ait oldukları kültürlerle eşleştir.", "left": ["Olmek dev başları", "Nok terakota heykelleri", "Haniwa figürleri", "Lapita çömlekleri"], "right": ["Mezoamerika (Meksika Körfezi)", "Batı Afrika (Nijerya)", "Japonya (Kofun dönemi)", "Pasifik adaları"], "exp": "Dördü de Avrupa dışındaki erken ve önemli sanat geleneklerindendir.", "detail": ["Olmek başları MÖ 1200–400 civarına, Nok heykelleri MÖ 1. binyıla tarihlenir. Haniwa'lar 3.–6. yüzyıllarda mezarların çevresine konan pişmiş toprak figürlerdir. Lapita kültürü, Pasifik'e yayılan ilk insanlarla ilişkilendirilir."]}, "fr": {"q": "Associe ces œuvres à leur culture.", "left": ["Les têtes colossales olmèques", "Les terres cuites Nok", "Les figurines haniwa", "Les poteries Lapita"], "right": ["Mésoamérique (golfe du Mexique)", "Afrique de l'Ouest (Nigeria)", "Japon (période Kofun)", "Îles du Pacifique"], "exp": "Ce sont quatre traditions artistiques anciennes et importantes hors d'Europe.", "detail": ["Les têtes olmèques datent d'environ 1200–400 av. J.-C., les terres cuites Nok du Ier millénaire av. J.-C. Les haniwa sont des figurines en terre cuite placées autour des tombes du IIIe au VIe siècle. La culture Lapita est liée aux premiers peuples qui se sont répandus dans le Pacifique."]}, "en": {"q": "Match these works with their cultures.", "left": ["Olmec colossal heads", "Nok terracotta sculptures", "Haniwa figures", "Lapita pottery"], "right": ["Mesoamerica (Gulf of Mexico)", "West Africa (Nigeria)", "Japan (Kofun period)", "Pacific Islands"], "exp": "These are four early and important art traditions outside Europe.", "detail": ["Olmec heads date from about 1200–400 BCE and Nok sculptures from the 1st millennium BCE. Haniwa are terracotta figures placed around tombs from the 3rd to 6th centuries. The Lapita culture is linked to the first peoples who spread across the Pacific."]}, "id": "x-13-20", "t": 1794800000000}, {"type": "order", "level": 4, "year": 800, "era": {"tr": "8. yüzyıl", "fr": "8e siècle", "en": "8th century"}, "region": "world", "medium": "arch", "tags": ["medieval", "architecture", "r-latam", "r-fareast", "r-southasia"], "topics": ["medieval", "architecture", "r-latam", "r-fareast", "r-southasia"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["c. 100 CE", "c. 750", "c. 800", "c. 1150"], "tr": {"q": "Bu anıtsal yapıları eskiden yeniye sırala.", "items": ["Teotihuacan'daki Güneş Piramidi", "Ellora'daki Kailasa Tapınağı", "Java'daki Borobudur", "Kamboçya'daki Angkor Wat"], "exp": "Güneş Piramidi yaklaşık MS 100, Kailasa 8. yüzyılın ortası, Borobudur 800 civarı, Angkor Wat 12. yüzyılın ilk yarısıdır.", "detail": ["Teotihuacan, Aztekler'den yüzyıllar önce yükselen bir Mezoamerika metropolüydü; Aztekler kentin adını sonradan koydu. Diğer üç yapı Hindu ve Budist geleneklerin Güney ve Güneydoğu Asya'daki zirveleridir."]}, "fr": {"q": "Classe ces monuments du plus ancien au plus récent.", "items": ["La pyramide du Soleil à Teotihuacan", "Le temple Kailasa à Ellora", "Borobudur à Java", "Angkor Vat au Cambodge"], "exp": "La pyramide du Soleil date d'environ 100 apr. J.-C., le Kailasa du milieu du VIIIe siècle, Borobudur d'environ 800 et Angkor Vat de la première moitié du XIIe siècle.", "detail": ["Teotihuacan était une métropole mésoaméricaine bien antérieure aux Aztèques, qui lui ont donné son nom plus tard. Les trois autres sont des sommets des traditions hindoue et bouddhiste en Asie du Sud et du Sud-Est."]}, "en": {"q": "Put these monuments in order, oldest first.", "items": ["The Pyramid of the Sun at Teotihuacan", "The Kailasa Temple at Ellora", "Borobudur in Java", "Angkor Wat in Cambodia"], "exp": "The Pyramid of the Sun dates from about 100 CE, Kailasa from the mid-8th century, Borobudur from about 800 and Angkor Wat from the first half of the 12th century.", "detail": ["Teotihuacan was a Mesoamerican metropolis long before the Aztecs, who named it later. The other three are high points of Hindu and Buddhist traditions in South and Southeast Asia."]}, "id": "x-13-21", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1540, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "islam", "medium": "painting", "tags": ["r-islam", "renaissance", "painting"], "topics": ["r-islam", "renaissance", "painting"], "search": {"commons": "Shahnameh of Shah Tahmasp Court of Gayumars", "wiki": {"en": "Shahnameh of Shah Tahmasp Court of Gayumars"}}, "answer": 2, "tr": {"q": "Safevi Şahı Tahmasb için hazırlanan büyük 'Şehname' el yazmasındaki ünlü 'Keyumers'in Sarayı' minyatürü hangi ressama atfedilir?", "opts": ["Behzad", "Rıza Abbasi", "Sultan Muhammed", "Mir Seyyid Ali"], "exp": "'Keyumers'in Sarayı' (yaklaşık 1522–25), Tebriz atölyesinin önde gelen ustası Sultan Muhammed'e atfedilir.", "detail": ["Şah Tahmasb'ın Şehnamesi 258 minyatür içeriyordu ve sonradan Osmanlı Sultanı II. Selim'e hediye edildi. 20. yüzyılda koleksiyoner Arthur Houghton sayfaları ayırıp sattı. 'Keyumers'in Sarayı' bugün Tahran'daki Çağdaş Sanat Müzesi'ndedir."]}, "fr": {"q": "À quel peintre attribue-t-on la célèbre miniature « La Cour de Gayumars » du grand Shahnameh fait pour le shah safavide Tahmasp ?", "opts": ["Behzad", "Reza Abbasi", "Soltan Mohammad", "Mir Sayyid Ali"], "exp": "« La Cour de Gayumars » (vers 1522–1525) est attribuée à Soltan Mohammad, grand maître de l'atelier de Tabriz.", "detail": ["Le Shahnameh de Shah Tahmasp comptait 258 miniatures ; il a ensuite été offert au sultan ottoman Selim II. Au XXe siècle, le collectionneur Arthur Houghton a séparé et vendu les pages. « La Cour de Gayumars » est aujourd'hui au musée d'Art contemporain de Téhéran."]}, "en": {"q": "To which painter is the famous miniature 'The Court of Gayumars' from the great Shahnameh made for the Safavid Shah Tahmasp attributed?", "opts": ["Behzad", "Reza Abbasi", "Sultan Muhammad", "Mir Sayyid Ali"], "exp": "'The Court of Gayumars' (about 1522–25) is attributed to Sultan Muhammad, leading master of the Tabriz workshop.", "detail": ["Shah Tahmasp's Shahnameh had 258 miniatures and was later given to the Ottoman Sultan Selim II. In the 20th century the collector Arthur Houghton split up and sold the pages. 'The Court of Gayumars' is now in the Tehran Museum of Contemporary Art."]}, "id": "x-13-22", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1839, "era": {"tr": "1830'ler", "fr": "Années 1830", "en": "1830s"}, "region": "europe", "medium": "photo", "tags": ["photo", "c19"], "topics": ["photo", "c19"], "search": {"commons": "Daguerreotype Boulevard du Temple", "wiki": {"en": "Daguerreotype Boulevard du Temple"}}, "answer": 0, "tr": {"q": "1839'da Fransız hükümetinin dünyaya 'hediye' olarak açıkladığı ilk pratik fotoğraf yöntemini kim geliştirdi?", "opts": ["Louis Daguerre", "Nadar", "William Henry Fox Talbot", "Eadweard Muybridge"], "exp": "Louis Daguerre, Nicéphore Niépce ile ortak çalışmalarından sonra 'dagerotip' yöntemini geliştirdi; Fransa 1839'da patenti satın alıp herkese açtı.", "detail": ["Dagerotip, gümüş kaplı bakır levha üzerinde tek, kopyalanamaz bir görüntü verir. Aynı yıllarda İngiltere'de Talbot, negatiften çok sayıda kopya üretilebilen 'kalotip'i geliştirdi. Bilinen en eski fotoğraf ise Niépce'nin yaklaşık 1826–27 tarihli görüntüsüdür."]}, "fr": {"q": "Qui a mis au point le premier procédé photographique pratique, offert au monde par le gouvernement français en 1839 ?", "opts": ["Louis Daguerre", "Nadar", "William Henry Fox Talbot", "Eadweard Muybridge"], "exp": "Après ses travaux avec Nicéphore Niépce, Louis Daguerre invente le daguerréotype ; en 1839, la France achète le brevet et l'offre à tous.", "detail": ["Le daguerréotype donne une image unique, impossible à copier, sur une plaque de cuivre argentée. À la même époque, en Angleterre, Talbot invente le calotype, qui permet de tirer plusieurs copies d'un négatif. La plus ancienne photo connue est celle de Niépce, vers 1826–1827."]}, "en": {"q": "Who developed the first practical photographic process, announced by the French government as a 'gift' to the world in 1839?", "opts": ["Louis Daguerre", "Nadar", "William Henry Fox Talbot", "Eadweard Muybridge"], "exp": "After working with Nicéphore Niépce, Louis Daguerre developed the daguerreotype; in 1839 France bought the patent and made it free for all.", "detail": ["A daguerreotype gives a single image that cannot be copied, on a silver-coated copper plate. At the same time in England, Talbot developed the calotype, which allowed many prints from one negative. The oldest known photograph is Niépce's, from about 1826–27."]}, "id": "x-14-0", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1936, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "americas", "medium": "photo", "tags": ["photo", "modern", "women", "r-namerica"], "topics": ["photo", "modern", "women", "r-namerica"], "search": {"commons": "Dorothea Lange Migrant Mother", "wiki": {"en": "Migrant Mother"}}, "answer": 2, "tr": {"q": "Bu fotoğraf hangisi?", "opts": ["Walker Evans – Allie Mae Burroughs", "Margaret Bourke-White – Louisville Seli", "Dorothea Lange – Göçmen Anne", "Gordon Parks – American Gothic"], "exp": "Dorothea Lange'ın 'Göçmen Anne' (1936) fotoğrafı, Büyük Buhran sırasında Kaliforniya'da bir bezelye toplayıcıları kampında çekildi.", "detail": ["Lange, Çiftlik Güvenliği İdaresi (FSA) için çalışıyordu; fotoğraf hükümetin yardım göndermesine katkı yaptı. Fotoğraftaki kadının adı yıllar sonra Florence Owens Thompson olarak öğrenildi. Fotoğraf Amerikan Kongre Kütüphanesi koleksiyonundadır."]}, "fr": {"q": "Quelle est cette photographie ?", "opts": ["Walker Evans – Allie Mae Burroughs", "Margaret Bourke-White – L'Inondation de Louisville", "Dorothea Lange – Migrant Mother", "Gordon Parks – American Gothic"], "exp": "« Migrant Mother » de Dorothea Lange (1936) a été prise pendant la Grande Dépression dans un camp de cueilleurs de petits pois en Californie.", "detail": ["Lange travaillait pour la Farm Security Administration (FSA) ; la photo a aidé à faire envoyer une aide d'urgence. On a appris des années plus tard le nom de la femme : Florence Owens Thompson. La photo appartient à la Bibliothèque du Congrès."]}, "en": {"q": "Which photograph is this?", "opts": ["Walker Evans – Allie Mae Burroughs", "Margaret Bourke-White – The Louisville Flood", "Dorothea Lange – Migrant Mother", "Gordon Parks – American Gothic"], "exp": "Dorothea Lange's 'Migrant Mother' (1
