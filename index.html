ly living people perform, passed on orally.", "I do not allow photos of my works, written contracts or catalogues.", "In 2012 I made 'These Associations' in Tate Modern's Turbine Hall, where hundreds of 'interpreters' talked with visitors."], "opts": ["Tino Sehgal", "Pierre Huyghe", "Anne Imhof", "Ragnar Kjartansson"], "exp": "The answer is Tino Sehgal. His works leave no material object and consist only of human interaction.", "detail": ["His works are sold to museums by oral agreement in front of witnesses. He won the Golden Lion at the 2013 Venice Biennale. This approach makes us rethink what an artwork is and how it is owned."]}, "id": "x-15-14", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 2017, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "contemporary", "painting"], "topics": ["renaissance", "contemporary", "painting"], "search": {"commons": "Salvator Mundi Leonardo", "wiki": {"en": "Salvator Mundi (Leonardo)"}}, "answer": 1, "tr": {"q": "2017'de açık artırmada yaklaşık 450 milyon dolara satılarak dünyanın en pahalı tablosu olan, Leonardo'ya atfedilen eser hangisidir?", "opts": ["Ermine'li Kadın", "Salvator Mundi", "Kayalıkların Meryemi", "Ginevra de' Benci"], "exp": "'Salvator Mundi' (Dünyanın Kurtarıcısı), Kasım 2017'de Christie's New York'ta yaklaşık 450,3 milyon dolara satıldı.", "detail": ["Tablo 1958'de çok küçük bir fiyata satılmıştı; 2005'te yeniden bulundu ve kapsamlı biçimde restore edildi. Leonardo'ya atfedilmesi ve restorasyonun boyutu uzmanlar arasında hâlâ tartışmalıdır. Eserin bugünkü yeri kamuya açık değildir."]}, "fr": {"q": "Quelle œuvre attribuée à Léonard est devenue en 2017 le tableau le plus cher du monde, vendu environ 450 millions de dollars ?", "opts": ["La Dame à l'hermine", "Salvator Mundi", "La Vierge aux rochers", "Ginevra de' Benci"], "exp": "Le « Salvator Mundi » (Sauveur du monde) a été vendu chez Christie's New York en novembre 2017 pour environ 450,3 millions de dollars.", "detail": ["Le tableau avait été vendu pour très peu en 1958 ; il a été redécouvert en 2005 et fortement restauré. Son attribution à Léonard et l'ampleur de la restauration sont encore discutées. On ne sait pas publiquement où il se trouve aujourd'hui."]}, "en": {"q": "Which work attributed to Leonardo became the world's most expensive painting in 2017, selling for about 450 million dollars?", "opts": ["Lady with an Ermine", "Salvator Mundi", "Virgin of the Rocks", "Ginevra de' Benci"], "exp": "'Salvator Mundi' (Saviour of the World) sold at Christie's New York in November 2017 for about 450.3 million dollars.", "detail": ["It had sold for very little in 1958; it was rediscovered in 2005 and heavily restored. Its attribution to Leonardo and the extent of restoration are still debated. Its current location is not public."]}, "id": "x-15-15", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1990, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "americas", "medium": "painting", "tags": ["contemporary", "c19", "painting", "r-namerica"], "topics": ["contemporary", "c19", "painting", "r-namerica"], "search": {"commons": "Isabella Stewart Gardner Museum empty frames", "wiki": {"en": "Isabella Stewart Gardner Museum empty frames"}}, "answer": true, "tr": {"q": "1990'da Boston'daki Isabella Stewart Gardner Müzesi'nden Vermeer ve Rembrandt eserleri dahil 13 eser çalındı ve hiçbiri bulunamadı.", "exp": "Doğru. 18 Mart 1990 gecesi polis kılığındaki iki hırsız eserleri aldı; boş çerçeveler hâlâ duvarlarda asılıdır.", "detail": ["Çalınanlar arasında Vermeer'in 'Konser'i ve Rembrandt'ın tek deniz manzarası 'Celile Denizi'nde Fırtına' vardır. Müze, eserlerin geri getirilmesine yardım edecek bilgiler için 10 milyon dolar ödül vaat etmiştir. Bu, tarihteki en büyük sanat hırsızlıklarından biridir."]}, "fr": {"q": "En 1990, treize œuvres, dont un Vermeer et des Rembrandt, ont été volées au musée Isabella Stewart Gardner de Boston, et aucune n'a été retrouvée.", "exp": "Vrai. Dans la nuit du 18 mars 1990, deux voleurs déguisés en policiers les ont emportées ; les cadres vides sont toujours accrochés.", "detail": ["Parmi les œuvres volées figurent « Le Concert » de Vermeer et la seule marine de Rembrandt, « La Tempête sur la mer de Galilée ». Le musée offre 10 millions de dollars pour des informations permettant de les retrouver. C'est l'un des plus grands vols d'art de l'histoire."]}, "en": {"q": "In 1990, thirteen works, including a Vermeer and Rembrandts, were stolen from the Isabella Stewart Gardner Museum in Boston, and none has been found.", "exp": "True. On the night of 18 March 1990, two thieves dressed as police officers took them; the empty frames still hang on the walls.", "detail": ["The stolen works include Vermeer's 'The Concert' and Rembrandt's only seascape, 'The Storm on the Sea of Galilee'. The museum offers a 10 million dollar reward for information leading to their return. It is one of the largest art thefts in history."]}, "id": "x-15-16", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1665, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "Vermeer The Milkmaid", "wiki": {"en": "The Milkmaid (Vermeer)"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Vermeer – Sütçü Kız", "Pieter de Hooch – Bir Delft Avlusu", "Gerard ter Borch – Mektup Okuyan Kadın", "Rembrandt – Banyo Yapan Kadın"], "exp": "Johannes Vermeer'in Sütçü Kız'ı (yaklaşık 1658–59), bir hizmetçinin sessizce süt döktüğü anı, pencereden gelen yumuşak ışıkla gösterir.", "detail": ["Vermeer, ekmek kabuğu ve testi üzerindeki ışığı küçük beyaz noktalarla gösterdi. Pahalı lacivert taşından yapılan 'ultramarin' mavisini bolca kullandı. Tablo Amsterdam'daki Rijksmuseum'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Vermeer – La Laitière", "Pieter de Hooch – Cour d'une maison à Delft", "Gerard ter Borch – Femme lisant une lettre", "Rembrandt – Femme se baignant"], "exp": "La Laitière de Johannes Vermeer (vers 1658–1659) montre une servante qui verse du lait en silence, dans une lumière douce venue de la fenêtre.", "detail": ["Vermeer rend la lumière sur le pain et la cruche par de petits points blancs. Il utilise beaucoup de bleu outremer, fait avec du lapis-lazuli très cher. Le tableau est au Rijksmuseum d'Amsterdam."]}, "en": {"q": "Which work is this?", "opts": ["Vermeer – The Milkmaid", "Pieter de Hooch – The Courtyard of a House in Delft", "Gerard ter Borch – Woman Reading a Letter", "Rembrandt – A Woman Bathing"], "exp": "Johannes Vermeer's The Milkmaid (about 1658–59) shows a maid quietly pouring milk in soft light from a window.", "detail": ["Vermeer showed light on the bread and jug with small white dots. He used plenty of ultramarine blue, made from expensive lapis lazuli. The painting is in the Rijksmuseum in Amsterdam."]}, "id": "x-16-0", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1600, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "Caravaggio The Calling of Saint Matthew", "wiki": {"en": "Caravaggio The Calling of Saint Matthew"}}, "answer": true, "tr": {"q": "Caravaggio'nun 'Aziz Matta'nın Çağrılışı' tablosu hâlâ Roma'daki San Luigi dei Francesi kilisesinde, yapıldığı yerde durur.", "exp": "Doğru. Tablo 1599–1600'de Contarelli Şapeli için yapıldı ve bugün de oradadır.", "detail": ["Caravaggio, sert ışık ile derin gölge arasındaki karşıtlığı (tenebrizm) kullanarak İsa'nın parmağını kaldırıp Matta'yı çağırdığı anı dramatik biçimde gösterdi. Figürler, dönemin Roma'sından sıradan insanlar gibi giyinmiştir."]}, "fr": {"q": "« La Vocation de saint Matthieu » du Caravage est toujours dans l'église Saint-Louis-des-Français à Rome, là où elle a été peinte.", "exp": "Vrai. Le tableau a été peint en 1599–1600 pour la chapelle Contarelli, et il y est encore.", "detail": ["Le Caravage utilise un fort contraste entre lumière et ombre (ténébrisme) pour montrer le moment où le Christ lève le doigt et appelle Matthieu. Les personnages sont habillés comme des gens ordinaires de la Rome de l'époque."]}, "en": {"q": "Caravaggio's 'The Calling of Saint Matthew' is still in the church of San Luigi dei Francesi in Rome, where it was made.", "exp": "True. It was painted in 1599–1600 for the Contarelli Chapel and is still there.", "detail": ["Caravaggio used sharp contrast between light and deep shadow (tenebrism) to show the moment Christ raises his finger and calls Matthew. The figures are dressed like ordinary people of Rome at the time."]}, "id": "x-16-1", "t": 1794800000000}, {"type": "order", "level": 2, "year": 1550, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["c. 1305", "c. 1427", "c. 1498", "1512"], "tr": {"q": "Bu İtalyan eserlerini eskiden yeniye sırala.", "items": ["Giotto – Scrovegni Şapeli freskleri", "Masaccio – Kutsal Üçleme", "Leonardo – Son Akşam Yemeği", "Michelangelo – Sistina Şapeli tavanı"], "exp": "Scrovegni yaklaşık 1305, Masaccio'nun Kutsal Üçleme'si yaklaşık 1427, Son Akşam Yemeği yaklaşık 1495–98, Sistina tavanı 1512 tarihlidir.", "detail": ["Masaccio'nun Floransa'daki Santa Maria Novella kilisesindeki 'Kutsal Üçleme'si, doğrusal perspektifin resimde ilk büyük uygulamalarından biridir. Leonardo'nun Milano'daki freski deneysel bir teknikle yapıldığı için çabuk bozuldu."]}, "fr": {"q": "Classe ces œuvres italiennes de la plus ancienne à la plus récente.", "items": ["Giotto – Fresques de la chapelle des Scrovegni", "Masaccio – La Trinité", "Léonard – La Cène", "Michel-Ange – Plafond de la chapelle Sixtine"], "exp": "Les Scrovegni datent d'environ 1305, la Trinité de Masaccio d'environ 1427, la Cène d'environ 1495–1498 et le plafond de la Sixtine de 1512.", "detail": ["La « Trinité » de Masaccio, à Santa Maria Novella à Florence, est l'une des premières grandes applications de la perspective linéaire en peinture. La fresque de Léonard à Milan s'est vite abîmée, car il a utilisé une technique expérimentale."]}, "en": {"q": "Put these Italian works in order, oldest first.", "items": ["Giotto – Scrovegni Chapel frescoes", "Masaccio – The Holy Trinity", "Leonardo – The Last Supper", "Michelangelo – Sistine Chapel ceiling"], "exp": "Scrovegni dates from about 1305, Masaccio's Holy Trinity from about 1427, the Last Supper from about 1495–98 and the Sistine ceiling from 1512.", "detail": ["Masaccio's 'Holy Trinity' in Santa Maria Novella in Florence is one of the first great uses of linear perspective in painting. Leonardo's fresco in Milan decayed quickly because he used an experimental technique."]}, "id": "x-16-2", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1500, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "r-europe"], "topics": ["renaissance", "painting", "r-europe"], "search": {"commons": "Bosch Garden of Earthly Delights", "wiki": {"en": "The Garden of Earthly Delights"}}, "answer": 2, "tr": {"q": "Hieronymus Bosch'un 'Dünyevi Zevkler Bahçesi' triptiği bugün hangi müzededir?", "opts": ["Rijksmuseum, Amsterdam", "Louvre, Paris", "Prado, Madrid", "Kunsthistorisches Museum, Viyana"], "exp": "Triptik, İspanya Kralı II. Felipe tarafından satın alındı ve bugün Madrid'deki Prado Müzesi'ndedir.", "detail": ["Sol panel Cennet Bahçesi'ni, orta panel çıplak insanların tuhaf zevklerini, sağ panel ise Cehennem'i gösterir. Kapaklar kapandığında, gri tonlarda yaratılışın üçüncü günü görülür. Anlamı hâlâ tartışılır; Sürrealistler Bosch'u bir öncü olarak gördü."]}, "fr": {"q": "Dans quel musée se trouve aujourd'hui le triptyque « Le Jardin des délices » de Jérôme Bosch ?", "opts": ["Le Rijksmuseum, Amsterdam", "Le Louvre, Paris", "Le Prado, Madrid", "Le Kunsthistorisches Museum, Vienne"], "exp": "Le triptyque a été acheté par le roi d'Espagne Philippe II ; il est aujourd'hui au musée du Prado, à Madrid.", "detail": ["Le panneau de gauche montre le Paradis, celui du centre les plaisirs étranges d'humains nus, celui de droite l'Enfer. Fermé, il montre en grisaille le troisième jour de la Création. Son sens est encore discuté ; les surréalistes voyaient Bosch comme un précurseur."]}, "en": {"q": "In which museum is Hieronymus Bosch's triptych 'The Garden of Earthly Delights' today?", "opts": ["The Rijksmuseum, Amsterdam", "The Louvre, Paris", "The Prado, Madrid", "The Kunsthistorisches Museum, Vienna"], "exp": "The triptych was acquired by King Philip II of Spain and is now in the Prado Museum in Madrid.", "detail": ["The left panel shows Paradise, the centre the strange pleasures of naked people, the right panel Hell. When closed, it shows the third day of Creation in grey tones. Its meaning is still debated; the Surrealists saw Bosch as a forerunner."]}, "id": "x-16-3", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1560, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["renaissance", "painting", "women", "r-europe"], "topics": ["renaissance", "painting", "women", "r-europe"], "search": {"commons": "Sofonisba Anguissola self-portrait", "wiki": {"en": "Sofonisba Anguissola self-portrait"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["İtalya'nın Cremona şehrinde soylu bir ailenin kızı olarak doğdum.", "Michelangelo, gülen bir kız çizimimi beğendi ve bana ağlayan bir çocuk çizmemi önerdi.", "İspanya Kralı II. Felipe'nin sarayında kraliçenin nedimesi ve ressamı oldum; 90'lı yaşlarıma kadar yaşadım ve Van Dyck beni ziyaret etti."], "opts": ["Lavinia Fontana", "Sofonisba Anguissola", "Artemisia Gentileschi", "Properzia de' Rossi"], "exp": "Cevap Sofonisba Anguissola'dır. Uluslararası üne kavuşan ilk kadın Rönesans ressamlarındandır.", "detail": ["Anguissola'nın 'Satranç Oyunu' (1555) kız kardeşlerini gülümseyerek oyun oynarken gösterir; bu, aile portresine yeni bir canlılık getirdi. Van Dyck 1624'te onu Palermo'da ziyaret edip portresini çizdi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Crémone, en Italie, dans une famille noble.", "Michel-Ange a aimé mon dessin d'une fille qui rit et m'a proposé de dessiner un enfant qui pleure.", "Je suis devenue dame d'honneur et peintre de la reine à la cour de Philippe II d'Espagne ; j'ai vécu plus de 90 ans et Van Dyck m'a rendu visite."], "opts": ["Lavinia Fontana", "Sofonisba Anguissola", "Artemisia Gentileschi", "Properzia de' Rossi"], "exp": "La réponse est Sofonisba Anguissola, l'une des premières femmes peintres de la Renaissance à avoir une renommée internationale.", "detail": ["Sa « Partie d'échecs » (1555) montre ses sœurs qui jouent en souriant, ce qui apporte une nouvelle vie au portrait de famille. Van Dyck lui a rendu visite à Palerme en 1624 et l'a dessinée."]}, "en": {"q": "Who am I?", "clues": ["I was born into a noble family in Cremona, Italy.", "Michelangelo liked my drawing of a laughing girl and suggested I draw a crying child.", "I became lady-in-waiting and painter to the queen at the court of Philip II of Spain; I lived into my nineties and Van Dyck visited me."], "opts": ["Lavinia Fontana", "Sofonisba Anguissola", "Artemisia Gentileschi", "Properzia de' Rossi"], "exp": "The answer is Sofonisba Anguissola, one of the first women painters of the Renaissance to win international fame.", "detail": ["Her 'The Chess Game' (1555) shows her sisters smiling as they play, bringing new life to the family portrait. Van Dyck visited her in Palermo in 1624 and drew her portrait."]}, "id": "x-16-4", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1650, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "europe", "medium": "painting", "tags": ["baroque", "painting", "r-europe"], "topics": ["baroque", "painting", "r-europe"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Barok ressamlarını ülkeleriyle eşleştir.", "left": ["Peter Paul Rubens", "Diego Velázquez", "Nicolas Poussin", "Caravaggio"], "right": ["Flandre (Anvers)", "İspanya", "Fransa", "İtalya"], "exp": "Dört ressam, Barok'un farklı ülkelerdeki ana temsilcileridir.", "detail": ["Rubens, Anvers'teki büyük atölyesiyle Avrupa'nın her yerine dinamik, renkli eserler gönderdi. Poussin ise Fransız olmasına rağmen hayatının çoğunu Roma'da geçirdi ve daha sakin, klasik bir Barok geliştirdi. Fransız Akademisi'nde 'Poussinciler' ile 'Rubensçiler' arasında çizgi mi renk mi tartışması yaşandı."]}, "fr": {"q": "Associe chaque peintre baroque à son pays.", "left": ["Pierre Paul Rubens", "Diego Velázquez", "Nicolas Poussin", "Le Caravage"], "right": ["Flandre (Anvers)", "Espagne", "France", "Italie"], "exp": "Ces quatre peintres sont des grands représentants du baroque dans différents pays.", "detail": ["Avec son grand atelier d'Anvers, Rubens envoie dans toute l'Europe des œuvres dynamiques et colorées. Poussin, bien que français, passe la plus grande partie de sa vie à Rome et développe un baroque plus calme et classique. À l'Académie française, « poussinistes » et « rubénistes » débattent : le dessin ou la couleur ?"]}, "en": {"q": "Match each Baroque painter with his country.", "left": ["Peter Paul Rubens", "Diego Velázquez", "Nicolas Poussin", "Caravaggio"], "right": ["Flanders (Antwerp)", "Spain", "France", "Italy"], "exp": "These four painters are leading figures of the Baroque in different countries.", "detail": ["With his large workshop in Antwerp, Rubens sent dynamic, colourful works all over Europe. Poussin, though French, spent most of his life in Rome and developed a calmer, classical Baroque. At the French Academy, 'Poussinistes' and 'Rubénistes' argued over line versus colour."]}, "id": "x-16-5", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1610, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "asia", "medium": "painting", "tags": ["r-southasia", "r-islam", "baroque", "painting"], "topics": ["r-southasia", "r-islam", "baroque", "painting"], "search": {"commons": "Mansur Zebra Jahangir", "wiki": {"en": "Mansur Zebra Jahangir"}}, "answer": 0, "tr": {"q": "Babür İmparatoru Cihangir'in sarayında hayvan ve kuş resimlerinde uzmanlaşan, bir zebra ve Hint dodo kuşu resimleriyle bilinen ressam kimdir?", "opts": ["Ustad Mansur", "Basawan", "Abu'l Hasan", "Bichitr"], "exp": "Ustad Mansur, Cihangir'in 'Nadir-ül Asr' (Çağın Harikası) unvanını verdiği hayvan ressamıdır; 1621'de bir zebra, yaklaşık aynı dönemde de bir dodo kuşu resmetti.", "detail": ["Cihangir doğaya ve nadir hayvanlara büyük ilgi duydu ve ressamlarından bunları ayrıntılı biçimde belgelemesini istedi. Mansur'un dodo resmi, kuşun nesli tükenmeden önce yapılmış en doğru tasvirlerden biri sayılır."]}, "fr": {"q": "Quel peintre de la cour de l'empereur moghol Jahangir, spécialiste des animaux et des oiseaux, est connu pour ses peintures d'un zèbre et d'un dodo ?", "opts": ["Ustad Mansur", "Basawan", "Abu'l Hasan", "Bichitr"], "exp": "Ustad Mansur, peintre animalier, reçoit de Jahangir le titre de « Nadir al-Asr » (Merveille de l'époque) ; en 1621, il peint un zèbre, et vers la même époque, un dodo.", "detail": ["Jahangir s'intéresse beaucoup à la nature et aux animaux rares, et demande à ses peintres de les représenter en détail. Le dodo de Mansur est considéré comme l'une des représentations les plus fidèles de l'oiseau avant son extinction."]}, "en": {"q": "Which painter at the court of the Mughal emperor Jahangir, a specialist in animals and birds, is known for paintings of a zebra and a dodo?", "opts": ["Ustad Mansur", "Basawan", "Abu'l Hasan", "Bichitr"], "exp": "Ustad Mansur, an animal painter, received from Jahangir the title 'Nadir al-Asr' (Wonder of the Age); in 1621 he painted a zebra, and around the same time a dodo.", "detail": ["Jahangir was very interested in nature and rare animals and asked his painters to record them in detail. Mansur's dodo is seen as one of the most accurate pictures of the bird before it became extinct."]}, "id": "x-16-6", "t": 1794800000000}, {"type": "tf", "level": 4, "year": 1611, "era": {"tr": "17. yüzyıl", "fr": "17e siècle", "en": "17th century"}, "region": "asia", "medium": "painting", "tags": ["r-fareast", "baroque", "painting"], "topics": ["r-fareast", "baroque", "painting"], "search": {"commons": "Tawaraya Sotatsu Wind God and Thunder God", "wiki": {"en": "Tawaraya Sotatsu Wind God and Thunder God"}}, "answer": true, "tr": {"q": "Tawaraya Sōtatsu'nun 'Rüzgâr Tanrısı ve Gök Gürültüsü Tanrısı' paravanı, sonraki yüzyıllarda Ogata Kōrin ve Sakai Hōitsu tarafından yeniden yorumlandı.", "exp": "Doğru. Rinpa okulunun ustaları, Sōtatsu'nun altın zeminli paravanını saygıyla kopyalayıp kendi üsluplarıyla yeniden yaptı.", "detail": ["Rinpa okulu, adını Kōrin'den alır ('Rin' + 'pa', yani okul). Altın ve gümüş zeminler, cesur düz biçimler ve doğa motifleriyle tanınır. Sōtatsu'nun orijinal paravanı Kyoto'daki Kennin-ji tapınağına aittir ve ulusal hazinedir."]}, "fr": {"q": "Le paravent « Dieu du vent et dieu du tonnerre » de Tawaraya Sōtatsu a été réinterprété plus tard par Ogata Kōrin et Sakai Hōitsu.", "exp": "Vrai. Les maîtres de l'école Rinpa ont copié avec respect le paravent à fond d'or de Sōtatsu et l'ont refait dans leur propre style.", "detail": ["L'école Rinpa doit son nom à Kōrin (« Rin » + « pa », école). Elle est connue pour ses fonds d'or et d'argent, ses formes plates audacieuses et ses motifs naturels. Le paravent original appartient au temple Kennin-ji de Kyoto et c'est un trésor national."]}, "en": {"q": "Tawaraya Sōtatsu's screen 'Wind God and Thunder God' was reinterpreted in later centuries by Ogata Kōrin and Sakai Hōitsu.", "exp": "True. Masters of the Rinpa school respectfully copied Sōtatsu's gold-ground screen and remade it in their own styles.", "detail": ["The Rinpa school takes its name from Kōrin ('Rin' + 'pa', school). It is known for gold and silver grounds, bold flat forms and nature motifs. Sōtatsu's original screen belongs to Kennin-ji temple in Kyoto and is a National Treasure."]}, "id": "x-16-7", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1863, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "painting", "tags": ["realism", "impressionism", "c19", "painting"], "topics": ["realism", "impressionism", "c19", "painting"], "search": {"commons": "Manet Le Déjeuner sur l'herbe", "wiki": {"en": "Le Déjeuner sur l'herbe"}}, "answer": 3, "tr": {"q": "Manet'nin 'Çimende Kahvaltı'sı 1863'te ilk kez nerede sergilendi?", "opts": ["Resmî Paris Salonu'nda", "İlk Empresyonist Sergi'de", "Dünya Fuarı'nda", "Salon des Refusés'de (Reddedilenler Salonu)"], "exp": "Resmî Salon'un reddettiği eserler çok tartışma yaratınca İmparator III. Napolyon 1863'te 'Salon des Refusés'yi açtırdı; Manet'nin tablosu orada skandal yarattı.", "detail": ["Tabloda giyinik iki erkeğin yanında çıplak bir kadın, izleyiciye doğrudan bakar. Konu Rönesans'tan alınmıştı, ama figürlerin çağdaş Parisliler olması seyirciyi rahatsız etti. Eser Musée d'Orsay'dadır."]}, "fr": {"q": "Où « Le Déjeuner sur l'herbe » de Manet a-t-il été exposé pour la première fois en 1863 ?", "opts": ["Au Salon officiel de Paris", "À la première exposition impressionniste", "À l'Exposition universelle", "Au Salon des refusés"], "exp": "Comme les refus du Salon officiel faisaient beaucoup de bruit, l'empereur Napoléon III fait ouvrir en 1863 le « Salon des refusés » ; le tableau de Manet y fait scandale.", "detail": ["Une femme nue, à côté de deux hommes habillés, regarde directement le spectateur. Le sujet venait de la Renaissance, mais les personnages contemporains ont choqué le public. L'œuvre est au musée d'Orsay."]}, "en": {"q": "Where was Manet's 'Le Déjeuner sur l'herbe' first shown in 1863?", "opts": ["At the official Paris Salon", "At the first Impressionist exhibition", "At the World's Fair", "At the Salon des Refusés"], "exp": "Because the official Salon's rejections caused so much protest, Emperor Napoleon III had the 'Salon des Refusés' opened in 1863; Manet's painting caused a scandal there.", "detail": ["A naked woman sits beside two clothed men and looks straight at the viewer. The subject came from the Renaissance, but the modern Parisian figures shocked the public. The work is in the Musée d'Orsay."]}, "id": "x-16-8", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1863, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "painting", "tags": ["realism", "impressionism", "c19", "painting"], "topics": ["realism", "impressionism", "c19", "painting"], "search": {"commons": "Manet Olympia", "wiki": {"en": "Olympia (Manet)"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Tiziano – Urbino Venüsü", "Manet – Olympia", "Goya – Çıplak Maja", "Cabanel – Venüs'ün Doğuşu"], "exp": "Édouard Manet'nin 'Olympia'sı (1863), 1865 Salonu'nda büyük bir skandala yol açtı; uzanmış çıplak kadın izleyiciye meydan okur gibi bakar.", "detail": ["Tablo, Tiziano'nun 'Urbino Venüsü'nü modern bir Parisli kadına dönüştürür. Arkada çiçek getiren siyah hizmetçi figürü (model Laure) bugün temsil ve görünürlük açısından yeniden tartışılır. Eser Musée d'Orsay'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Titien – La Vénus d'Urbin", "Manet – Olympia", "Goya – La Maja nue", "Cabanel – La Naissance de Vénus"], "exp": "« Olympia » d'Édouard Manet (1863) fait scandale au Salon de 1865 : la femme nue allongée regarde le spectateur avec défi.", "detail": ["Le tableau transforme la « Vénus d'Urbin » de Titien en Parisienne moderne. La servante noire qui apporte des fleurs (le modèle Laure) est aujourd'hui rediscutée sous l'angle de la représentation. L'œuvre est au musée d'Orsay."]}, "en": {"q": "Which work is this?", "opts": ["Titian – Venus of Urbino", "Manet – Olympia", "Goya – The Nude Maja", "Cabanel – The Birth of Venus"], "exp": "Édouard Manet's 'Olympia' (1863) caused a scandal at the 1865 Salon; the reclining nude woman stares at the viewer with defiance.", "detail": ["The painting turns Titian's 'Venus of Urbino' into a modern Parisian woman. The Black maid bringing flowers (the model Laure) is now discussed again in terms of representation. The work is in the Musée d'Orsay."]}, "id": "x-16-9", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1872, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "europe", "medium": "painting", "tags": ["impressionism", "c19", "painting", "women"], "topics": ["impressionism", "c19", "painting", "women"], "search": {"commons": "Berthe Morisot The Cradle", "wiki": {"en": "Berthe Morisot The Cradle"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Paris'te burjuva bir ailede büyüdüm ve kız kardeşim Edma ile resim öğrendim.", "1874'teki ilk Empresyonist sergiye katılan tek kadın sanatçıydım.", "Édouard Manet'nin kardeşi Eugène ile evlendim; 'Beşik' (1872) en bilinen tablolarımdandır."], "opts": ["Mary Cassatt", "Eva Gonzalès", "Berthe Morisot", "Marie Bracquemond"], "exp": "Cevap Berthe Morisot'dur. Empresyonist sergilerin neredeyse hepsine katıldı.", "detail": ["Morisot, kadınların hayatını, evleri ve bahçeleri hızlı, hafif fırça darbeleriyle resmetti. 'Beşik' Musée d'Orsay'dadır. Manet onun birçok portresini yaptı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai grandi à Paris dans une famille bourgeoise et j'ai appris la peinture avec ma sœur Edma.", "J'étais la seule femme à la première exposition impressionniste, en 1874.", "J'ai épousé Eugène, le frère d'Édouard Manet ; « Le Berceau » (1872) est l'un de mes tableaux les plus connus."], "opts": ["Mary Cassatt", "Eva Gonzalès", "Berthe Morisot", "Marie Bracquemond"], "exp": "La réponse est Berthe Morisot, qui a participé à presque toutes les expositions impressionnistes.", "detail": ["Morisot peint la vie des femmes, les maisons et les jardins avec des touches rapides et légères. « Le Berceau » est au musée d'Orsay. Manet a fait plusieurs portraits d'elle."]}, "en": {"q": "Who am I?", "clues": ["I grew up in a middle-class Paris family and learned painting with my sister Edma.", "I was the only woman in the first Impressionist exhibition in 1874.", "I married Eugène, Édouard Manet's brother; 'The Cradle' (1872) is one of my best-known paintings."], "opts": ["Mary Cassatt", "Eva Gonzalès", "Berthe Morisot", "Marie Bracquemond"], "exp": "The answer is Berthe Morisot, who took part in almost all the Impressionist exhibitions.", "detail": ["Morisot painted women's lives, homes and gardens with quick, light brushstrokes. 'The Cradle' is in the Musée d'Orsay. Manet made several portraits of her."]}, "id": "x-16-10", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1888, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "painting", "tags": ["postimpressionism", "c19", "painting"], "topics": ["postimpressionism", "c19", "painting"], "search": {"commons": "Van Gogh Sunflowers National Gallery", "wiki": {"en": "Van Gogh Sunflowers National Gallery"}}, "answer": true, "tr": {"q": "Van Gogh hayattayken sattığı tek tablonun 'Kırmızı Bağ' olduğu sık söylenir, ama bazı araştırmacılar başka küçük satışlar da olduğunu belirtir.", "exp": "Doğru. 'Kırmızı Bağ' 1890'da Brüksel'de ressam Anna Boch'a satıldı; ancak birkaç başka küçük satış ya da takas da belgelenmiştir.", "detail": ["Van Gogh'un ölümünden sonra eserlerinin ün kazanmasında kardeşi Theo'nun eşi Jo van Gogh-Bonger'in büyük rolü oldu; mektupları yayımladı ve sergiler düzenledi. 'Kırmızı Bağ' bugün Moskova'daki Puşkin Müzesi'ndedir."]}, "fr": {"q": "On dit souvent que « La Vigne rouge » est le seul tableau vendu par Van Gogh de son vivant, mais des chercheurs signalent d'autres petites ventes.", "exp": "Vrai. « La Vigne rouge » a été vendue en 1890 à Bruxelles à la peintre Anna Boch ; mais quelques autres petites ventes ou échanges sont documentés.", "detail": ["Après sa mort, Jo van Gogh-Bonger, l'épouse de son frère Theo, a joué un grand rôle dans sa célébrité : elle a publié les lettres et organisé des expositions. « La Vigne rouge » est au musée Pouchkine de Moscou."]}, "en": {"q": "It is often said that 'The Red Vineyard' was the only painting Van Gogh sold in his lifetime, but some researchers point to other small sales.", "exp": "True. 'The Red Vineyard' was sold in Brussels in 1890 to the painter Anna Boch, but a few other small sales or exchanges are documented.", "detail": ["After his death, his brother Theo's wife, Jo van Gogh-Bonger, played a huge role in his fame: she published the letters and organised exhibitions. 'The Red Vineyard' is in the Pushkin Museum in Moscow."]}, "id": "x-16-11", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1920, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "newmedia", "tags": ["constructivism", "bauhaus", "modern", "newmedia", "sculpture"], "topics": ["constructivism", "bauhaus", "modern", "newmedia", "sculpture"], "search": {"commons": "Moholy-Nagy Light-Space Modulator", "wiki": {"en": "Moholy-Nagy Light-Space Modulator"}}, "answer": 1, "tr": {"q": "Işık ve hareketi birleştiren ilk kinetik eserlerden biri olan 'Işık-Mekân Modülatörü'nü (1922–30) yapan Bauhaus öğretmeni kimdir?", "opts": ["Josef Albers", "László Moholy-Nagy", "Oskar Schlemmer", "Paul Klee"], "exp": "László Moholy-Nagy, motorla dönen metal ve cam parçalardan oluşan bu makineyi ışıkla aydınlatıp duvarlarda hareketli gölgeler oluşturdu.", "detail": ["Moholy-Nagy fotoğraf, film, tipografi ve sahne tasarımında da öncüydü. 'Fotogram' denen kamerasız fotoğraflar yaptı. Eser, kinetik ve ışık sanatının, hatta bugünkü immersif projeksiyonların erken bir atası sayılır; Harvard Art Museums'dadır."]}, "fr": {"q": "Quel professeur du Bauhaus a créé le « Modulateur lumière-espace » (1922–1930), l'une des premières œuvres cinétiques mêlant lumière et mouvement ?", "opts": ["Josef Albers", "László Moholy-Nagy", "Oskar Schlemmer", "Paul Klee"], "exp": "László Moholy-Nagy éclaire cette machine de pièces de métal et de verre qui tournent grâce à un moteur, et crée des ombres mobiles sur les murs.", "detail": ["Moholy-Nagy est aussi un pionnier de la photo, du film, de la typographie et de la scène. Il fait des « photogrammes », des photos sans appareil. L'œuvre est vue comme un ancêtre de l'art cinétique et lumineux, et même des projections immersives actuelles ; elle est aux Harvard Art Museums."]}, "en": {"q": "Which Bauhaus teacher made the 'Light-Space Modulator' (1922–30), one of the first kinetic works combining light and movement?", "opts": ["Josef Albers", "László Moholy-Nagy", "Oskar Schlemmer", "Paul Klee"], "exp": "László Moholy-Nagy lit this motor-driven machine of turning metal and glass parts, casting moving shadows on the walls.", "detail": ["Moholy-Nagy was also a pioneer of photography, film, typography and stage design. He made 'photograms', camera-less photographs. The work is seen as an ancestor of kinetic and light art, even of today's immersive projections; it is in the Harvard Art Museums."]}, "id": "x-16-12", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1922, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "performance", "tags": ["bauhaus", "modern", "performance", "design"], "topics": ["bauhaus", "modern", "performance", "design"], "search": {"commons": "Oskar Schlemmer Triadic Ballet", "wiki": {"en": "Oskar Schlemmer Triadic Ballet"}}, "answer": true, "tr": {"q": "Oskar Schlemmer'in 'Triyadik Bale'si (1922), dansçıları geometrik kostümlerle neredeyse heykele dönüştüren bir Bauhaus sahne eseridir.", "exp": "Doğru. Eserde 3 dansçı, 12 dans ve 18 kostüm vardı; kostümler hareketi kısıtlayarak bedeni mekân içindeki biçimlere dönüştürüyordu.", "detail": ["Schlemmer, Bauhaus'ta sahne atölyesini yönetti ve insan figürü ile mekân arasındaki ilişkiyi araştırdı. Bale ilk kez 1922'de Stuttgart'ta sahnelendi. Kostümleri bugün de moda ve sahne tasarımına ilham verir."]}, "fr": {"q": "Le « Ballet triadique » d'Oskar Schlemmer (1922) est une œuvre de scène du Bauhaus où des costumes géométriques transforment presque les danseurs en sculptures.", "exp": "Vrai. L'œuvre comptait 3 danseurs, 12 danses et 18 costumes ; les costumes limitaient le mouvement et transformaient le corps en formes dans l'espace.", "detail": ["Schlemmer dirige l'atelier de théâtre du Bauhaus et étudie la relation entre la figure humaine et l'espace. Le ballet est créé à Stuttgart en 1922. Ses costumes inspirent encore la mode et la scénographie."]}, "en": {"q": "Oskar Schlemmer's 'Triadic Ballet' (1922) is a Bauhaus stage work in which geometric costumes almost turn the dancers into sculptures.", "exp": "True. It had 3 dancers, 12 dances and 18 costumes; the costumes limited movement and turned the body into forms in space.", "detail": ["Schlemmer ran the Bauhaus theatre workshop and explored the relation between the human figure and space. The ballet premiered in Stuttgart in 1922. Its costumes still inspire fashion and stage design."]}, "id": "x-16-13", "t": 1794800000000}, {"type": "order", "level": 4, "year": 1960, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "world", "medium": "newmedia", "tags": ["newmedia", "postwar", "contemporary"], "topics": ["newmedia", "postwar", "contemporary"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1922", "1963", "1974", "2003"], "tr": {"q": "Işık, video ve immersif sanatla ilgili bu eserleri eskiden yeniye sırala.", "items": ["Moholy-Nagy – Işık-Mekân Modülatörü (ilk tasarım)", "Nam June Paik – Wuppertal'deki televizyon sergisi", "Nam June Paik – TV Buda", "Olafur Eliasson – Hava Durumu Projesi"], "exp": "Moholy-Nagy'nin modülatörü 1922'de tasarlanmaya başlandı, Paik'in Wuppertal sergisi 1963, TV Buda 1974, Eliasson'un Hava Durumu Projesi 2003 tarihlidir.", "detail": ["Bu sıra, ışığın ve teknolojinin sanat malzemesine dönüşümünü izler: mekanik ışık makinesinden televizyona, kapalı devre videodan dev ölçekli immersif ortamlara. Bugünkü projeksiyon haritalama ve immersif deneyimler bu çizginin devamıdır."]}, "fr": {"q": "Classe ces œuvres liées à la lumière, à la vidéo et à l'art immersif de la plus ancienne à la plus récente.", "items": ["Moholy-Nagy – Modulateur lumière-espace (première conception)", "Nam June Paik – Exposition de téléviseurs à Wuppertal", "Nam June Paik – TV Buddha", "Olafur Eliasson – The Weather Project"], "exp": "Le modulateur de Moholy-Nagy est conçu à partir de 1922, l'exposition de Paik à Wuppertal date de 1963, TV Buddha de 1974 et The Weather Project d'Eliasson de 2003.", "detail": ["Cet ordre suit la transformation de la lumière et de la technologie en matériaux d'art : de la machine lumineuse mécanique à la télévision, de la vidéo en circuit fermé aux grands environnements immersifs. Le mapping vidéo et les expériences immersives d'aujourd'hui en sont la suite."]}, "en": {"q": "Put these works related to light, video and immersive art in order, oldest first.", "items": ["Moholy-Nagy – Light-Space Modulator (first design)", "Nam June Paik – Television exhibition in Wuppertal", "Nam June Paik – TV Buddha", "Olafur Eliasson – The Weather Project"], "exp": "Moholy-Nagy began designing the modulator in 1922, Paik's Wuppertal show dates from 1963, TV Buddha from 1974 and Eliasson's Weather Project from 2003.", "detail": ["The order follows light and technology becoming art materials: from a mechanical light machine to television, from closed-circuit video to huge immersive environments. Today's projection mapping and immersive experiences continue this line."]}, "id": "x-16-14", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1977, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "europe", "medium": "arch", "tags": ["architecture", "postwar", "contemporary", "r-europe"], "topics": ["architecture", "postwar", "contemporary", "r-europe"], "search": {"commons": "Centre Pompidou facade", "wiki": {"en": "Centre Pompidou"}}, "answer": 2, "tr": {"q": "Borular, merdivenler ve tesisatı dışarıda gösteren Paris'teki Centre Pompidou'yu (1977) hangi mimarlar tasarladı?", "opts": ["Herzog & de Meuron", "Jean Nouvel ve Dominique Perrault", "Renzo Piano ve Richard Rogers", "Norman Foster ve Frank Gehry"], "exp": "Renzo Piano ve Richard Rogers (Gianfranco Franchini ile birlikte) 1971'deki yarışmayı kazandı; bina 1977'de açıldı.", "detail": ["Mavi borular havalandırmayı, yeşiller suyu, sarılar elektriği, kırmızılar ise insan dolaşımını gösterir. Bu 'içi dışa dönük' yaklaşım High-Tech mimarinin simgesi oldu. Binanın 2025'ten itibaren yaklaşık beş yıl sürecek büyük bir yenileme için kapanması planlandı."]}, "fr": {"q": "Quels architectes ont conçu le Centre Pompidou à Paris (1977), qui montre à l'extérieur ses tuyaux, ses escaliers et ses réseaux ?", "opts": ["Herzog & de Meuron", "Jean Nouvel et Dominique Perrault", "Renzo Piano et Richard Rogers", "Norman Foster et Frank Gehry"], "exp": "Renzo Piano et Richard Rogers (avec Gianfranco Franchini) gagnent le concours de 1971 ; le bâtiment ouvre en 1977.", "detail": ["Les tuyaux bleus sont pour l'air, les verts pour l'eau, les jaunes pour l'électricité et les rouges pour la circulation des personnes. Cette architecture « retournée » est devenue le symbole du high-tech. Une grande rénovation d'environ cinq ans était prévue à partir de 2025."]}, "en": {"q": "Which architects designed the Centre Pompidou in Paris (1977), which shows its pipes, stairs and services on the outside?", "opts": ["Herzog & de Meuron", "Jean Nouvel and Dominique Perrault", "Renzo Piano and Richard Rogers", "Norman Foster and Frank Gehry"], "exp": "Renzo Piano and Richard Rogers (with Gianfranco Franchini) won the 1971 competition; the building opened in 1977.", "detail": ["Blue pipes carry air, green ones water, yellow ones electricity and red ones show people's circulation. This 'inside-out' approach became the symbol of High-Tech architecture. A major renovation of about five years was planned from 2025."]}, "id": "x-16-15", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1951, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "arch", "tags": ["architecture", "postwar", "women", "r-latam"], "topics": ["architecture", "postwar", "women", "r-latam"], "search": {"commons": "MASP Lina Bo Bardi", "wiki": {"en": "MASP Lina Bo Bardi"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Roma'da doğdum ve 1946'da Brezilya'ya göç ettim.", "São Paulo Sanat Müzesi'ni (MASP) dört kırmızı ayak üzerinde havada asılı duran bir kutu olarak tasarladım.", "Eserlerin cam şövaleler üzerinde, duvarlar olmadan sergilenmesini önerdim; Glass House (Cam Ev) adlı evimde yaşadım."], "opts": ["Lina Bo Bardi", "Charlotte Perriand", "Eileen Gray", "Denise Scott Brown"], "exp": "Cevap Lina Bo Bardi'dir. Modernizmi Brezilya'nın halk kültürüyle birleştiren önemli bir mimardır.", "detail": ["MASP 1968'de açıldı; altındaki büyük açık alan halka açık bir meydan olarak kullanılır. Bo Bardi'nin cam şövaleleri 2015'te yeniden kullanılmaya başlandı. São Paulo'daki SESC Pompéia kültür merkezi de onun eseridir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Rome et j'ai émigré au Brésil en 1946.", "J'ai conçu le Musée d'art de São Paulo (MASP) comme une boîte suspendue sur quatre piliers rouges.", "J'ai proposé d'exposer les œuvres sur des chevalets de verre, sans murs ; j'ai vécu dans ma « Casa de Vidro » (maison de verre)."], "opts": ["Lina Bo Bardi", "Charlotte Perriand", "Eileen Gray", "Denise Scott Brown"], "exp": "La réponse est Lina Bo Bardi, une architecte importante qui a uni le modernisme et la culture populaire brésilienne.", "detail": ["Le MASP a ouvert en 1968 ; le grand espace libre en dessous sert de place publique. Ses chevalets de verre sont de nouveau utilisés depuis 2015. Le centre culturel SESC Pompéia à São Paulo est aussi son œuvre."]}, "en": {"q": "Who am I?", "clues": ["I was born in Rome and emigrated to Brazil in 1946.", "I designed the São Paulo Museum of Art (MASP) as a box suspended on four red pillars.", "I proposed showing artworks on glass easels without walls; I lived in my 'Glass House' (Casa de Vidro)."], "opts": ["Lina Bo Bardi", "Charlotte Perriand", "Eileen Gray", "Denise Scott Brown"], "exp": "The answer is Lina Bo Bardi, an important architect who joined modernism with Brazilian popular culture.", "detail": ["MASP opened in 1968; the large open space beneath it is used as a public square. Her glass easels were brought back into use in 2015. The SESC Pompéia cultural centre in São Paulo is also hers."]}, "id": "x-16-16", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1955, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "anatolia", "medium": "sculpture", "tags": ["r-anatolia", "postwar", "sculpture", "modern"], "topics": ["r-anatolia", "postwar", "sculpture", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "Türkiye'de soyut heykelin öncülerinden olan İstanbul'daki 'Akdeniz' heykeliyle bilinen heykeltıraş kimdir?", "opts": ["Hüseyin Gezer", "Mehmet Aksoy", "Ali Hadi Bara", "İlhan Koman"], "exp": "İlhan Koman, metal levhaları bükerek ve keserek yaptığı soyut heykellerle Türk modern heykelinin öncülerindendir; 1950'lerden sonra İsveç'e yerleşti.", "detail": ["Koman'ın İstanbul'daki 'Akdeniz' heykeli (1980) en tanınan kamusal eserlerindendir. Matematik ve geometriden ilham alan, hiperbolik yüzeyli heykeller de yaptı. Ali Hadi Bara ve Zühtü Müridoğlu da Türk modern heykelinin önemli isimleridir."]}, "fr": {"q": "Quel sculpteur, pionnier de la sculpture abstraite en Turquie, est connu pour la sculpture « Akdeniz » à Istanbul ?", "opts": ["Hüseyin Gezer", "Mehmet Aksoy", "Ali Hadi Bara", "İlhan Koman"], "exp": "İlhan Koman est un pionnier de la sculpture moderne turque, avec des sculptures abstraites en tôles pliées et découpées ; il s'installe en Suède après les années 1950.", "detail": ["Sa sculpture « Akdeniz » (Méditerranée, 1980) à Istanbul est l'une de ses œuvres publiques les plus connues. Il a aussi fait des sculptures à surfaces hyperboliques inspirées des mathématiques. Ali Hadi Bara et Zühtü Müridoğlu sont aussi des noms importants."]}, "en": {"q": "Which sculptor, a pioneer of abstract sculpture in Turkey, is known for the 'Akdeniz' sculpture in Istanbul?", "opts": ["Hüseyin Gezer", "Mehmet Aksoy", "Ali Hadi Bara", "İlhan Koman"], "exp": "İlhan Koman was a pioneer of modern Turkish sculpture, with abstract works made by bending and cutting metal sheets; he settled in Sweden after the 1950s.", "detail": ["His 'Akdeniz' (Mediterranean, 1980) in Istanbul is one of his best-known public works. He also made sculptures with hyperbolic surfaces inspired by mathematics. Ali Hadi Bara and Zühtü Müridoğlu are other key names."]}, "id": "x-16-17", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1958, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "anatolia", "medium": "photo", "tags": ["photo", "postwar", "r-anatolia"], "topics": ["photo", "postwar", "r-anatolia"], "search": {"commons": "Ara Güler Istanbul", "wiki": {"en": "Ara Güler Istanbul"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["İstanbul'da doğdum ve 'İstanbul'un gözü' olarak anıldım.", "Magnum ajansıyla çalıştım ve Picasso, Dalí gibi sanatçıların portrelerini çektim.", "Siyah beyaz fotoğraflarımda Beyoğlu'nun, Boğaz'ın ve balıkçıların eski İstanbul'unu belgeledim."], "opts": ["Ozan Sağdıç", "Ara Güler", "Sabit Kalfagil", "Fikret Otyam"], "exp": "Cevap Ara Güler'dir. Türkiye'nin en ünlü foto muhabiriydi.", "detail": ["Güler kendini 'sanatçı' değil, görsel tarih yazan bir 'foto muhabiri' olarak tanımladı. 2018'de öldü. İstanbul'daki Ara Güler Müzesi, arşivinin bir bölümünü sergiler."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Istanbul et on m'a surnommé « l'œil d'Istanbul ».", "J'ai travaillé avec l'agence Magnum et j'ai photographié des artistes comme Picasso et Dalí.", "Dans mes photos en noir et blanc, j'ai documenté le vieil Istanbul de Beyoğlu, du Bosphore et des pêcheurs."], "opts": ["Ozan Sağdıç", "Ara Güler", "Sabit Kalfagil", "Fikret Otyam"], "exp": "La réponse est Ara Güler, le photojournaliste le plus célèbre de Turquie.", "detail": ["Güler ne se voyait pas comme un « artiste », mais comme un photojournaliste qui écrit une histoire visuelle. Il est mort en 2018. Le musée Ara Güler à Istanbul présente une partie de ses archives."]}, "en": {"q": "Who am I?", "clues": ["I was born in Istanbul and was called 'the eye of Istanbul'.", "I worked with the Magnum agency and photographed artists such as Picasso and Dalí.", "In my black and white photos I documented the old Istanbul of Beyoğlu, the Bosphorus and fishermen."], "opts": ["Ozan Sağdıç", "Ara Güler", "Sabit Kalfagil", "Fikret Otyam"], "exp": "The answer is Ara Güler, Turkey's most famous photojournalist.", "detail": ["Güler saw himself not as an 'artist' but as a photojournalist writing visual history. He died in 2018. The Ara Güler Museum in Istanbul shows part of his archive."]}, "id": "x-17-0", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1500, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "anatolia", "medium": "design", "tags": ["r-anatolia", "r-islam", "renaissance", "design"], "topics": ["r-anatolia", "r-islam", "renaissance", "design"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "Osmanlı hat sanatında 'Kıbletü'l-küttâb' (hattatların kıblesi) olarak anılan ve 'Şeyh' lakabıyla bilinen hattat kimdir?", "opts": ["Şeyh Hamdullah", "Hafız Osman", "Ahmed Karahisarî", "Mustafa Rakım"], "exp": "Şeyh Hamdullah (1436–1520), Amasya'da II. Bayezid'in hocası oldu ve Yakut el-Müsta'sımi'nin üslubunu geliştirerek Osmanlı nesih ve sülüs yazısının temelini attı.", "detail": ["Hafız Osman 17. yüzyılda bu geleneği daha da sadeleştirdi. Ahmed Karahisarî ise 16. yüzyılda farklı bir üslubu temsil etti. Şeyh Hamdullah'ın kalemi, yüzyıllar boyunca hattatlara örnek oldu."]}, "fr": {"q": "Quel calligraphe ottoman, surnommé « le Cheikh », est appelé « la qibla des calligraphes » ?", "opts": ["Şeyh Hamdullah", "Hafız Osman", "Ahmed Karahisarî", "Mustafa Rakım"], "exp": "Şeyh Hamdullah (1436–1520), professeur de Bayezid II à Amasya, développe le style de Yaqut al-Musta'simi et pose les bases des écritures naskh et thuluth ottomanes.", "detail": ["Au XVIIe siècle, Hafız Osman simplifie encore cette tradition. Ahmed Karahisarî représente au XVIe siècle un autre style. La plume de Şeyh Hamdullah a servi de modèle pendant des siècles."]}, "en": {"q": "Which Ottoman calligrapher, known as 'the Sheikh', is called 'the qibla of calligraphers'?", "opts": ["Şeyh Hamdullah", "Hafız Osman", "Ahmed Karahisarî", "Mustafa Rakım"], "exp": "Şeyh Hamdullah (1436–1520), teacher of Bayezid II in Amasya, developed the style of Yaqut al-Musta'simi and laid the foundations of Ottoman naskh and thuluth script.", "detail": ["In the 17th century Hafız Osman refined this tradition further. Ahmed Karahisarî represented a different style in the 16th century. Şeyh Hamdullah's hand served as a model for centuries."]}, "id": "x-17-1", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1446, "era": {"tr": "15. yüzyıl", "fr": "15e siècle", "en": "15th century"}, "region": "asia", "medium": "design", "tags": ["r-fareast", "renaissance", "design"], "topics": ["r-fareast", "renaissance", "design"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Kore alfabesi Hangul, 15. yüzyılda Kral Sejong döneminde yaratıldı ve 1446'da halka duyuruldu.", "exp": "Doğru. Hangul, 'Hunminjeongeum' adlı belgeyle 1446'da ilan edildi; amaç halkın kolayca okuyup yazabilmesiydi.", "detail": ["Harflerin biçimleri kısmen ses çıkarırken ağız ve dilin aldığı şekillerden esinlenir. Hangul, tasarımı bilinen nadir alfabelerden biridir ve bugün tipografi ve grafik tasarımda da güçlü bir görsel kimliğe sahiptir. Kore'de 9 Ekim Hangul Günü olarak kutlanır."]}, "fr": {"q": "L'alphabet coréen, le hangeul, a été créé au XVe siècle sous le roi Sejong et présenté au peuple en 1446.", "exp": "Vrai. Le hangeul est promulgué en 1446 dans le document « Hunminjeongeum » ; le but était que le peuple puisse lire et écrire facilement.", "detail": ["La forme des lettres s'inspire en partie de la position de la bouche et de la langue quand on prononce les sons. C'est l'un des rares alphabets dont la conception est connue, et il a une forte identité visuelle en typographie. Le 9 octobre est le jour du hangeul en Corée."]}, "en": {"q": "The Korean alphabet, Hangul, was created in the 15th century under King Sejong and announced in 1446.", "exp": "True. Hangul was proclaimed in 1446 in the document 'Hunminjeongeum'; the aim was for ordinary people to read and write easily.", "detail": ["The shapes of the letters are partly based on the position of the mouth and tongue when making the sounds. It is one of the few alphabets whose design is known, and it has a strong visual identity in typography. 9 October is Hangul Day in Korea."]}, "id": "x-17-2", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1927, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "modern", "newobjectivity", "artdeco"], "topics": ["cinema", "modern", "newobjectivity", "artdeco"], "search": {"commons": "Metropolis 1927 Maria robot", "wiki": {"en": "Metropolis 1927 Maria robot"}}, "answer": 1, "tr": {"q": "Dev kent mimarisi ve robot Maria ile bilimkurgu sinemasının temel eserlerinden biri sayılan 1927 tarihli 'Metropolis' filmini kim yönetti?", "opts": ["F. W. Murnau", "Fritz Lang", "Robert Wiene", "G. W. Pabst"], "exp": "Fritz Lang'ın yönettiği 'Metropolis' (1927), zengin bir üst kent ile yeraltında çalışan işçiler arasındaki karşıtlığı anlatır.", "detail": ["Filmin gökdelenli kent tasarımı Art Deco ve Ekspresyonist mimariden etkilendi. Uzun süre eksik kopyalarla bilindi; 2008'de Buenos Aires'te kayıp sahneleri içeren bir kopya bulundu. 'Metropolis', UNESCO Dünya Belleği listesine giren ilk filmdir."]}, "fr": {"q": "Qui a réalisé « Metropolis » (1927), avec sa ville géante et la robote Maria, film fondateur de la science-fiction au cinéma ?", "opts": ["F. W. Murnau", "Fritz Lang", "Robert Wiene", "G. W. Pabst"], "exp": "« Metropolis » de Fritz Lang (1927) oppose une ville haute très riche aux ouvriers qui travaillent sous terre.", "detail": ["Le décor de gratte-ciel s'inspire de l'Art déco et de l'architecture expressionniste. Le film a longtemps été connu par des copies incomplètes ; en 2008, une copie avec des scènes perdues a été retrouvée à Buenos Aires. C'est le premier film inscrit au registre Mémoire du monde de l'UNESCO."]}, "en": {"q": "Who directed 'Metropolis' (1927), with its giant city and the robot Maria, a founding work of science fiction cinema?", "opts": ["F. W. Murnau", "Fritz Lang", "Robert Wiene", "G. W. Pabst"], "exp": "Fritz Lang's 'Metropolis' (1927) contrasts a rich upper city with workers labouring underground.", "detail": ["Its skyscraper city design was influenced by Art Deco and Expressionist architecture. For a long time it was known only from incomplete prints; in 2008 a copy with lost scenes was found in Buenos Aires. It was the first film added to UNESCO's Memory of the World register."]}, "id": "x-17-3", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1920, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "expressionism", "modern"], "topics": ["cinema", "expressionism", "modern"], "search": {"commons": "The Cabinet of Dr Caligari set", "wiki": {"en": "The Cabinet of Dr Caligari set"}}, "answer": true, "tr": {"q": "'Dr. Caligari'nin Muayenehanesi' (1920) filminde gölgeler ve ışıklar, eğri dekorların üzerine doğrudan boyanmıştır.", "exp": "Doğru. Robert Wiene'nin filminde sanatçılar Hermann Warm, Walter Reimann ve Walter Röhrig, ışık ve gölgeleri tuval dekorlara boyayarak çarpık bir dünya yarattı.", "detail": ["Film, Alman Ekspresyonist sinemasının en ünlü örneğidir; delilik, otorite ve kâbus temalarını işler. Eğri sokaklar ve keskin açılar, karakterlerin iç dünyasını dışa vurur ve sonraki korku filmlerini etkiledi."]}, "fr": {"q": "Dans « Le Cabinet du docteur Caligari » (1920), les ombres et les lumières sont peintes directement sur des décors tordus.", "exp": "Vrai. Dans le film de Robert Wiene, les artistes Hermann Warm, Walter Reimann et Walter Röhrig peignent la lumière et l'ombre sur des toiles et créent un monde déformé.", "detail": ["C'est l'exemple le plus célèbre du cinéma expressionniste allemand, sur la folie, l'autorité et le cauchemar. Les rues tordues et les angles aigus expriment l'intérieur des personnages et ont influencé les films d'horreur."]}, "en": {"q": "In 'The Cabinet of Dr. Caligari' (1920), shadows and lights are painted directly onto crooked sets.", "exp": "True. In Robert Wiene's film, the artists Hermann Warm, Walter Reimann and Walter Röhrig painted light and shadow onto canvas sets to create a distorted world.", "detail": ["It is the most famous example of German Expressionist cinema, dealing with madness, authority and nightmare. Crooked streets and sharp angles express the characters' inner world and influenced later horror films."]}, "id": "x-17-4", "t": 1794800000000}], "artists": {}, "intros": {}};

 cartel:{who:{tr:"Çanak çömleksiz Neolitik topluluklar",fr:"Communautés du Néolithique précéramique"},what:{tr:"Göbekli Tepe dikilitaşları",fr:"Piliers de Göbekli Tepe"},when:{tr:"MÖ y. 9600–8200",fr:"v. 9600–8200 av. J.-C."},how:{tr:"Oyulmuş kireçtaşı",fr:"Calcaire sculpté"},where:{tr:"Şanlıurfa, Türkiye",fr:"Şanlıurfa, Turquie"}},
 tr:{
  q:"Şanlıurfa yakınlarındaki Göbekli Tepe'yi arkeoloji için devrim niteliğinde yapan nedir?",
  opts:["Bilinen en eski yazılı belgeleri barındırması","Tarımdan ve çanak çömlekten önce, avcı-toplayıcılar tarafından inşa edilmiş anıtsal bir yapı olması","Hitit İmparatorluğu'nun başkenti olması","Anadolu'daki ilk Roma tiyatrosu olması"],
  exp:"Yaklaşık MÖ 9600'e tarihlenen Göbekli Tepe, Stonehenge'den 6.000 yıldan fazla eskidir. Hayvan kabartmalı, T biçimli dev dikilitaşlar, anıtsal mimarinin tarımdan önce de var olabildiğini gösterdi.",
  detail:["Kazılar 1995'te Alman arkeolog Klaus Schmidt yönetiminde başladı. Schmidt'in yorumu kısaca şöyle özetlenir: önce tapınak geldi, sonra şehir. Yani insanları bir araya getiren şey tarım değil, ortak bir inanç ya da tören olabilir.","Dikilitaşlardaki tilki, yaban domuzu, yılan ve akbaba kabartmaları, sanatta bilinen en erken anlatı denemelerinden sayılır. Bazı sütunlarda kollar ve eller oyulmuştur. Bu taşlar büyük olasılıkla stilize insan ya da tanrı figürleridir.","Göbekli Tepe 2018'de UNESCO Dünya Mirası Listesi'ne girdi. Yakındaki Karahan Tepe gibi 'Taş Tepeler' alanlarında kazılar sürüyor ve bölgenin Neolitik haritası hızla yeniden çiziliyor."]
 },
 fr:{
  q:"Qu'est-ce qui rend le site de Göbekli Tepe, près de Şanlıurfa, révolutionnaire pour l'archéologie ?",
  opts:["Il contient les plus anciens documents écrits connus","C'est un monument construit par des chasseurs-cueilleurs, avant l'agriculture et la poterie","C'était la capitale de l'Empire hittite","C'est le premier théâtre romain d'Anatolie"],
  exp:"Daté d'environ 9600 av. J.-C., Göbekli Tepe est plus ancien que Stonehenge de plus de 6 000 ans. Ses immenses piliers en forme de T, sculptés d'animaux, montrent que l'architecture monumentale a pu exister avant l'agriculture.",
  detail:["Les fouilles ont commencé en 1995 sous la direction de l'archéologue allemand Klaus Schmidt. On résume souvent son interprétation ainsi : d'abord le temple, ensuite la ville. Autrement dit, ce qui a rassemblé les humains n'était peut-être pas l'agriculture, mais une croyance ou un rituel commun.","Les reliefs de renards, de sangliers, de serpents et de vautours sur les piliers comptent parmi les premières tentatives de récit dans l'art. Sur certains piliers, on a sculpté des bras et des mains. Ces pierres sont probablement des figures humaines ou divines stylisées.","Göbekli Tepe est inscrit au patrimoine mondial de l'UNESCO depuis 2018. Les fouilles continuent sur d'autres sites des « Collines de pierre », comme Karahan Tepe, et la carte du Néolithique de la région est en train d'être redessinée."]
 }
},

 cartel:{who:{tr:"Heykeltıraş Thutmose'nin atölyesi",fr:"Atelier du sculpteur Thoutmôsis"},what:{tr:"Nefertiti büstü",fr:"Buste de Néfertiti"},when:{tr:"MÖ y. 1345",fr:"v. 1345 av. J.-C."},how:{tr:"Boyalı kireçtaşı ve alçı",fr:"Calcaire peint et stuc"},where:{tr:"Neues Museum, Berlin",fr:"Neues Museum, Berlin"}},
 tr:{
  q:"Uzun yüzler, sarkık karınlar ve samimi aile sahneleriyle Mısır sanatının bin yıllık kurallarını kıran dönem hangi firavunla ilişkilidir?",
  opts:["II. Ramses","Akhenaton","Tutankamon","Keops"],
  exp:"Akhenaton (MÖ 14. yüzyıl) tek tanrı Aton'a tapınmayı öne çıkardı ve yeni başkent Amarna'yı kurdu. Saray sanatçıları kralı ve ailesini alışılmadık biçimde doğal, hatta abartılı gösterdi. Bu üsluba 'Amarna sanatı' denir.",
  detail:["Nefertiti büstü 1912'de Alman arkeolog Ludwig Borchardt'ın ekibi tarafından, Amarna'daki heykeltıraş Thutmose'nin atölyesinde bulundu. Bugün Berlin'deki Neues Museum'da sergileniyor ve Mısır uzun süredir iadesini talep ediyor.","Büstün tek gözü hiç tamamlanmamış. Bu yüzden eserin bir portre değil, atölyede kullanılan bir model olduğu düşünülüyor.","Akhenaton'un ölümünden sonra eski düzen hızla geri döndü. Oğlu Tutankaton adını Tutankamon olarak değiştirdi ve Akhenaton'un adı resmî kayıtlardan silindi."]
 },
 fr:{
  q:"La période qui a brisé des règles millénaires de l'art égyptien, avec ses visages allongés, ses ventres arrondis et ses scènes familiales intimes, est liée à quel pharaon ?",
  opts:["Ramsès II","Akhenaton","Toutânkhamon","Khéops"],
  exp:"Akhenaton (XIVe siècle av. J.-C.) a imposé le culte d'un dieu unique, Aton, et a fondé une nouvelle capitale, Amarna. Les artistes de la cour ont représenté le roi et sa famille de façon étonnamment naturelle, voire exagérée. On appelle ce style « l'art amarnien ».",
  detail:["Le buste de Néfertiti a été découvert en 1912 par l'équipe de l'archéologue allemand Ludwig Borchardt, dans l'atelier du sculpteur Thoutmôsis à Amarna. Il est aujourd'hui exposé au Neues Museum de Berlin, et l'Égypte demande sa restitution depuis longtemps.","Un des yeux du buste n'a jamais été terminé. C'est pourquoi on pense que l'œuvre n'est pas un portrait, mais un modèle utilisé dans l'atelier.","Après la mort d'Akhenaton, l'ancien ordre est vite revenu. Son fils Toutânkhaton a changé son nom en Toutânkhamon, et le nom d'Akhenaton a été effacé des documents officiels."]
 }
},

 cartel:{who:{tr:"Polykleitos",fr:"Polyclète"},what:{tr:"Doryphoros (Mızrak Taşıyan)",fr:"Le Doryphore"},when:{tr:"MÖ y. 440 (Roma kopyası)",fr:"v. 440 av. J.-C. (copie romaine)"},how:{tr:"Bronz orijinalin mermer kopyası",fr:"Copie en marbre d'un original en bronze"},where:{tr:"Napoli Ulusal Arkeoloji Müzesi",fr:"Musée archéologique national de Naples"}},
 tr:{
  q:"Polykleitos'un Doryphoros'unda görülen, ağırlığın tek bacağa verilmesiyle bedene doğal bir S kıvrımı kazandıran duruşun adı nedir?",
  opts:["Kontrapost","Sfumato","Anamorfoz","Arkaik gülümseme"],
  exp:"Kontrapostta ağırlık bir bacağa verilir, kalça ve omuzlar zıt yönlere eğilir. Klasik Yunan heykeltıraşları bu duruşla arkaik kouros heykellerinin katı, cepheden duruşunu aştı.",
  detail:["Polykleitos, 'Kanon' adlı kayıp incelemesinde ideal insan oranlarını tarif etti. Doryphoros bu kuralların somut örneğiydi. Orijinal bronz kayıp; bildiğimiz eserler Romalıların yaptığı mermer kopyalardır.","Diğer şıklar da sanat tarihi terimleri: sfumato Leonardo'nun yumuşak geçişli tekniği, anamorfoz ise Holbein'in 'Elçiler' tablosundaki çarpık kafatası gibi belli bir açıdan çözülen görüntüdür.","Kontrapost Orta Çağ'da büyük ölçüde unutuldu. Rönesans'ta Donatello'nun bronz Davut'u ve Michelangelo'nun Davut'u ile görkemli bir dönüş yaptı."]
 },
 fr:{
  q:"Comment s'appelle la posture du Doryphore de Polyclète, où le poids du corps repose sur une seule jambe, ce qui donne au corps une courbe naturelle en S ?",
  opts:["Le contrapposto","Le sfumato","L'anamorphose","Le sourire archaïque"],
  exp:"Dans le contrapposto, le poids repose sur une jambe, et les hanches et les épaules s'inclinent dans des directions opposées. Grâce à cette posture, les sculpteurs grecs classiques ont dépassé la pose rigide et frontale des kouroi archaïques.",
  detail:["Dans son traité perdu, le « Canon », Polyclète décrivait les proportions idéales du corps humain. Le Doryphore était l'exemple concret de ces règles. L'original en bronze est perdu ; les œuvres que nous connaissons sont des copies romaines en marbre.","Les autres réponses sont aussi des termes d'histoire de l'art : le sfumato est la technique de Léonard aux transitions douces, et l'anamorphose est une image déformée qui se révèle sous un certain angle, comme le crâne dans « Les Ambassadeurs » de Holbein.","Le contrapposto a été largement oublié au Moyen Âge. Il a fait un retour spectaculaire à la Renaissance avec le David en bronze de Donatello et le David de Michel-Ange."]
 }
},

 cartel:{who:{tr:"Qin hanedanı atölyeleri",fr:"Ateliers de la dynastie Qin"},what:{tr:"Toprak Askerler Ordusu",fr:"Armée de terre cuite"},when:{tr:"MÖ y. 210",fr:"v. 210 av. J.-C."},how:{tr:"Boyalı pişmiş toprak",fr:"Terre cuite polychrome"},where:{tr:"Lintong, Şian, Çin",fr:"Lintong, Xi'an, Chine"}},
 tr:{
  q:"1974'te Şian yakınlarında kuyu kazan çiftçilerin bulduğu Toprak Askerler Ordusu kimin mezar kompleksinin parçasıdır?",
  opts:["Cengiz Han","Qin Shi Huang","Kubilay Han","Ming imparatoru Yongle"],
  exp:"Çin'i MÖ 221'de birleştiren ilk imparator Qin Shi Huang, öbür dünyada kendisini koruyacak bir ordu yaptırdı. Sekiz binden fazla asker, at ve savaş arabasının pişmiş topraktan üretildiği tahmin ediliyor.",
  detail:["Her askerin yüzü farklı. Atölyeler gövde, kol ve baş gibi parçaları seri üretimle yapıyor, ardından yüzleri ve saçları elle bireyselleştiriyordu: antik bir 'modüler üretim' sistemi.","Heykeller başlangıçta canlı renklerle boyalıydı. Kazıda havayla temas eden boya dakikalar içinde dökülebiliyor. Bu yüzden imparatorun asıl mezar höyüğü hâlâ açılmadı.","Tarihçi Sima Qian, mezarda cıvadan nehirler olduğunu yazmıştı. Höyükteki toprakta ölçülen yüksek cıva oranları bu anlatıyı destekliyor."]
 },
 fr:{
  q:"L'armée de terre cuite, découverte en 1974 près de Xi'an par des paysans qui creusaient un puits, fait partie du complexe funéraire de qui ?",
  opts:["Gengis Khan","Qin Shi Huang","Kubilai Khan","L'empereur Ming Yongle"],
  exp:"Qin Shi Huang, le premier empereur qui a unifié la Chine en 221 av. J.-C., a fait construire une armée pour le protéger dans l'au-delà. On estime que plus de huit mille soldats, chevaux et chars ont été fabriqués en terre cuite.",
  detail:["Chaque soldat a un visage différent. Les ateliers produisaient en série des parties comme le corps, les bras et la tête, puis personnalisaient à la main les visages et les coiffures : un système antique de « production modulaire ».","À l'origine, les statues étaient peintes de couleurs vives. Lors des fouilles, la peinture au contact de l'air peut tomber en quelques minutes. C'est pourquoi le tumulus principal de l'empereur n'a toujours pas été ouvert.","L'historien Sima Qian avait écrit que la tombe contenait des rivières de mercure. Les taux élevés de mercure mesurés dans le sol du tumulus confirment ce récit."]
 }

 cartel:{who:{tr:"Benin Krallığı (Edo) dökümcüleri",fr:"Fondeurs du royaume du Bénin (Edo)"},what:{tr:"Oba sarayının plaketleri",fr:"Plaques du palais de l'Oba"},when:{tr:"16.–17. yüzyıl",fr:"XVIe–XVIIe siècle"},how:{tr:"Pirinç, kayıp mum tekniği",fr:"Laiton, fonte à la cire perdue"},where:{tr:"British Museum ve dağınık koleksiyonlar",fr:"British Museum et collections dispersées"}},
 tr:{
  q:"'Benin Bronzları' hakkında hangisi doğrudur?",
  opts:["Bugünkü Benin Cumhuriyeti'nde, Dahomey Krallığı'nda üretildiler","1897'de bir İngiliz cezalandırma seferinde Benin Krallığı'ndan (bugünkü Nijerya) yağmalandılar","Portekizli sanatçılar tarafından Avrupa'da döküldüler","Tamamı Nijerya'ya iade edildi"],
  exp:"Benin Krallığı, Edo halkının bugünkü güney Nijerya'daki krallığıdır; adaşı Benin Cumhuriyeti ile karıştırılmamalıdır. 1897'de İngiliz birlikleri Benin City'yi yağmaladı ve binlerce plaket ile heykel Avrupa müzelerine dağıldı.",
  detail:["Eserlerin çoğu aslında bronz değil pirinçtir ve kayıp mum tekniğiyle dökülmüştür. Oba'nın sarayını süsleyen plaketler savaşları, törenleri ve saray hayatını anlatır. Bazılarında Portekizli tüccarlar da görülür; ticaretle gelen metal halkalar dökümün hammaddesiydi.","İade tartışmasının merkezinde bu eserler var. Almanya 2022'de koleksiyonlarındaki Benin Bronzlarının mülkiyetini Nijerya'ya devretti. British Museum ise hâlâ yüzlerce parçayı elinde tutuyor.","Kafa karıştıran bir ayrıntı: Fransa'nın 2021'de Benin Cumhuriyeti'ne iade ettiği 26 eser, Dahomey Krallığı'nın Abomey hazinesinden geliyor. Yani farklı bir krallık, farklı bir ülke."]
 },
 fr:{
  q:"Laquelle de ces affirmations sur les « bronzes du Bénin » est vraie ?",
  opts:["Ils ont été produits dans l'actuelle République du Bénin, dans le royaume du Dahomey","Ils ont été pillés en 1897 dans le royaume du Bénin (l'actuel Nigeria) lors d'une expédition punitive britannique","Ils ont été fondus en Europe par des artistes portugais","Ils ont tous été rendus au Nigeria"],
  exp:"Le royaume du Bénin est le royaume du peuple edo, dans le sud de l'actuel Nigeria ; il ne faut pas le confondre avec la République du Bénin. En 1897, les troupes britanniques ont pillé Benin City, et des milliers de plaques et de sculptures se sont dispersées dans les musées européens.",
  detail:["La plupart de ces œuvres ne sont pas en bronze mais en laiton, et elles ont été fondues selon la technique de la cire perdue. Les plaques qui décoraient le palais de l'Oba racontent les guerres, les cérémonies et la vie de la cour. On y voit aussi des marchands portugais ; les bracelets de métal apportés par le commerce servaient de matière première.","Ces œuvres sont au cœur du débat sur les restitutions. En 2022, l'Allemagne a transféré au Nigeria la propriété des bronzes du Bénin de ses collections. Le British Museum, lui, en conserve encore des centaines.","Un détail qui prête à confusion : les 26 œuvres que la France a rendues à la République du Bénin en 2021 viennent du trésor d'Abomey, dans le royaume du Dahomey. C'est donc un autre royaume et un autre pays."]
 }
},
{
 id:"olmec", region:"americas", medium:"sculpture", era:{tr:"Mezoamerika",fr:"Mésoamérique"}, year:-1100,

 cartel:{who:{tr:"Olmek uygarlığı",fr:"Civilisation olmèque"},what:{tr:"Dev başlar",fr:"Têtes colossales"},when:{tr:"MÖ y. 1200–900",fr:"v. 1200–900 av. J.-C."},how:{tr:"Bazalt",fr:"Basalte"},where:{tr:"Xalapa ve Villahermosa, Meksika",fr:"Xalapa et Villahermosa, Mexique"}},
 tr:{
  q:"Meksika Körfezi kıyısında bulunan, bazıları 3 metreyi aşan bazalt 'dev başlar' hangi uygarlığa aittir?",
  opts:["Olmekler","Aztekler","İnkalar","Mayalar"],
  exp:"Olmekler (yaklaşık MÖ 1500–400) Mezoamerika'nın bilinen en eski karmaşık uygarlıklarından biridir. Bugüne 17 dev baş ulaştı; çoğunun, miğfere benzer başlıklar takan hükümdarların portresi olduğu düşünülüyor.",
  detail:["Bazalt bloklar Tuxtla Dağları'ndan getirildi; bazıları 100 kilometreden fazla taşındı. Üstelik tekerlek ve yük hayvanı kullanılmadan, büyük olasılıkla sallarla ve kızaklarla.","Başlıca merkezler San Lorenzo ve La Venta'ydı. Bugün başların bir kısmını Xalapa Antropoloji Müzesi'nde ve Villahermosa'daki La Venta Park Müzesi'nde görebilirsiniz.","Olmeklere uzun süre Mezoamerika'nın 'ana kültürü' dendi; takvim, top oyunu ve jaguar imgesi sonraki Maya ve Aztek kültürlerinde de görülür. Günümüz araştırmacıları ise tek bir kaynaktan çok kültürler arası etkileşimi vurguluyor."]
 },
 fr:{
  q:"À quelle civilisation appartiennent les « têtes colossales » en basalte, découvertes sur la côte du golfe du Mexique, dont certaines dépassent 3 mètres ?",
  opts:["Les Olmèques","Les Aztèques","Les Incas","Les Mayas"],
  exp:"Les Olmèques (environ 1500–400 av. J.-C.) forment l'une des plus anciennes civilisations complexes connues de Mésoamérique. Dix-sept têtes colossales nous sont parvenues ; on pense que la plupart sont des portraits de souverains portant des coiffes semblables à des casques.",
  detail:["Les blocs de basalte venaient des montagnes de Tuxtla ; certains ont été transportés sur plus de 100 kilomètres. Et cela sans roue ni animal de bât, probablement avec des radeaux et des traîneaux.","Les principaux centres étaient San Lorenzo et La Venta. Aujourd'hui, on peut voir une partie des têtes au musée d'anthropologie de Xalapa et au parc-musée de La Venta, à Villahermosa.","On a longtemps appelé les Olmèques la « culture mère » de la Mésoamérique : le calendrier, le jeu de balle et l'image du jaguar se retrouvent plus tard chez les Mayas et les Aztèques. Les chercheurs actuels insistent plutôt sur les échanges entre cultures que sur une source unique."]
 }
},

 cartel:{who:{tr:"Emevi halifesi Abdülmelik",fr:"Le calife omeyyade Abd al-Malik"},what:{tr:"Kubbetü's-Sahra",fr:"Dôme du Rocher"},when:{tr:"691–692",fr:"691–692"},how:{tr:"Taş, mozaik, çini (16. yy)",fr:"Pierre, mosaïques, céramiques (XVIe s.)"},where:{tr:"Kudüs",fr:"Jérusalem"}},
 tr:{
  q:"Günümüze ayakta ulaşan en eski büyük İslam anıtı kabul edilen yapı hangisidir?",
  opts:["Kurtuba Ulu Camii","Kubbetü's-Sahra","Samarra Ulu Camii","Süleymaniye Camii"],
  exp:"Kudüs'teki Kubbetü's-Sahra, Emevi halifesi Abdülmelik döneminde 691–692'de tamamlandı. Sekizgen planı ve altın zeminli mozaikleriyle Bizans ve Geç Antik mimari geleneğinden beslenir.",
  detail:["Yapı teknik olarak bir cami değildir; kutsal kayayı çevreleyen bir anıttır. Cemaat namazı hemen yanındaki Mescid-i Aksa'da kılınır.","İç mozaiklerde insan ya da hayvan figürü yoktur: bitkisel motifler, mücevherler ve taçlar görülür. Bu, İslam sanatında figürsüz süslemenin erken bir örneğidir. Kûfi yazılı kuşak, bilinen en eski tarihli Kuran yazıtları arasındadır.","Dış cephedeki çiniler 16. yüzyılda Kanuni Sultan Süleyman döneminde yenilendi. Yani bugün gördüğümüz renkli dış görünüş büyük ölçüde Osmanlı dönemine aittir."]
 },
 fr:{
  q:"Quel édifice est considéré comme le plus ancien grand monument islamique encore debout ?",
  opts:["La grande mosquée de Cordoue","Le Dôme du Rocher","La grande mosquée de Samarra","La mosquée Süleymaniye"],
  exp:"Le Dôme du Rocher, à Jérusalem, a été achevé en 691–692 sous le calife omeyyade Abd al-Malik. Avec son plan octogonal et ses mosaïques à fond d'or, il s'inspire de la tradition architecturale byzantine et de l'Antiquité tardive.",
  detail:["Techniquement, l'édifice n'est pas une mosquée : c'est un monument qui entoure le rocher sacré. La prière en commun a lieu juste à côté, à la mosquée al-Aqsa.","Les mosaïques intérieures ne montrent aucune figure humaine ou animale : on y voit des motifs végétaux, des bijoux et des couronnes. C'est un exemple précoce de décor non figuratif dans l'art islamique. La frise en écriture coufique fait partie des plus anciennes inscriptions coraniques datées que l'on connaisse.","Les céramiques de la façade ont été renouvelées au XVIe siècle, sous Soliman le Magnifique. L'aspect coloré extérieur que nous voyons aujourd'hui date donc en grande partie de l'époque ottomane."]
 }
},
{
 id:"hagia", region:"anatolia", medium:"arch", era:{tr:"Bizans",fr:"Byzance"}, year:537,

 cartel:{who:{tr:"Trallesli Anthemios ve Miletli İsidoros",fr:"Anthémius de Tralles et Isidore de Milet"},what:{tr:"Ayasofya",fr:"Sainte-Sophie"},when:{tr:"532–537",fr:"532–537"},how:{tr:"Tuğla, taş, mozaik",fr:"Brique, pierre, mosaïques"},where:{tr:"İstanbul",fr:"Istanbul"}},
 tr:{
  q:"537'de tamamlanan Ayasofya'nın mimarları kimlerdir?",
  opts:["Mimar Sinan ve Davud Ağa","Trallesli Anthemios ve Miletli İsidoros","Vitruvius ve Şamlı Apollodoros","Brunelleschi ve Alberti"],
  exp:"İmparator I. Justinianus, Nika İsyanı'nda yanan kilisenin yerine yenisini yaptırdı. Matematikçi-mühendis Anthemios ve İsidoros, yaklaşık beş yılda dev kubbeyi kare bir plan üzerine oturttu.",
  detail:["Anahtar çözüm pandantiflerdir: kubbeyi kare tabana bağlayan küresel üçgenler. Kubbenin eteğindeki 40 pencere, ışığın arasında kubbenin havada süzüldüğü izlenimini verir. Tarihçi Prokopios kubbenin gökten bir zincirle asılı gibi durduğunu yazmıştı.","558'deki depremden sonra kubbe çöktü. Genç İsidoros onu daha yüksek bir profille yeniden yaptı (562).","1453'ten sonra camiye çevrildi, 1934'te müze oldu, 2020'de yeniden cami olarak ibadete açıldı. Mimar Sinan'ın kariyeri boyunca bu kubbeyle 'yarıştığı' sık sık söylenir."]
 },
 fr:{
  q:"Qui sont les architectes de Sainte-Sophie, achevée en 537 ?",
  opts:["Mimar Sinan et Davud Ağa","Anthémius de Tralles et Isidore de Milet","Vitruve et Apollodore de Damas","Brunelleschi et Alberti"],
  exp:"L'empereur Justinien Ier a fait reconstruire l'église brûlée pendant la sédition Nika. Les mathématiciens-ingénieurs Anthémius et Isidore ont posé, en environ cinq ans, une immense coupole sur un plan carré.",
  detail:["La solution clé, ce sont les pendentifs : des triangles sphériques qui relient la coupole à la base carrée. Les 40 fenêtres à la base de la coupole donnent l'impression qu'elle flotte dans la lumière. L'historien Procope écrivait qu'elle semblait suspendue au ciel par une chaîne.","Après un tremblement de terre en 558, la coupole s'est effondrée. Isidore le Jeune l'a reconstruite avec un profil plus haut (562).","Après 1453, elle a été transformée en mosquée, puis elle est devenue un musée en 1934, et elle a de nouveau été ouverte au culte comme mosquée en 2020. On dit souvent que Mimar Sinan a « rivalisé » avec cette coupole pendant toute sa carrière."]
 }
},

 tr:{
  q:"Mimar Sinan, hatıralarında hangi eserini 'ustalık eserim' olarak tanımlar?",
  opts:["Şehzade Camii","Süleymaniye Camii","Selimiye Camii","Sultanahmet Camii"],
  exp:"Sinan, Tezkiretü'l-Bünyan'da Şehzade Camii'ni çıraklık, Süleymaniye'yi kalfalık, Edirne'deki Selimiye'yi ise ustalık eseri olarak tanımlar. Selimiye'yi 80 yaşını geçmişken tamamladı.",
  detail:["Selimiye'nin yaklaşık 31 metre çaplı kubbesi Ayasofya'nınkiyle boy ölçüşür. Sekiz ayağa oturan kubbe, iç mekânı tek ve kesintisiz bir hacim gibi algılatır.","Dört ince minare yaklaşık 70 metre yüksekliğindedir ve Osmanlı'nın en yüksek minareleri arasındadır. Cami ve külliyesi 2011'de UNESCO Dünya Mirası Listesi'ne girdi.","Tuzak şık: Sultanahmet Camii Sinan'ın değil, onun öğrencisi Sedefkâr Mehmed Ağa'nın eseridir (1609–1617)."]
 },
 fr:{
  q:"Dans ses mémoires, quelle œuvre Mimar Sinan qualifie-t-il de « chef-d'œuvre de maître » ?",
  opts:["La mosquée Şehzade","La mosquée Süleymaniye","La mosquée Selimiye","La mosquée Sultanahmet"],
  exp:"Dans le Tezkiretü'l-Bünyan, Sinan présente la mosquée Şehzade comme son œuvre d'apprenti, la Süleymaniye comme son œuvre de compagnon, et la Selimiye d'Edirne comme son œuvre de maître. Il l'a achevée à plus de 80 ans.",
  detail:["La coupole de la Selimiye, d'environ 31 mètres de diamètre, rivalise avec celle de Sainte-Sophie. Posée sur huit piliers, elle donne l'impression que l'intérieur est un espace unique et continu.","Les quatre minarets élancés mesurent environ 70 mètres et comptent parmi les plus hauts de l'Empire ottoman. La mosquée et son complexe sont inscrits au patrimoine mondial de l'UNESCO depuis 2011.","Le piège : la mosquée Sultanahmet n'est pas de Sinan, mais de son élève Sedefkâr Mehmed Ağa (1609–1617)."]
 }
