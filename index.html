function stripTags(s){ const d=document.createElement('div'); d.innerHTML=s||''; return (d.textContent||'').trim().replace(/\s+/g,' ').slice(0,80); }
async function getJSON(u){ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),8000); try{ const r=await fetch(u,{signal:c.signal}); return await r.json(); } finally{ clearTimeout(tm); } }
const autoBusy={};
async function loadAuto(q){
  if(AUTO[q.id]!==undefined||autoBusy[q.id]) return; autoBusy[q.id]=1;
  let im=null; const sr=q.search||{}, wk=sr.wiki||{};
  try{
    if(sr.commons){ const j=await getJSON('https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:bitmap '+sr.commons,gsrnamespace:'6',gsrlimit:'1',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'1200',iiextmetadatafilter:'Artist|LicenseShortName'}));
      const pg=j.query&&j.query.pages&&Object.values(j.query.pages)[0], ii=pg&&pg.imageinfo&&pg.imageinfo[0];
      if(ii&&(ii.thumburl||ii.url)){ const em=ii.extmetadata||{}; im={src:ii.thumburl||ii.url,link:ii.descriptionurl||'',artist:stripTags(em.Artist&&em.Artist.value),lic:(em.LicenseShortName&&em.LicenseShortName.value)||''}; } }
    if(!im) for(const lg of ['fr','en','tr']){ if(!wk[lg]) continue;
      const j=await getJSON(`https://${lg}.wikipedia.org/w/api.php?`+new URLSearchParams({action:'query',format:'json',origin:'*',prop:'pageimages',piprop:'thumbnail|name',pithumbsize:'1200',redirects:'1',titles:wk[lg]}));
      const pg=j.query&&j.query.pages&&Object.values(j.query.pages)[0];
      if(pg&&pg.thumbnail&&pg.thumbnail.source){ im={src:pg.thumbnail.source,link:pg.pageimage?'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(pg.pageimage):'',artist:'',lic:''}; break; } }
  }catch(e){}
  AUTO[q.id]=im||false; store('imgcache',AUTO); delete autoBusy[q.id];
  if(V.view==='intro'&&q.id.startsWith('intro-')){ renderIntro(); return; }
  if(V.view==='artist'&&q.id.startsWith('artist_')){ renderArtist(); return; }
  const cq=V.view==='quiz'?currentQ():null; if(cq&&cq.id===q.id) renderQuiz();

async function shrink(file){ try{ const bmp=await createImageBitmap(file); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.86)); }catch(e){ return file; } }
async function uploadImage(q,file){
  if(!ASSETS||!file) return; toast('…');
  try{ const blob=await shrink(file); const r=await ASSETS.upload(blob); const old=IMGMAP[q.id]; const rec={id:r.id,qid:q.id,t:Date.now(),credit:''}; IMGMAP[q.id]=rec;
    if(DB) await Promise.resolve(DB.collection('images').doc(q.id.replace(/[^\w-]/g,'_')).set(rec));
    if(old&&old.id&&old.id!==r.id){ try{ await ASSETS.delete(old.id);}catch(e){} } toast('✓'); render(); }
  catch(e){ toast('✕'); }
}
async function removeImage(q){ const old=IMGMAP[q.id]; if(!old) return; delete IMGMAP[q.id]; try{ if(DB) await Promise.resolve(DB.collection('images').doc(q.id.replace(/[^\w-]/g,'_')).delete()); }catch(e){} try{ await ASSETS.delete(old.id);}catch(e){} renderQuiz(); }

function planTypes(n){ const pool=['mcq','mcq','tf','order','match','clues','identify']; return shuffle(Array.from({length:n},(_,i)=>pool[(i+Math.floor(Math.random()*pool.length))%pool.length])); }
function buildPrompt(topic,types,avoid,level){
  return `You write art-history quiz questions for a Turkish adult (an experienced creative director in visual and immersive arts) who is also learning French and English.
Topic: "${topic}".
Write exactly ${types.length} questions, with these types in this order: ${JSON.stringify(types)}.

Rules:
- Accuracy comes first: only well-established facts (dates, attributions, places, current museums) that standard art-history references agree on. If unsure about a detail, leave it out. Do not invent quotations.
- Difficulty: target level ${level} of 4 = ${LEVEL_DESC[level]}. Give each question a top-level "level" (integer 1–4, at most one step from ${level}). No trivial questions; distractors must be plausible (same period or field).
- Cover varied artists, works and places; when the topic allows, include regions beyond Europe.
- Do not repeat these already-asked questions: ${avoid.length?avoid.map(a=>'"'+a+'"').join('; '):'(none)'}.
- Write every question in Turkish ("tr"), French ("fr") and English ("en") with the same content. French and English: natural, clear, B1–B2 level, short sentences.

Return only JSON: {"questions":[ ... ]}. Each question object:
- "type": "mcq" | "tf" | "order" | "match" | "clues" | "identify"
- "year": number (negative for BCE); "era": {"tr","fr","en"} short period label
- "region": one of "anatolia","islam","europe","asia","africa","americas","oceania","world"
- "tags": array of the topic keys from this list that clearly apply: ${JSON.stringify(TOPIC_KEYS.filter(k=>k!=='mix'))} (always include "women" when the main artist is a woman)
- "medium": one of "arch","sculpture","painting","print","photo","cinema","concept","newmedia","design"
- "search": {"commons": English search words that find the main work on Wikimedia Commons when it is public domain (artist died before 1955), else "", "wiki": {"tr","fr","en"} Wikipedia article titles}
- "cartel": only for a question about one specific work: {"who","what","when","how","where"}, each {"tr","fr","en"} ("where" = current museum or location)
- "glossary": 15–30 French words or expressions as they appear in the French text (lowercase) → Turkish meaning; for verbs add the infinitive, e.g. "fondé": "kurdu (fonder: kurmak)"
- "glossary_en": the same for the English text → Turkish meaning
- "tr", "fr", "en": objects with "q", "exp" (2–3 sentences), "detail" (array of exactly 3 paragraphs, 40–70 words each: context, anecdotes, why traps are wrong, where to see the work), plus by type:
  mcq: "opts" (4); top-level "answer": index 0–3 (vary it).
  tf: "q" is the statement; top-level "answer": true/false (mix); "exp" starts with "Doğru."/"Yanlış.", "Vrai."/"Faux.", "True."/"False.".
  order: "items": 4 events/works in correct chronological order, oldest first, no dates; "notes": 4 explanations (1–2 sentences, same order) starting with the date; top-level "years": 4 distinct date strings.
  match: "left" (4), "right" (4) where right[i] matches left[i]; "notes": 4 one-sentence explanations, one per pair.
  clues: "q": "Ben kimim?"/"Qui suis-je ?"/"Who am I?" (or the work equivalent), "clues": 3 clues hardest→easiest, "opts" (4); top-level "answer".
  identify: a public-domain artwork shown as an image; "q": "Bu eser hangisi?"/"Quelle est cette œuvre ?"/"Which work is this?"; "opts": 4 titles with artist; top-level "answer"; "search.commons" must find exactly that work.`;
}
function arr4(a){return Array.isArray(a)&&a.length===4&&a.every(x=>typeof x==='string'&&x.trim());}
function cleanQ(q){
  if(!q||!TYPES.includes(q.type)||!q.tr) return null;
  for(const lg of LANGS){ const d=q[lg]; if(!d){ if(lg==='tr') return null; delete q[lg]; continue; } if(typeof d.q!=='string'||typeof d.exp!=='string'){ if(lg==='tr') return null; delete q[lg]; continue; } if(!Array.isArray(d.detail)) d.detail=[]; d.detail=d.detail.filter(x=>typeof x==='string'); }
  const t=q.type, langs=LANGS.filter(l=>q[l]);
  if(t==='mcq'||t==='clues'||t==='identify'){ if(!langs.every(l=>arr4(q[l].opts))) return null; q.answer=+q.answer; if(!(q.answer>=0&&q.answer<=3)) return null; }
  if(t==='clues'&&!langs.every(l=>Array.isArray(q[l].clues)&&q[l].clues.length>=2&&q[l].clues.length===q.tr.clues.length)) return null;
  if(t==='tf'){ if(typeof q.answer==='string') q.answer=q.answer.toLowerCase()==='true'; if(typeof q.answer!=='boolean') return null; }
  if(t==='order'){ if(!langs.every(l=>arr4(q[l].items))) return null; q.years=(Array.isArray(q.years)?q.years:[]).map(String); }
  if(t==='match'){ if(!langs.every(l=>arr4(q[l].left)&&arr4(q[l].right))) return null; }
  if(t==='order'||t==='match') langs.forEach(l=>{ if(q[l].notes&&!arr4(q[l].notes)) delete q[l].notes; });
  if(t==='identify'&&!(q.search&&q.search.commons)) return null;
  if(!REGIONS[q.region]) q.region='world'; if(!MEDIA[q.medium]) q.medium='concept';
  if(!q.era||typeof q.era!=='object') q.era={tr:'',fr:'',en:''};
  q.year=Number(q.year)||0; q.level=Math.min(4,Math.max(1,parseInt(q.level)||2));
  if(!q.search||typeof q.search!=='object') q.search={commons:'',wiki:{}}; if(!q.search.wiki) q.search.wiki={};
  if(q.cartel&&(typeof q.cartel!=='object'||!q.cartel.what)) delete q.cartel;
  return q;
}
async function verify(s,qs){
  try{
    const brief=qs.map((q,i)=>{ const d=q.tr; let ans=''; if(q.type==='tf') ans=String(q.answer); else if(q.type==='order') ans=d.items.map((x,j)=>x+' ('+(q.years[j]||'')+')').join(' < '); else if(q.type==='match') ans=d.left.map((x,j)=>x+' = '+d.right[j]).join('; '); else ans=d.opts[q.answer];
      return `#${i} [${q.type}] ${d.q}\nANSWER: ${ans}\nEXPLANATION: ${d.exp}`; }).join('\n\n');
    const r=await s.json(`You are a strict art-history fact-checker. For each numbered quiz question below (in Turkish), check that the marked answer is correct and that the explanation contains no factual errors (dates, attributions, places, museums). Return only JSON {"bad":[indices of questions with a clear factual error or a wrong/ambiguous answer]}.\n\n${brief}`,{modelTier:'default'});
    const bad=new Set((r&&Array.isArray(r.bad)?r.bad:[]).map(Number));
    return qs.filter((q,i)=>!bad.has(i));
  }catch(e){ return qs; }
}
async function generateBatch(topic,level,n){
  if(!SAMPLE||(V.gen&&V.gen.active)) return;
  V.gen={active:true,topic,error:null};
  try{
    const info=topicInfo(topic);
    const avoid=[]; BANK.forEach(q=>{ if(matchesTopic(q,topic)) avoid.push(String(q.tr.q).slice(0,80)); });
    const r=await SAMPLE.json(buildPrompt(info.prompt,planTypes(n),shuffle(avoid).slice(0,40),level),{modelTier:'default'});
    let qs=(r&&Array.isArray(r.questions)?r.questions:[]).map(cleanQ).filter(Boolean);
    if(!qs.length) throw {code:'bad_output'};
    qs=await verify(SAMPLE,qs);
    const bid='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    qs.forEach((q,i)=>{ q.id=bid+'-'+i; q.topics=[topic]; q.t=Date.now(); addToBank(q,'gen'); });
    if(DB&&OWNER){ try{ await Promise.resolve(DB.collection('bank').doc(bid).set({kind:'batch',topic,t:Date.now(),data:JSON.stringify(qs)})); }catch(e){ saveLocalBank(qs); } }
    else saveLocalBank(qs);
    V.gen={active:false};
    if(V.waiting&&S.session&&S.session.topic===topic) advance();
    else if(V.view==='home') renderHome();
    prefetch();
  }catch(err){
    V.gen={active:false,error: err&&err.code==='rate_limited'?'Çok sık istek gönderildi; biraz sonra tekrar dene.':err&&err.code==='not_granted'?'Claude\'a soru üretme izni verilmedi.':'Sorular hazırlanamadı.'};
    if(V.waiting) renderQuiz();
  }
}
function saveLocalBank(qs){ const lb=recall('localbank',[]); lb.push(...qs); store('localbank',lb.slice(-400)); }
function prefetch(urgent){
  if(!S.session) return; const topic=S.session.topic, lv=curLevel(topic);
  const near=candidates(topic).filter(q=>Math.abs((q.level||2)-lv)<=1).length;
  if((urgent||near<6)&&SAMPLE&&!(V.gen&&V.gen.active)) generateBatch(topic,lv,4);
  // translate upcoming
  if(S.lang!=='tr'&&SAMPLE){ const c=candidates(topic).filter(q=>!q[S.lang]).slice(0,2); c.forEach(q=>ensureLang(q,S.lang)); }
}

/* lazy translation */
async function ensureLang(q,lang){
  if(q[lang]||!SAMPLE||V.translating[q.id+lang]) return; V.translating[q.id+lang]=1;
  try{
    const src={q:q.tr.q,exp:q.tr.exp,detail:q.tr.detail}; ['opts','items','notes','left','right','clues'].forEach(k=>{ if(q.tr[k]) src[k]=q.tr[k]; });
    const r=await SAMPLE.json(`Translate this Turkish art-history quiz content into ${lang==='en'?'English':'French'} (natural, clear, B1–B2 level). Keep the same structure and array lengths and order. Also give "glossary": 15–25 ${lang==='en'?'English':'French'} words or expressions from your translation (lowercase, as written) → Turkish meaning (for verbs add the infinitive). Return only JSON {"t": {...same keys...}, "glossary": {...}}.\n\n${JSON.stringify(src)}`,{modelTier:'quick'});
    if(r&&r.t&&typeof r.t.q==='string'){ q[lang]=Object.assign({detail:[]},r.t); addGlossary(r.glossary,lang); if(lang==='en') q.glossary_en=Object.assign(q.glossary_en||{},r.glossary||{}); else q.glossary=Object.assign(q.glossary||{},r.glossary||{});
      if(DB&&OWNER){ try{ DB.collection('bank').doc('x_'+q.id.replace(/[^\w-]/g,'_')+'_'+lang).set({kind:'ext',qid:q.id,lang,data:JSON.stringify({t:q[lang],glossary:r.glossary||{}})}); }catch(e){} }
      const cq=currentQ(); if(cq&&cq.id===q.id&&V.view==='quiz') renderQuiz(); }
  }catch(e){}
  delete V.translating[q.id+lang];
}

async function lookupAI(c){

async function speakQ(q){

function speak(text,lang){

}

    case 'nbf': V.nbf=v; renderNotebook(); break;
    case 'say': speak(v,b.dataset.l); break;
    case 'delw': delWord(v); renderNotebook(); break;
    case 'nbcopy': { const txt=[...notebook.values()].map(x=>`${x.word} (${x.lang}) — ${x.mean}`).join('\n'); navigator.clipboard.writeText(txt).then(()=>toast('✓'),()=>toast('✕')); break; }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeSheet(); if(V.menu){V.menu=false;render();} } if(e.key==='Enter'&&e.target.id==='ask-in'){ e.preventDefault(); ask(currentQ()); } if(e.key==='Enter'&&e.target.id==='custom-in'){ e.preventDefault(); document.querySelector('[data-act=addcustom]').click(); } });
$('sh-x').onclick=closeSheet;
$('sh-say').onclick=()=>{ if(cur) speak(cur.ph?cur.ph.text:cur.word,cur.lang); };
$('sh-s').onclick=()=>{ if(!cur) return; const id=cur.lang+':'+cur.k; if(notebook.has(id)) delWord(id); else addWord({id,lang:cur.lang,word:cur.ph&&!DICT[cur.lang][cur.k]?cur.ph.text:cur.word,mean:cur.mean||(cur.ph?cur.ph.mean:''),ctx:cur.ctx,t:Date.now()}); updSave(); };
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(S.theme==='system') render(); });

/* ================= boot ================= */
render();
if(WEB){ (async()=>{ try{ const r=await fetch('atlas-bank.json',{cache:'no-store'}); if(!r.ok) return; const j=await r.json();
  (j.questions||[]).forEach(q=>{ const c=cleanQ(JSON.parse(JSON.stringify(q))); if(c){ c.id=q.id; c.topics=q.topics||c.topics; addToBank(c,'export'); } });
  Object.assign(ARTISTS,j.artists||{}); Object.assign(GINTROS,j.intros||{}); render(); }catch(e){} })(); }
(async()=>{
  if(WEB||!(window.claude&&claude.use)) return;
  const use=n=>claude.use(n).catch(()=>null);
  [SAMPLE,ASSETS,DOWNLOADS,TTS]=await Promise.all([use('sample'),use('assets'),use('downloads'),use('tts')]);
  OWNER=!!ASSETS;
  const db=await use('db'); const user=await use('user');
  if(db){
    DB=db;
    try{ const res=await race(db.collection('bank').get(),12000); docsOf(res).forEach(x=>{ try{ if(x.kind==='batch'&&x.data){ JSON.parse(x.data).forEach(q=>addToBank(q,'gen')); } else if(x.kind==='intro'&&x.data&&x.key){ GINTROS[x.key]=JSON.parse(x.data); } else if(x.kind==='artist'&&x.data&&x.name){ ARTISTS[x.name]=JSON.parse(x.data); } else if(x.kind==='ext'&&x.data){ const q=BANK.get(x.qid), e=JSON.parse(x.data); if(q&&e.t){ q[x.lang]=e.t; addGlossary(e.glossary,x.lang); } } }catch(e){} }); }catch(e){}
    try{ const res=await race(db.collection('images').get(),10000); docsOf(res).forEach(x=>{ if(x&&x.id&&x.qid) IMGMAP[x.qid]=x; }); }catch(e){}
    if(user){ try{ UID=await user.id(); }catch(e){} }
    if(UID){ try{ const res=await race(ucol().get(),10000); const docs=docsOf(res);
      const st=docs.find(x=>x.kind==='state'&&x.data); if(st){ try{ const rs=JSON.parse(st.data); if(rs.updated>(S.updated||0)){ S=Object.assign({},DEF,rs); migrateCustoms(); store('state',S); } }catch(e){} }
      docs.filter(x=>x.kind==='word'&&x.id).forEach(x=>{ if(!notebook.has(x.id)) notebook.set(x.id,x); }); nbSave();
      // push local bank items (generated before db was available) to shared bank
      const lb=recall('localbank',[]); if(lb.length&&OWNER){ try{ await Promise.resolve(db.collection('bank').doc('l'+Date.now().toString(36)).set({kind:'batch',topic:'local',t:Date.now(),data:JSON.stringify(lb)})); store('localbank',[]); }catch(e){} }
    }catch(e){} }
  }
  render(); if(V.view==='quiz') prefetch();
})();

</script>
</body>
