window of the asylum at Saint-Rémy.", "detail": ["The swirling sky, the flame-like cypress and the calm village express Van Gogh's intensity. The village is partly imagined. The painting is in MoMA in New York."]}, "id": "x-04-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1886, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "painting", "tags": ["postimpressionism", "c19", "painting"], "topics": ["postimpressionism", "c19", "painting"], "search": {"commons": "Seurat A Sunday Afternoon on the Island of La Grande Jatte", "wiki": {"en": "A Sunday Afternoon on the Island of La Grande Jatte"}}, "answer": 2, "tr": {"q": "Georges Seurat'nın 'La Grande Jatte Adası'nda Bir Pazar Öğleden Sonrası' tablosunda kullandığı, küçük saf renk noktalarından oluşan teknik nedir?", "opts": ["Sfumato", "Empasto", "Puantilizm", "Grisaille"], "exp": "Seurat, saf renkleri küçük noktalar hâlinde yan yana koydu; renkler izleyicinin gözünde karışır. Bu tekniğe puantilizm ya da Neo-Empresyonizm denir.", "detail": ["Seurat, renk kuramı üzerine bilimsel kitaplardan etkilendi. Tablo 1886'daki son Empresyonist sergide gösterildi ve bugün Chicago Sanat Enstitüsü'ndedir."]}, "fr": {"q": "Quelle technique, faite de petits points de couleur pure, Georges Seurat utilise-t-il dans « Un dimanche après-midi à l'île de la Grande Jatte » ?", "opts": ["Le sfumato", "L'empâtement", "Le pointillisme", "La grisaille"], "exp": "Seurat juxtapose de petits points de couleur pure, qui se mélangent dans l'œil du spectateur. C'est le pointillisme, ou néo-impressionnisme.", "detail": ["Seurat s'inspire de livres scientifiques sur la couleur. Le tableau est montré à la dernière exposition impressionniste en 1886 ; il est aujourd'hui à l'Art Institute de Chicago."]}, "en": {"q": "What technique of small dots of pure colour did Georges Seurat use in 'A Sunday Afternoon on the Island of La Grande Jatte'?", "opts": ["Sfumato", "Impasto", "Pointillism", "Grisaille"], "exp": "Seurat placed small dots of pure colour side by side, so the colours mix in the viewer's eye. This is Pointillism, or Neo-Impressionism.", "detail": ["Seurat was inspired by scientific books on colour. The painting was shown at the last Impressionist exhibition in 1886 and is now in the Art Institute of Chicago."]}, "id": "x-04-6", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1891, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "oceania", "medium": "painting", "tags": ["postimpressionism", "c19", "painting"], "topics": ["postimpressionism", "c19", "painting"], "search": {"commons": "Gauguin Where Do We Come From", "wiki": {"en": "Gauguin Where Do We Come From"}}, "answer": false, "tr": {"q": "Paul Gauguin, Tahiti'ye gittikten sonra bir daha Fransa'ya hiç dönmedi.", "exp": "Yanlış. Gauguin 1891'de Tahiti'ye gitti, 1893'te Fransa'ya döndü, 1895'te yeniden Pasifik'e gitti ve 1903'te Markiz Adaları'nda öldü.", "detail": ["Gauguin 'ilkel' ve saf bir dünya aradı, ama bu bakış bugün sömürgeci ve Oryantalist yönleriyle de eleştirilir. 'Nereden Geliyoruz? Neyiz? Nereye Gidiyoruz?' (1897–98) Boston Güzel Sanatlar Müzesi'ndedir."]}, "fr": {"q": "Après son départ pour Tahiti, Paul Gauguin n'est jamais revenu en France.", "exp": "Faux. Gauguin part à Tahiti en 1891, rentre en France en 1893, repart dans le Pacifique en 1895 et meurt aux îles Marquises en 1903.", "detail": ["Gauguin cherche un monde « primitif » et pur, mais ce regard est aujourd'hui critiqué pour ses aspects coloniaux. « D'où venons-nous ? Que sommes-nous ? Où allons-nous ? » (1897–1898) est au musée des Beaux-Arts de Boston."]}, "en": {"q": "After leaving for Tahiti, Paul Gauguin never returned to France.", "exp": "False. Gauguin went to Tahiti in 1891, returned to France in 1893, left again for the Pacific in 1895 and died in the Marquesas Islands in 1903.", "detail": ["Gauguin looked for a 'primitive' and pure world, but this view is now criticised for its colonial side. 'Where Do We Come From? What Are We? Where Are We Going?' (1897–98) is in the Museum of Fine Arts, Boston."]}, "id": "x-04-7", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1904, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["postimpressionism", "cubism", "c19", "painting"], "topics": ["postimpressionism", "cubism", "c19", "painting"], "search": {"commons": "Cézanne Mont Sainte-Victoire", "wiki": {"en": "Cézanne Mont Sainte-Victoire"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Aix-en-Provence'ta doğdum ve hayatımın çoğunu orada geçirdim.", "Sainte-Victoire Dağı'nı onlarca kez resmettim.", "Doğayı silindir, küre ve koni ile ele almayı önerdim; Picasso beni 'hepimizin babası' diye andı."], "opts": ["Paul Cézanne", "Camille Pissarro", "Paul Signac", "Henri Rousseau"], "exp": "Cevap Paul Cézanne'dır. Biçimleri geometrik yapılar olarak düşünmesi, Kübizme giden yolu açtı.", "detail": ["Cézanne'ın elma natürmortları ve Kart Oyuncuları serisi de çok ünlüdür. Aix'deki atölyesi bugün ziyarete açıktır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Aix-en-Provence et j'y ai passé la plus grande partie de ma vie.", "J'ai peint la montagne Sainte-Victoire des dizaines de fois.", "J'ai proposé de traiter la nature par le cylindre, la sphère et le cône ; Picasso m'a appelé « notre père à tous »."], "opts": ["Paul Cézanne", "Camille Pissarro", "Paul Signac", "Henri Rousseau"], "exp": "La réponse est Paul Cézanne. Sa façon de penser les formes comme des structures géométriques a ouvert la voie au cubisme.", "detail": ["Ses natures mortes aux pommes et sa série des Joueurs de cartes sont aussi très célèbres. Son atelier d'Aix se visite aujourd'hui."]}, "en": {"q": "Who am I?", "clues": ["I was born in Aix-en-Provence and spent most of my life there.", "I painted Mont Sainte-Victoire dozens of times.", "I suggested treating nature through the cylinder, the sphere and the cone; Picasso called me 'the father of us all'."], "opts": ["Paul Cézanne", "Camille Pissarro", "Paul Signac", "Henri Rousseau"], "exp": "The answer is Paul Cézanne. His way of thinking of forms as geometric structures opened the road to Cubism.", "detail": ["His apple still lifes and the Card Players series are also very famous. His studio in Aix can be visited today."]}, "id": "x-04-8", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1889, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "painting", "tags": ["postimpressionism", "c19", "painting"], "topics": ["postimpressionism", "c19", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1886", "1888", "1889", "1897"], "tr": {"q": "Bu Post-Empresyonist eserleri eskiden yeniye sırala.", "items": ["Seurat – La Grande Jatte (ilk sergilenişi)", "Van Gogh – Ayçiçekleri (Arles)", "Van Gogh – Yıldızlı Gece", "Gauguin – Nereden Geliyoruz? Neyiz? Nereye Gidiyoruz?"], "exp": "La Grande Jatte 1886'da sergilendi, Ayçiçekleri 1888'de Arles'da, Yıldızlı Gece 1889'da Saint-Rémy'de, Gauguin'in büyük tablosu 1897'de Tahiti'de yapıldı.", "detail": ["Van Gogh, Ayçiçekleri'ni Gauguin'in Arles'a gelişi için 'Sarı Ev'i süslemek amacıyla yaptı. İki ressamın birlikteliği Aralık 1888'deki kulak olayıyla sona erdi."]}, "fr": {"q": "Classe ces œuvres postimpressionnistes de la plus ancienne à la plus récente.", "items": ["Seurat – La Grande Jatte (première exposition)", "Van Gogh – Les Tournesols (Arles)", "Van Gogh – La Nuit étoilée", "Gauguin – D'où venons-nous ? Que sommes-nous ? Où allons-nous ?"], "exp": "La Grande Jatte est exposée en 1886, les Tournesols sont peints à Arles en 1888, La Nuit étoilée à Saint-Rémy en 1889 et le grand tableau de Gauguin à Tahiti en 1897.", "detail": ["Van Gogh peint les Tournesols pour décorer la « Maison jaune » avant l'arrivée de Gauguin à Arles. Leur vie commune se termine en décembre 1888 avec l'épisode de l'oreille coupée."]}, "en": {"q": "Put these Post-Impressionist works in order, oldest first.", "items": ["Seurat – La Grande Jatte (first shown)", "Van Gogh – Sunflowers (Arles)", "Van Gogh – The Starry Night", "Gauguin – Where Do We Come From? What Are We? Where Are We Going?"], "exp": "La Grande Jatte was shown in 1886, the Sunflowers were painted in Arles in 1888, The Starry Night in Saint-Rémy in 1889 and Gauguin's large painting in Tahiti in 1897.", "detail": ["Van Gogh painted the Sunflowers to decorate the 'Yellow House' before Gauguin arrived in Arles. Their time together ended in December 1888 with the ear episode."]}, "id": "x-04-9", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1908, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["artnouveau", "symbolism", "modern", "painting"], "topics": ["artnouveau", "symbolism", "modern", "painting"], "search": {"commons": "Gustav Klimt The Kiss", "wiki": {"en": "The Kiss (Klimt)"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Mucha – Gismonda", "Schiele – Kucaklaşma", "Klimt – Öpücük", "Munch – Öpücük"], "exp": "Gustav Klimt'in Öpücük'ü (1907–08), altın varak kullandığı 'altın dönemi'nin en ünlü eseridir.", "detail": ["Erkeğin giysisinde dikdörtgen, kadınınkinde yuvarlak ve çiçekli motifler vardır. Klimt, Viyana Secession'ının kurucusuydu. Tablo Viyana'daki Belvedere'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Mucha – Gismonda", "Schiele – L'Étreinte", "Klimt – Le Baiser", "Munch – Le Baiser"], "exp": "Le Baiser de Gustav Klimt (1907–1908) est l'œuvre la plus célèbre de sa « période dorée », où il utilise la feuille d'or.", "detail": ["Le vêtement de l'homme porte des motifs rectangulaires, celui de la femme des motifs ronds et fleuris. Klimt a fondé la Sécession viennoise. Le tableau est au Belvédère de Vienne."]}, "en": {"q": "Which work is this?", "opts": ["Mucha – Gismonda", "Schiele – The Embrace", "Klimt – The Kiss", "Munch – The Kiss"], "exp": "Gustav Klimt's The Kiss (1907–08) is the best-known work of his 'golden period', when he used gold leaf.", "detail": ["The man's robe has rectangular patterns, the woman's round, flowery ones. Klimt founded the Vienna Secession. The painting is in the Belvedere in Vienna."]}, "id": "x-04-10", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1900, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "design", "tags": ["artnouveau", "modern", "design"], "topics": ["artnouveau", "modern", "design"], "search": {"commons": "Hector Guimard Paris Metro entrance", "wiki": {"en": "Hector Guimard"}}, "answer": 0, "tr": {"q": "Paris Metrosu'nun bitki biçimli, yeşil dökme demir girişlerini kim tasarladı?", "opts": ["Hector Guimard", "Victor Horta", "Antoni Gaudí", "René Lalique"], "exp": "Hector Guimard, 1900'den itibaren Paris Metrosu için ünlü Art Nouveau girişlerini tasarladı.", "detail": ["Girişler seri üretilen dökme demir parçalardan oluşur; böylece Art Nouveau şehrin günlük hayatına girdi. Abbesses ve Porte Dauphine istasyonlarında cam çatılı özgün örnekler hâlâ görülebilir."]}, "fr": {"q": "Qui a dessiné les entrées en fonte verte, en forme de plantes, du métro de Paris ?", "opts": ["Hector Guimard", "Victor Horta", "Antoni Gaudí", "René Lalique"], "exp": "Hector Guimard a conçu à partir de 1900 les célèbres entrées Art nouveau du métro parisien.", "detail": ["Les entrées sont faites de pièces de fonte produites en série : l'Art nouveau entre ainsi dans la vie quotidienne de la ville. On voit encore des exemples avec verrière à Abbesses et à Porte Dauphine."]}, "en": {"q": "Who designed the green cast-iron, plant-like entrances of the Paris Métro?", "opts": ["Hector Guimard", "Victor Horta", "Antoni Gaudí", "René Lalique"], "exp": "Hector Guimard designed the famous Art Nouveau Métro entrances from 1900 onwards.", "detail": ["The entrances were made of mass-produced cast-iron parts, so Art Nouveau entered the everyday life of the city. Original examples with glass canopies can still be seen at Abbesses and Porte Dauphine."]}, "id": "x-04-11", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1893, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "arch", "tags": ["artnouveau", "modern", "architecture"], "topics": ["artnouveau", "modern", "architecture"], "search": {"commons": "Hôtel Tassel staircase Horta", "wiki": {"en": "Hôtel Tassel staircase Horta"}}, "answer": true, "tr": {"q": "Victor Horta'nın Brüksel'deki Hôtel Tassel'i (1893–94), Art Nouveau mimarisinin ilk örneklerinden biri sayılır.", "exp": "Doğru. Hôtel Tassel, kıvrımlı demir ve 'kırbaç darbesi' çizgileriyle Art Nouveau mimarisinin başlangıç yapıtı kabul edilir.", "detail": ["Horta, demir yapıyı gizlemek yerine gösterdi ve merdiven, mozaik, korkuluk gibi tüm detayları aynı bitkisel dille tasarladı. Horta'nın Brüksel'deki evleri UNESCO Dünya Mirası listesindedir."]}, "fr": {"q": "L'hôtel Tassel de Victor Horta à Bruxelles (1893–1894) est considéré comme l'un des premiers bâtiments Art nouveau.", "exp": "Vrai. Avec son fer courbe et ses lignes en « coup de fouet », l'hôtel Tassel est vu comme l'œuvre fondatrice de l'architecture Art nouveau.", "detail": ["Horta montre la structure en fer au lieu de la cacher, et dessine tous les détails — escalier, mosaïque, rampe — avec le même langage végétal. Ses maisons bruxelloises sont classées à l'UNESCO."]}, "en": {"q": "Victor Horta's Hôtel Tassel in Brussels (1893–94) is seen as one of the first Art Nouveau buildings.", "exp": "True. With its curving iron and 'whiplash' lines, the Hôtel Tassel is seen as the founding work of Art Nouveau architecture.", "detail": ["Horta showed the iron structure instead of hiding it and designed every detail — staircase, mosaic, railing — in the same plant-like language. His Brussels houses are on the UNESCO World Heritage list."]}, "id": "x-04-12", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1896, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "print", "tags": ["artnouveau", "c19", "design"], "topics": ["artnouveau", "c19", "design"], "search": {"commons": "Alphonse Mucha Gismonda poster", "wiki": {"en": "Alphonse Mucha Gismonda poster"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Moravya'da doğdum, Paris'te çalıştım.", "1894'te aktris Sarah Bernhardt için yaptığım 'Gismonda' afişiyle bir gecede ünlendim.", "Hayatımın sonlarında Slav halklarının tarihini anlatan 20 dev tablodan oluşan 'Slav Destanı'nı yaptım."], "opts": ["Jules Chéret", "Henri de Toulouse-Lautrec", "Eugène Grasset", "Alphonse Mucha"], "exp": "Cevap Alphonse Mucha'dır. Uzun saçlı kadınlar, çiçekler ve dekoratif çerçevelerle Art Nouveau afişinin simgesi oldu.", "detail": ["Mucha'nın üslubu öyle popüler oldu ki Paris'te Art Nouveau'ya bir dönem 'le style Mucha' dendi. Slav Destanı bugün Prag'da sergilenir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né en Moravie et j'ai travaillé à Paris.", "Je suis devenu célèbre du jour au lendemain avec l'affiche « Gismonda » pour Sarah Bernhardt, en 1894.", "À la fin de ma vie, j'ai peint « L'Épopée slave », vingt immenses toiles sur l'histoire des peuples slaves."], "opts": ["Jules Chéret", "Henri de Toulouse-Lautrec", "Eugène Grasset", "Alphonse Mucha"], "exp": "La réponse est Alphonse Mucha. Avec ses femmes aux longs cheveux, ses fleurs et ses cadres décoratifs, il est devenu le symbole de l'affiche Art nouveau.", "detail": ["Son style était si populaire qu'à Paris on parlait parfois du « style Mucha ». L'Épopée slave est exposée à Prague."]}, "en": {"q": "Who am I?", "clues": ["I was born in Moravia and worked in Paris.", "I became famous overnight with the 'Gismonda' poster for Sarah Bernhardt in 1894.", "Late in life I painted 'The Slav Epic', twenty huge canvases on the history of the Slavic peoples."], "opts": ["Jules Chéret", "Henri de Toulouse-Lautrec", "Eugène Grasset", "Alphonse Mucha"], "exp": "The answer is Alphonse Mucha. With his long-haired women, flowers and decorative frames, he became the symbol of the Art Nouveau poster.", "detail": ["His style was so popular that in Paris Art Nouveau was sometimes called 'le style Mucha'. The Slav Epic is shown in Prague."]}, "id": "x-04-13", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1897, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "arch", "tags": ["artnouveau", "c19", "architecture"], "topics": ["artnouveau", "c19", "architecture"], "search": {"commons": "Secession Building Vienna", "wiki": {"en": "Secession Building"}}, "answer": 1, "tr": {"q": "Viyana Secession binasının girişindeki 'Her çağa kendi sanatı, sanata kendi özgürlüğü' yazısı hangi sanatçı grubuna aittir?", "opts": ["Deutscher Werkbund", "Viyana Secession'ı", "Wiener Werkstätte", "Die Brücke"], "exp": "Viyana Secession'ı 1897'de Klimt ve arkadaşları tarafından kuruldu; Joseph Maria Olbrich'in tasarladığı bina 1898'de açıldı.", "detail": ["Altın yaprak kubbesi nedeniyle halk binaya 'altın lahana' dedi. Bodrumda Klimt'in Beethoven Frizi bulunur. Wiener Werkstätte ise 1903'te Hoffmann ve Moser tarafından kurulan zanaat atölyesidir."]}, "fr": {"q": "La devise « À chaque époque son art, à l'art sa liberté », sur le bâtiment de la Sécession à Vienne, appartient à quel groupe ?", "opts": ["Le Deutscher Werkbund", "La Sécession viennoise", "La Wiener Werkstätte", "Die Brücke"], "exp": "La Sécession viennoise est fondée en 1897 par Klimt et ses amis ; le bâtiment de Joseph Maria Olbrich ouvre en 1898.", "detail": ["À cause de sa coupole en feuilles dorées, les Viennois l'appellent le « chou doré ». La Frise Beethoven de Klimt se trouve au sous-sol. La Wiener Werkstätte, elle, est un atelier fondé en 1903 par Hoffmann et Moser."]}, "en": {"q": "The motto 'To every age its art, to art its freedom' on the Secession Building in Vienna belongs to which group?", "opts": ["The Deutscher Werkbund", "The Vienna Secession", "The Wiener Werkstätte", "Die Brücke"], "exp": "The Vienna Secession was founded in 1897 by Klimt and his friends; Joseph Maria Olbrich's building opened in 1898.", "detail": ["Because of its dome of golden leaves, the Viennese called it the 'golden cabbage'. Klimt's Beethoven Frieze is in the basement. The Wiener Werkstätte was a craft workshop founded in 1903 by Hoffmann and Moser."]}, "id": "x-04-14", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1905, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["fauvism", "modern", "painting"], "topics": ["fauvism", "modern", "painting"], "search": {"commons": "Matisse Woman with a Hat", "wiki": {"en": "Woman with a Hat"}}, "answer": 3, "tr": {"q": "'Fovizm' adı nereden gelir?", "opts": ["Matisse'in bir tablosunun adından", "Bir galeri sahibinin soyadından", "Fransızca 'renk' kelimesinden", "Bir eleştirmenin ressamları 'vahşi hayvanlar' (fauves) diye nitelendirmesinden"], "exp": "1905 Salon d'Automne'da eleştirmen Louis Vauxcelles, parlak renkli tablolarla dolu odayı 'vahşi hayvanlar arasında bir Donatello' diye tanımladı.", "detail": ["Odada Matisse, Derain ve Vlaminck'in eserleri vardı. Matisse'in 'Şapkalı Kadın'ı büyük skandal yarattı. Fovistler rengi doğadan bağımsız, duygusal bir güç olarak kullandı."]}, "fr": {"q": "D'où vient le nom « fauvisme » ?", "opts": ["Du titre d'un tableau de Matisse", "Du nom d'un marchand d'art", "Du mot français « couleur »", "D'un critique qui a appelé les peintres des « fauves »"], "exp": "Au Salon d'automne de 1905, le critique Louis Vauxcelles parle de « Donatello parmi les fauves » devant une salle pleine de tableaux aux couleurs vives.", "detail": ["Dans cette salle, il y avait Matisse, Derain et Vlaminck. « La Femme au chapeau » de Matisse a fait scandale. Les fauves utilisent la couleur comme une force émotionnelle, libre de la nature."]}, "en": {"q": "Where does the name 'Fauvism' come from?", "opts": ["From the title of a Matisse painting", "From an art dealer's surname", "From the French word for 'colour'", "From a critic calling the painters 'wild beasts' (fauves)"], "exp": "At the 1905 Salon d'Automne, the critic Louis Vauxcelles spoke of 'Donatello among the wild beasts' in a room full of brightly coloured paintings.", "detail": ["The room held works by Matisse, Derain and Vlaminck. Matisse's 'Woman with a Hat' caused a scandal. The Fauves used colour as an emotional force, free from nature."]}, "id": "x-04-15", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1906, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["fauvism", "modern", "painting"], "topics": ["fauvism", "modern", "painting"], "search": {"commons": "André Derain Charing Cross Bridge", "wiki": {"en": "André Derain Charing Cross Bridge"}}, "answer": true, "tr": {"q": "André Derain, sanat taciri Ambroise Vollard'ın siparişiyle Londra'ya gidip Thames manzaralarını parlak Fovist renklerle resmetti.", "exp": "Doğru. Vollard, Monet'nin Londra serisinin başarısından sonra Derain'i 1906 civarında Londra'ya gönderdi.", "detail": ["Derain, Monet'nin sisli Londra'sının aksine pembe, mavi ve sarı gibi canlı renkler kullandı. Bu tablolar bugün National Gallery of Art (Washington) ve Musée d'Orsay gibi müzelerdedir."]}, "fr": {"q": "André Derain est allé à Londres, à la demande du marchand Ambroise Vollard, pour peindre la Tamise avec des couleurs fauves.", "exp": "Vrai. Après le succès de la série londonienne de Monet, Vollard envoie Derain à Londres vers 1906.", "detail": ["Contrairement au Londres brumeux de Monet, Derain utilise des roses, des bleus et des jaunes vifs. Ces tableaux sont aujourd'hui dans des musées comme la National Gallery of Art de Washington et le musée d'Orsay."]}, "en": {"q": "André Derain went to London, commissioned by the dealer Ambroise Vollard, to paint the Thames in bright Fauve colours.", "exp": "True. After the success of Monet's London series, Vollard sent Derain to London around 1906.", "detail": ["Unlike Monet's misty London, Derain used bright pinks, blues and yellows. These paintings are now in museums such as the National Gallery of Art in Washington and the Musée d'Orsay."]}, "id": "x-04-16", "t": 1794800000000}, {"type": "match", "level": 2, "year": 1906, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["fauvism", "modern", "painting"], "topics": ["fauvism", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Fovist ressamları eserleriyle eşleştir.", "left": ["Henri Matisse", "André Derain", "Maurice de Vlaminck", "Raoul Dufy"], "right": ["Yaşamın Sevinci", "Charing Cross Köprüsü", "Chatou'daki Evler", "Bayraklı Sokak"], "exp": "Dördü de Fovizmin parlak, saf renklerini kullanan ressamlardır.", "detail": ["Matisse'in 'Yaşamın Sevinci' (1905–06) Barnes Vakfı'ndadır. Derain ve Vlaminck Chatou'da birlikte çalıştılar. Dufy, Le Havre'daki bayraklı sokakları resmetti."]}, "fr": {"q": "Associe chaque peintre fauve à son œuvre.", "left": ["Henri Matisse", "André Derain", "Maurice de Vlaminck", "Raoul Dufy"], "right": ["Le Bonheur de vivre", "Charing Cross Bridge", "Maisons à Chatou", "La Rue pavoisée"], "exp": "Ces quatre peintres utilisent les couleurs vives et pures du fauvisme.", "detail": ["« Le Bonheur de vivre » de Matisse (1905–1906) est à la Fondation Barnes. Derain et Vlaminck ont travaillé ensemble à Chatou. Dufy a peint les rues pavoisées du Havre."]}, "en": {"q": "Match each Fauve painter with his work.", "left": ["Henri Matisse", "André Derain", "Maurice de Vlaminck", "Raoul Dufy"], "right": ["The Joy of Life", "Charing Cross Bridge", "Houses at Chatou", "The Street Decked with Flags"], "exp": "All four used the bright, pure colours of Fauvism.", "detail": ["Matisse's 'The Joy of Life' (1905–06) is in the Barnes Foundation. Derain and Vlaminck worked together at Chatou. Dufy painted the flag-decked streets of Le Havre."]}, "id": "x-04-17", "t": 1794800000000}, {"type": "match", "level": 2, "year": 1911, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["expressionism", "modern", "painting"], "topics": ["expressionism", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Alman Ekspresyonist grupları ve kurucularını eşleştir.", "left": ["Die Brücke (Dresden, 1905)", "Der Blaue Reiter (Münih, 1911)", "Viyana Ekspresyonizmi", "Kuzey Alman manzara ekspresyonizmi"], "right": ["Ernst Ludwig Kirchner", "Wassily Kandinsky ve Franz Marc", "Egon Schiele", "Emil Nolde"], "exp": "Ekspresyonizm, iç duyguları çarpıtılmış biçim ve sert renklerle anlatan bir akımdır.", "detail": ["Die Brücke kent hayatını ve çıplak figürleri sert ahşap baskılarla gösterdi. Der Blaue Reiter daha ruhani ve soyuta yönelikti. Nolde kısa süre Die Brücke'ye katıldı; Schiele ise Klimt'in yolundan gelen bir Viyanalıydı."]}, "fr": {"q": "Associe chaque groupe ou courant expressionniste à son artiste principal.", "left": ["Die Brücke (Dresde, 1905)", "Der Blaue Reiter (Munich, 1911)", "L'expressionnisme viennois", "Le paysage expressionniste de l'Allemagne du Nord"], "right": ["Ernst Ludwig Kirchner", "Wassily Kandinsky et Franz Marc", "Egon Schiele", "Emil Nolde"], "exp": "L'expressionnisme exprime les émotions intérieures par des formes déformées et des couleurs violentes.", "detail": ["Die Brücke montre la ville et les nus avec des gravures sur bois dures. Der Blaue Reiter est plus spirituel et va vers l'abstraction. Nolde a fait un court passage dans Die Brücke ; Schiele est un Viennois dans la lignée de Klimt."]}, "en": {"q": "Match each Expressionist group or current with its main artist.", "left": ["Die Brücke (Dresden, 1905)", "Der Blaue Reiter (Munich, 1911)", "Viennese Expressionism", "North German Expressionist landscape"], "right": ["Ernst Ludwig Kirchner", "Wassily Kandinsky and Franz Marc", "Egon Schiele", "Emil Nolde"], "exp": "Expressionism shows inner feelings through distorted forms and harsh colours.", "detail": ["Die Brücke showed city life and nudes in rough woodcuts. Der Blaue Reiter was more spiritual and moved towards abstraction. Nolde was briefly in Die Brücke; Schiele was a Viennese artist following Klimt."]}, "id": "x-05-0", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1913, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["expressionism", "modern", "painting"], "topics": ["expressionism", "modern", "painting"], "search": {"commons": "Kirchner Potsdamer Platz 1914", "wiki": {"en": "Potsdamer Platz (painting)"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Kirchner – Potsdamer Platz", "Beckmann – Gece", "Grosz – Metropolis", "Dix – Büyük Şehir"], "exp": "Ernst Ludwig Kirchner'in Potsdamer Platz'ı (1914), Berlin'deki iki sokak kadınını sivri, gergin biçimlerle gösterir.", "detail": ["Kirchner, büyük şehrin yalnızlığını ve gerginliğini anlatan Berlin sokak sahneleri serisi yaptı. Nazi döneminde eserleri 'yozlaşmış sanat' sayıldı. Tablo Berlin'deki Neue Nationalgalerie'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Kirchner – Potsdamer Platz", "Beckmann – La Nuit", "Grosz – Metropolis", "Dix – La Grande Ville"], "exp": "Potsdamer Platz d'Ernst Ludwig Kirchner (1914) montre deux prostituées à Berlin, avec des formes pointues et tendues.", "detail": ["Kirchner a peint une série de scènes de rue berlinoises sur la solitude et la tension de la grande ville. Sous les nazis, ses œuvres sont classées « art dégénéré ». Le tableau est à la Neue Nationalgalerie de Berlin."]}, "en": {"q": "Which work is this?", "opts": ["Kirchner – Potsdamer Platz", "Beckmann – The Night", "Grosz – Metropolis", "Dix – Metropolis triptych"], "exp": "Ernst Ludwig Kirchner's Potsdamer Platz (1914) shows two street-walkers in Berlin with sharp, tense forms.", "detail": ["Kirchner painted a series of Berlin street scenes about the loneliness and tension of the big city. Under the Nazis his works were labelled 'degenerate art'. The painting is in the Neue Nationalgalerie in Berlin."]}, "id": "x-05-1", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1937, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "concept", "tags": ["expressionism", "modern"], "topics": ["expressionism", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Naziler 1937'de Münih'te modern sanatı aşağılamak için 'Yozlaşmış Sanat' (Entartete Kunst) sergisini düzenledi.", "exp": "Doğru. Sergi 1937'de Münih'te açıldı ve Ekspresyonist, Dadacı ve soyut eserleri alay konusu yaptı.", "detail": ["Sergi milyonlarca ziyaretçi çekti; bu sayı aynı dönemdeki resmî 'Büyük Alman Sanatı' sergisinden fazlaydı. Müzelerden binlerce eser alındı, bir kısmı satıldı, bir kısmı yakıldı."]}, "fr": {"q": "En 1937, les nazis ont organisé à Munich l'exposition « Art dégénéré » (Entartete Kunst) pour humilier l'art moderne.", "exp": "Vrai. L'exposition ouvre à Munich en 1937 et se moque des œuvres expressionnistes, dadaïstes et abstraites.", "detail": ["Elle attire des millions de visiteurs, plus que la « Grande exposition d'art allemand » officielle de la même époque. Des milliers d'œuvres sont retirées des musées ; certaines sont vendues, d'autres brûlées."]}, "en": {"q": "In 1937 the Nazis organised the 'Degenerate Art' (Entartete Kunst) exhibition in Munich to humiliate modern art.", "exp": "True. The show opened in Munich in 1937 and mocked Expressionist, Dada and abstract works.", "detail": ["It drew millions of visitors, more than the official 'Great German Art Exhibition' of the same time. Thousands of works were taken from museums; some were sold, others burned."]}, "id": "x-05-2", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1907, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["expressionism", "modern", "painting", "women"], "topics": ["expressionism", "modern", "painting", "women"], "search": {"commons": "Paula Modersohn-Becker self-portrait", "wiki": {"en": "Paula Modersohn-Becker self-portrait"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Worpswede sanatçı kolonisinde çalıştım ve Paris'e birkaç kez gittim.", "1906'da kendimi hamile ve çıplak olarak resmettim; bu, bir kadın sanatçının çıplak otoportrelerinin ilklerinden biridir.", "1907'de, kızımı doğurduktan kısa süre sonra 31 yaşında öldüm."], "opts": ["Gabriele Münter", "Käthe Kollwitz", "Paula Modersohn-Becker", "Marianne von Werefkin"], "exp": "Cevap Paula Modersohn-Becker'dir. Erken Ekspresyonizmin önemli isimlerindendir.", "detail": ["Basit, ağır figürleri Gauguin ve Cézanne'dan etkilenir. Bremen'de onun adını taşıyan bir müze, kadın sanatçıya adanan ilk müzelerden biridir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai travaillé dans la colonie d'artistes de Worpswede et je suis allée plusieurs fois à Paris.", "En 1906, je me suis peinte nue et enceinte : c'est l'un des premiers autoportraits nus d'une femme artiste.", "Je suis morte en 1907, à 31 ans, peu après la naissance de ma fille."], "opts": ["Gabriele Münter", "Käthe Kollwitz", "Paula Modersohn-Becker", "Marianne von Werefkin"], "exp": "La réponse est Paula Modersohn-Becker, une figure importante du premier expressionnisme.", "detail": ["Ses figures simples et lourdes sont influencées par Gauguin et Cézanne. À Brême, un musée porte son nom ; c'est l'un des premiers musées consacrés à une femme artiste."]}, "en": {"q": "Who am I?", "clues": ["I worked in the Worpswede artists' colony and went to Paris several times.", "In 1906 I painted myself naked and pregnant, one of the first nude self-portraits by a woman artist.", "I died in 1907, aged 31, shortly after giving birth to my daughter."], "opts": ["Gabriele Münter", "Käthe Kollwitz", "Paula Modersohn-Becker", "Marianne von Werefkin"], "exp": "The answer is Paula Modersohn-Becker, an important figure of early Expressionism.", "detail": ["Her simple, heavy figures are influenced by Gauguin and Cézanne. A museum in Bremen bears her name; it was one of the first museums devoted to a woman artist."]}, "id": "x-05-3", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1907, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["cubism", "modern", "painting"], "topics": ["cubism", "modern", "painting"], "search": {"commons": "Les Demoiselles d'Avignon Picasso", "wiki": {"en": "Les Demoiselles d'Avignon"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Braque – Estaque'taki Evler", "Picasso – Avignonlu Kızlar", "Matisse – Mavi Çıplak", "Derain – Yıkananlar"], "exp": "Pablo Picasso'nun Avignonlu Kızlar'ı (1907), Kübizme giden yolda devrim niteliğinde bir eserdir.", "detail": ["Beş kadın figürü sert açılı düzlemlere bölünür; bazı yüzler İber heykellerinden ve Afrika maskelerinden etkilenir. Tablo uzun süre kamuya gösterilmedi ve bugün MoMA'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Braque – Maisons à l'Estaque", "Picasso – Les Demoiselles d'Avignon", "Matisse – Nu bleu", "Derain – Les Baigneuses"], "exp": "Les Demoiselles d'Avignon de Pablo Picasso (1907) est une œuvre révolutionnaire sur le chemin du cubisme.", "detail": ["Les cinq femmes sont découpées en plans anguleux ; certains visages s'inspirent de la sculpture ibérique et des masques africains. Le tableau n'a pas été montré au public pendant longtemps ; il est au MoMA."]}, "en": {"q": "Which work is this?", "opts": ["Braque – Houses at L'Estaque", "Picasso – Les Demoiselles d'Avignon", "Matisse – Blue Nude", "Derain – The Bathers"], "exp": "Pablo Picasso's Les Demoiselles d'Avignon (1907) is a revolutionary work on the road to Cubism.", "detail": ["The five women are cut into sharp planes; some faces draw on Iberian sculpture and African masks. The painting was not shown publicly for a long time; it is in MoMA."]}, "id": "x-05-4", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1912, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["cubism", "modern", "painting"], "topics": ["cubism", "modern", "painting"], "search": {"commons": "Picasso Still Life with Chair Caning", "wiki": {"en": "Still Life with Chair Caning"}}, "answer": 3, "tr": {"q": "Picasso'nun 1912 tarihli 'Hasır Sandalyeli Natürmort'u neden önemlidir?", "opts": ["İlk soyut tablo olduğu için", "Fotoğraftan kopyalandığı için", "Tamamen siyah beyaz yapıldığı için", "Resme gerçek bir nesne parçası ekleyen ilk kolajlardan biri olduğu için"], "exp": "Picasso tuvale hasır deseni basılı bir muşamba yapıştırdı ve çerçeve yerine bir ip kullandı; bu, kolajın modern sanattaki ilk örneklerindendir.", "detail": ["Aynı yıl Braque da 'papier collé' (yapıştırılmış kâğıt) tekniğini geliştirdi. Bu yöntemle Analitik Kübizmden Sentetik Kübizme geçildi. Eser Paris'teki Musée Picasso'dadır."]}, "fr": {"q": "Pourquoi la « Nature morte à la chaise cannée » de Picasso (1912) est-elle importante ?", "opts": ["C'est le premier tableau abstrait", "Elle est copiée d'une photo", "Elle est entièrement en noir et blanc", "C'est l'un des premiers collages qui ajoutent un vrai objet à la peinture"], "exp": "Picasso colle sur la toile une toile cirée imprimée d'un motif de cannage et utilise une corde comme cadre : c'est l'un des premiers collages de l'art moderne.", "detail": ["La même année, Braque invente le « papier collé ». Ces techniques font passer du cubisme analytique au cubisme synthétique. L'œuvre est au musée Picasso de Paris."]}, "en": {"q": "Why is Picasso's 'Still Life with Chair Caning' (1912) important?", "opts": ["It is the first abstract painting", "It was copied from a photograph", "It is completely black and white", "It is one of the first collages that adds a real object to painting"], "exp": "Picasso glued printed oilcloth with a chair-caning pattern onto the canvas and used a rope as a frame, one of the first collages in modern art.", "detail": ["The same year Braque invented 'papier collé' (pasted paper). These methods led from Analytical to Synthetic Cubism. The work is in the Musée Picasso in Paris."]}, "id": "x-05-5", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1908, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "painting", "tags": ["cubism", "modern", "painting"], "topics": ["cubism", "modern", "painting"], "search": {"commons": "Georges Braque Houses at L'Estaque", "wiki": {"en": "Georges Braque Houses at L'Estaque"}}, "answer": true, "tr": {"q": "'Kübizm' adı, Braque'ın Estaque manzaraları için kullanılan 'küçük küpler' ifadesinden gelir.", "exp": "Doğru. 1908'de Braque'ın Estaque tabloları için Matisse ve eleştirmen Louis Vauxcelles 'küçük küpler'den söz etti.", "detail": ["Braque ile Picasso 1908–1914 arasında neredeyse birlikte çalıştılar; Braque bunu 'iki dağcının bir ipe bağlanması'na benzetti. Bazı eserlerini ayırt etmek bugün bile zordur."]}, "fr": {"q": "Le nom « cubisme » vient de l'expression « petits cubes », utilisée pour les paysages de l'Estaque de Braque.", "exp": "Vrai. En 1908, Matisse et le critique Louis Vauxcelles parlent de « petits cubes » devant les tableaux de l'Estaque de Braque.", "detail": ["Entre 1908 et 1914, Braque et Picasso travaillent presque ensemble ; Braque compare cela à deux alpinistes attachés à la même corde. Certaines de leurs œuvres sont encore difficiles à distinguer."]}, "en": {"q": "The name 'Cubism' comes from the phrase 'little cubes', used for Braque's L'Estaque landscapes.", "exp": "True. In 1908 Matisse and the critic Louis Vauxcelles spoke of 'little cubes' when they saw Braque's L'Estaque paintings.", "detail": ["From 1908 to 1914 Braque and Picasso worked almost together; Braque compared it to two mountaineers roped together. Some of their works are still hard to tell apart."]}, "id": "x-05-6", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1910, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["cubism", "modern", "painting"], "topics": ["cubism", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1907", "1908", "1910", "1912"], "tr": {"q": "Kübizmin gelişimindeki bu adımları eskiden yeniye sırala.", "items": ["Picasso – Avignonlu Kızlar", "Braque – Estaque'taki Evler", "Picasso – Ambroise Vollard'ın Portresi (Analitik Kübizm)", "Picasso – Hasır Sandalyeli Natürmort (kolaj)"], "exp": "Avignonlu Kızlar 1907, Estaque'taki Evler 1908, Vollard Portresi 1910, Hasır Sandalyeli Natürmort 1912 tarihlidir.", "detail": ["Sıra, ilk şoktan geometrik manzaraya, sonra biçimlerin neredeyse çözüldüğü Analitik Kübizme ve son olarak gerçek malzemelerin girdiği Sentetik Kübizme geçişi gösterir. Vollard portresi Moskova'daki Puşkin Müzesi'ndedir."]}, "fr": {"q": "Classe ces étapes du cubisme de la plus ancienne à la plus récente.", "items": ["Picasso – Les Demoiselles d'Avignon", "Braque – Maisons à l'Estaque", "Picasso – Portrait d'Ambroise Vollard (cubisme analytique)", "Picasso – Nature morte à la chaise cannée (collage)"], "exp": "Les Demoiselles datent de 1907, les Maisons à l'Estaque de 1908, le Portrait de Vollard de 1910 et la Nature morte à la chaise cannée de 1912.", "detail": ["L'ordre montre le passage du premier choc au paysage géométrique, puis au cubisme analytique, où les formes se décomposent, et enfin au cubisme synthétique, avec de vrais matériaux. Le portrait de Vollard est au musée Pouchkine de Moscou."]}, "en": {"q": "Put these steps in the development of Cubism in order, oldest first.", "items": ["Picasso – Les Demoiselles d'Avignon", "Braque – Houses at L'Estaque", "Picasso – Portrait of Ambroise Vollard (Analytical Cubism)", "Picasso – Still Life with Chair Caning (collage)"], "exp": "Les Demoiselles dates from 1907, Houses at L'Estaque from 1908, the Vollard portrait from 1910 and Still Life with Chair Caning from 1912.", "detail": ["The order shows the move from the first shock to geometric landscape, then Analytical Cubism where forms break apart, and finally Synthetic Cubism with real materials. The Vollard portrait is in the Pushkin Museum in Moscow."]}, "id": "x-05-7", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1912, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["cubism", "modern", "painting"], "topics": ["cubism", "modern", "painting"], "search": {"commons": "Juan Gris Portrait of Picasso", "wiki": {"en": "Juan Gris Portrait of Picasso"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Madrid'de doğdum ve Paris'te Bateau-Lavoir'da, Picasso'nun yakınında yaşadım.", "1912'de 'Picasso'nun Portresi'ni yaptım.", "Sentetik Kübizmin en net, en düzenli temsilcilerinden biri sayılırım; 1927'de genç yaşta öldüm."], "opts": ["Juan Gris", "Jean Metzinger", "Albert Gleizes", "Fernand Léger"], "exp": "Cevap Juan Gris'tir. Kübizmin 'üçüncü silahşoru' olarak anılır.", "detail": ["Gris'in eserleri parlak renkler ve keskin, düzenli kompozisyonlarla ayrılır. 'Picasso'nun Portresi' Chicago Sanat Enstitüsü'ndedir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Madrid et j'ai vécu au Bateau-Lavoir à Paris, près de Picasso.", "En 1912, j'ai peint un « Portrait de Picasso ».", "Je suis vu comme l'un des représentants les plus clairs et ordonnés du cubisme synthétique ; je suis mort jeune en 1927."], "opts": ["Juan Gris", "Jean Metzinger", "Albert Gleizes", "Fernand Léger"], "exp": "La réponse est Juan Gris, souvent appelé le « troisième mousquetaire » du cubisme.", "detail": ["Ses œuvres se distinguent par des couleurs vives et des compositions nettes et ordonnées. Le « Portrait de Picasso » est à l'Art Institute de Chicago."]}, "en": {"q": "Who am I?", "clues": ["I was born in Madrid and lived at the Bateau-Lavoir in Paris, near Picasso.", "In 1912 I painted a 'Portrait of Picasso'.", "I am seen as one of the clearest, most ordered painters of Synthetic Cubism; I died young in 1927."], "opts": ["Juan Gris", "Jean Metzinger", "Albert Gleizes", "Fernand Léger"], "exp": "The answer is Juan Gris, often called the 'third musketeer' of Cubism.", "detail": ["His works stand out for bright colours and sharp, ordered compositions. The 'Portrait of Picasso' is in the Art Institute of Chicago."]}, "id": "x-05-8", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1912, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["orphism", "cubism", "modern", "painting"], "topics": ["orphism", "cubism", "modern", "painting"], "search": {"commons": "Robert Delaunay Simultaneous Windows", "wiki": {"en": "Robert Delaunay Simultaneous Windows"}}, "answer": 1, "tr": {"q": "Robert ve Sonia Delaunay'nin renkli, ritmik soyutlamasına 'Orfizm' adını veren şair kimdir?", "opts": ["André Breton", "Guillaume Apollinaire", "Blaise Cendrars", "Max Jacob"], "exp": "Guillaume Apollinaire 1912'de, mitolojik şarkıcı Orpheus'a gönderme yaparak 'Orfik Kübizm' ifadesini kullandı.", "detail": ["Orfizm, Kübizmin parçalı biçimlerini parlak renklerle birleştirip müziğe yakın bir soyutluğa ulaşmak istedi. Delaunay'nin 'Eşzamanlı Pencereler' serisi ve František Kupka'nın eserleri bu akımla ilişkilidir."]}, "fr": {"q": "Quel poète a donné le nom d'« orphisme » à l'abstraction colorée et rythmée de Robert et Sonia Delaunay ?", "opts": ["André Breton", "Guillaume Apollinaire", "Blaise Cendrars", "Max Jacob"], "exp": "En 1912, Guillaume Apollinaire parle de « cubisme orphique », en référence au chanteur mythologique Orphée.", "detail": ["L'orphisme associe les formes du cubisme à s, de la mode et des décors de théâtre ; en 1964, j'ai été la première femme artiste exposée de son vivant au Louvre."], "opts": ["Natalia Gontcharova", "Alexandra Exter", "Lioubov Popova", "Sonia Delaunay"], "exp": "La réponse est Sonia Delaunay, cofondatrice de l'orphisme avec Robert Delaunay.", "detail": ["Ses tissus « simultanés » ont eu un grand succès dans la mode des années 1920. Elle travaillait sans séparer l'art et le design, ce qui en fait encore un modèle aujourd'hui."]}, "en": {"q": "Who am I?", "clues": ["I was born in Ukraine, grew up in Saint Petersburg and settled in Paris.", "A colourful patchwork blanket I made for my son led me to abstraction.", "I designed fabrics, fashion and stage sets; in 1964 I was the first living woman artist to have an exhibition at the Louvre."], "opts": ["Natalia Goncharova", "Alexandra Exter", "Lyubov Popova", "Sonia Delaunay"], "exp": "The answer is Sonia Delaunay, co-founder of Orphism with Robert Delaunay.", "detail": ["Her 'simultaneous' fabrics were a great success in 1920s fashion. She worked without separating art and design, which still makes her a model today."]}, "id": "x-05-10", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1916, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["suprematism", "modern", "painting"], "topics": ["suprematism", "modern", "painting"], "search": {"commons": "Malevich Suprematist Composition Airplane Flying", "wiki": {"en": "Malevich Suprematist Composition Airplane Flying"}}, "answer": 2, "tr": {"q": "Bu tarz, düz renkli geometrik biçimlerin beyaz bir zeminde süzüldüğü hangi akıma aittir?", "opts": ["De Stijl", "Orfizm", "Süprematizm", "Konstrüktivizm"], "exp": "Bu, Kazimir Malevich'in 1915'te başlattığı Süprematizmdir: kare, daire, çizgi gibi saf biçimler beyaz uzayda yüzer.", "detail": ["Malevich 'saf duygunun üstünlüğünü' savundu ve nesneleri tamamen bıraktı. 1918'deki 'Beyaz Üzerine Beyaz' akımın en uç noktasıdır; bugün MoMA'dadır."]}, "fr": {"q": "À quel mouvement appartient ce style, où des formes géométriques de couleur unie flottent sur un fond blanc ?", "opts": ["De Stijl", "L'orphisme", "Le suprématisme", "Le constructivisme"], "exp": "C'est le suprématisme, lancé par Kazimir Malevitch en 1915 : des formes pures — carré, cercle, ligne — flottent dans un espace blanc.", "detail": ["Malevitch défend la « suprématie de la sensation pure » et abandonne complètement les objets. « Carré blanc sur fond blanc » (1918) est le point extrême du mouvement ; il est au MoMA."]}, "en": {"q": "Which movement does this style belong to, where flat-coloured geometric shapes float on a white ground?", "opts": ["De Stijl", "Orphism", "Suprematism", "Constructivism"], "exp": "This is Suprematism, launched by Kazimir Malevich in 1915: pure forms — square, circle, line — float in white space.", "detail": ["Malevich defended 'the supremacy of pure feeling' and left objects behind completely. 'White on White' (1918) is the movement's extreme point; it is in MoMA."]}, "id": "x-05-11", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1919, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "print", "tags": ["suprematism", "constructivism", "modern", "design"], "topics": ["suprematism", "constructivism", "modern", "design"], "search": {"commons": "El Lissitzky Beat the Whites with the Red Wedge", "wiki": {"en": "Beat the Whites with the Red Wedge"}}, "answer": 0, "tr": {"q": "'Beyazları Kırmızı Kamayla Vur' adlı Rus İç Savaşı afişini hangi sanatçı tasarladı?", "opts": ["El Lissitzky", "Aleksandr Rodçenko", "Gustav Klutsis", "Vladimir Tatlin"], "exp": "El Lissitzky'nin 1919–20 tarihli afişi, kırmızı bir üçgenin beyaz bir daireye saplanmasıyla Bolşeviklerin Beyaz Ordu'ya karşı zaferini simgeler.", "detail": ["Lissitzky, Malevich'in Süprematist biçimlerini siyasi bir mesaj için kullandı. Daha sonra 'Proun' adını verdiği resim ile mimari arasındaki eserleriyle Avrupa avangardını etkiledi."]}, "fr": {"q": "Quel artiste a créé l'affiche de la guerre civile russe « Battez les Blancs avec le coin rouge » ?", "opts": ["El Lissitzky", "Alexandre Rodtchenko", "Gustav Klucis", "Vladimir Tatline"], "exp": "Dans l'affiche d'El Lissitzky (1919–1920), un triangle rouge entre dans un cercle blanc : c'est la victoire des bolcheviks contre l'Armée blanche.", "detail": ["Lissitzky utilise les formes suprématistes de Malevitch pour un message politique. Ensuite, ses « Prouns », entre peinture et architecture, influencent l'avant-garde européenne."]}, "en": {"q": "Which artist designed the Russian Civil War poster 'Beat the Whites with the Red Wedge'?", "opts": ["El Lissitzky", "Alexander Rodchenko", "Gustav Klutsis", "Vladimir Tatlin"], "exp": "In El Lissitzky's 1919–20 poster, a red triangle pierces a white circle, symbolising the Bolshevik victory over the White Army.", "detail": ["Lissitzky used Malevich's Suprematist forms for a political message. Later his 'Prouns', between painting and architecture, influenced the European avant-garde."]}, "id": "x-05-12", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1935, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "painting", "tags": ["suprematism", "modern"], "topics": ["suprematism", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Malevich'in 1935'teki cenazesinde tabutu Süprematist motiflerle süslenmişti ve mezarına siyah bir kare yerleştirildi.", "exp": "Doğru. Tabutu öğrencisi Nikolay Suetin'in tasarladığı Süprematist bir biçimdeydi; mezar taşında beyaz zemin üzerinde siyah bir kare vardı.", "detail": ["Malevich, Sovyet yönetimi sanat üzerinde baskı kurunca 1920'lerin sonunda yeniden figüratif resme döndü. Yine de Kara Kare'yi hayatının sembolü olarak gördü; ölüm yatağında Kara Kare'nin bir versiyonu yanında asılıydı."]}, "fr": {"q": "À l'enterrement de Malevitch en 1935, son cercueil était décoré de motifs suprématistes et un carré noir a été placé sur sa tombe.", "exp": "Vrai. Son cercueil, de forme suprématiste, avait été dessiné par son élève Nikolaï Souïetine ; la tombe portait un carré noir sur fond blanc.", "detail": ["Quand le pouvoir soviétique contrôle l'art à la fin des années 1920, Malevitch revient à la figuration. Mais il voit toujours le Carré noir comme le symbole de sa vie ; une version était accrochée près de son lit de mort."]}, "en": {"q": "At Malevich's funeral in 1935, his coffin was decorated with Suprematist motifs and a black square was placed on his grave.", "exp": "True. His Suprematist-shaped coffin was designed by his pupil Nikolai Suetin; the grave marker showed a black square on white.", "detail": ["When Soviet power took control of art in the late 1920s, Malevich returned to figurative painting. Still, he saw the Black Square as the symbol of his life; a version hung near his deathbed."]}, "id": "x-05-13", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1920, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "arch", "tags": ["constructivism", "modern", "architecture", "sculpture"], "topics": ["constructivism", "modern", "architecture", "sculpture"], "search": {"commons": "Tatlin Tower model", "wiki": {"en": "Tatlin's Tower"}}, "answer": 1, "tr": {"q": "Tatlin'in 'Üçüncü Enternasyonal Anıtı' için düşünülen yapı nasıldı?", "opts": ["Kare tabanlı, taş kaplı bir obelisk", "Çelik ve camdan, içinde dönen hacimler bulunan spiral bir kule", "Bronzdan dev bir işçi heykeli", "Betonarme bir zafer takı"], "exp": "Tatlin, Eyfel Kulesi'nden yüksek, çelik spiral iskelet içinde farklı hızlarda dönen cam hacimlerden oluşan bir kule tasarladı.", "detail": ["Proje 1920'de ahşap maket olarak gösterildi ama hiç inşa edilmedi. Malzeme gerçekliğini ve devrimci dinamizmi simgeleyen kule, Konstrüktivizmin en ünlü imgesidir."]}, "fr": {"q": "Comment devait être le Monument à la IIIe Internationale de Tatline ?", "opts": ["Un obélisque en pierre à base carrée", "Une tour en spirale d'acier et de verre, avec des volumes qui tournent à l'intérieur", "Une immense statue d'ouvrier en bronze", "Un arc de triomphe en béton armé"], "exp": "Tatline imagine une tour plus haute que la tour Eiffel, avec une spirale d'acier contenant des volumes de verre qui tournent à des vitesses différentes.", "detail": ["Le projet est montré en 1920 sous forme de maquette en bois, mais il n'a jamais été construit. C'est l'image la plus célèbre du constructivisme."]}, "en": {"q": "What was Tatlin's Monument to the Third International meant to look like?", "opts": ["A square stone obelisk", "A spiral tower of steel and glass with rotating volumes inside", "A huge bronze statue of a worker", "A reinforced-concrete triumphal arch"], "exp": "Tatlin imagined a tower taller than the Eiffel Tower, with a steel spiral holding glass volumes turning at different speeds.", "detail": ["The project was shown in 1920 as a wooden model but was never built. It is the most famous image of Constructivism."]}, "id": "x-05-14", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1924, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "photo", "tags": ["constructivism", "modern", "photo", "design"], "topics": ["constructivism", "modern", "photo", "design"], "search": {"commons": "Rodchenko Books poster Lilya Brik", "wiki": {"en": "Rodchenko Books poster Lilya Brik"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Eşim Varvara Stepanova da bir Konstrüktivist sanatçıydı.", "1924'te Lilya Brik'in bağırdığı fotoğrafla ünlü 'Kitaplar' afişini yaptım.", "Fotoğrafta alışılmadık aşağıdan ve yukarıdan çekim açılarıyla tanındım."], "opts": ["El Lissitzky", "Gustav Klutsis", "Aleksandr Rodçenko", "Vladimir Tatlin"], "exp": "Cevap Aleksandr Rodçenko'dur. Resim, grafik tasarım ve fotoğrafta Konstrüktivizmin önde gelen ismidir.", "detail": ["
