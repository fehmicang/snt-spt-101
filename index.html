<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNT-SPT 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: colored region band header + one column card flow (phone) / image-left, question-right (desktop) */
  --bg:#FFFFFF; --surface:#F3F4F8; --card:#FFFFFF; --ink:#12131A; --muted:#5B5E6E; --line:#E3E5EC; --edge:#12131A;
  --ok:#00936D; --ok-soft:#E2F7F0; --bad:#E0365B; --bad-soft:#FDE7EC; --star:#FFD25E; --accent:#3D5AFE; --accent-soft:#EEF1FF;
  --font:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1116; --surface:#191C24; --card:#191C24; --ink:#ECEEF5; --muted:#9AA1B4; --line:#2C3242; --edge:#3A4154;
  --ok:#4FD39A; --ok-soft:#10342A; --bad:#FF6B88; --bad-soft:#3A1520; --star:#FFD25E; --accent:#8FA0FF; --accent-soft:#1E2440;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* band */
.band{position:relative;z-index:58;background:var(--band,#12131A);color:var(--bandfg,#fff);transition:background .25s}
.band .in{max-width:1200px;margin:0 auto;padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em;flex:1;cursor:pointer;background:none;border:0;text-align:left;padding:0;color:inherit}
.navlinks{display:none;gap:4px}
.navlinks button{border:0;background:transparent;color:inherit;font-weight:600;font-size:15px;padding:8px 12px;border-radius:10px}
.navlinks button[aria-current="true"]{background:color-mix(in srgb,var(--bandfg) 14%,transparent);font-weight:800}
.starbtn{border:0;font-family:var(--mono);font-size:12px;font-weight:700;border-radius:8px;padding:9px 10px;background:var(--bandfg);color:var(--band)}
.gear{border:0;width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--bandfg) 16%,transparent);display:grid;place-items:center}
.gear svg{stroke:var(--bandfg)}
.qhead{display:flex;align-items:flex-end;gap:12px}
.qnum{font-family:var(--mono);font-weight:700;font-size:40px;line-height:.9}
.qtags{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.progressline{display:flex;gap:3px}
.progressline span{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--bandfg) 25%,transparent)}
.progressline span.ok{background:var(--bandfg)}
.progressline span.bad{background:color-mix(in srgb,var(--bandfg) 55%,transparent)}

main{max-width:1200px;margin:0 auto;padding:0 20px 120px}

/* settings menu */
.menu{position:fixed;z-index:60;right:max(14px,calc((100vw - 1200px)/2 + 14px));top:64px;width:300px;max-width:calc(100vw - 28px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.28);padding:16px;display:flex;flex-direction:column;gap:16px}
.menu .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.seg{display:grid;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:800}
.toggle{display:flex;align-items:center;gap:12px;font-size:14px;padding:6px 0;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.toggle .sw{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-checked="true"] .sw{background:var(--ok)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(18px);background:var(--bg)}
.menu .row{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:none;width:100%;text-align:left;font-size:14px;color:var(--ink)}
.menu hr{border:0;border-top:1px solid var(--line);margin:0}
.scrim{position:fixed;inset:0;z-index:55}

/* home */
.home h1{font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.04;letter-spacing:-.03em;margin:22px 0 6px;text-wrap:balance}
.stats{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.homegrid{display:grid;gap:12px;margin-top:16px}
@media (min-width:860px){.homegrid{grid-template-columns:1fr 1fr}}
.resume{background:var(--rband,#3D5AFE);color:var(--rfg,#fff);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%}
.resume .t{font-weight:800;font-size:22px;letter-spacing:-.02em}
.resume .go{align-self:flex-start;border:0;background:var(--rfg,#fff);color:var(--rband,#3D5AFE);border-radius:12px;padding:11px 16px;font-weight:800}
.mixtile{border:2px solid var(--edge);background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.mixtile .stripe{display:flex;gap:3px}
.mixtile .stripe span{flex:1;height:6px;border-radius:3px}
.mixtile .t{font-weight:800;font-size:18px}
.mixtile .s{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.custom{display:flex;gap:8px;margin-top:10px}
.custom input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.sh{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;text-transform:uppercase}
.lvlseg{grid-template-columns:repeat(5,minmax(0,1fr));max-width:460px}
.lvlseg button{font-family:var(--mono);font-size:11px}
.lvlseg button:first-child{font-family:var(--font);font-size:13px}
.startrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px}
.btn.primary{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.btn.band{border:0;background:var(--band);color:var(--bandfg)}
.btn[disabled]{opacity:.45;cursor:default}
.mini{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:4px 0}
.note{font-size:13px;color:var(--muted)}

/* quiz */
.qwrap{display:flex;flex-wrap:wrap;gap:24px;margin-top:18px}
.qmedia{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:8px}
.qbody{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:14px}
.qwrap.noimg .qmedia{display:none}
.art{border-radius:14px;overflow:hidden;background:var(--surface);display:grid;place-items:center;min-height:220px;max-height:520px}
.art img{display:block;width:100%;height:100%;max-height:520px;object-fit:contain;background:#14151a}
.artcap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted)}
.artcap a{color:var(--muted)}
.imgadd{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:12px;font-weight:700;color:var(--accent);width:100%}
.qtitle{margin:0;font-weight:800;font-size:clamp(22px,4.6vw,30px);line-height:1.14;letter-spacing:-.02em;text-wrap:balance}
.howto{font-size:13px;color:var(--muted);margin:-6px 0 0}
.opts{display:grid;gap:8px}
.opts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--edge);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left;display:flex;gap:10px;align-items:baseline;font-weight:600;font-size:16px;transition:background .12s,border-color .12s}
:root[data-theme="dark"] .opt{border-color:var(--line)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--band-ink,var(--accent));flex:none}
.opt.pending{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtn{border:0;border-radius:18px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:18px;color:#fff}
.tfbtn.t{background:#00A47A}.tfbtn.f{background:#E0365B}
.tfbtn.pending{outline:4px solid var(--accent);outline-offset:2px}
.tfbtn.dim{opacity:.35}
.statement{position:relative;border:2px solid var(--edge);border-radius:18px;padding:22px 18px 18px;font-weight:600;font-size:19px;line-height:1.32}
.statement .tag{position:absolute;top:-11px;left:16px;background:var(--bg);padding:0 8px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
.badge{flex:none;display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);font-family:var(--mono);font-weight:700;font-size:12px;color:var(--muted)}
.opt.picked .badge{border:0;background:var(--ink);color:var(--bg)}
.yr{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);padding-left:8px;white-space:nowrap}
.ordrow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:10px 12px}
.ordrow .b{display:grid;gap:3px;flex:1;min-width:0}
.ordrow .h{display:flex;gap:8px;align-items:baseline;font-weight:600}
.ordrow .n{font-size:13.5px;color:var(--muted);line-height:1.45}
.ordrow .me{font-family:var(--mono);font-size:11px}
.ordrow .me.ok{color:var(--ok)}.ordrow .me.bad{color:var(--bad)}
.mrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:12px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.mrow.sel{border-color:var(--accent)}
.mrow .l{flex:1;font-weight:700}
.mrow .r{font-size:13px;color:var(--muted)}
.mrow.right{border-color:var(--ok);background:var(--ok-soft)}
.mrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mbadge{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:#0F1116;border:2px dashed var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool .chip{position:relative}
.pool .chip.used{opacity:.5}
.clues{display:grid;gap:8px}
.clue{display:flex;gap:12px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.4}
.clue .i{font-family:var(--mono);font-weight:700;color:var(--accent)}
.cluemore{border:2px dashed var(--line);background:transparent;border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;color:var(--accent)}
.checkrow{display:flex;gap:8px;flex-wrap:wrap}

.verdict{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.vtag{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.pill.ok{background:var(--ok);color:#06291C}
.pill.bad{background:var(--bad);color:#fff}
.pill.lv{background:var(--star);color:#12131A}
.exp{margin:0;font-size:16.5px;line-height:1.58}
.trline{font-size:14.5px;color:var(--muted);border-left:3px solid var(--star);padding:2px 0 2px 12px}
.cartel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.cartel div{background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.cartel .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cartel .v{font-size:13.5px;font-weight:700}
.detail{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.detail p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1.5px solid var(--accent);border-radius:999px;padding:6px 12px}
.ask{display:flex;flex-direction:column;gap:6px}
.ask .r{display:flex;gap:8px}
.ask input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.answer{white-space:pre-wrap;font-size:15px}
.err{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.wait{margin-top:40px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.loader{height:4px;width:220px;border-radius:2px;background:var(--line);overflow:hidden}
.loader i{display:block;height:100%;width:35%;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* words */
.w{cursor:pointer;border-radius:4px}
.lang-fr .w,.lang-en .w{text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:4px;text-decoration-thickness:1px}
.w.active{background:var(--star);color:#12131A!important;text-decoration:none!important}
.w.saved{text-decoration-color:var(--star)!important;text-decoration-style:solid!important}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
.sheet.open{transform:none;visibility:visible;transition:transform .2s ease,visibility 0s}
.sheet .in{max-width:640px;margin:0 auto;background:var(--star);color:#12131A;border-radius:24px 24px 0 0;padding:18px 22px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .wd{font-weight:800;font-size:30px;letter-spacing:-.01em;flex:1}
.sheet .mn{font-size:17px;font-weight:500;margin:4px 0 0}
.sheet .ph{margin-top:8px;font-size:14px;background:rgba(18,19,26,.08);border-radius:10px;padding:8px 10px}
.sheet .tg{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.sheet .acts button{border:2px solid #12131A;background:transparent;border-radius:999px;padding:9px 14px;font-weight:800;color:#12131A}
.sheet .acts button.s{background:#12131A;color:var(--star)}
.x{border:0;background:transparent;font-size:26px;line-height:1;color:inherit;padding:0 4px}

/* notebook */
.nbhead{display:flex;align-items:flex-end;gap:12px}
.vlist{display:grid;gap:8px;margin-top:14px}
@media (min-width:860px){.vlist{grid-template-columns:1fr 1fr}}
.vitem{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.vitem .top{display:flex;gap:8px;align-items:baseline}
.vitem .fw{flex:1;font-weight:800;font-size:20px}
.vitem .tg{font-family:var(--mono);font-size:10px;border-radius:6px;padding:3px 7px;background:var(--surface);color:var(--muted)}
.vitem .cx{font-size:12.5px;color:var(--muted);font-style:italic}
.vitem .ops{display:flex;gap:4px}
.vitem .ops button{border:0;background:transparent;font-size:14px;color:var(--muted);padding:2px 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (min-width:860px){.navlinks{display:flex}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.chip.neg{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.neg[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

.intro .ibody{display:flex;flex-direction:column;gap:12px;max-width:760px;margin-top:20px}
.works{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.work{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.wimg{aspect-ratio:4/3;background:var(--line);display:grid;place-items:center;overflow:hidden}
.wimg img{width:100%;height:100%;object-fit:cover;display:block}
.wb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.wt{font-weight:800;color:var(--ink);text-decoration:none;line-height:1.25}
.wa{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wimg.none{aspect-ratio:auto;min-height:56px}
.msec{flex-basis:100%}
.cchip{display:inline-flex;align-items:stretch}
.cchip .chip{border-top-right-radius:0;border-bottom-right-radius:0;border-right:0}
.cdel{border:1.5px solid var(--line);border-left:0;background:var(--card);color:var(--muted);border-radius:0 10px 10px 0;padding:0 10px;font-size:13px}
.cdel.confirm{background:var(--bad);color:#fff;border-color:var(--bad)}

</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="sh-w"><div class="in">
  <div style="display:flex;align-items:baseline;gap:10px"><span class="wd" id="sh-w"></span><span class="tg" id="sh-t"></span><button class="x" id="sh-x" aria-label="Kapat">×</button></div>
  <p class="mn" id="sh-m"></p><div class="ph" id="sh-p" hidden></div>
  <div class="acts"><button id="sh-say">Dinle</button><button class="s" id="sh-s">★ Deftere ekle</button></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const WEB=true;
const BANK_EXPORT={"atlasBank": 2, "questions": [{"type": "mcq", "level": 1, "year": 1144, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "europe", "medium": "arch", "tags": ["gothic", "medieval", "architecture"], "topics": ["gothic", "medieval", "architecture"], "search": {"commons": "Basilica of Saint-Denis choir", "wiki": {"en": "Basilica of Saint-Denis"}}, "answer": 2, "tr": {"q": "Gotik mimarinin doğduğu yer olarak kabul edilen, Başrahip Suger'in yeniden yaptırdığı kilise hangisidir?", "opts": ["Chartres Katedrali", "Notre-Dame de Paris", "Saint-Denis Bazilikası", "Amiens Katedrali"], "exp": "Saint-Denis Bazilikası'nın koro bölümü 1144'te Başrahip Suger yönetiminde tamamlandı ve Gotik üslubun başlangıcı sayılır.", "detail": ["Suger, ışığı Tanrı'nın varlığının simgesi olarak görüyordu; bu yüzden geniş vitraylı pencereler ve sivri kemerler kullandırdı. Chartres, Paris ve Amiens katedralleri bu modeli izleyerek daha sonra yapıldı."]}, "fr": {"q": "Quelle église, reconstruite par l'abbé Suger, est considérée comme le lieu de naissance de l'architecture gothique ?", "opts": ["La cathédrale de Chartres", "Notre-Dame de Paris", "La basilique de Saint-Denis", "La cathédrale d'Amiens"], "exp": "Le chœur de Saint-Denis est achevé en 1144 sous l'abbé Suger. On le considère comme le début du style gothique.", "detail": ["Pour Suger, la lumière était un signe de la présence de Dieu ; il a donc choisi de grands vitraux et des arcs brisés. Chartres, Paris et Amiens ont suivi ce modèle plus tard."]}, "en": {"q": "Which church, rebuilt by Abbot Suger, is seen as the birthplace of Gothic architecture?", "opts": ["Chartres Cathedral", "Notre-Dame de Paris", "The Basilica of Saint-Denis", "Amiens Cathedral"], "exp": "The choir of Saint-Denis was finished in 1144 under Abbot Suger. It is seen as the start of the Gothic style.", "detail": ["Suger saw light as a sign of God's presence, so he chose large stained-glass windows and pointed arches. Chartres, Paris and Amiens followed this model later."]}, "id": "x-01-0", "t": 1794800000000}, {"type": "tf", "level": 1, "year": 1200, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "europe", "medium": "arch", "tags": ["gothic", "medieval", "architecture"], "topics": ["gothic", "medieval", "architecture"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Uçan payandalar (arcs-boutants), Gotik katedrallerde yüksek duvarların itme kuvvetini dışarıdan karşılamak için kullanılır.", "exp": "Doğru. Uçan payandalar duvarın dışında yer alır ve tonozun itme kuvvetini zemine iletir.", "detail": ["Bu sistem sayesinde duvarlar incelebildi ve büyük vitraylı pencereler açılabildi. Notre-Dame de Paris'in uçan payandaları en çok fotoğraflanan örneklerdendir."]}, "fr": {"q": "Dans les cathédrales gothiques, les arcs-boutants servent à soutenir de l'extérieur la poussée des murs très hauts.", "exp": "Vrai. Les arcs-boutants sont placés à l'extérieur et transmettent la poussée des voûtes vers le sol.", "detail": ["Grâce à ce système, les murs peuvent être plus fins et accueillir de grands vitraux. Les arcs-boutants de Notre-Dame de Paris sont parmi les plus photographiés."]}, "en": {"q": "In Gothic cathedrals, flying buttresses support the push of the very high walls from the outside.", "exp": "True. Flying buttresses stand outside the building and carry the push of the vaults down to the ground.", "detail": ["Thanks to this system, walls could be thinner and hold large stained-glass windows. The flying buttresses of Notre-Dame de Paris are among the most photographed."]}, "id": "x-01-1", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1248, "era": {"tr": "13. yüzyıl", "fr": "13e siècle", "en": "13th century"}, "region": "europe", "medium": "arch", "tags": ["gothic", "medieval", "architecture"], "topics": ["gothic", "medieval", "architecture"], "search": {"commons": "Sainte-Chapelle upper chapel interior", "wiki": {"en": "Sainte-Chapelle"}}, "answer": 0, "tr": {"q": "Bu yapı hangisi?", "opts": ["Sainte-Chapelle, Paris", "Westminster Manastırı, Londra", "Köln Katedrali", "Siena Katedrali"], "exp": "Bu, Fransa Kralı IX. Louis'nin 1248'de kutsanan saray şapeli Sainte-Chapelle'dir. Üst şapelin duvarları neredeyse tamamen vitraydır.", "detail": ["Şapel, Louis'nin satın aldığı Dikenli Taç gibi kutsal emanetleri korumak için yapıldı. Rayonnant Gotik üslubun en saf örneği sayılır ve Paris'teki Île de la Cité üzerindedir."]}, "fr": {"q": "Quel est ce monument ?", "opts": ["La Sainte-Chapelle, Paris", "L'abbaye de Westminster, Londres", "La cathédrale de Cologne", "La cathédrale de Sienne"], "exp": "C'est la Sainte-Chapelle, chapelle du palais de Louis IX, consacrée en 1248. Les murs de la chapelle haute sont presque entièrement en vitraux.", "detail": ["Elle a été construite pour garder des reliques comme la Couronne d'épines achetée par Louis IX. C'est l'exemple le plus pur du gothique rayonnant, sur l'île de la Cité à Paris."]}, "en": {"q": "Which building is this?", "opts": ["Sainte-Chapelle, Paris", "Westminster Abbey, London", "Cologne Cathedral", "Siena Cathedral"], "exp": "This is the Sainte-Chapelle, the palace chapel of Louis IX, consecrated in 1248. The walls of the upper chapel are almost all stained glass.", "detail": ["It was built to hold relics such as the Crown of Thorns, bought by Louis IX. It is the purest example of Rayonnant Gothic, on the Île de la Cité in Paris."]}, "id": "x-01-2", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1880, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "arch", "tags": ["gothic", "medieval", "architecture"], "topics": ["gothic", "medieval", "architecture"], "search": {"commons": "Cologne Cathedral", "wiki": {"en": "Cologne Cathedral"}}, "answer": 3, "tr": {"q": "İnşaatı 1248'de başlayıp yüzyıllarca duran ve ancak 1880'de tamamlanan Gotik katedral hangisidir?", "opts": ["Reims Katedrali", "Milano Katedrali", "Salisbury Katedrali", "Köln Katedrali"], "exp": "Köln Katedrali 1248'de başladı, 1473 civarında durdu ve 19. yüzyılda orijinal planlar bulununca 1880'de bitirildi.", "detail": ["Kayıp ortaçağ çizimlerinin bulunması ve Alman ulusal duygusu inşaatın yeniden başlamasını sağladı. Bitirildiğinde bir süre dünyanın en yüksek yapısıydı ve bugün UNESCO Dünya Mirası'dır."]}, "fr": {"q": "Quelle cathédrale gothique, commencée en 1248, est restée inachevée pendant des siècles et n'a été terminée qu'en 1880 ?", "opts": ["La cathédrale de Reims", "La cathédrale de Milan", "La cathédrale de Salisbury", "La cathédrale de Cologne"], "exp": "La cathédrale de Cologne est commencée en 1248, arrêtée vers 1473, puis terminée en 1880 après la découverte des plans d'origine.", "detail": ["La découverte des dessins médiévaux et le sentiment national allemand ont relancé le chantier. À sa fin, elle a été pendant quelques années le plus haut bâtiment du monde."]}, "en": {"q": "Which Gothic cathedral, begun in 1248, stayed unfinished for centuries and was only completed in 1880?", "opts": ["Reims Cathedral", "Milan Cathedral", "Salisbury Cathedral", "Cologne Cathedral"], "exp": "Cologne Cathedral was begun in 1248, stopped around 1473 and finished in 1880 after the original plans were found.", "detail": ["The discovery of medieval drawings and German national feeling restarted the work. When it was finished, it was for a few years the tallest building in the world."]}, "id": "x-01-3", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1200, "era": {"tr": "12. yüzyıl", "fr": "12e siècle", "en": "12th century"}, "region": "europe", "medium": "arch", "tags": ["gothic", "medieval", "architecture"], "topics": ["gothic", "medieval", "architecture"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1144", "1163", "1194", "1248"], "tr": {"q": "Bu Gotik yapıların inşaatının başlama tarihlerini eskiden yeniye sırala.", "items": ["Saint-Denis korosu", "Notre-Dame de Paris", "Chartres Katedrali (yangın sonrası)", "Köln Katedrali"], "exp": "Saint-Denis 1144, Notre-Dame 1163, Chartres'ın yeniden yapımı 1194, Köln 1248 tarihlidir.", "detail": ["Gotik üslup Paris çevresinden doğdu ve önce Fransa'da, sonra Almanya ve İngiltere'ye yayıldı. Chartres, 1194 yangınından sonra hızla yeniden yapılarak orijinal vitraylarının çoğunu korudu."]}, "fr": {"q": "Classe ces chantiers gothiques selon leur date de début, du plus ancien au plus récent.", "items": ["Le chœur de Saint-Denis", "Notre-Dame de Paris", "La cathédrale de Chartres (après l'incendie)", "La cathédrale de Cologne"], "exp": "Saint-Denis date de 1144, Notre-Dame de 1163, la reconstruction de Chartres de 1194 et Cologne de 1248.", "detail": ["Le gothique est né autour de Paris, puis il s'est répandu en France, en Allemagne et en Angleterre. Chartres a été reconstruite très vite après l'incendie de 1194 et garde la plupart de ses vitraux d'origine."]}, "en": {"q": "Put these Gothic building projects in order of their start date, oldest first.", "items": ["The choir of Saint-Denis", "Notre-Dame de Paris", "Chartres Cathedral (after the fire)", "Cologne Cathedral"], "exp": "Saint-Denis dates from 1144, Notre-Dame from 1163, the rebuilding of Chartres from 1194 and Cologne from 1248.", "detail": ["Gothic was born around Paris, then spread through France, Germany and England. Chartres was rebuilt quickly after the 1194 fire and keeps most of its original stained glass."]}, "id": "x-01-4", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1534, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["mannerism", "renaissance", "painting"], "topics": ["mannerism", "renaissance", "painting"], "search": {"commons": "Parmigianino Madonna with the Long Neck", "wiki": {"en": "Madonna with the Long Neck"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Raffaello – Sistina Madonnası", "Parmigianino – Uzun Boyunlu Madonna", "Bronzino – Venüs ve Aşk Alegorisi", "Pontormo – Çarmıhtan İndiriliş"], "exp": "Parmigianino'nun Uzun Boyunlu Madonna'sı (1534–1540), uzatılmış bedenleri ve tuhaf oranlarıyla Maniyerizmin simgesidir.", "detail": ["Ressam, Rönesans'ın dengeli oranları yerine zarif ve yapay bir güzellik aradı. Tablo bitmemiş kaldı ve bugün Floransa'daki Uffizi Galerisi'ndedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Raphaël – La Madone Sixtine", "Parmigianino – La Madone au long cou", "Bronzino – Allégorie du triomphe de Vénus", "Pontormo – La Déposition"], "exp": "La Madone au long cou de Parmigianino (1534–1540) est un symbole du maniérisme, avec ses corps allongés et ses proportions étranges.", "detail": ["Le peintre cherche une beauté élégante et artificielle, et non l'équilibre de la Renaissance. Le tableau est resté inachevé et se trouve aux Offices, à Florence."]}, "en": {"q": "Which work is this?", "opts": ["Raphael – Sistine Madonna", "Parmigianino – Madonna with the Long Neck", "Bronzino – Venus, Cupid, Folly and Time", "Pontormo – Deposition"], "exp": "Parmigianino's Madonna with the Long Neck (1534–1540) is a symbol of Mannerism, with its stretched bodies and strange proportions.", "detail": ["The painter looked for an elegant, artificial beauty instead of Renaissance balance. The painting stayed unfinished and is in the Uffizi Gallery in Florence."]}, "id": "x-01-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1586, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["mannerism", "renaissance", "painting"], "topics": ["mannerism", "renaissance", "painting"], "search": {"commons": "El Greco Burial of the Count of Orgaz", "wiki": {"en": "The Burial of the Count of Orgaz"}}, "answer": 0, "tr": {"q": "Girit doğumlu, Toledo'da çalışan ve 'Kont Orgaz'ın Gömülmesi'ni yapan ressam kimdir?", "opts": ["El Greco", "Tintoretto", "Velázquez", "Zurbarán"], "exp": "El Greco (Domenikos Theotokopoulos) Girit'te doğdu, Venedik ve Roma'dan sonra Toledo'ya yerleşti. Kont Orgaz'ın Gömülmesi 1586–88 tarihlidir.", "detail": ["Uzun figürleri, soğuk renkleri ve titreyen ışığı onu Maniyerizmle ilişkilendirir. Tablo bugün hâlâ Toledo'daki Santo Tomé kilisesinde, yapıldığı yerde durur."]}, "fr": {"q": "Quel peintre né en Crète, actif à Tolède, a peint L'Enterrement du comte d'Orgaz ?", "opts": ["Le Greco", "Le Tintoret", "Velázquez", "Zurbarán"], "exp": "Le Greco (Domínikos Theotokópoulos) est né en Crète. Après Venise et Rome, il s'installe à Tolède. L'Enterrement du comte d'Orgaz date de 1586–1588.", "detail": ["Ses figures allongées, ses couleurs froides et sa lumière vibrante le lient au maniérisme. Le tableau est toujours dans l'église Santo Tomé de Tolède, là où il a été peint."]}, "en": {"q": "Which Crete-born painter, active in Toledo, painted The Burial of the Count of Orgaz?", "opts": ["El Greco", "Tintoretto", "Velázquez", "Zurbarán"], "exp": "El Greco (Domenikos Theotokopoulos) was born in Crete. After Venice and Rome, he settled in Toledo. The Burial of the Count of Orgaz dates from 1586–88.", "detail": ["His long figures, cold colours and flickering light link him to Mannerism. The painting is still in the church of Santo Tomé in Toledo, where it was made."]}, "id": "x-01-6", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1545, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["mannerism", "renaissance", "painting"], "topics": ["mannerism", "renaissance", "painting"], "search": {"commons": "Bronzino Allegory with Venus and Cupid", "wiki": {"en": "Bronzino Allegory with Venus and Cupid"}}, "answer": false, "tr": {"q": "Bronzino'nun 'Venüs ve Aşk Alegorisi' bugün Floransa'daki Uffizi Galerisi'ndedir.", "exp": "Yanlış. Tablo Londra'daki National Gallery'dedir. Cosimo de' Medici onu Fransa Kralı I. François'ya hediye olarak göndermişti.", "detail": ["Eser, gizemli figürleri ve soğuk, cilalı yüzeyiyle Maniyerizmin en karmaşık alegorilerinden biridir. Anlamı hâlâ tartışılır; zaman, kıskançlık ve aldatma temaları öne çıkar."]}, "fr": {"q": "L'« Allégorie du triomphe de Vénus » de Bronzino se trouve aujourd'hui aux Offices, à Florence.", "exp": "Faux. Le tableau est à la National Gallery de Londres. Cosme de Médicis l'avait offert au roi de France François Ier.", "detail": ["Avec ses figures mystérieuses et sa surface froide et lisse, c'est l'une des allégories les plus complexes du maniérisme. Son sens est encore discuté : le temps, la jalousie et la tromperie y sont présents."]}, "en": {"q": "Bronzino's \"Venus, Cupid, Folly and Time\" is today in the Uffizi Gallery in Florence.", "exp": "False. The painting is in the National Gallery in London. Cosimo de' Medici sent it as a gift to King Francis I of France.", "detail": ["With its mysterious figures and cold, polished surface, it is one of the most complex allegories of Mannerism. Its meaning is still debated: time, jealousy and deceit all appear."]}, "id": "x-01-7", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1528, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "painting", "tags": ["mannerism", "renaissance", "painting"], "topics": ["mannerism", "renaissance", "painting"], "search": {"commons": "Pontormo Deposition Santa Felicita", "wiki": {"en": "Pontormo Deposition Santa Felicita"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Andrea del Sarto'nun öğrencisiydim ve Floransa'da çalıştım.", "Santa Felicita kilisesi için pastel pembe ve mavilerle 'Çarmıhtan İndiriliş'i yaptım.", "Bronzino benim öğrencimdi ve günlüğüm bugün de okunur."], "opts": ["Rosso Fiorentino", "Giulio Romano", "Jacopo da Pontormo", "Andrea del Sarto"], "exp": "Cevap Jacopo da Pontormo'dur. Santa Felicita'daki Çarmıhtan İndiriliş (1525–28) Maniyerizmin başyapıtlarındandır.", "detail": ["Tabloda haç ya da manzara yoktur; figürler havada süzülür gibi durur. Pontormo'nun yalnız ve titiz kişiliği, son yıllarında tuttuğu günlükten bilinir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai été l'élève d'Andrea del Sarto et j'ai travaillé à Florence.", "J'ai peint une Déposition aux roses et aux bleus pâles pour l'église Santa Felicita.", "Bronzino a été mon élève, et on lit encore mon journal aujourd'hui."], "opts": ["Rosso Fiorentino", "Giulio Romano", "Jacopo da Pontormo", "Andrea del Sarto"], "exp": "La réponse est Jacopo da Pontormo. Sa Déposition de Santa Felicita (1525–1528) est un chef-d'œuvre du maniérisme.", "detail": ["Il n'y a ni croix ni paysage : les figures semblent flotter. On connaît son caractère solitaire et minutieux grâce au journal de ses dernières années."]}, "en": {"q": "Who am I?", "clues": ["I was a pupil of Andrea del Sarto and worked in Florence.", "I painted a Deposition in pale pinks and blues for the church of Santa Felicita.", "Bronzino was my pupil, and my diary is still read today."], "opts": ["Rosso Fiorentino", "Giulio Romano", "Jacopo da Pontormo", "Andrea del Sarto"], "exp": "The answer is Jacopo da Pontormo. His Deposition in Santa Felicita (1525–28) is a masterpiece of Mannerism.", "detail": ["There is no cross and no landscape; the figures seem to float. His lonely, careful character is known from the diary of his last years."]}, "id": "x-01-8", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1534, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "europe", "medium": "arch", "tags": ["mannerism", "renaissance", "architecture"], "topics": ["mannerism", "renaissance", "architecture"], "search": {"commons": "Palazzo Te Mantua Sala dei Giganti", "wiki": {"en": "Palazzo del Te"}}, "answer": 1, "tr": {"q": "Mantova'daki Palazzo Te'yi tasarlayan ve 'Devler Salonu' fresklerini yapan Maniyerist sanatçı kimdir?", "opts": ["Sebastiano Serlio", "Giulio Romano", "Giorgio Vasari", "Benvenuto Cellini"], "exp": "Giulio Romano, Raffaello'nun öğrencisiydi; Gonzaga ailesi için Palazzo Te'yi (1524–34) tasarladı ve boyadı.", "detail": ["Devler Salonu'nda duvarlar ve tavan tek bir sahne oluşturur: çöken sütunlar izleyicinin üstüne düşüyor gibidir. Mimaride de klasik kuralları şaka gibi bozdu; bazı triglifler bilerek 'kaymış' görünür."]}, "fr": {"q": "Quel artiste maniériste a conçu le Palazzo Te à Mantoue et peint les fresques de la Salle des Géants ?", "opts": ["Sebastiano Serlio", "Giulio Romano", "Giorgio Vasari", "Benvenuto Cellini"], "exp": "Giulio Romano, élève de Raphaël, a conçu et décoré le Palazzo Te (1524–1534) pour les Gonzague.", "detail": ["Dans la Salle des Géants, murs et plafond forment une seule scène : les colonnes semblent tomber sur le visiteur. Il joue aussi avec les règles classiques : certains triglyphes semblent « glisser »."]}, "en": {"q": "Which Mannerist artist designed the Palazzo Te in Mantua and painted the frescoes of the Hall of the Giants?", "opts": ["Sebastiano Serlio", "Giulio Romano", "Giorgio Vasari", "Benvenuto Cellini"], "exp": "Giulio Romano, a pupil of Raphael, designed and decorated the Palazzo Te (1524–34) for the Gonzaga family.", "detail": ["In the Hall of the Giants, walls and ceiling form one scene: columns seem to fall on the visitor. He also played with classical rules; some triglyphs seem to 'slip'."]}, "id": "x-01-9", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1767, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "painting", "tags": ["rococo", "baroque", "painting"], "topics": ["rococo", "baroque", "painting"], "search": {"commons": "Fragonard The Swing Wallace Collection", "wiki": {"en": "The Swing (Fragonard)"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Watteau – Kythira'ya Yolculuk", "Boucher – Madame de Pompadour", "Gainsborough – Mavi Oğlan", "Fragonard – Salıncak"], "exp": "Jean-Honoré Fragonard'ın Salıncak'ı (1767), Rokoko'nun oyunbaz ve flörtöz ruhunun simgesidir.", "detail": ["Pembe elbiseli genç kadın salıncakta havaya uçarken ayakkabısı fırlar; çalılıkların arasındaki genç adam onu izler. Tablo Londra'daki Wallace Collection'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Watteau – Pèlerinage à l'île de Cythère", "Boucher – Madame de Pompadour", "Gainsborough – Le Garçon en bleu", "Fragonard – L'Escarpolette"], "exp": "L'Escarpolette de Jean-Honoré Fragonard (1767) est un symbole de l'esprit léger et galant du rococo.", "detail": ["Une jeune femme en robe rose vole sur sa balançoire et perd sa chaussure, sous le regard d'un jeune homme caché dans les buissons. Le tableau est à la Wallace Collection de Londres."]}, "en": {"q": "Which work is this?", "opts": ["Watteau – Pilgrimage to Cythera", "Boucher – Madame de Pompadour", "Gainsborough – The Blue Boy", "Fragonard – The Swing"], "exp": "Jean-Honoré Fragonard's The Swing (1767) is a symbol of the playful, flirtatious spirit of Rococo.", "detail": ["A young woman in a pink dress flies on a swing and loses her shoe, watched by a young man hidden in the bushes. The painting is in the Wallace Collection in London."]}, "id": "x-01-10", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1717, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "painting", "tags": ["rococo", "baroque", "painting"], "topics": ["rococo", "baroque", "painting"], "search": {"commons": "Watteau Pilgrimage to Cythera Louvre", "wiki": {"en": "The Embarkation for Cythera"}}, "answer": 0, "tr": {"q": "Antoine Watteau, 1717'de Fransız Akademisi'ne 'Kythira'ya Yolculuk' ile kabul edildiğinde akademi onun için hangi yeni kategoriyi oluşturdu?", "opts": ["Fête galante", "Tarih resmi", "Natürmort", "Bambochade"], "exp": "Akademi, Watteau'nun zarif açık hava eğlencelerini tanımlamak için 'fête galante' kategorisini yarattı.", "detail": ["Fête galante resimleri, kostümlü aristokratların doğada müzik ve aşkla vakit geçirdiği sahneleri gösterir. Kythira'ya Yolculuk bugün Louvre'dadır; ikinci bir versiyonu Berlin'dedir."]}, "fr": {"q": "Quand Watteau est reçu à l'Académie en 1717 avec le Pèlerinage à l'île de Cythère, quelle nouvelle catégorie l'Académie crée-t-elle pour lui ?", "opts": ["La fête galante", "La peinture d'histoire", "La nature morte", "La bambochade"], "exp": "L'Académie crée la catégorie de « fête galante » pour décrire ses élégantes scènes de plaisirs en plein air.", "detail": ["Les fêtes galantes montrent des aristocrates costumés qui passent le temps dans la nature, avec la musique et l'amour. Le tableau est au Louvre ; une deuxième version est à Berlin."]}, "en": {"q": "When Watteau entered the French Academy in 1717 with Pilgrimage to Cythera, what new category did the Academy create for him?", "opts": ["Fête galante", "History painting", "Still life", "Bambochade"], "exp": "The Academy created the 'fête galante' category to describe his elegant outdoor pleasure scenes.", "detail": ["Fêtes galantes show costumed aristocrats spending time in nature with music and love. The painting is in the Louvre; a second version is in Berlin."]}, "id": "x-01-11", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1735, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "arch", "tags": ["rococo", "baroque", "architecture", "design"], "topics": ["rococo", "baroque", "architecture", "design"], "search": {"commons": "Amalienburg Hall of Mirrors", "wiki": {"en": "Amalienburg Hall of Mirrors"}}, "answer": true, "tr": {"q": "'Rokoko' kelimesi, Fransızca 'rocaille' sözcüğünden türemiştir; bu kelime bahçe mağaralarındaki kabuk ve taş süslemelerini anlatır.", "exp": "Doğru. Rocaille, kabuk ve kayaya benzeyen kıvrımlı süslemeleri ifade eder; 'rokoko' adı buradan gelir.", "detail": ["Rokoko özellikle iç mekân süslemesinde gelişti: beyaz ve pastel duvarlar, altın kaplama kıvrımlar ve aynalar. Münih yakınındaki Amalienburg köşkü ve Paris'teki Hôtel de Soubise salonları güzel örneklerdir."]}, "fr": {"q": "Le mot « rococo » vient du mot français « rocaille », qui désigne les décors de coquillages et de pierres des grottes de jardin.", "exp": "Vrai. La rocaille désigne des ornements courbes qui imitent les coquillages et les rochers ; le mot « rococo » en vient.", "detail": ["Le rococo se développe surtout dans le décor intérieur : murs blancs et pastel, courbes dorées et miroirs. Le pavillon d'Amalienburg près de Munich et les salons de l'hôtel de Soubise à Paris en sont de beaux exemples."]}, "en": {"q": "The word 'Rococo' comes from the French word 'rocaille', which describes shell and stone decoration in garden grottoes.", "exp": "True. Rocaille means curving ornaments that imitate shells and rocks; the name 'Rococo' comes from it.", "detail": ["Rococo grew above all in interior decoration: white and pastel walls, gilded curves and mirrors. The Amalienburg pavilion near Munich and the salons of the Hôtel de Soubise in Paris are fine examples."]}, "id": "x-01-12", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1756, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "painting", "tags": ["rococo", "baroque", "painting"], "topics": ["rococo", "baroque", "painting"], "search": {"commons": "François Boucher Madame de Pompadour Munich", "wiki": {"en": "François Boucher Madame de Pompadour Munich"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Madame de Pompadour'un en sevdiği ressamdım ve onun portrelerini yaptım.", "Pembe tenli tanrıçalar ve pastoral aşk sahneleriyle tanındım.", "Gobelins dokuma atölyesini yönettim ve Kralın Birinci Ressamı oldum."], "opts": ["Antoine Watteau", "François Boucher", "Jean-Baptiste Greuze", "Jean-Siméon Chardin"], "exp": "Cevap François Boucher'dir. Rokoko'nun en tipik ressamlarındandır ve Madame de Pompadour'un himayesinde çalıştı.", "detail": ["Boucher, mitolojik sahneleri hafif ve süslü bir dille anlattı; resimleri duvar halılarına ve porselenlere de aktarıldı. Diderot gibi eleştirmenler onu fazla yapay bulup sert biçimde eleştirdi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'étais le peintre préféré de Madame de Pompadour et j'ai fait ses portraits.", "Je suis connu pour mes déesses à la peau rose et mes scènes pastorales d'amour.", "J'ai dirigé la manufacture des Gobelins et je suis devenu Premier peintre du roi."], "opts": ["Antoine Watteau", "François Boucher", "Jean-Baptiste Greuze", "Jean-Siméon Chardin"], "exp": "La réponse est François Boucher. C'est un peintre typique du rococo, protégé par Madame de Pompadour.", "detail": ["Boucher raconte la mythologie de façon légère et décorative ; ses images passent aussi dans les tapisseries et les porcelaines. Des critiques comme Diderot le trouvent trop artificiel."]}, "en": {"q": "Who am I?", "clues": ["I was Madame de Pompadour's favourite painter and made her portraits.", "I am known for pink-skinned goddesses and pastoral love scenes.", "I ran the Gobelins tapestry works and became First Painter to the King."], "opts": ["Antoine Watteau", "François Boucher", "Jean-Baptiste Greuze", "Jean-Siméon Chardin"], "exp": "The answer is François Boucher. He is a typical Rococo painter, supported by Madame de Pompadour.", "detail": ["Boucher told myths in a light, decorative way; his images were also used for tapestries and porcelain. Critics such as Diderot found him too artificial."]}, "id": "x-01-13", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1753, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "painting", "tags": ["rococo", "baroque", "painting"], "topics": ["rococo", "baroque", "painting"], "search": {"commons": "Tiepolo Würzburg Residence staircase fresco", "wiki": {"en": "Würzburg Residence"}}, "answer": 2, "tr": {"q": "Giovanni Battista Tiepolo, dünyanın en büyük tavan fresklerinden birini hangi sarayın merdiven holüne yaptı?", "opts": ["Versay Sarayı", "Schönbrunn Sarayı", "Würzburg Rezidansı", "Caserta Sarayı"], "exp": "Tiepolo 1752–53'te Balthasar Neumann'ın tasarladığı Würzburg Rezidansı'nın merdiven tavanına dört kıtayı gösteren dev freski yaptı.", "detail": ["Fresk, Avrupa, Asya, Afrika ve Amerika'yı alegorik figürlerle temsil eder. İkinci Dünya Savaşı'ndaki bombalamadan büyük ölçüde sağlam çıktı ve bugün UNESCO Dünya Mirası'dır."]}, "fr": {"q": "Dans l'escalier de quel palais Giambattista Tiepolo a-t-il peint l'une des plus grandes fresques de plafond du monde ?", "opts": ["Le château de Versailles", "Le château de Schönbrunn", "La Résidence de Wurtzbourg", "Le palais de Caserte"], "exp": "En 1752–1753, Tiepolo peint au plafond de l'escalier de la Résidence de Wurtzbourg, conçue par Balthasar Neumann, une immense fresque des quatre continents.", "detail": ["La fresque représente l'Europe, l'Asie, l'Afrique et l'Amérique par des figures allégoriques. Elle a presque échappé aux bombardements de 1945 et elle est classée à l'UNESCO."]}, "en": {"q": "In the staircase of which palace did Giambattista Tiepolo paint one of the largest ceiling frescoes in the world?", "opts": ["The Palace of Versailles", "Schönbrunn Palace", "The Würzburg Residence", "The Royal Palace of Caserta"], "exp": "In 1752–53 Tiepolo painted a huge fresco of the four continents on the staircase ceiling of the Würzburg Residence, designed by Balthasar Neumann.", "detail": ["The fresco shows Europe, Asia, Africa and America through allegorical figures. It largely survived the bombing of 1945 and is a UNESCO World Heritage site."]}, "id": "x-01-14", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1784, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "painting", "tags": ["neoclassicism", "c19", "painting"], "topics": ["neoclassicism", "c19", "painting"], "search": {"commons": "Jacques-Louis David Oath of the Horatii", "wiki": {"en": "Oath of the Horatii"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["David – Horatiusların Yemini", "Ingres – Büyük Odalık", "Delacroix – Halka Yol Gösteren Özgürlük", "Géricault – Medusa'nın Salı"], "exp": "Jacques-Louis David'in Horatiusların Yemini (1784), Neoklasizmin manifestosu sayılır: sade bir mekân, net çizgiler ve vatan için fedakârlık teması.", "detail": ["Üç kardeş babalarının uzattığı kılıçlar önünde yemin eder; sağda kadınlar yas tutar. Erkeklerin dik çizgileriyle kadınların yumuşak kıvrımları bilinçli bir karşıtlık oluşturur. Tablo Louvre'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["David – Le Serment des Horaces", "Ingres – La Grande Odalisque", "Delacroix – La Liberté guidant le peuple", "Géricault – Le Radeau de La Méduse"], "exp": "Le Serment des Horaces de Jacques-Louis David (1784) est considéré comme le manifeste du néoclassicisme : décor simple, lignes nettes et sacrifice pour la patrie.", "detail": ["Trois frères jurent devant les épées tendues par leur père ; à droite, les femmes pleurent. Les lignes droites des hommes s'opposent aux courbes douces des femmes. Le tableau est au Louvre."]}, "en": {"q": "Which work is this?", "opts": ["David – Oath of the Horatii", "Ingres – Grande Odalisque", "Delacroix – Liberty Leading the People", "Géricault – The Raft of the Medusa"], "exp": "Jacques-Louis David's Oath of the Horatii (1784) is seen as the manifesto of Neoclassicism: a simple setting, clear lines and sacrifice for the nation.", "detail": ["Three brothers swear an oath before the swords held out by their father; on the right, the women grieve. The straight lines of the men contrast with the soft curves of the women. The painting is in the Louvre."]}, "id": "x-02-0", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1764, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "europe", "medium": "concept", "tags": ["neoclassicism", "c19", "sculpture"], "topics": ["neoclassicism", "c19", "sculpture"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "Neoklasizmi derinden etkileyen 'soylu sadelik ve sessiz büyüklük' ifadesi hangi yazara aittir?", "opts": ["Denis Diderot", "Jean-Jacques Rousseau", "Johann Joachim Winckelmann", "Gotthold Ephraim Lessing"], "exp": "Alman sanat tarihçisi Johann Joachim Winckelmann, antik Yunan sanatını 'soylu sadelik ve sessiz büyüklük' ile tanımladı.", "detail": ["Winckelmann'ın 1764 tarihli 'Antik Çağ Sanatı Tarihi' modern sanat tarihinin kurucu metinlerinden sayılır. Pompeii ve Herculaneum kazıları da aynı dönemde antik çağa ilgiyi büyük ölçüde artırdı."]}, "fr": {"q": "Quel auteur a décrit l'art grec par la formule « noble simplicité et calme grandeur », qui a beaucoup influencé le néoclassicisme ?", "opts": ["Denis Diderot", "Jean-Jacques Rousseau", "Johann Joachim Winckelmann", "Gotthold Ephraim Lessing"], "exp": "L'historien d'art allemand Johann Joachim Winckelmann a décrit l'art grec comme une « noble simplicité et calme grandeur ».", "detail": ["Son Histoire de l'art de l'Antiquité (1764) est l'un des textes fondateurs de l'histoire de l'art moderne. À la même époque, les fouilles de Pompéi et d'Herculanum augmentent beaucoup l'intérêt pour l'Antiquité."]}, "en": {"q": "Which writer described Greek art as having 'noble simplicity and quiet grandeur', a phrase that deeply influenced Neoclassicism?", "opts": ["Denis Diderot", "Jean-Jacques Rousseau", "Johann Joachim Winckelmann", "Gotthold Ephraim Lessing"], "exp": "The German art historian Johann Joachim Winckelmann described Greek art as 'noble simplicity and quiet grandeur'.", "detail": ["His History of the Art of Antiquity (1764) is one of the founding texts of modern art history. At the same time, the excavations at Pompeii and Herculaneum greatly increased interest in antiquity."]}, "id": "x-02-1", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1808, "era": {"tr": "1800'ler", "fr": "Années 1800", "en": "1800s"}, "region": "europe", "medium": "sculpture", "tags": ["neoclassicism", "c19", "sculpture"], "topics": ["neoclassicism", "c19", "sculpture"], "search": {"commons": "Canova Paolina Borghese as Venus Victrix", "wiki": {"en": "Canova Paolina Borghese as Venus Victrix"}}, "answer": true, "tr": {"q": "Antonio Canova, Napolyon'un kız kardeşi Pauline Borghese'yi yarı çıplak Venüs olarak mermer bir heykelde tasvir etti.", "exp": "Doğru. 'Muzaffer Venüs olarak Paolina Borghese' (1805–08) bugün Roma'daki Galleria Borghese'dedir.", "detail": ["Canova, Neoklasik heykelin en ünlü ustasıdır; mermeri cilalayarak ona ten gibi parlak bir yüzey verdi. Eser eskiden mum ışığında, dönen bir kaide üzerinde gösterilirdi."]}, "fr": {"q": "Antonio Canova a représenté Pauline Borghèse, la sœur de Napoléon, en Vénus à demi nue dans une sculpture en marbre.", "exp": "Vrai. « Pauline Borghèse en Vénus victorieuse » (1805–1808) est aujourd'hui à la Galerie Borghèse, à Rome.", "detail": ["Canova est le plus célèbre sculpteur néoclassique ; il polissait le marbre pour lui donner l'éclat de la peau. Autrefois, on montrait l'œuvre à la lumière des bougies, sur un socle tournant."]}, "en": {"q": "Antonio Canova showed Pauline Borghese, Napoleon's sister, as a half-naked Venus in a marble sculpture.", "exp": "True. 'Paolina Borghese as Venus Victrix' (1805–08) is today in the Galleria Borghese in Rome.", "detail": ["Canova is the most famous Neoclassical sculptor; he polished marble to give it the glow of skin. In the past, the work was shown by candlelight on a turning base."]}, "id": "x-02-2", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1814, "era": {"tr": "1810'ler", "fr": "Années 1810", "en": "1810s"}, "region": "europe", "medium": "painting", "tags": ["neoclassicism", "c19", "painting", "orientalism"], "topics": ["neoclassicism", "c19", "painting", "orientalism"], "search": {"commons": "Ingres Grande Odalisque", "wiki": {"en": "Grande Odalisque"}}, "answer": 1, "tr": {"q": "Ingres'in 'Büyük Odalık' (1814) tablosu Salon'da eleştirildiğinde, eleştirmenler en çok neye takıldı?", "opts": ["Renklerin çok koyu olmasına", "Kadının sırtının fazladan omurlarla aşırı uzun olmasına", "Fırça izlerinin görünmesine", "Konunun dinî olmasına"], "exp": "Eleştirmenler, figürün sırtının 'üç omur fazla' olacak kadar uzun olduğunu söyledi. Ingres, anatomiyi bilinçli olarak zarafet için çarpıttı.", "detail": ["Ingres, David'in öğrencisiydi ve Neoklasik çizgiye bağlıydı, ama bu eserde Maniyerizme yakın bir yapaylık vardır. Tablo Napolyon'un kız kardeşi Caroline Murat için yapıldı ve bugün Louvre'dadır."]}, "fr": {"q": "Quand La Grande Odalisque d'Ingres (1814) a été critiquée au Salon, qu'est-ce que les critiques ont surtout remarqué ?", "opts": ["Des couleurs trop sombres", "Un dos trop long, avec des vertèbres en trop", "Des coups de pinceau visibles", "Un sujet religieux"], "exp": "Les critiques ont dit que le dos était si long qu'il avait « trois vertèbres de trop ». Ingres a déformé l'anatomie volontairement, pour l'élégance.", "detail": ["Ingres est l'élève de David et défend la ligne néoclassique, mais ce tableau a une artificialité proche du maniérisme. Il a été commandé par Caroline Murat, sœur de Napoléon, et se trouve au Louvre."]}, "en": {"q": "When Ingres's Grande Odalisque (1814) was criticised at the Salon, what did critics notice most?", "opts": ["Colours that were too dark", "A back that was too long, with extra vertebrae", "Visible brushstrokes", "A religious subject"], "exp": "Critics said the back was so long that it had 'three vertebrae too many'. Ingres bent anatomy on purpose, for elegance.", "detail": ["Ingres was David's pupil and defended the Neoclassical line, but this painting has an artificial quality close to Mannerism. It was made for Caroline Murat, Napoleon's sister, and is in the Louvre."]}, "id": "x-02-3", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1800, "era": {"tr": "1800'ler", "fr": "Années 1800", "en": "1800s"}, "region": "europe", "medium": "painting", "tags": ["neoclassicism", "c19", "painting"], "topics": ["neoclassicism", "c19", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1784", "1793", "1806", "1814"], "tr": {"q": "Bu Neoklasik eserleri eskiden yeniye sırala.", "items": ["David – Horatiusların Yemini", "David – Marat'nın Ölümü", "Ingres – Tahtındaki Napolyon", "Ingres – Büyük Odalık"], "exp": "Horatiuslar 1784, Marat 1793, Tahtındaki Napolyon 1806, Büyük Odalık 1814 tarihlidir.", "detail": ["Sıra, Neoklasizmin Devrim öncesi ahlaki dramdan Devrim'in şehitlerine, sonra İmparatorluk propagandasına geçişini gösterir. Ingres zamanla daha kişisel ve egzotik konulara yöneldi."]}, "fr": {"q": "Classe ces œuvres néoclassiques de la plus ancienne à la plus récente.", "items": ["David – Le Serment des Horaces", "David – La Mort de Marat", "Ingres – Napoléon Ier sur le trône impérial", "Ingres – La Grande Odalisque"], "exp": "Les Horaces datent de 1784, Marat de 1793, Napoléon sur le trône de 1806 et La Grande Odalisque de 1814.", "detail": ["L'ordre montre le passage du drame moral d'avant la Révolution aux martyrs révolutionnaires, puis à la propagande impériale. Ingres se tourne ensuite vers des sujets plus personnels et exotiques."]}, "en": {"q": "Put these Neoclassical works in order, oldest first.", "items": ["David – Oath of the Horatii", "David – The Death of Marat", "Ingres – Napoleon on his Imperial Throne", "Ingres – Grande Odalisque"], "exp": "The Horatii date from 1784, Marat from 1793, Napoleon on his Throne from 1806 and the Grande Odalisque from 1814.", "detail": ["The order shows Neoclassicism moving from pre-Revolution moral drama to revolutionary martyrs, then to imperial propaganda. Ingres later turned to more personal and exotic subjects."]}, "id": "x-02-4", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1818, "era": {"tr": "1810'ler", "fr": "Années 1810", "en": "1810s"}, "region": "europe", "medium": "painting", "tags": ["romanticism", "c19", "painting"], "topics": ["romanticism", "c19", "painting"], "search": {"commons": "Caspar David Friedrich Wanderer above the Sea of Fog", "wiki": {"en": "Wanderer above the Sea of Fog"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Turner – Savaşçı Temeraire", "Constable – Saman Arabası", "Friedrich – Sis Denizi Üzerindeki Gezgin", "Géricault – Medusa'nın Salı"], "exp": "Caspar David Friedrich'in Sis Denizi Üzerindeki Gezgin'i (yaklaşık 1818), Romantizmin doğa karşısındaki bireyi gösteren simge imgesidir.", "detail": ["Figür izleyiciye sırtını döner (Rückenfigur); böylece biz de onun gözünden sonsuz manzaraya bakarız. Tablo Hamburg Kunsthalle'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Turner – Le Dernier Voyage du Téméraire", "Constable – La Charrette de foin", "Friedrich – Le Voyageur contemplant une mer de nuages", "Géricault – Le Radeau de La Méduse"], "exp": "Le Voyageur contemplant une mer de nuages de Caspar David Friedrich (vers 1818) est l'image romantique par excellence de l'individu face à la nature.", "detail": ["Le personnage nous tourne le dos (Rückenfigur) : nous regardons donc le paysage infini avec ses yeux. Le tableau est à la Kunsthalle de Hambourg."]}, "en": {"q": "Which work is this?", "opts": ["Turner – The Fighting Temeraire", "Constable – The Hay Wain", "Friedrich – Wanderer above the Sea of Fog", "Géricault – The Raft of the Medusa"], "exp": "Caspar David Friedrich's Wanderer above the Sea of Fog (around 1818) is the classic Romantic image of the individual facing nature.", "detail": ["The figure turns his back to us (a Rückenfigur), so we look at the endless landscape through his eyes. The painting is in the Hamburg Kunsthalle."]}, "id": "x-02-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1819, "era": {"tr": "1810'ler", "fr": "Années 1810", "en": "1810s"}, "region": "europe", "medium": "painting", "tags": ["romanticism", "c19", "painting"], "topics": ["romanticism", "c19", "painting"], "search": {"commons": "Géricault Raft of the Medusa", "wiki": {"en": "The Raft of the Medusa"}}, "answer": 3, "tr": {"q": "Géricault'nun 'Medusa'nın Salı' tablosu hangi olaydan esinlenmiştir?", "opts": ["Trafalgar Savaşı", "Lizbon depremi", "Napolyon'un Rusya seferi", "1816'da batan bir Fransız savaş gemisinin hayatta kalanları"], "exp": "Tablo, 1816'da Senegal açıklarında karaya oturan Fransız fırkateyni Méduse'den kurtulanların sal üzerindeki dramını anlatır.", "detail": ["Yüzlerce kişilik geminin salına binen yaklaşık 150 kişiden yalnızca birkaçı kurtuldu; skandal hükümeti de sarstı. Géricault hayatta kalanlarla görüştü ve morglarda çalıştı. Eser Louvre'dadır."]}, "fr": {"q": "De quel événement Géricault s'est-il inspiré pour Le Radeau de La Méduse ?", "opts": ["La bataille de Trafalgar", "Le tremblement de terre de Lisbonne", "La campagne de Russie de Napoléon", "Les survivants d'une frégate française naufragée en 1816"], "exp": "Le tableau raconte le drame des survivants de la frégate La Méduse, échouée en 1816 au large du Sénégal.", "detail": ["Sur environ 150 personnes montées sur le radeau, très peu ont survécu, et le scandale a touché le gouvernement. Géricault a rencontré des survivants et étudié des cadavres à la morgue. L'œuvre est au Louvre."]}, "en": {"q": "Which event inspired Géricault's The Raft of the Medusa?", "opts": ["The Battle of Trafalgar", "The Lisbon earthquake", "Napoleon's Russian campaign", "The survivors of a French frigate wrecked in 1816"], "exp": "The painting shows the drama of the survivors of the French frigate Méduse, which ran aground off Senegal in 1816.", "detail": ["Of about 150 people on the raft, very few survived, and the scandal shook the government. Géricault met survivors and studied bodies in morgues. The work is in the Louvre."]}, "id": "x-02-6", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1830, "era": {"tr": "1830'ler", "fr": "Années 1830", "en": "1830s"}, "region": "europe", "medium": "painting", "tags": ["romanticism", "c19", "painting"], "topics": ["romanticism", "c19", "painting"], "search": {"commons": "Delacroix Liberty Leading the People", "wiki": {"en": "Delacroix Liberty Leading the People"}}, "answer": false, "tr": {"q": "Delacroix'nın 'Halka Yol Gösteren Özgürlük' tablosu 1789 Fransız Devrimi'ni anlatır.", "exp": "Yanlış. Tablo, Kral X. Charles'ı deviren 1830 Temmuz Devrimi'ni anlatır.", "detail": ["Göğsü açık Marianne figürü bir elinde üç renkli bayrak, diğerinde tüfekle barikatın üstünden ilerler. Silindir şapkalı adamın Delacroix'nın kendisi olduğu sık söylenir, ama kesin değildir. Eser Louvre'dadır."]}, "fr": {"q": "« La Liberté guidant le peuple » de Delacroix représente la Révolution française de 1789.", "exp": "Faux. Le tableau représente la révolution de Juillet 1830, qui renverse le roi Charles X.", "detail": ["Marianne, la poitrine nue, avance sur la barricade avec un drapeau tricolore et un fusil. On dit souvent que l'homme au chapeau haut-de-forme est Delacroix lui-même, mais ce n'est pas certain. L'œuvre est au Louvre."]}, "en": {"q": "Delacroix's 'Liberty Leading the People' shows the French Revolution of 1789.", "exp": "False. The painting shows the July Revolution of 1830, which overthrew King Charles X.", "detail": ["Bare-breasted Marianne moves over the barricade with a tricolour flag and a rifle. People often say the man in the top hat is Delacroix himself, but this is not certain. The work is in the Louvre."]}, "id": "x-02-7", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1839, "era": {"tr": "1830'ler", "fr": "Années 1830", "en": "1830s"}, "region": "europe", "medium": "painting", "tags": ["romanticism", "c19", "painting"], "topics": ["romanticism", "c19", "painting"], "search": {"commons": "Turner The Fighting Temeraire", "wiki": {"en": "Turner The Fighting Temeraire"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Londra'da bir berberin oğlu olarak doğdum ve çok genç yaşta Kraliyet Akademisi'ne girdim.", "Fırtınaları, sisleri ve buharlı trenleri neredeyse soyut ışık patlamaları olarak resmettim.", "Eserlerimin çoğunu ulusa bıraktım; adımı taşıyan bir ödül bugün çağdaş sanatçılara verilir."], "opts": ["J. M. W. Turner", "John Constable", "William Blake", "Thomas Gainsborough"], "exp": "Cevap J. M. W. Turner'dır. Işık ve atmosfer konusundaki deneyleri Empresyonizmin habercisi sayılır.", "detail": ["'Savaşçı Temeraire' ve 'Yağmur, Buhar ve Hız' en ünlü eserlerindendir. Turner Ödülü 1984'ten beri Tate tarafından veriliyor ve İngiltere'nin en önemli çağdaş sanat ödülüdür."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Londres, fils d'un barbier, et je suis entré très jeune à la Royal Academy.", "J'ai peint les tempêtes, les brumes et les trains à vapeur comme des explosions de lumière presque abstraites.", "J'ai laissé la plupart de mes œuvres à la nation ; un prix d'art contemporain porte mon nom."], "opts": ["J. M. W. Turner", "John Constable", "William Blake", "Thomas Gainsborough"], "exp": "La réponse est J. M. W. Turner. Ses recherches sur la lumière et l'atmosphère annoncent l'impressionnisme.", "detail": ["« Le Dernier Voyage du Téméraire » et « Pluie, vapeur et vitesse » sont parmi ses œuvres les plus célèbres. Le prix Turner est décerné par la Tate depuis 1984."]}, "en": {"q": "Who am I?", "clues": ["I was born in London, the son of a barber, and entered the Royal Academy very young.", "I painted storms, mists and steam trains as almost abstract bursts of light.", "I left most of my works to the nation; a contemporary art prize carries my name."], "opts": ["J. M. W. Turner", "John Constable", "William Blake", "Thomas Gainsborough"], "exp": "The answer is J. M. W. Turner. His experiments with light and atmosphere point towards Impressionism.", "detail": ["'The Fighting Temeraire' and 'Rain, Steam and Speed' are among his best-known works. The Turner Prize has been awarded by Tate since 1984."]}, "id": "x-02-8", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1814, "era": {"tr": "1810'ler", "fr": "Années 1810", "en": "1810s"}, "region": "europe", "medium": "painting", "tags": ["romanticism", "c19", "painting"], "topics": ["romanticism", "c19", "painting"], "search": {"commons": "Goya The Third of May 1808", "wiki": {"en": "The Third of May 1808"}}, "answer": 1, "tr": {"q": "Goya'nın '3 Mayıs 1808' tablosu hangi olayı gösterir?", "opts": ["Fransız Devrimi'nde Bastille'in alınmasını", "Napolyon askerlerinin Madrid'de İspanyol sivilleri kurşuna dizmesini", "İspanyol Engizisyonu'nun bir ayinini", "Trafalgar Savaşı'ndan sonra bir idamı"], "exp": "Tablo, Madrid'deki 2 Mayıs ayaklanmasının ardından Fransız askerlerinin sivilleri idam etmesini gösterir. Goya onu 1814'te yaptı.", "detail": ["Beyaz gömlekli adam kollarını açarak İsa'yı andırır; askerler ise yüzsüz bir makine gibi sıralanır. Savaşın modern ve dinî olmayan bir şiddet olarak gösterildiği ilk büyük eserlerden biridir. Prado'dadır."]}, "fr": {"q": "Que montre le tableau de Goya « Tres de mayo » (Le 3 mai 1808) ?", "opts": ["La prise de la Bastille", "L'exécution de civils espagnols par des soldats de Napoléon à Madrid", "Une cérémonie de l'Inquisition espagnole", "Une exécution après la bataille de Trafalgar"], "exp": "Le tableau montre l'exécution de civils par des soldats français après le soulèvement du 2 mai à Madrid. Goya l'a peint en 1814.", "detail": ["L'homme en chemise blanche ouvre les bras comme le Christ ; les soldats, sans visage, forment une machine. C'est l'une des premières grandes images d'une violence de guerre moderne. Le tableau est au Prado."]}, "en": {"q": "What does Goya's 'The Third of May 1808' show?", "opts": ["The storming of the Bastille", "Napoleon's soldiers shooting Spanish civilians in Madrid", "A ceremony of the Spanish Inquisition", "An execution after the Battle of Trafalgar"], "exp": "The painting shows French soldiers executing civilians after the uprising of 2 May in Madrid. Goya painted it in 1814.", "detail": ["The man in the white shirt opens his arms like Christ; the faceless soldiers form a machine. It is one of the first great images of modern war violence. It is in the Prado."]}, "id": "x-02-9", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1857, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "painting", "tags": ["realism", "c19", "painting"], "topics": ["realism", "c19", "painting"], "search": {"commons": "Millet The Gleaners", "wiki": {"en": "The Gleaners"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Courbet – Taş Kırıcılar", "Daumier – Üçüncü Mevki Vagon", "Rosa Bonheur – Nivernais'de Çift Sürme", "Millet – Başak Toplayanlar"], "exp": "Jean-François Millet'nin Başak Toplayanlar'ı (1857), hasattan sonra tarlada kalan başakları toplayan üç yoksul köylü kadını gösterir.", "detail": ["Sıradan emekçileri anıtsal figürler olarak göstermesi bazı burjuva eleştirmenleri rahatsız etti; tabloyu tehlikeli ve siyasi buldular. Eser Paris'teki Musée d'Orsay'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Courbet – Les Casseurs de pierres", "Daumier – Le Wagon de troisième classe", "Rosa Bonheur – Labourage nivernais", "Millet – Des glaneuses"], "exp": "Des glaneuses de Jean-François Millet (1857) montre trois paysannes pauvres qui ramassent les épis restés dans le champ après la moisson.", "detail": ["Montrer de simples travailleuses comme des figures monumentales a gêné certains critiques bourgeois, qui ont trouvé le tableau dangereux et politique. Il est au musée d'Orsay."]}, "en": {"q": "Which work is this?", "opts": ["Courbet – The Stone Breakers", "Daumier – The Third-Class Carriage", "Rosa Bonheur – Ploughing in the Nivernais", "Millet – The Gleaners"], "exp": "Jean-François Millet's The Gleaners (1857) shows three poor peasant women picking up the grain left in the field after the harvest.", "detail": ["Showing simple workers as monumental figures upset some middle-class critics, who found the painting dangerous and political. It is in the Musée d'Orsay."]}, "id": "x-02-10", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1855, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "painting", "tags": ["realism", "c19", "painting"], "topics": ["realism", "c19", "painting"], "search": {"commons": "Courbet The Painter's Studio", "wiki": {"en": "The Painter's Studio"}}, "answer": 0, "tr": {"q": "Courbet, 1855 Paris Dünya Fuarı'nda eserleri reddedilince ne yaptı?", "opts": ["Fuarın yanında kendi 'Gerçekçilik Pavyonu'nu açtı", "Paris'i terk edip Londra'ya yerleşti", "Resmi bırakıp heykele geçti", "Eserlerini Salon des Refusés'de gösterdi"], "exp": "Courbet, fuarın yakınında kendi pahalı pavyonunu kurdu ve 'Le Réalisme' adıyla kişisel bir sergi açtı.", "detail": ["Sergide 'Ressamın Atölyesi' ve 'Ornans'ta Cenaze' gibi büyük eserler vardı. Bu, bir sanatçının resmî kurumlara karşı kendi sergisini düzenlemesinin erken bir örneğidir. Salon des Refusés ise 1863'te açıldı."]}, "fr": {"q": "Quand ses œuvres ont été refusées à l'Exposition universelle de Paris en 1855, qu'a fait Courbet ?", "opts": ["Il a ouvert son propre « Pavillon du Réalisme » près de l'exposition", "Il a quitté Paris pour Londres", "Il a abandonné la peinture pour la sculpture", "Il a exposé au Salon des refusés"], "exp": "Courbet a construit à ses frais un pavillon près de l'exposition et y a présenté une exposition personnelle intitulée « Le Réalisme ».", "detail": ["On y voyait de grandes œuvres comme « L'Atelier du peintre » et « Un enterrement à Ornans ». C'est un exemple précoce d'artiste qui s'expose seul contre les institutions. Le Salon des refusés n'a ouvert qu'en 1863."]}, "en": {"q": "When his works were refused at the 1855 Paris World's Fair, what did Courbet do?", "opts": ["He opened his own 'Pavilion of Realism' next to the fair", "He left Paris for London", "He gave up painting for sculpture", "He showed them at the Salon des Refusés"], "exp": "Courbet built his own pavilion near the fair at his own cost and held a solo show called 'Le Réalisme'.", "detail": ["It included large works such as 'The Painter's Studio' and 'A Burial at Ornans'. It is an early example of an artist showing alone against the institutions. The Salon des Refusés only opened in 1863."]}, "id": "x-02-11", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1853, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "painting", "tags": ["realism", "c19", "painting", "women"], "topics": ["realism", "c19", "painting", "women"], "search": {"commons": "Rosa Bonheur The Horse Fair", "wiki": {"en": "Rosa Bonheur The Horse Fair"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Hayvanları resmetmekte uzmanlaştım ve mezbahalarda, at pazarlarında çizim yaptım.", "Erkek kıyafeti giyebilmek için polisten özel izin aldım.", "'At Panayırı' adlı büyük tablom bugün New York'taki Metropolitan Müzesi'ndedir."], "opts": ["Berthe Morisot", "Mary Cassatt", "Rosa Bonheur", "Élisabeth Vigée Le Brun"], "exp": "Cevap Rosa Bonheur'dür. 19. yüzyılın en ünlü kadın ressamlarındandı ve Légion d'honneur alan ilk kadın sanatçılardan biri oldu.", "detail": ["Bonheur'ün gerçekçi hayvan resimleri Avrupa ve Amerika'da çok sevildi. Fontainebleau yakınındaki By şatosunda yaşadı; atölyesi bugün müze olarak gezilebilir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je me suis spécialisée dans les animaux et j'ai dessiné dans les abattoirs et les foires aux chevaux.", "J'ai obtenu de la police une permission spéciale pour porter des vêtements d'homme.", "Mon grand tableau « Le Marché aux chevaux » est au Metropolitan Museum de New York."], "opts": ["Berthe Morisot", "Mary Cassatt", "Rosa Bonheur", "Élisabeth Vigée Le Brun"], "exp": "La réponse est Rosa Bonheur. Elle a été l'une des peintres les plus célèbres du XIXe siècle et l'une des premières artistes femmes décorées de la Légion d'honneur.", "detail": ["Ses animaux réalistes ont eu un grand succès en Europe et en Amérique. Elle a vécu au château de By, près de Fontainebleau ; son atelier se visite aujourd'hui."]}, "en": {"q": "Who am I?", "clues": ["I specialised in painting animals and drew in slaughterhouses and horse markets.", "I got special permission from the police to wear men's clothes.", "My large painting 'The Horse Fair' is now in the Metropolitan Museum in New York."], "opts": ["Berthe Morisot", "Mary Cassatt", "Rosa Bonheur", "Élisabeth Vigée Le Brun"], "exp": "The answer is Rosa Bonheur. She was one of the most famous painters of the 19th century and one of the first women artists to receive the Legion of Honour.", "detail": ["Her realistic animals were very popular in Europe and America. She lived at the Château de By near Fontainebleau; her studio can be visited today."]}, "id": "x-02-12", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1866, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "painting", "tags": ["realism", "c19", "painting"], "topics": ["realism", "c19", "painting"], "search": {"commons": "Courbet L'Origine du monde", "wiki": {"en": "Courbet L'Origine du monde"}}, "answer": true, "tr": {"q": "Courbet'nin 1866 tarihli 'Dünyanın Kökeni' tablosu bir dönem psikanalist Jacques Lacan'a aitti.", "exp": "Doğru. Lacan tabloyu 1955'te satın aldı; 1995'te Musée d'Orsay'a girdi.", "detail": ["Eser, bir Osmanlı diplomatı olan Halil Şerif Paşa için yapılmıştı. Uzun yıllar özel koleksiyonlarda saklandı, çünkü dönemi için çok cesur bir çıplak tasviriydi."]}, "fr": {"q": "« L'Origine du monde » de Courbet (1866) a appartenu un temps au psychanalyste Jacques Lacan.", "exp": "Vrai. Lacan l'a acheté en 1955 ; le tableau est entré au musée d'Orsay en 1995.", "detail": ["L'œuvre avait été commandée par Khalil-Bey, un diplomate ottoman. Elle est restée cachée longtemps dans des collections privées, car c'était un nu très audacieux pour l'époque."]}, "en": {"q": "Courbet's 1866 painting 'The Origin of the World' once belonged to the psychoanalyst Jacques Lacan.", "exp": "True. Lacan bought it in 1955; it entered the Musée d'Orsay in 1995.", "detail": ["The work was made for Khalil Bey, an Ottoman diplomat. It stayed hidden for a long time in private collections, because it was a very bold nude for its time."]}, "id": "x-02-13", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1855, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "painting", "tags": ["realism", "c19", "painting"], "topics": ["realism", "c19", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Gerçekçi ressamları eserleriyle eşleştir.", "left": ["Gustave Courbet", "Honoré Daumier", "Jean-François Millet", "Ilya Repin"], "right": ["Ornans'ta Cenaze", "Üçüncü Mevki Vagon", "Akşam Duası (Angelus)", "Volga'da Mavnacılar"], "exp": "Dört ressam da sıradan insanların hayatını büyük sanatın konusu yaptı.", "detail": ["Courbet ve Millet Fransız köylüsünü, Daumier kent yoksullarını ve burjuvaziyi, Repin ise Rus emekçilerini resmetti. Daumier aynı zamanda keskin bir karikatüristti."]}, "fr": {"q": "Associe chaque peintre réaliste à son œuvre.", "left": ["Gustave Courbet", "Honoré Daumier", "Jean-François Millet", "Ilya Répine"], "right": ["Un enterrement à Ornans", "Le Wagon de troisième classe", "L'Angélus", "Les Haleurs de la Volga"], "exp": "Ces quatre peintres ont fait de la vie des gens ordinaires un sujet de grand art.", "detail": ["Courbet et Millet peignent les paysans français, Daumier les pauvres des villes et la bourgeoisie, Répine les travailleurs russes. Daumier était aussi un caricaturiste mordant."]}, "en": {"q": "Match each Realist painter with his work.", "left": ["Gustave Courbet", "Honoré Daumier", "Jean-François Millet", "Ilya Repin"], "right": ["A Burial at Ornans", "The Third-Class Carriage", "The Angelus", "Barge Haulers on the Volga"], "exp": "All four painters made the lives of ordinary people a subject for great art.", "de
