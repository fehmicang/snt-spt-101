 traces sur la toile avec du feu"], "exp": "En 1960 à Paris, Klein dirige des modèles couvertes de bleu IKB qui pressent leur corps sur la toile, pendant qu'un orchestre joue sa « Symphonie Monoton-Silence ».", "detail": ["Klein parle de « pinceaux vivants » et ne touche pas lui-même la peinture. Cette performance est encore discutée, car elle utilise le corps des femmes comme un outil. Sa couleur brevetée est l'« International Klein Blue » (IKB)."]}, "en": {"q": "What happens in Yves Klein's 'Anthropometries' series?", "opts": ["The artist paints his own body and lies on the canvas", "Viewers leave footprints on the canvas", "Female models covered in blue paint press their bodies onto the canvas", "Marks are burned onto the canvas with fire"], "exp": "In Paris in 1960, Klein directed models covered in IKB blue as they pressed their bodies onto canvas, while an orchestra played his one-note 'Monotone-Silence Symphony'.", "detail": ["Klein called them 'living brushes' and did not touch the paint himself. The performance is still debated for using women's bodies as tools. His patented colour is known as 'International Klein Blue' (IKB)."]}, "id": "x-08-5", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1961, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "sculpture", "tags": ["nouveaurealisme", "postwar", "sculpture", "women"], "topics": ["nouveaurealisme", "postwar", "sculpture", "women"], "search": {"commons": "Niki de Saint Phalle Nanas", "wiki": {"en": "Niki de Saint Phalle Nanas"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["1961'de boya torbaları gizlenmiş beyaz kabartmalara tüfekle ateş ettiğim 'Atış Resimleri'mle tanındım.", "Yeni Gerçekçiler grubunun tek kadın üyesiydim.", "Sonra 'Nana' adını verdiğim renkli, iri kadın figürleri yaptım ve İtalya'da Tarot Bahçesi'ni kurdum."], "opts": ["Yayoi Kusama", "Louise Bourgeois", "Marisol", "Niki de Saint Phalle"], "exp": "Cevap Niki de Saint Phalle'dir. 'Atış Resimleri' hem performans hem resim olarak öfke ve özgürleşmeyi ifade eder.", "detail": ["Eşi Jean Tinguely ile Paris'teki Stravinsky Çeşmesi'ni (1983) yaptı. Toskana'daki Tarot Bahçesi, dev mozaik heykellerden oluşan bir parktır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["En 1961, je suis devenue célèbre avec mes « Tirs » : je tirais à la carabine sur des reliefs blancs qui cachaient des poches de peinture.", "J'étais la seule femme du groupe des Nouveaux Réalistes.", "Ensuite, j'ai créé des femmes rondes et colorées, les « Nanas », et le Jardin des Tarots en Italie."], "opts": ["Yayoi Kusama", "Louise Bourgeois", "Marisol", "Niki de Saint Phalle"], "exp": "La réponse est Niki de Saint Phalle. Les « Tirs », entre performance et peinture, expriment la colère et la libération.", "detail": ["Avec son mari Jean Tinguely, elle a créé la fontaine Stravinsky à Paris (1983). Le Jardin des Tarots, en Toscane, est un parc de sculptures géantes en mosaïque."]}, "en": {"q": "Who am I?", "clues": ["In 1961 I became known for my 'Shooting Paintings': I fired a rifle at white reliefs hiding bags of paint.", "I was the only woman in the Nouveaux Réalistes group.", "Later I made colourful, rounded women called 'Nanas' and created the Tarot Garden in Italy."], "opts": ["Yayoi Kusama", "Louise Bourgeois", "Marisol", "Niki de Saint Phalle"], "exp": "The answer is Niki de Saint Phalle. The 'Shooting Paintings', between performance and painting, express anger and liberation.", "detail": ["With her husband Jean Tinguely she made the Stravinsky Fountain in Paris (1983). The Tarot Garden in Tuscany is a park of giant mosaic sculptures."]}, "id": "x-08-6", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1960, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "sculpture", "tags": ["nouveaurealisme", "postwar", "sculpture"], "topics": ["nouveaurealisme", "postwar", "sculpture"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Yeni Gerçekçi sanatçıları teknikleriyle eşleştir.", "left": ["Arman", "César", "Jean Tinguely", "Christo"], "right": ["Biriktirmeler ve 'Dolu' sergisi", "Sıkıştırılmış otomobiller", "Kendini yok eden makineler", "Nesneleri ve binaları sarmalamak"], "exp": "Yeni Gerçekçiler (1960, Pierre Restany) günlük nesneleri ve tüketim toplumunun atıklarını doğrudan kullandı.", "detail": ["Arman 1960'ta Iris Clert galerisini çöple doldurdu ('Le Plein'). César hurda otomobilleri preste sıkıştırdı. Tinguely'nin 'New York'a Saygı' (1960) makinesi MoMA'nın bahçesinde kendini yok etti."]}, "fr": {"q": "Associe chaque Nouveau Réaliste à sa technique.", "left": ["Arman", "César", "Jean Tinguely", "Christo"], "right": ["Accumulations et exposition « Le Plein »", "Compressions de voitures", "Machines autodestructrices", "Empaquetage d'objets et de bâtiments"], "exp": "Les Nouveaux Réalistes (1960, Pierre Restany) utilisent directement les objets quotidiens et les déchets de la société de consommation.", "detail": ["En 1960, Arman remplit la galerie Iris Clert de déchets (« Le Plein »). César compresse des voitures à la presse. La machine « Hommage à New York » de Tinguely (1960) s'autodétruit dans le jardin du MoMA."]}, "en": {"q": "Match each Nouveau Réaliste with his technique.", "left": ["Arman", "César", "Jean Tinguely", "Christo"], "right": ["Accumulations and the 'Le Plein' show", "Compressed cars", "Self-destroying machines", "Wrapping objects and buildings"], "exp": "The Nouveaux Réalistes (1960, Pierre Restany) used everyday objects and the waste of consumer society directly.", "detail": ["In 1960 Arman filled the Iris Clert gallery with rubbish ('Le Plein'). César crushed scrap cars in a press. Tinguely's machine 'Homage to New York' (1960) destroyed itself in MoMA's garden."]}, "id": "x-08-7", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1962, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "print", "tags": ["popart", "postwar", "design", "r-namerica"], "topics": ["popart", "postwar", "design", "r-namerica"], "search": {"commons": "Andy Warhol Campbell's Soup Cans", "wiki": {"en": "Campbell's Soup Cans"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Warhol – Campbell's Çorba Kutuları", "Lichtenstein – Whaam!", "Oldenburg – Yumuşak Tuvalet", "Johns – Bayrak"], "exp": "Andy Warhol'un 32 tuvalden oluşan Campbell's Çorba Kutuları (1962), Pop Art'ın en bilinen eserlerinden biridir.", "detail": ["Warhol, süpermarket ürünlerini ve ünlüleri tekrar eden, seri üretim gibi görünen imgelerle gösterdi. Eser ilk kez Los Angeles'taki Ferus Galerisi'nde sergilendi; bugün MoMA'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Warhol – Campbell's Soup Cans", "Lichtenstein – Whaam!", "Oldenburg – Soft Toilet", "Johns – Flag"], "exp": "Les Campbell's Soup Cans d'Andy Warhol (1962), 32 toiles, sont parmi les œuvres les plus connues du pop art.", "detail": ["Warhol montre les produits du supermarché et les célébrités avec des images répétées, comme une production en série. L'œuvre a été montrée d'abord à la Ferus Gallery de Los Angeles ; elle est au MoMA."]}, "en": {"q": "Which work is this?", "opts": ["Warhol – Campbell's Soup Cans", "Lichtenstein – Whaam!", "Oldenburg – Soft Toilet", "Johns – Flag"], "exp": "Andy Warhol's Campbell's Soup Cans (1962), 32 canvases, is one of the best-known works of Pop Art.", "detail": ["Warhol showed supermarket products and celebrities through repeated images that look mass-produced. The work was first shown at the Ferus Gallery in Los Angeles; it is now in MoMA."]}, "id": "x-08-8", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1956, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "europe", "medium": "design", "tags": ["popart", "postwar", "design"], "topics": ["popart", "postwar", "design"], "search": {"commons": "Richard Hamilton Just what is it", "wiki": {"en": "Richard Hamilton Just what is it"}}, "answer": 1, "tr": {"q": "İngiliz Pop Art'ının ilk eserlerinden sayılan 'Bugünün evlerini bu kadar farklı, bu kadar çekici yapan nedir?' kolajını kim yaptı?", "opts": ["David Hockney", "Richard Hamilton", "Peter Blake", "Eduardo Paolozzi"], "exp": "Richard Hamilton bu kolajı 1956'da Londra'daki 'This Is Tomorrow' sergisi için yaptı.", "detail": ["Kolajda vücut geliştirici bir adam, 'POP' yazılı dev bir lolipop tutar; etrafında televizyon, teyp ve reklam görüntüleri vardır. Hamilton ve Paolozzi, Londra'daki Independent Group'un üyeleriydi."]}, "fr": {"q": "Qui a réalisé le collage « Just what is it that makes today's homes so different, so appealing? », vu comme l'une des premières œuvres du pop art britannique ?", "opts": ["David Hockney", "Richard Hamilton", "Peter Blake", "Eduardo Paolozzi"], "exp": "Richard Hamilton réalise ce collage en 1956 pour l'exposition « This Is Tomorrow » à Londres.", "detail": ["Un culturiste tient une énorme sucette marquée « POP », entouré de télévision, magnétophone et images publicitaires. Hamilton et Paolozzi faisaient partie de l'Independent Group à Londres."]}, "en": {"q": "Who made the collage 'Just what is it that makes today's homes so different, so appealing?', seen as one of the first works of British Pop Art?", "opts": ["David Hockney", "Richard Hamilton", "Peter Blake", "Eduardo Paolozzi"], "exp": "Richard Hamilton made the collage in 1956 for the 'This Is Tomorrow' exhibition in London.", "detail": ["A bodybuilder holds a giant lollipop marked 'POP', surrounded by a TV, a tape recorder and advertising images. Hamilton and Paolozzi belonged to London's Independent Group."]}, "id": "x-08-9", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1963, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "painting", "tags": ["popart", "postwar", "painting", "r-namerica"], "topics": ["popart", "postwar", "painting", "r-namerica"], "search": {"commons": "Roy Lichtenstein Whaam!", "wiki": {"en": "Roy Lichtenstein Whaam!"}}, "answer": true, "tr": {"q": "Roy Lichtenstein'ın 'Whaam!' tablosu bir savaş çizgi romanındaki kareden uyarlanmıştır.", "exp": "Doğru. 1963 tarihli dev diptik, DC Comics'in 'All-American Men of War' dergisindeki bir kareden uyarlandı.", "detail": ["Lichtenstein, baskıdaki Ben-Day noktalarını büyüterek ticari imgenin mekanik görünümünü taklit etti. Tablo Londra'daki Tate Modern'dedir. Bugün orijinal çizerlere yeterince itibar edilmediği de tartışılır."]}, "fr": {"q": "Le tableau « Whaam! » de Roy Lichtenstein s'inspire d'une case d'une bande dessinée de guerre.", "exp": "Vrai. Ce grand diptyque de 1963 reprend une case de la revue « All-American Men of War » de DC Comics.", "detail": ["Lichtenstein agrandit les points Ben-Day de l'impression pour imiter l'aspect mécanique de l'image commerciale. Le tableau est à la Tate Modern. On discute aujourd'hui du peu de crédit donné aux dessinateurs d'origine."]}, "en": {"q": "Roy Lichtenstein's 'Whaam!' is adapted from a panel in a war comic.", "exp": "True. The large 1963 diptych is adapted from a panel in DC Comics' 'All-American Men of War'.", "detail": ["Lichtenstein enlarged the Ben-Day dots of printing to imitate the mechanical look of commercial images. The painting is in Tate Modern. Today people also discuss the lack of credit given to the original comic artists."]}, "id": "x-08-10", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1962, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "painting", "tags": ["popart", "postwar", "painting", "r-namerica"], "topics": ["popart", "postwar", "painting", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1954", "1956", "1962", "1963"], "tr": {"q": "Bu Pop Art ile ilgili eserleri eskiden yeniye sırala.", "items": ["Jasper Johns – Bayrak", "Richard Hamilton – 'Bugünün evlerini...' kolajı", "Warhol – Marilyn Diptiği", "Lichtenstein – Whaam!"], "exp": "Johns'un Bayrak'ı 1954–55, Hamilton'ın kolajı 1956, Marilyn Diptiği 1962, Whaam! 1963 tarihlidir.", "detail": ["Johns'un tanıdık simgeleri resmetmesi Pop Art'a giden yolu açtı. Warhol, Marilyn Monroe'nun ölümünden birkaç ay sonra Marilyn Diptiği'ni yaptı; eser Tate'tedir."]}, "fr": {"q": "Classe ces œuvres liées au pop art de la plus ancienne à la plus récente.", "items": ["Jasper Johns – Flag", "Richard Hamilton – le collage « Just what is it... »", "Warhol – Marilyn Diptych", "Lichtenstein – Whaam!"], "exp": "Flag de Johns date de 1954–1955, le collage de Hamilton de 1956, le Marilyn Diptych de 1962 et Whaam! de 1963.", "detail": ["En peignant des symboles familiers, Johns ouvre la voie au pop art. Warhol réalise le Marilyn Diptych quelques mois après la mort de Marilyn Monroe ; l'œuvre est à la Tate."]}, "en": {"q": "Put these Pop-related works in order, oldest first.", "items": ["Jasper Johns – Flag", "Richard Hamilton – 'Just what is it...' collage", "Warhol – Marilyn Diptych", "Lichtenstein – Whaam!"], "exp": "Johns's Flag dates from 1954–55, Hamilton's collage from 1956, the Marilyn Diptych from 1962 and Whaam! from 1963.", "detail": ["By painting familiar symbols, Johns opened the way to Pop Art. Warhol made the Marilyn Diptych a few months after Marilyn Monroe's death; it is in Tate."]}, "id": "x-08-11", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1964, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "painting", "tags": ["opart", "postwar", "painting", "women"], "topics": ["opart", "postwar", "painting", "women"], "search": {"commons": "Bridget Riley Current 1964", "wiki": {"en": "Bridget Riley Current 1964"}}, "answer": 2, "tr": {"q": "Bu tarz, siyah beyaz dalgalı çizgilerle gözde hareket yanılsaması yaratan hangi akıma aittir?", "opts": ["Minimalizm", "Renk Alanı Resmi", "Op Art", "Konstrüktivizm"], "exp": "Bu, göz yanılsamalarına dayanan Op Art'tır. Örnekteki tarz Bridget Riley'nin 1960'lardaki siyah beyaz eserlerini andırır.", "detail": ["Op Art adı 1965'te MoMA'daki 'The Responsive Eye' sergisiyle yaygınlaştı. Victor Vasarely akımın öncüsü, Bridget Riley ise en tanınan isimlerinden biridir. Moda ve reklam bu üslubu hızla benimsedi."]}, "fr": {"q": "À quel mouvement appartient ce style, qui crée une illusion de mouvement avec des lignes ondulées noires et blanches ?", "opts": ["Le minimalisme", "Le Color Field", "L'Op Art", "Le constructivisme"], "exp": "C'est l'Op Art, fondé sur les illusions d'optique. Ce style rappelle les œuvres en noir et blanc de Bridget Riley dans les années 1960.", "detail": ["Le nom Op Art se répand en 1965 avec l'exposition « The Responsive Eye » au MoMA. Victor Vasarely en est le pionnier, et Bridget Riley l'une des figures les plus connues. La mode et la publicité adoptent vite ce style."]}, "en": {"q": "Which movement does this style belong to, creating an illusion of movement with wavy black and white lines?", "opts": ["Minimalism", "Color Field painting", "Op Art", "Constructivism"], "exp": "This is Op Art, based on optical illusions. The style recalls Bridget Riley's black and white works of the 1960s.", "detail": ["The name Op Art spread in 1965 with MoMA's 'The Responsive Eye' exhibition. Victor Vasarely was its pioneer and Bridget Riley one of its best-known figures. Fashion and advertising quickly adopted the style."]}, "id": "x-08-12", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1965, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "painting", "tags": ["opart", "postwar", "painting"], "topics": ["opart", "postwar", "painting"], "search": {"commons": "Victor Vasarely Vega", "wiki": {"en": "Victor Vasarely Vega"}}, "answer": 0, "tr": {"q": "Op Art'ın 'babası' olarak anılan, Macaristan doğumlu ve Fransa'da çalışan sanatçı kimdir?", "opts": ["Victor Vasarely", "László Moholy-Nagy", "Jesús Rafael Soto", "Carlos Cruz-Diez"], "exp": "Victor Vasarely, Budapeşte'deki 'Mühely' okulunda Bauhaus fikirleriyle tanıştı ve 1930'da Paris'e yerleşti. Geometrik göz yanılsamalarıyla Op Art'ın öncüsü oldu.", "detail": ["Vasarely 'plastik birim' denen modüler bir sistem geliştirdi ve sanatın seri üretilebilir olmasını savundu. Aix-en-Provence'taki Vasarely Vakfı binası onun fikirlerini mimariye taşır."]}, "fr": {"q": "Quel artiste né en Hongrie et actif en France est appelé le « père » de l'Op Art ?", "opts": ["Victor Vasarely", "László Moholy-Nagy", "Jesús Rafael Soto", "Carlos Cruz-Diez"], "exp": "Victor Vasarely découvre les idées du Bauhaus à l'école Mühely de Budapest et s'installe à Paris en 1930. Ses illusions géométriques font de lui le pionnier de l'Op Art.", "detail": ["Vasarely invente un système modulaire, l'« unité plastique », et défend un art qui peut être produit en série. Le bâtiment de la Fondation Vasarely à Aix-en-Provence met ses idées en architecture."]}, "en": {"q": "Which Hungarian-born artist working in France is called the 'father' of Op Art?", "opts": ["Victor Vasarely", "László Moholy-Nagy", "Jesús Rafael Soto", "Carlos Cruz-Diez"], "exp": "Victor Vasarely met Bauhaus ideas at the Mühely school in Budapest and settled in Paris in 1930. His geometric illusions made him the pioneer of Op Art.", "detail": ["Vasarely developed a modular system called the 'plastic unit' and argued that art could be mass-produced. The Fondation Vasarely building in Aix-en-Provence turns his ideas into architecture."]}, "id": "x-08-13", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1964, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "sculpture", "tags": ["minimalism", "postwar", "sculpture", "r-namerica"], "topics": ["minimalism", "postwar", "sculpture", "r-namerica"], "search": {"commons": "Donald Judd untitled stacks", "wiki": {"en": "Donald Judd untitled stacks"}}, "answer": 3, "tr": {"q": "Donald Judd, eserlerini 'heykel' yerine hangi terimle tanımlamayı tercih etti?", "opts": ["Hazır-yapıt", "Asamblaj", "Kinetik nesne", "Özgül nesneler (Specific Objects)"], "exp": "Judd, 1965 tarihli 'Specific Objects' makalesinde ne resim ne de geleneksel heykel olan yeni bir üç boyutlu sanattan söz etti.", "detail": ["Judd'un eserleri genellikle fabrikada üretilen, tekrarlanan metal ve pleksiglas kutulardır. Teksas'taki Marfa'da Chinati Vakfı'nı kurdu; eserler orada kalıcı olarak sergilenir."]}, "fr": {"q": "Quel terme Donald Judd préférait-il à « sculpture » pour décrire ses œuvres ?", "opts": ["Ready-made", "Assemblage", "Objet cinétique", "Objets spécifiques (Specific Objects)"], "exp": "Dans son article « Specific Objects » (1965), Judd parle d'un nouvel art en trois dimensions qui n'est ni peinture ni sculpture traditionnelle.", "detail": ["Ses œuvres sont souvent des boîtes en métal et en plexiglas, répétées et fabriquées en usine. Il a fondé la Chinati Foundation à Marfa, au Texas, où ses œuvres sont exposées en permanence."]}, "en": {"q": "What term did Donald Judd prefer to 'sculpture' to describe his works?", "opts": ["Readymade", "Assemblage", "Kinetic object", "Specific Objects"], "exp": "In his 1965 essay 'Specific Objects', Judd described a new three-dimensional art that was neither painting nor traditional sculpture.", "detail": ["His works are often factory-made, repeated metal and Plexiglas boxes. He founded the Chinati Foundation in Marfa, Texas, where his works are permanently shown."]}, "id": "x-08-14", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1963, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "sculpture", "tags": ["minimalism", "postwar", "sculpture", "r-namerica"], "topics": ["minimalism", "postwar", "sculpture", "r-namerica"], "search": {"commons": "Dan Flavin fluorescent light", "wiki": {"en": "Dan Flavin fluorescent light"}}, "answer": false, "tr": {"q": "Dan Flavin, eserlerinde kendi tasarladığı özel ampuller kullandı.", "exp": "Yanlış. Flavin, piyasada satılan standart floresan tüpleri kullandı; bu, Minimalizmin hazır, endüstriyel malzeme anlayışının bir parçasıydı.", "detail": ["Flavin'in ilk floresan eseri 'Kişisel Esrime Diyagonali (25 Mayıs 1963)' idi. Işığın renkleri duvarlara ve köşelere yayılarak mekânın kendisini değiştirir."]}, "fr": {"q": "Dan Flavin utilisait dans ses œuvres des ampoules spéciales qu'il dessinait lui-même.", "exp": "Faux. Flavin utilisait des tubes fluorescents standard du commerce ; c'était lié à l'idée minimaliste de matériaux industriels déjà faits.", "detail": ["Sa première œuvre fluorescente est « La diagonale du 25 mai 1963 ». Les couleurs de la lumière se répandent sur les murs et dans les coins et transforment l'espace lui-même."]}, "en": {"q": "Dan Flavin used special bulbs that he designed himself.", "exp": "False. Flavin used standard fluorescent tubes sold in shops, part of Minimalism's idea of ready-made industrial materials.", "detail": ["His first fluorescent work was 'the diagonal of May 25, 1963'. The coloured light spreads over walls and corners and changes the space itself."]}, "id": "x-08-15", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1966, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "sculpture", "tags": ["minimalism", "postwar", "sculpture", "r-namerica"], "topics": ["minimalism", "postwar", "sculpture", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Minimalist sanatçıları malzemeleriyle eşleştir.", "left": ["Carl Andre", "Dan Flavin", "Donald Judd", "Agnes Martin"], "right": ["Yere dizilmiş metal levhalar ve tuğlalar", "Floresan tüpler", "Duvara dizilmiş kutular", "Hafif ızgaralı soluk tuvaller"], "exp": "Minimalistler sade biçimleri, tekrarı ve endüstriyel malzemeleri kullandı.", "detail": ["Carl Andre'nin 120 tuğladan oluşan 'Equivalent VIII' eseri 1976'da Tate'te büyük tartışma yarattı. Agnes Martin ise kendini Soyut Ekspresyonistlere daha yakın görse de ince ızgaralarıyla Minimalizmle ilişkilendirilir."]}, "fr": {"q": "Associe chaque artiste minimaliste à ses matériaux.", "left": ["Carl Andre", "Dan Flavin", "Donald Judd", "Agnes Martin"], "right": ["Plaques de métal et briques posées au sol", "Tubes fluorescents", "Boîtes alignées au mur", "Toiles pâles aux grilles légères"], "exp": "Les minimalistes utilisent des formes simples, la répétition et des matériaux industriels.", "detail": ["« Equivalent VIII » de Carl Andre, 120 briques, a fait scandale à la Tate en 1976. Agnes Martin se sentait plus proche des expressionnistes abstraits, mais ses grilles fines la lient au minimalisme."]}, "en": {"q": "Match each Minimalist artist with their materials.", "left": ["Carl Andre", "Dan Flavin", "Donald Judd", "Agnes Martin"], "right": ["Metal plates and bricks laid on the floor", "Fluorescent tubes", "Boxes stacked on the wall", "Pale canvases with faint grids"], "exp": "Minimalists used simple forms, repetition and industrial materials.", "detail": ["Carl Andre's 'Equivalent VIII', 120 bricks, caused a scandal at Tate in 1976. Agnes Martin felt closer to the Abstract Expressionists, but her fine grids link her to Minimalism."]}, "id": "x-08-16", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1965, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "concept", "tags": ["conceptual", "postwar", "r-namerica"], "topics": ["conceptual", "postwar", "r-namerica"], "search": {"commons": "Joseph Kosuth One and Three Chairs", "wiki": {"en": "One and Three Chairs"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Duchamp – Bisiklet Tekerleği", "Kosuth – Bir ve Üç Sandalye", "Beuys – Yağlı Sandalye", "Rietveld – Kırmızı Mavi Sandalye"], "exp": "Joseph Kosuth'un 'Bir ve Üç Sandalye'si (1965), gerçek bir sandalyeyi, onun fotoğrafını ve sözlükteki 'sandalye' tanımını yan yana koyar.", "detail": ["Eser, bir nesne, onun imgesi ve onun kavramı arasındaki ilişkiyi sorgular. Kosuth 'Felsefeden Sonra Sanat' (1969) makalesiyle Kavramsal Sanatın kuramcılarından oldu. Bir versiyonu MoMA'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Duchamp – Roue de bicyclette", "Kosuth – One and Three Chairs", "Beuys – Chaise avec graisse", "Rietveld – Chaise rouge et bleue"], "exp": "« One and Three Chairs » de Joseph Kosuth (1965) place côte à côte une vraie chaise, sa photo et la définition du mot « chaise » dans le dictionnaire.", "detail": ["L'œuvre interroge le lien entre un objet, son image et son concept. Avec son texte « Art after Philosophy » (1969), Kosuth devient un théoricien de l'art conceptuel. Une version est au MoMA."]}, "en": {"q": "Which work is this?", "opts": ["Duchamp – Bicycle Wheel", "Kosuth – One and Three Chairs", "Beuys – Fat Chair", "Rietveld – Red and Blue Chair"], "exp": "Joseph Kosuth's 'One and Three Chairs' (1965) places a real chair, a photo of it and the dictionary definition of 'chair' side by side.", "detail": ["The work questions the link between an object, its image and its concept. With his essay 'Art after Philosophy' (1969), Kosuth became a theorist of Conceptual Art. A version is in MoMA."]}, "id": "x-08-17", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1967, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "concept", "tags": ["conceptual", "postwar", "r-namerica"], "topics": ["conceptual", "postwar", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "1967'de 'Kavramsal Sanat Üzerine Paragraflar'ı yazan ve 'fikir, sanatı yapan makinedir' diyen sanatçı kimdir?", "opts": ["Lawrence Weiner", "John Baldessari", "Sol LeWitt", "Robert Barry"], "exp": "Sol LeWitt, 1967'de Artforum'da yayımlanan bu metinde kavramsal sanatta fikrin en önemli unsur olduğunu yazdı.", "detail": ["LeWitt'in duvar resimleri, başkalarının uygulaması için yazılmış talimatlardan oluşur; bu yüzden aynı eser farklı yerlerde yeniden yapılabilir. MASS MoCA'da onun duvar resimlerinin uzun süreli büyük bir sergisi vardır."]}, "fr": {"q": "Quel artiste a écrit en 1967 « Paragraphs on Conceptual Art » et a dit que « l'idée devient une machine qui fait l'art » ?", "opts": ["Lawrence Weiner", "John Baldessari", "Sol LeWitt", "Robert Barry"], "exp": "Dans ce texte publié dans Artforum en 1967, Sol LeWitt écrit que l'idée est l'élément le plus important de l'art conceptuel.", "detail": ["Ses wall drawings sont des instructions écrites que d'autres personnes réalisent ; la même œuvre peut donc être refaite dans différents lieux. Le MASS MoCA présente une grande exposition de longue durée de ses wall drawings."]}, "en": {"q": "Which artist wrote 'Paragraphs on Conceptual Art' in 1967 and said 'the idea becomes a machine that makes the art'?", "opts": ["Lawrence Weiner", "John Baldessari", "Sol LeWitt", "Robert Barry"], "exp": "In this text published in Artforum in 1967, Sol LeWitt wrote that the idea is the most important part of conceptual art.", "detail": ["His wall drawings are written instructions carried out by other people, so the same work can be remade in different places. MASS MoCA has a large long-term exhibition of his wall drawings."]}, "id": "x-08-18", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1970, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "concept", "tags": ["conceptual", "postwar", "r-namerica"], "topics": ["conceptual", "postwar", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "John Baldessari 1970'te 1953–1966 arasında yaptığı resimlerinin çoğunu yaktırdı ve külleri bir esere dönüştürdü.", "exp": "Doğru. 'Kremasyon Projesi'nde resimler San Diego'da bir krematoryumda yakıldı; küllerin bir kısmı kurabiye yapılarak bir kavanozda sergilendi.", "detail": ["Baldessari bu eylemle kendi el emeğine dayanan resmi bırakıp fotoğraf, metin ve fikir temelli işe geçti. Eğitmen olarak da birçok genç sanatçıyı etkiledi."]}, "fr": {"q": "En 1970, John Baldessari a fait brûler la plupart de ses peintures de 1953 à 1966 et a transformé les cendres en œuvre.", "exp": "Vrai. Dans le « Cremation Project », ses tableaux sont brûlés dans un crématorium de San Diego ; une partie des cendres est cuite dans des biscuits et présentée dans une urne.", "detail": ["Par ce geste, Baldessari abandonne la peinture faite à la main pour un travail basé sur la photo, le texte et l'idée. Il a aussi influencé beaucoup de jeunes artistes comme professeur."]}, "en": {"q": "In 1970 John Baldessari had most of his paintings from 1953 to 1966 burned and turned the ashes into an artwork.", "exp": "True. In the 'Cremation Project', the paintings were burned in a San Diego crematorium; some of the ashes were baked into cookies and shown in an urn.", "detail": ["With this act Baldessari left hand-made painting behind for work based on photography, text and ideas. As a teacher he also influenced many young artists."]}, "id": "x-08-19", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1967, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "sculpture", "tags": ["artepovera", "postwar", "sculpture"], "topics": ["artepovera", "postwar", "sculpture"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "'Arte Povera' (Yoksul Sanat) terimini 1967'de ortaya atan İtalyan eleştirmen kimdir?", "opts": ["Achille Bonito Oliva", "Germano Celant", "Lucio Fontana", "Pierre Restany"], "exp": "Germano Celant 1967'de Cenova'da bir sergi düzenledi ve 'Arte Povera' adını verdi.", "detail": ["Sanatçılar toprak, taş, kömür, paçavra ve canlı bitkiler gibi 'yoksul' malzemeler kullandı. Michelangelo Pistoletto, Jannis Kounellis, Mario Merz ve Giuseppe Penone grubun önde gelen isimleridir."]}, "fr": {"q": "Quel critique italien a inventé le terme « Arte Povera » (art pauvre) en 1967 ?", "opts": ["Achille Bonito Oliva", "Germano Celant", "Lucio Fontana", "Pierre Restany"], "exp": "En 1967, Germano Celant organise une exposition à Gênes et lui donne le nom d'« Arte Povera ».", "detail": ["Les artistes utilisent des matériaux « pauvres » : terre, pierre, charbon, chiffons, plantes vivantes. Michelangelo Pistoletto, Jannis Kounellis, Mario Merz et Giuseppe Penone en sont les figures principales."]}, "en": {"q": "Which Italian critic coined the term 'Arte Povera' (poor art) in 1967?", "opts": ["Achille Bonito Oliva", "Germano Celant", "Lucio Fontana", "Pierre Restany"], "exp": "In 1967 Germano Celant organised an exhibition in Genoa and named it 'Arte Povera'.", "detail": ["The artists used 'poor' materials such as earth, stone, coal, rags and living plants. Michelangelo Pistoletto, Jannis Kounellis, Mario Merz and Giuseppe Penone are its leading figures."]}, "id": "x-09-0", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1967, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "sculpture", "tags": ["artepovera", "postwar", "sculpture"], "topics": ["artepovera", "postwar", "sculpture"], "search": {"commons": "Pistoletto Venus of the Rags", "wiki": {"en": "Venus of the Rags"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Kounellis – Atlar", "Merz – Giap'ın İglusu", "Penone – Ağaç Olmak", "Pistoletto – Paçavraların Venüsü"], "exp": "Michelangelo Pistoletto'nun 'Paçavraların Venüsü' (1967), klasik bir Venüs heykeli kopyasını bir yığın renkli eski giysinin önüne koyar.", "detail": ["Eser, antik güzellik idealiyle tüketim toplumunun atıklarını karşı karşıya getirir. Arte Povera'nın simgelerinden biridir; versiyonları Tate'te ve Rivoli'deki Castello di Rivoli'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Kounellis – Chevaux", "Merz – Igloo de Giap", "Penone – Devenir arbre", "Pistoletto – Vénus aux chiffons"], "exp": "La « Vénus aux chiffons » de Michelangelo Pistoletto (1967) place la copie d'une Vénus classique devant un tas de vieux vêtements colorés.", "detail": ["L'œuvre confronte l'idéal antique de beauté aux déchets de la société de consommation. C'est un symbole de l'Arte Povera ; des versions sont à la Tate et au Castello di Rivoli."]}, "en": {"q": "Which work is this?", "opts": ["Kounellis – Horses", "Merz – Giap's Igloo", "Penone – To Become a Tree", "Pistoletto – Venus of the Rags"], "exp": "Michelangelo Pistoletto's 'Venus of the Rags' (1967) places a copy of a classical Venus in front of a pile of old colourful clothes.", "detail": ["The work sets the ancient ideal of beauty against the waste of consumer society. It is a symbol of Arte Povera; versions are in Tate and the Castello di Rivoli."]}, "id": "x-09-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1969, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "performance", "tags": ["artepovera", "postwar", "performance"], "topics": ["artepovera", "postwar", "performance"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Jannis Kounellis 1969'da Roma'daki bir galeriye 12 canlı at getirip sergiledi.", "exp": "Doğru. 'Başlıksız (12 At)', 1969'da Roma'daki L'Attico galerisinde canlı atlarla gerçekleşti.", "detail": ["Kounellis, galeriyi bir ahıra dönüştürerek sanat mekânının sınırlarını ve canlı ile cansız arasındaki farkı sorguladı. Eser 2015 Venedik'te ve başka yerlerde yeniden yapıldı."]}, "fr": {"q": "En 1969, Jannis Kounellis a présenté douze chevaux vivants dans une galerie de Rome.", "exp": "Vrai. « Sans titre (12 chevaux) » a eu lieu en 1969 à la galerie L'Attico, à Rome, avec des chevaux vivants.", "detail": ["En transformant la galerie en écurie, Kounellis interroge les limites du lieu d'art et la différence entre le vivant et l'inerte. L'œuvre a été refaite plus tard, par exemple à Venise."]}, "en": {"q": "In 1969 Jannis Kounellis showed twelve live horses in a gallery in Rome.", "exp": "True. 'Untitled (12 Horses)' took place in 1969 at the L'Attico gallery in Rome with live horses.", "detail": ["By turning the gallery into a stable, Kounellis questioned the limits of the art space and the difference between living and lifeless things. The work was later restaged, for example in Venice."]}, "id": "x-09-2", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1970, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "sculpture", "tags": ["landart", "postwar", "sculpture", "r-namerica"], "topics": ["landart", "postwar", "sculpture", "r-namerica"], "search": {"commons": "Spiral Jetty Smithson", "wiki": {"en": "Spiral Jetty"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Smithson – Spiral İskele", "Heizer – Çifte Olumsuz", "De Maria – Şimşek Tarlası", "Holt – Güneş Tünelleri"], "exp": "Robert Smithson'ın Spiral İskele'si (1970), Utah'taki Büyük Tuz Gölü'ne uzanan, kaya ve topraktan yapılmış 457 metrelik bir sarmaldır.", "detail": ["Eser yıllarca su altında kaldı, sonra kuraklıkla yeniden ortaya çıktı; tuz kristalleriyle beyaza büründü. Smithson 1973'te bir uçak kazasında öldü. Eser bugün Dia Art Foundation'a aittir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Smithson – Spiral Jetty", "Heizer – Double Negative", "De Maria – The Lightning Field", "Holt – Sun Tunnels"], "exp": "Spiral Jetty de Robert Smithson (1970) est une spirale de 457 mètres en roches et en terre, qui avance dans le Grand Lac Salé, dans l'Utah.", "detail": ["L'œuvre est restée sous l'eau pendant des années, puis elle est réapparue avec la sécheresse, couverte de cristaux de sel. Smithson est mort dans un accident d'avion en 1973. L'œuvre appartient à la Dia Art Foundation."]}, "en": {"q": "Which work is this?", "opts": ["Smithson – Spiral Jetty", "Heizer – Double Negative", "De Maria – The Lightning Field", "Holt – Sun Tunnels"], "exp": "Robert Smithson's Spiral Jetty (1970) is a 457-metre spiral of rock and earth reaching into the Great Salt Lake in Utah.", "detail": ["It was under water for years, then reappeared with drought, white with salt crystals. Smithson died in a plane crash in 1973. The work belongs to the Dia Art Foundation."]}, "id": "x-09-3", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1977, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "sculpture", "tags": ["landart", "postwar", "sculpture", "r-namerica"], "topics": ["landart", "postwar", "sculpture", "r-namerica"], "search": {"commons": "The Lightning Field Walter De Maria", "wiki": {"en": "The Lightning Field"}}, "answer": 2, "tr": {"q": "Walter De Maria'nın 'Şimşek Tarlası' (1977) nedir?", "opts": ["Nevada çölünde kazılmış iki büyük hendek", "Utah'ta dört dev beton tüp", "New Mexico'da ızgara düzeninde dikilmiş 400 paslanmaz çelik direk", "Arizona'da bir volkan kraterine oyulmuş bir gözlemevi"], "exp": "Şimşek Tarlası, New Mexico'nun ıssız bir bölgesinde yaklaşık 1,6 km × 1 km'lik bir alana dizilmiş 400 çelik direkten oluşur.", "detail": ["Ziyaretçiler küçük gruplar hâlinde bir gece kalır; şimşek her zaman düşmez, ama gün doğumu ve batımında direkler ışıkla parlar. Diğer seçenekler Heizer'in 'Double Negative', Nancy Holt'un 'Sun Tunnels' ve James Turrell'in 'Roden Crater' projelerini anlatır."]}, "fr": {"q": "Qu'est-ce que « The Lightning Field » de Walter De Maria (1977) ?", "opts": ["Deux grandes tranchées creusées dans le désert du Nevada", "Quatre énormes tubes en béton dans l'Utah", "400 poteaux en acier inoxydable plantés en grille au Nouveau-Mexique", "Un observatoire creusé dans un cratère volcanique en Arizona"], "exp": "The Lightning Field est formé de 400 poteaux en acier, disposés sur environ 1,6 km × 1 km dans une région isolée du Nouveau-Mexique.", "detail": ["Les visiteurs y passent une nuit en petits groupes ; la foudre ne tombe pas toujours, mais les poteaux brillent au lever et au coucher du soleil. Les autres réponses décrivent « Double Negative » de Heizer, « Sun Tunnels » de Nancy Holt et le « Roden Crater » de James Turrell."]}, "en": {"q": "What is Walter De Maria's 'The Lightning Field' (1977)?", "opts": ["Two large trenches dug into the Nevada desert", "Four huge concrete tubes in Utah", "400 stainless-steel poles set in a grid in New Mexico", "An observatory carved into a volcanic crater in Arizona"], "exp": "The Lightning Field consists of 400 steel poles laid out over about 1.6 km × 1 km in a remote part of New Mexico.", "detail": ["Visitors stay one night in small groups; lightning does not always strike, but the poles glow at sunrise and sunset. The other options describe Heizer's 'Double Negative', Nancy Holt's 'Sun Tunnels' and James Turrell's 'Roden Crater'."]}, "id": "x-09-4", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 2021, "era": {"tr": "2020'ler", "fr": "Années 2020", "en": "2020s"}, "region": "europe", "medium": "sculpture", "tags": ["landart", "contemporary", "sculpture"], "topics": ["landart", "contemporary", "sculpture"], "search": {"commons": "Arc de Triomphe wrapped", "wiki": {"en": "Arc de Triomphe wrapped"}}, "answer": true, "tr": {"q": "Christo ve Jeanne-Claude'un Paris'teki Zafer Takı'nı sarma projesi, Christo'nun ölümünden sonra 2021'de gerçekleştirildi.", "exp": "Doğru. Christo 2020'de öldü; 'L'Arc de Triomphe, Wrapped' Eylül 2021'de, planladığı gibi gerçekleştirildi.", "detail": ["Çift, Berlin'deki Reichstag'ı (1995) ve Paris'teki Pont Neuf'ü (1985) de sarmıştı. Projelerini kendi eskiz ve maketlerini satarak finanse ettiler; hiçbir sponsor kabul etmediler."]}, "fr": {"q": "Le projet de Christo et Jeanne-Claude d'empaqueter l'Arc de Triomphe à Paris a été réalisé en 2021, après la mort de Christo.", "exp": "Vrai. Christo est mort en 2020 ; « L'Arc de Triomphe, empaqueté » a été réalisé en septembre 2021, comme il l'avait prévu.", "detail": ["Le couple avait déjà empaqueté le Reichstag à Berlin (1995) et le Pont-Neuf à Paris (1985). Ils finançaient leurs projets en vendant leurs dessins et maquettes, sans sponsors."]}, "en": {"q": "Christo and Jeanne-Claude's project to wrap the Arc de Triomphe in Paris was carried out in 2021, after Christo's death.", "exp": "True. Christo died in 2020; 'L'Arc de Triomphe, Wrapped' was carried out in September 2021, as he had planned.", "detail": ["The couple had already wrapped the Reichstag in Berlin (1995) and the Pont Neuf in Paris (1985). They funded their projects by selling their own drawings and models, without sponsors."]}, "id": "x-09-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1970, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "painting", "tags": ["photorealism", "postwar", "painting", "r-namerica"], "topics": ["photorealism", "postwar", "painting", "r-namerica"], "search": {"commons": "Chuck Close Big Self-Portrait", "wiki": {"en": "Chuck Close Big Self-Portrait"}}, "answer": 0, "tr": {"q": "Dev boyutlu, fotoğraftan büyütülmüş yüz portreleriyle tanınan, 1988'de felç geçirdikten sonra da resim yapmaya devam eden Fotogerçekçi sanatçı kimdir?", "opts": ["Chuck Close", "Richard Estes", "Ralph Goings", "Audrey Flack"], "exp": "Chuck Close, fotoğrafları ızgaralarla büyüterek dev portreler yaptı; 'Büyük Otoportre' (1967–68) en ünlülerindendir.", "detail": ["1988'de omuriliğindeki bir hasar sonrası büyük ölçüde felç oldu, ama fırçayı eline bağlayarak çalışmayı sürdürdü. Sonraki eserlerinde ızgaranın her karesi küçük, renkli soyut biçimlerle doludur."]}, "fr": {"q": "Quel artiste photoréaliste, connu pour ses immenses portraits agrandis à partir de photos, a continué à peindre après une paralysie en 1988 ?", "opts": ["Chuck Close", "Richard Estes", "Ralph Goings", "Audrey Flack"], "exp": "Chuck Close agrandit des photos à l'aide de grilles pour faire de gigantesques portraits ; « Big Self-Portrait » (1967–1968) est l'un des plus célèbres.", "detail": ["En 1988, une lésion de la moelle épinière le laisse en grande partie paralysé, mais il continue à peindre avec un pinceau attaché à la main. Dans ses œuvres tardives, chaque case de la grille est remplie de petites formes abstraites colorées."]}, "en": {"q": "Which Photorealist artist, known for huge portraits enlarged from photographs, kept painting after being paralysed in 1988?", "opts": ["Chuck Close", "Richard Estes", "Ralph Goings", "Audrey Flack"], "exp": "Chuck Close enlarged photographs with grids to make giant portraits; 'Big Self-Portrait' (1967–68) is one of the most famous.", "detail": ["In 1988 a spinal injury left him largely paralysed, but he kept working with a brush strapped to his hand. In his later works each square of the grid is filled with small, colourful abstract shapes."]}, "id": "x-09-6", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1975, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "painting", "tags": ["photorealism", "postwar", "painting", "r-namerica"], "topics": ["photorealism", "postwar", "painting", "r-namerica"], "search": {"commons": "Richard Estes storefront reflections", "wiki": {"en": "Richard Estes storefront reflections"}}, "answer": true, "tr": {"q": "Richard Estes, New York sokaklarındaki vitrin camlarının yansımalarını çok ayrıntılı biçimde resmetmesiyle tanınır.", "exp": "Doğru. Estes, parlak cam ve metal yüzeylerdeki karmaşık yansımaları fotoğraflara dayanarak keskin bir netlikle resmetti.", "detail": ["Estes genellikle birkaç fotoğrafı birleştirerek gerçekte tek bir bakışta görülemeyecek kadar net bir şehir manzarası kurar. Fotogerçekçilik 1960'ların sonunda ABD'de Pop Art'ın ardından gelişti."]}, "fr": {"q": "Richard Estes est connu pour ses peintures très détaillées des reflets dans les vitrines des rues de New York.", "exp": "Vrai. Estes peint, à partir de photos, les reflets complexes sur le verre et le métal avec une netteté extrême.", "detail": ["Il combine souvent plusieurs photos pour créer une vue de la ville plus nette que ce que l'œil peut voir en un seul regard. Le photoréalisme se développe aux États-Unis à la fin des années 1960, après le pop art."]}, "en": {"q": "Richard Estes is known for highly detailed paintings of reflections in New York shop windows.", "exp": "True. Estes painted complex reflections on glass and metal from photographs with extreme sharpness.", "detail": ["He often combined several photos to build a city view sharper than the eye could see in one glance. Photorealism developed in the USA in the late 1960s, after Pop Art."]}, "id": "x-09-7", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1979, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "sculpture", "tags": ["feminist", "postwar", "sculpture", "women", "r-namerica"], "topics": ["feminist", "postwar", "sculpture", "women", "r-namerica"], "search": {"commons": "Judy Chicago The Dinner Party", "wiki": {"en": "The Dinner Party"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Miriam Schapiro – Kadın Evi", "Faith Ringgold – Kim Kocaman Kara Kurttan Korkar?", "Judy Chicago – Akşam Yemeği Partisi", "Louise Bourgeois – Anne"], "exp": "Judy Chicago'nun Akşam Yemeği Partisi (1974–79), tarihteki 39 önemli kadın için kurulmuş üçgen bir masadır; zeminde 999 kadının adı daha yazılıdır.", "detail": ["Eser, porselen boyama ve nakış gibi 'kadın işi' sayılan zanaatları kullanır ve yüzlerce gönüllüyle yapıldı. Uzun yıllar tartışıldı; 2007'den beri Brooklyn Müzesi'nde kalıcı olarak sergilenir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Miriam Schapiro – Womanhouse", "Faith Ringgold – Who's Afraid of Aunt Jemima?", "Judy Chicago – The Dinner Party", "Louise Bourgeois – Maman"], "exp": "The Dinner Party de Judy Chicago (1974–1979) est une table triangulaire dressée pour 39 femmes importantes de l'histoire ; 999 autres noms de femmes sont inscrits au sol.", "detail": ["L'œuvre utilise des savoir-faire vus comme « féminins », comme la peinture sur porcelaine et la broderie, et a été réalisée avec des centaines de bénévoles. Longtemps discutée, elle est exposée en permanence au Brooklyn Museum depuis 2007."]}, "en": {"q": "Which work is this?", "opts": ["Miriam Schapiro – Womanhouse", "Faith Ringgold – Who's Afraid of Aunt Jemima?", "Judy Chicago – The Dinner Party", "Louise Bourgeois – Maman"], "exp": "Judy Chicago's The Dinner Party (1974–79) is a triangular table set for 39 important women in history; 999 more women's names are written on the floor.", "detail": ["The work uses crafts seen as 'women's work', such as china painting and embroidery, and was made with hundreds of volunteers. Long debated, it has been on permanent show at the Brooklyn Museum since 2007."]}, "id": "x-09-8", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1971, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "concept", "tags": ["feminist", "postwar", "women", "r-namerica"], "topics": ["feminist", "postwar", "women", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "1971'de 'Neden Hiç Büyük Kadın Sanatçı Olmadı?' adlı ünlü makaleyi yazan sanat tarihçisi kimdir?", "opts": ["Griselda Pollock", "Lucy Lippard", "Rosalind Krauss", "Linda Nochlin"], "exp": "Linda Nochlin, makalesinde sorunun kadınların yeteneğinde değil, eğitime, çıplak model derslerine ve kurumlara erişimin engellenmesinde olduğunu savundu.", "detail": ["Makale ARTnews'te yayımlandı ve feminist sanat tarihinin kurucu metinlerinden biri oldu. Nochlin, 'deha' kavramının toplumsal koşullardan bağımsız olmadığını gösterdi."]}, "fr": {"q": "Quelle historienne de l'art a écrit en 1971 l'article célèbre « Pourquoi n'y a-t-il pas eu de grandes artistes femmes ? » ?", "opts": ["Griselda Pollock", "Lucy Lippard", "Rosalind Krauss", "Linda Nochlin"], "exp": "Linda Nochlin explique que le problème n'est pas le talent des femmes, mais leur exclusion de la formation, des cours de nu et des institutions.", "detail": ["L'article, publié dans ARTnews, est l'un des textes fondateurs de l'histoire de l'art féministe. Nochlin montre que l'idée de « génie » dépend des conditions sociales."]}, "en": {"q": "Which art historian wrote the famous 1971 essay 'Why Have There Been No Great Women Artists?'?", "opts": ["Griselda Pollock", "Lucy Lippard", "Rosalind Krauss", "Linda Nochlin"], "exp": "Linda Nochlin argued that the problem was not women's talent but their exclusion from training, life-drawing classes and institutions.", "detail": ["The essay, published in ARTnews, is one of the founding texts of feminist art history. Nochlin showed that the idea of 'genius' depends on social conditions."]}, "id": "x-09-9", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1989, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "americas", "medium": "print", "tags": ["feminist", "contemporary", "design", "women", "r-namerica"], "topics": ["feminist", "contemporary", "design", "women", "r-namerica"], "search": {"commons": "Guerrilla Girls Do women have to be naked", "wiki": {"en": "Guerrilla Girls Do women have to be naked"}}, "answer": 1, "tr": {"q": "Biz kimiz?", "clues": ["1985'te New York'ta kurulan anonim bir kadın sanatçılar grubuyuz.", "Kamusal alanda goril maskeleri takarız ve ölmüş kadın sanatçıların adlarını takma ad olarak kullanırız.", "1989'da 'Kadınlar Metropolitan Müzesi'ne girmek için çıplak mı olmalı?' diye soran bir afiş yaptık."], "opts": ["Pussy Riot", "Guerrilla Girls", "Womanhouse", "Heresies Kolektifi"], "exp": "Cevap Guerrilla Girls'tür. Müzelerdeki cinsiyet ve ırk eşitsizliğini istatistiklerle ve mizahla eleştirirler.", "detail": ["Afişte, Met'in modern sanat bölümündeki sanatçıların yüzde 5'ten azının kadın, çıplakların ise yüzde 85'inin kadın olduğu yazar. Grup bugün de dünya çapında sergiler ve kampanyalar düzenliyor."]}, "fr": {"q": "Qui sommes-nous ?", "clues": ["Nous sommes un groupe anonyme d'artistes femmes fondé à New York en 1985.", "En public, nous portons des masques de gorille et nous prenons comme pseudonymes les noms d'artistes femmes mortes.", "En 1989, nous avons fait une affiche qui demande : « Les femmes doivent-elles être nues pour entrer au Metropolitan Museum ? »."], "opts": ["Pussy Riot", "Les Guerrilla Girls", "Womanhouse", "Le collectif Heresies"], "exp": "La réponse est les Guerrilla Girls. Elles critiquent avec des chiffres et de l'humour l'inégalité de genre et de race dans les musées.", "detail": ["L'affiche dit que moins de 5 % des artistes de la section d'art moderne du Met sont des femmes, mais que 85 % des nus sont des femmes. Le groupe organise encore des expositions et des campagnes dans le monde entier."]}, "en": {"q": "Who are we?", "clues": ["We are an anonymous group of women artists founded in New York in 1985.", "In public we wear gorilla masks and use the names of dead women artists as pseudonyms.", "In 1989 we made a poster asking 'Do women have to be naked to get into the Met. Museum?'"], "opts": ["Pussy Riot", "The Guerrilla Girls", "Womanhouse", "The Heresies Collective"], "exp": "The answer is the Guerrilla Girls. They criticise gender and racial inequality in museums with statistics and humour.", "detail": ["The poster says that less than 5% of the artists in the Met's modern art section are women, but 85% of the nudes are female. The group still runs exhibitions and campaigns around the world."]}, "id": "x-09-10", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1975, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "concept", "tags": ["feminist", "postwar", "women", "r-namerica"], "topics": ["feminist", "postwar", "women", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1971", "1972", "1979", "1985"], "tr": {"q": "Feminist sanatla ilgili bu olayları eskiden yeniye sırala.", "items": ["Nochlin'in 'Neden Hiç Büyük Kadın Sanatçı Olmadı?' makalesi", "Los Angeles'ta 'Womanhouse' projesi", "Judy Chicago'nun 'Akşam Yemeği Partisi'nin ilk sergilenişi", "Guerrilla Girls'ün kuruluşu"], "exp": "Nochlin'in makalesi 1971, Womanhouse 1972, Akşam Yemeği Partisi'nin San Francisco'da ilk gösterimi 1979, Guerrilla Girls'ün kuruluşu 1985'tir.", "detail": ["Womanhouse, Judy Chicago ve Miriam Schapiro'nun öğrencileriyle terk edilmiş bir evi kadın deneyimini anlatan mekânlara dönüştürdüğü bir projeydi. Bu olaylar, sanat dünyasında kadınların yerini sorgulayan bir dönemi gösterir."]}, "fr": {"q": "Classe ces événements liés à l'art féministe du plus ancien au plus récent.", "items": ["L'article de Nochlin « Pourquoi n'y a-t-il pas eu de grandes artistes femmes ? »", "Le projet « Womanhouse » à Los Angeles", "La première présentation de « The Dinner Party » de Judy Chicago", "La fondation des Guerrilla Girls"], "exp": "L'article de Nochlin date de 1971, Womanhouse de 1972, la première présentation de The Dinner Party à San Francisco de 1979 et la fondation des Guerrilla Girls de 1985.", "detail": ["Dans Womanhouse, Judy Chicago, Miriam Schapiro et leurs étudiantes transforment une maison abandonnée en espaces sur l'expérience des femmes. Ces événements montrent une période où l'on interroge la place des femmes dans l'art."]}, "en": {"q": "Put these events linked to feminist art in order, oldest first.", "items": ["Nochlin's essay 'Why Have There Been No Great Women Artists?'", "The 'Womanhouse' project in Los Angeles", "The first showing of Judy Chicago's 'The Dinner Party'", "The founding of the Guerrilla Girls"], "exp": "Nochlin's essay dates from 1971, Womanhouse from 1972, the first showing of The Dinner Party in San Francisco from 1979 and the founding of the Guerrilla Girls from 1985.", "detail": ["In Womanhouse, Judy Chicago, Miriam Schapiro and their students turned an empty house into spaces about women's experience. These events mark a period of questioning women's place in art."]}, "id": "x-09-11", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1968, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "asia", "medium": "sculpture", "tags": ["monoha", "postwar", "sculpture", "r-fareast"], "topics": ["monoha", "postwar", "sculpture", "r-fareast"], "search": {"commons": "Nobuo Sekine Phase Mother Earth", "wiki": {"en": "Nobuo Sekine Phase Mother Earth"}}, "answer": 0, "tr": {"q": "Mono-ha'nın başlangıcı sayılan, yere kazılmış silindir bir çukur ve yanında aynı biçimde sıkıştırılmış topraktan oluşan 1968 tarihli eser hangisidir?", "opts": ["Nobuo Sekine – Faz: Toprak Ana", "Lee Ufan – İlişkiler", "Kishio Suga – Sonsuz Durum", "Koji Enokura – Temas"], "exp": "Nobuo Sekine'nin 'Faz: Toprak Ana' (1968) eseri, Kobe'deki Suma Parkı'nda açılan bir sergide yapıldı; çukur ve silindir, negatif ve pozitif hacim olarak yan yana durur.", "detail": ["Mono-ha ('nesnelerin okulu') sanatçıları taş, ahşap, kâğıt ve çelik gibi malzemeleri az müdahale ile düzenleyerek nesneler ile mekân arasındaki ilişkiye dikkat çekti. Lee Ufan grubun kuramcısıdır."]}, "fr": {"q": "Quelle œuvre de 1968, faite d'un trou cylindrique creusé dans le sol et d'un cylindre de terre tassée de même forme, est vue comme le début de Mono-ha ?", "opts": ["Nobuo Sekine – Phase : Mère Terre", "Lee Ufan – Relatum", "Kishio Suga – Situation infinie", "Koji Enokura – Contact"], "exp": "« Phase : Mère Terre » de Nobuo Sekine (1968) est réalisée lors d'une exposition au parc Suma de Kobe ; le trou et le cylindre se répondent comme volume négatif et positif.", "detail": ["Les artistes de Mono-ha (« école des choses ») placent pierres, bois, papier ou acier avec peu d'intervention pour attirer l'attention sur la relation entre les choses et l'espace. Lee Ufan en est le théoricien."]}, "en": {"q": "Which 1968 work, a cylindrical hole dug in the ground beside a cylinder of packed earth of the same shape, is seen as the start of Mono-ha?", "opts": ["Nobuo Sekine – Phase: Mother Earth", "Lee Ufan – Relatum", "Kishio Suga – Infinite Situation", "Koji Enokura – Contact"], "exp": "Nobuo Sekine's 'Phase: Mother Earth' (1968) was made for an exhibition in Suma Park in Kobe; the hole and the cylinder stand together as negative and positive volume.", "detail": ["Mono-ha ('school of things') artists arranged stone, wood, paper and steel with little intervention to draw attention to the relation between things and space. Lee Ufan was its theorist."]}, "id": "x-09-12", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1970, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "asia", "medium": "sculpture", "tags": ["monoha", "dansaekhwa", "postwar", "sculpture", "r-fareast"], "topics": ["monoha", "dansaekhwa", "postwar", "sculpture", "r-fareast"], "search": {"commons": "Lee Ufan Relatum", "wiki": {"en": "Lee Ufan Relatum"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Kore'de doğdum, Japonya'ya yerleştim ve felsefe okudum.", "Mono-ha'nın kuramcısı oldum; taş ve çelik levhaları 'İlişkiler' (Relatum) adlı eserlerde bir araya getirdim.", "Resimde de 'Noktadan' ve 'Çizgiden' serileriyle Kore Dansaekhwa'sıyla ilişkilendirildim; Japonya'daki Naoshima'da adıma bir müze var."], "opts": ["Park Seo-bo", "Nam June Paik", "Lee Ufan", "Kishio Suga"], "exp": "Cevap Lee Ufan'dır. Hem Mono-ha hem Dansaekhwa ile ilişkilendirilen nadir sanatçılardandır.", "detail": ["Lee'nin eserleri yaptığı ile yapmadığı arasındaki dengeye, boşluğa ve sessizliğe odaklanır. Lee Ufan Müzesi, Tadao Ando tarafından tasarlandı ve 2010'da Naoshima'da açıldı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né en Corée, je me suis installé au Japon et j'ai étudié la philosophie.", "Je suis devenu le théoricien de Mono-ha ; j'ai réuni pierres et plaques d'acier dans des œuvres appelées « Relatum ».", "En peinture, mes séries « From Point » et « From Line » me lient au Dansaekhwa coréen ; un musée porte mon nom à Naoshima, au Japon."], "opts": ["Park Seo-bo", "Nam June Paik", "Lee Ufan", "Kishio Suga"], "exp": "La réponse est Lee Ufan, l'un des rares artistes liés à la fois à Mono-ha et au Dansaekhwa.", "detail": ["Ses œuvres cherchent l'équilibre entre ce qui est fait et ce qui ne l'est pas, le vide et le silence. Le musée Lee Ufan, dessiné par Tadao Ando, a ouvert à Naoshima en 2010."]}, "en": {"q": "Who am I?", "clues": ["I was born in Korea, settled in Japan and studied philosophy.", "I became the theorist of Mono-ha; I brought stones and steel plates together in works called 'Relatum'.", "In painting, my 'From Point' and 'From Line' series link me to Korean Dansaekhwa; there is a museum in my name on Naoshima in Japan."], "opts": ["Park Seo-bo", "Nam June Paik", "Lee Ufan", "Kishio Suga"], "exp": "The answer is Lee Ufan, one of the few artists linked to both Mono-ha and Dansaekhwa.", "detail": ["His works focus on the balance between what is made and not made, on emptiness and silence. The Lee Ufan Museum, designed by Tadao Ando, opened on Naoshima in 2010."]}, "id": "x-09-13", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1959, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "sculpture", "tags": ["neoconcrete", "postwar", "sculpture", "r-latam"], "topics": ["neoconcrete", "postwar", "sculpture", "r-latam"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1959'da Rio de Janeiro'da yayımlanan 'Neo-Konkret Manifesto'yu yazan şair ve eleştirmen kimdir?", "opts": ["Haroldo de Campos", "Ferreira Gullar", "Oswald de Andrade", "Mário Pedrosa"], "exp": "Şair Ferreira Gullar, 1959'da 'Neo-Konkret Manifesto'yu yazdı; Lygia Clark, Lygia Pape ve Hélio Oiticica gibi sanatçılar imzaladı.", "detail": ["Neo-Konkretler, São Paulo'daki katı matematiksel Konkret sanata karşı çıkarak eserin izleyiciyle duygusal ve bedensel ilişkisini öne çıkardı. Oswald de Andrade ise 1928'deki 'Yamyamlık Manifestosu'nun yazarıdır."]}, "fr": {"q": "Quel poète et critique a écrit le « Manifeste néoconcret », publié à Rio de Janeiro en 1959 ?", "opts": ["Haroldo de Campos", "Ferreira Gullar", "Oswald de Andrade", "Mário Pedrosa"], "exp": "Le poète Ferreira Gullar écrit le « Manifeste néoconcret » en 1959 ; des artistes comme Lygia Clark, Lygia Pape et Hélio Oiticica le signent.", "detail": ["Contre l'art concret mathématique de São Paulo, les néoconcrets mettent en avant la relation émotionnelle et corporelle entre l'œuvre et le spectateur. Oswald de Andrade, lui, est l'auteur du « Manifeste anthropophage » de 1928."]}, "en": {"q": "Which poet and critic wrote the 'Neo-Concrete Manifesto', published in Rio de Janeiro in 1959?", "opts": ["Haroldo de Campos", "Ferreira Gullar", "Oswald de Andrade", "Mário Pedrosa"], "exp": "The poet Ferreira Gullar wrote the 'Neo-Concrete Manifesto' in 1959; artists such as Lygia Clark, Lygia Pape and Hélio Oiticica signed it.", "detail": ["Against the strict mathematical Concrete art of São Paulo, the Neo-Concretists stressed the emotional and bodily relation between work and viewer. Oswald de Andrade wrote the 'Cannibalist Manifesto' of 1928."]}, "id": "x-09-14", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1960, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "americas", "medium": "sculpture", "tags": ["neoconcrete", "postwar", "sculpture", "women", "r-latam"], "topics": ["neoconcrete", "postwar", "sculpture", "women", "r-latam"], "search": {"commons": "Lygia Clark Bichos", "wiki": {"en": "Lygia Clark Bichos"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Brezilyalı Neo-Konkret bir sanatçıyım.", "1960'ta menteşelerle birbirine bağlanmış metal levhalardan oluşan, izleyicinin elle biçimini değiştirdiği 'Bichos' (Yaratıklar) serisini yaptım.", "Sonraki yıllarda sanatı terapiye yaklaştıran, bedene dokunan 'ilişkisel nesneler' geliştirdim."], "opts": ["Lygia Pape", "Tarsila do Amaral", "Mira Schendel", "Lygia Clark"], "exp": "Cevap Lygia Clark'tır. Eseri izleyicinin dokunuşuyla tamamlanan bir süreç olarak gördü.", "detail": ["Bichos'un 'doğru' bir biçimi yoktur; her dokunuşla yeni bir yapı oluşur. Clark'ın sonraki çalışmaları sanat ile psikoterapi arasında bir alanda gelişti. MoMA 2014'te büyük bir retrospektifini düzenledi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis une artiste néoconcrète brésilienne.", "En 1960, j'ai créé les « Bichos » (Bêtes), des plaques de métal reliées par des charnières que le spectateur peut manipuler.", "Plus tard, j'ai développé des « objets relationnels » qui touchent le corps et rapprochent l'art de la thérapie."], "opts": ["Lygia Pape", "Tarsila do Amaral", "Mira Schendel", "Lygia Clark"], "exp": "La réponse est Lygia Clark. Pour elle, l'œuvre est un processus que le geste du spectateur complète.", "detail": ["Les Bichos n'ont pas de « bonne » forme : chaque manipulation crée une nouvelle structure. Ses travaux tardifs se situent entre art et psychothérapie. Le MoMA lui a consacré une grande rétrospective en 2014."]}, "en": {"q": "Who am I?", "clues": ["I am a Brazilian Neo-Concrete artist.", "In 1960 I made the 'Bichos' (Critters), metal plates joined by hinges that viewers reshape by hand.", "Later I developed 'relational objects' that touch the body and bring art close to therapy."], "opts": ["Lygia Pape", "Tarsila do Amaral", "Mira Schendel", "Lygia Clark"], "exp": "The answer is Lygia Clark. She saw the work as a process completed by the viewer's touch.", "detail": ["The Bichos have no 'correct' shape; every touch creates a new structure. Her later work lay between art and psychotherapy. MoMA held a major retrospective of her work in 2014."]}, "id": "x-09-15", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1975, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "asia", "medium": "painting", "tags": ["dansaekhwa", "postwar", "painting", "r-fareast"], "topics": ["dansaekhwa", "postwar", "painting", "r-fareast"], "search": {"commons": "Park Seo-bo Ecriture", "wiki": {"en": "Park Seo-bo Ecriture"}}, "answer": 2, "tr": {"q": "1970'lerde gelişen, sade, tek renkli ve tekrara dayalı Kore soyut resim hareketinin adı nedir?", "opts": ["Gutai", "Minhwa", "Dansaekhwa", "Mono-ha"], "exp": "Dansaekhwa ('tek renkli resim'), 1970'lerde Kore'de Park Seo-bo, Ha Chong-hyun, Yun Hyong-keun ve Chung Sang-hwa gibi sanatçılarla gelişti.", "detail": ["Sanatçılar kâğıdı katlamak, boyayı tuvalin arkasından itmek, ıslak yüzeye kurşunkalemle tekrar tekrar çizmek gibi bedensel ve sabır isteyen yöntemler kullandı. 2010'larda uluslararası sanat piyasasında büyük ilgi gördü."]}, "fr": {"q": "Comment s'appelle le mouvement coréen de peinture abstraite des années 1970, simple, monochrome et fondé sur la répétition ?", "opts": ["Gutai", "Minhwa", "Dansaekhwa", "Mono-ha"], "exp": "Le Dansaekhwa (« peinture monochrome ») se développe en Corée dans les années 1970 avec Park Seo-bo, Ha Chong-hyun, Yun Hyong-keun et Chung Sang-hwa.", "detail": ["Les artistes utilisent des gestes lents et physiques : plier le papier, pousser la peinture à travers l'arrière de la toile, tracer encore et encore au crayon dans la peinture humide. Le mouvement a connu un grand succès international dans les années 2010."]}, "en": {"q": "What is the name of the 1970s Korean movement of simple, monochrome abstract painting based on repetition?", "opts": ["Gutai", "Minhwa", "Dansaekhwa", "Mono-ha"], "exp": "Dansaekhwa ('monochrome painting') developed in Korea in the 1970s with artists such as Park Seo-bo, Ha Chong-hyun, Yun Hyong-keun and Chung Sang-hwa.", "detail": ["Artists used slow, physical methods: folding paper, pushing paint through the back of the canvas, drawing pencil lines again and again into wet paint. The movement drew great international attention in the 2010s."]}, "id": "x-09-16", "t": 1794800000000}, {"type": "tf", "level": 4, "year": 1974, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "asia", "medium": "painting", "tags": ["dansaekhwa", "postwar", "painting", "r-fareast"], "topics": ["dansaekhwa", "postwar", "painting", "r-fareast"], "search": {"commons": "Ha Chong-hyun Conjunction", "wiki": {"en": "Ha Chong-hyun Conjunction"}}, "answer": true, "tr": {"q": "Ha Chong-hyun 'Birleşme' (Conjunction) serisinde boyayı kaba çuval bezinin arka yüzünden iterek ön yüze geçirir.", "exp": "Doğru. Ha, 1974'ten itibaren yoğun boyayı kaba dokulu kumaşın arkasından bastırarak ön yüzde dokulu izler oluşturdu.", "detail": ["Bu yöntem, Kore Savaşı sonrası kıtlık yıllarında yardım malzemesi taşıyan çuvallarla da ilişkilendirilir. Malzemenin kendisi eserin anlamının bir parçası olur; resim yüzeyi ile arka arasındaki sınır bulanıklaşır."]}, "fr": {"q": "Dans sa série « Conjunction », Ha Chong-hyun pousse la peinture à travers l'arrière d'une toile de jute grossière jusqu'à la face avant.", "exp": "Vrai. À partir de 1974, Ha presse une peinture épaisse à travers l'arrière de la toile grossière, ce qui crée des traces en relief à l'avant.", "detail": ["La méthode est aussi liée aux sacs d'aide alimentaire des années de pénurie après la guerre de Corée. Le matériau devient une partie du sens de l'œuvre, et la frontière entre l'avant et l'arrière du tableau devient floue."]}, "en": {"q": "In his 'Conjunction' series, Ha Chong-hyun pushes paint through the back of coarse hemp cloth to the front.", "exp": "True. From 1974 Ha pressed thick paint through the back of rough cloth, creating textured marks on the front.", "detail": ["The method is also linked to the aid sacks of the hungry years after the Korean War. The material itself becomes part of the work's meaning, and the border between the front and back of the painting blurs."]}, "id": "x-09-17", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1982, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "americas", "medium": "painting", "tags": ["neoexpressionism", "streetart", "contemporary", "painting", "r-namerica"], "topics": ["neoexpressionism", "streetart", "contemporary", "painting", "r-namerica"], "search": {"commons": "Jean-Michel Basquiat crown", "wiki": {"en": "Jean-Michel Basquiat crown"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Brooklyn'de Haitili bir baba ve Porto Rikolu bir annenin oğlu olarak doğdum.", "Gençliğimde arkadaşım Al Diaz ile New York duvarlarına 'SAMO©' imzalı yazılar yazdım.", "Taç simgesi, kelimeler ve anatomik çizimlerle dolu resimler yaptım; Warhol ile birlikte çalıştım ve 27 yaşında öldüm."], "opts": ["Jean-Michel Basquiat", "Keith Haring", "Kenny Scharf", "Fab 5 Freddy"], "exp": "Cevap Jean-Michel Basquiat'tır. Neo-Ekspresyonizmin ve 1980'ler New York sahnesinin en önemli isimlerindendir.", "detail": ["Basquiat ırkçılığı, sömürgeciliği ve siyah tarihini güçlü, yazılı ve çizili yüzeylerle işledi. 2017'de 'Başlıksız' (1982) adlı bir tablosu 110,5 milyon dolara satıldı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Brooklyn, d'un père haïtien et d'une mère portoricaine.", "Jeune, avec mon ami Al Diaz, j'ai écrit sur les murs de New York des phrases signées « SAMO© ».", "J'ai peint des tableaux pleins de couronnes, de mots et de dessins anatomiques ; j'ai travaillé avec Warhol et je suis mort à 27 ans."], "opts": ["Jean-Michel Basquiat", "Keith Haring", "Kenny Scharf", "Fab 5 Freddy"], "exp": "La réponse est Jean-Michel Basquiat, une figure majeure du néo-expressionnisme et de la scène new-yorkaise des années 1980.", "detail": ["Basquiat traite du racisme, du colonialisme et de l'histoire noire avec des surfaces fortes, pleines d'écritures et de dessins. En 2017, un « Untitled » (1982) a été vendu 110,5 millions de dollars."]}, "en": {"q": "Who am I?", "clues": ["I was born in Brooklyn to a Haitian father and a Puerto Rican mother.", "As a teenager, with my friend Al Diaz, I wrote messages signed 'SAMO©' on New York walls.", "I made paintings full of crowns, words and anatomical drawings; I worked with Warhol and died at 27."], "opts": ["Jean-Michel Basquiat", "Keith Haring", "Kenny Scharf", "Fab 5 Freddy"], "exp": "The answer is Jean-Michel Basquiat, a major figure of Neo-Expressionism and the 1980s New York scene.", "detail": ["Basquiat dealt with racism, colonialism and Black history through powerful surfaces full of writing and drawing. In 2017 an 'Untitled' (1982) sold for 110.5 million dollars."]}, "id": "x-10-0", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1969, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "painting", "tags": ["neoexpressionism", "postwar", "painting"], "topics": ["neoexpressionism", "postwar", "painting"], "search": {"commons": "Georg Baselitz upside down painting", "wiki": {"en": "Georg Baselitz upside down painting"}}, "answer": 1, "tr": {"q": "1969'dan itibaren figürlerini tuvalde baş aşağı resmetmesiyle tanınan Alman Neo-Ekspresyonist ressam kimdir?", "opts": ["Anselm Kiefer", "Georg Baselitz", "Jörg Immendorff", "A. R. Penck"], "exp": "Georg Baselitz, 1969'dan beri figürleri ters çevirerek izleyicinin konuya değil resmin kendisine bakmasını istedi.", "detail": ["Baselitz Doğu Almanya'da doğdu ve Batı Berlin'e geçti. Kiefer ise Alman tarihini ve Nazi geçmişini toprak, saman ve kurşunla yaptığı dev tablolarda işledi. Bu ressamlar 1980'lerde 'Neue Wilde' ve Neo-Ekspresyonizm başlığıyla tanındı."]}, "fr": {"q": "Quel peintre néo-expressionniste allemand est connu pour peindre ses figures la tête en bas depuis 1969 ?", "opts": ["Anselm Kiefer", "Georg Baselitz", "Jörg Immendorff", "A. R. Penck"], "exp": "Depuis 1969, Georg Baselitz retourne ses figures pour que le spectateur regarde la peinture elle-même plutôt que le sujet.", "detail": ["Baselitz est né en Allemagne de l'Est et il est passé à Berlin-Ouest. Kiefer, lui, travaille l'histoire allemande et le passé nazi dans d'immenses tableaux en terre, paille et plomb. Ces peintres sont connus dans les années 1980 sous les noms de « Neue Wilde » et de néo-expressionnisme."]}, "en": {"q": "Which German Neo-Expressionist painter is known for painting his figures upside down since 1969?", "opts": ["Anselm Kiefer", "Georg Baselitz", "Jörg Immendorff", "A. R. Penck"], "exp": "Since 1969 Georg Baselitz has turned his figures upside down so that viewers look at the painting itself rather than the subject.", "detail": ["Baselitz was born in East Germany and moved to West Berlin. Kiefer dealt with German history and the Nazi past in huge paintings made with earth, straw and lead. These painters became known in the 1980s as 'Neue Wilde' and Neo-Expressionists."]}, "id": "x-10-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1981, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "europe", "medium": "painting", "tags": ["neoexpressionism", "contemporary", "painting"], "topics": ["neoexpressionism", "contemporary", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "1981'de Londra'daki Royal Academy'de açılan 'Resimde Yeni Bir Ruh' (A New Spirit in Painting) sergisi, kavramsal sanattan sonra figüratif resmin geri dönüşünün simgesi oldu.", "exp": "Doğru. Sergi, Baselitz, Kiefer, Schnabel ve Picasso'nun son dönem eserleri gibi resimleri bir araya getirdi.", "detail": ["1970'lerde kavramsal ve minimal sanat egemenken, bu sergi resmin 'öldüğü' fikrine karşı çıktı. Ertesi yıl Berlin'deki 'Zeitgeist' sergisi de aynı eğilimi güçlendirdi."]}, "fr": {"q": "L'exposition « A New Spirit in Painting », ouverte à la Royal Academy de Londres en 1981, est devenue le symbole du retour de la peinture figurative après l'art conceptuel.", "exp": "Vrai. L'exposition réunissait des peintures de Baselitz, Kiefer, Schnabel et des œuvres tardives de Picasso.", "detail": ["Dans les années 1970, dominées par l'art conceptuel et minimal, on disait la peinture « morte » ; l'exposition s'y oppose. L'année suivante, l'exposition « Zeitgeist » à Berlin renforce cette tendance."]}, "en": {"q": "The exhibition 'A New Spirit in Painting', opened at the Royal Academy in London in 1981, became the symbol of figurative painting's return after Conceptual art.", "exp": "True. It brought together paintings by Baselitz, Kiefer, Schnabel and late works by Picasso.", "detail": ["In the 1970s, dominated by Conceptual and Minimal art, painting was often called 'dead'; this show argued against that. The next year the 'Zeitgeist' show in Berlin strengthened the trend."]}, "id": "x-10-2", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1978, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "photo", "tags": ["picturesgen", "postwar", "photo", "women", "r-namerica"], "topics": ["picturesgen", "postwar", "photo", "women", "r-namerica"], "search": {"commons": "Cindy Sherman Untitled Film Still", "wiki": {"en": "Untitled Film Stills"}}, "answer": 2, "tr": {"q": "Bu tarz, sanatçının kendini 1950'ler filmlerindeki kadın tiplerine benzer biçimde fotoğrafladığı hangi seriyi akla getirir?", "opts": ["Nan Goldin – Cinsel Bağımlılığın Baladı", "Francesca Woodman – Uzay²", "Cindy Sherman – Başlıksız Film Kareleri", "Barbara Kruger – Başlıksız"], "exp": "Cindy Sherman'ın 'Başlıksız Film Kareleri' (1977–80), sanatçının kendini kurgusal kadın karakterlere dönüştürdüğü 70 siyah beyaz fotoğraftır.", "detail": ["Fotoğraflar gerçek bir filmden alınmamıştır; Sherman, medyadaki kadın imgelerinin ne kadar kurgusal olduğunu gösterir. Seri MoMA'nın koleksiyonundadır ve 'Pictures Generation'ın simgesidir."]}, "fr": {"q": "Ce style, où l'artiste se photographie comme les types féminins des films des années 1950, fait penser à quelle série ?", "opts": ["Nan Goldin – The Ballad of Sexual Dependency", "Francesca Woodman – Space²", "Cindy Sherman – Untitled Film Stills", "Barbara Kruger – Untitled"], "exp": "Les « Untitled Film Stills » de Cindy Sherman (1977–1980) sont 70 photos en noir et blanc où l'artiste se transforme en personnages féminins imaginaires.", "detail": ["Les photos ne viennent d'aucun vrai film : Sherman montre que les images de femmes dans les médias sont construites. La série est au MoMA et symbolise la « Pictures Generation »."]}, "en": {"q": "This style, where the artist photographs herself as female types from 1950s films, recalls which series?", "opts": ["Nan Goldin – The Ballad of Sexual Dependency", "Francesca Woodman – Space²", "Cindy Sherman – Untitled Film Stills", "Barbara Kruger – Untitled"], "exp": "Cindy Sherman's 'Untitled Film Stills' (1977–80) are 70 black and white photos in which the artist turns herself into fictional female characters.", "detail": ["The photos come from no real film; Sherman shows how constructed media images of women are. The series is in MoMA and is a symbol of the 'Pictures Generation'."]}, "id": "x-10-3", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1977, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "photo", "tags": ["picturesgen", "postwar", "photo", "r-namerica"], "topics": ["picturesgen", "postwar", "photo", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "'Pictures Generation' adı 1977'de New York'taki Artists Space'te açılan bir sergiden gelir. Sergiyi düzenleyen eleştirmen kimdir?", "opts": ["Douglas Crimp", "Clement Greenberg", "Hal Foster", "Arthur Danto"], "exp": "Douglas Crimp 1977'de 'Pictures' adlı sergiyi düzenledi; bu sergi, medyadan alınan imgeleri yeniden kullanan genç sanatçılara adını verdi.", "detail": ["Bu sanatçılar reklam, film ve dergi imgelerini 'ödünç alarak' (appropriation) özgünlük ve yazarlık fikrini sorguladı. Sherrie Levine, Richard Prince, Barbara Kruger ve Louise Lawler bu kuşağın önemli isimleridir."]}, "fr": {"q": "Le nom « Pictures Generation » vient d'une exposition de 1977 à Artists Space, à New York. Quel critique l'a organisée ?", "opts": ["Douglas Crimp", "Clement Greenberg", "Hal Foster", "Arthur Danto"], "exp": "En 1977, Douglas Crimp organise l'exposition « Pictures », qui donne son nom à de jeunes artistes réutilisant des images des médias.", "detail": ["Ces artistes « empruntent » (appropriation) des images de publicité, de cinéma et de magazines pour interroger l'originalité et l'auteur. Sherrie Levine, Richard Prince, Barbara Kruger et Louise Lawler en sont des figures importantes."]}, "en": {"q": "The name 'Pictures Generation' comes from a 1977 exhibition at Artists Space in New York. Which critic organised it?", "opts": ["Douglas Crimp", "Clement Greenberg", "Hal Foster", "Arthur Danto"], "exp": "In 1977 Douglas Crimp organised the 'Pictures' exhibition, which gave its name to young artists who reused media images.", "detail": ["These artists 'borrowed' (appropriation) images from advertising, film and magazines to question originality and authorship. Sherrie Levine, Richard Prince, Barbara Kruger and Louise Lawler are key names."]}, "id": "x-10-4", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1987, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "americas", "medium": "design", "tags": ["picturesgen", "contemporary", "design", "women", "r-namerica"], "topics": ["picturesgen", "contemporary", "design", "women", "r-namerica"], "search": {"commons": "Barbara Kruger I shop therefore I am", "wiki": {"en": "Barbara Kruger I shop therefore I am"}}, "answer": true, "tr": {"q": "Barbara Kruger'ın 'Alışveriş yapıyorum, öyleyse varım' (I shop therefore I am) sloganı, Descartes'ın ünlü sözüne yapılan bir göndermedir.", "exp": "Doğru. 1987 tarihli eser, 'Düşünüyorum, öyleyse varım' sözünü tüketim toplumuna uyarlar.", "detail": ["Kruger, dergi grafikerliğinden gelen deneyimiyle siyah beyaz fotoğrafların üzerine kırmızı bantlarda beyaz Futura harfleriyle kısa sloganlar yerleştirir. Bu üslup daha sonra bazı moda markalarınca taklit edildi."]}, "fr": {"q": "Le slogan de Barbara Kruger « I shop therefore I am » (J'achète donc je suis) fait référence à la célèbre phrase de Descartes.", "exp": "Vrai. L'œuvre de 1987 adapte « Je pense donc je suis
