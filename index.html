ler hiç üretilmedi.", "exp": "Yanlış. 1923–24'te Moskova'daki Birinci Devlet Pamuklu Baskı Fabrikası için çalıştılar ve desenleri seri olarak basıldı.", "detail": ["Konstrüktivistler sanatı günlük yaşama, üretime taşımak istedi. Popova ve Stepanova'nın geometrik desenleri gerçek giysilere dönüştü. Popova 1924'te kızıl ateşten genç yaşta öldü."]}, "fr": {"q": "Lioubov Popova et Varvara Stepanova ont dessiné des tissus constructivistes seulement pour les musées ; ils n'ont jamais été produits.", "exp": "Faux. En 1923–1924, elles travaillent pour la Première fabrique d'impression sur coton de Moscou, et leurs motifs sont produits en série.", "detail": ["Les constructivistes veulent mettre l'art dans la vie quotidienne et la production. Les motifs géométriques de Popova et Stepanova deviennent de vrais vêtements. Popova meurt jeune en 1924 de la scarlatine."]}, "en": {"q": "Lyubov Popova and Varvara Stepanova designed Constructivist fabrics only for museums; they were never produced.", "exp": "False. In 1923–24 they worked for the First State Textile Printing Factory in Moscow, and their patterns were mass-produced.", "detail": ["Constructivists wanted to bring art into everyday life and production. Popova's and Stepanova's geometric patterns became real clothes. Popova died young in 1924 of scarlet fever."]}, "id": "x-05-16", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1930, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "painting", "tags": ["destijl", "modern", "painting"], "topics": ["destijl", "modern", "painting"], "search": {"commons": "Mondrian Composition with Red Blue and Yellow 1930", "wiki": {"en": "Composition with Red, Blue and Yellow"}}, "answer": 3, "tr": {"q": "Bu tarz resim hangi sanatçıya aittir?", "opts": ["Kazimir Malevich", "Theo van Doesburg", "Josef Albers", "Piet Mondrian"], "exp": "Siyah yatay ve dikey çizgiler arasında kırmızı, mavi ve sarı alanlar Piet Mondrian'ın 'Neoplastisizm' üslubunun tipik özelliğidir.", "detail": ["Mondrian yalnızca dik açılar, ana renkler ve beyaz, gri ve siyah kullandı. Bu sade dil moda, mimari ve grafik tasarımı derinden etkiledi; Yves Saint Laurent'in 1965 'Mondrian elbiseleri' ünlü bir örnektir."]}, "fr": {"q": "À quel artiste appartient ce style de peinture ?", "opts": ["Kazimir Malevitch", "Theo van Doesburg", "Josef Albers", "Piet Mondrian"], "exp": "Des surfaces rouges, bleues et jaunes entre des lignes noires horizontales et verticales : c'est le « néoplasticisme » typique de Piet Mondrian.", "detail": ["Mondrian n'utilise que l'angle droit, les couleurs primaires, le blanc, le gris et le noir. Ce langage simple a beaucoup influencé la mode, l'architecture et le graphisme ; les robes « Mondrian » d'Yves Saint Laurent (1965) en sont un exemple célèbre."]}, "en": {"q": "Which artist does this style of painting belong to?", "opts": ["Kazimir Malevich", "Theo van Doesburg", "Josef Albers", "Piet Mondrian"], "exp": "Red, blue and yellow areas between black horizontal and vertical lines are typical of Piet Mondrian's 'Neoplasticism'.", "detail": ["Mondrian used only right angles, primary colours, white, grey and black. This simple language strongly influenced fashion, architecture and graphic design; Yves Saint Laurent's 1965 'Mondrian dresses' are a famous example."]}, "id": "x-06-0", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1924, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "arch", "tags": ["destijl", "modern", "architecture"], "topics": ["destijl", "modern", "architecture"], "search": {"commons": "Rietveld Schröder House", "wiki": {"en": "Rietveld Schröder House"}}, "answer": 0, "tr": {"q": "Utrecht'teki Rietveld Schröder Evi (1924) hangi akımın mimarideki en saf örneği sayılır?", "opts": ["De Stijl", "Bauhaus", "Art Deco", "Brutalizm"], "exp": "Gerrit Rietveld'in tasarladığı ev, De Stijl'in düzlemlerini, ana renklerini ve hareketli iç bölmelerini mimariye taşır.", "detail": ["Evin üst katında sürgülü duvarlar sayesinde mekân açılıp kapanabilir. Rietveld aynı akımın simgesi olan 'Kırmızı Mavi Sandalye'yi de tasarladı. Ev UNESCO Dünya Mirası'dır."]}, "fr": {"q": "La maison Rietveld Schröder à Utrecht (1924) est l'exemple architectural le plus pur de quel mouvement ?", "opts": ["De Stijl", "Le Bauhaus", "L'Art déco", "Le brutalisme"], "exp": "Conçue par Gerrit Rietveld, la maison transpose en architecture les plans, les couleurs primaires et les cloisons mobiles de De Stijl.", "detail": ["À l'étage, des murs coulissants permettent d'ouvrir ou de fermer l'espace. Rietveld a aussi créé la « chaise rouge et bleue », symbole du mouvement. La maison est classée à l'UNESCO."]}, "en": {"q": "The Rietveld Schröder House in Utrecht (1924) is the purest architectural example of which movement?", "opts": ["De Stijl", "Bauhaus", "Art Deco", "Brutalism"], "exp": "Designed by Gerrit Rietveld, the house brings De Stijl's planes, primary colours and movable partitions into architecture.", "detail": ["Upstairs, sliding walls let the space open or close. Rietveld also designed the 'Red and Blue Chair', a symbol of the movement. The house is a UNESCO World Heritage site."]}, "id": "x-06-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1924, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "painting", "tags": ["destijl", "modern", "painting"], "topics": ["destijl", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Mondrian, Theo van Doesburg'un çapraz çizgileri kullanmaya başlaması üzerine De Stijl grubundan ayrıldı.", "exp": "Doğru. Van Doesburg 'Elementarizm' adıyla eğik çizgileri savununca, yalnızca yatay ve dikeye inanan Mondrian 1924 civarında gruptan koptu.", "detail": ["De Stijl dergisi 1917'de Van Doesburg tarafından kuruldu ve 1931'deki ölümüne kadar yayımlandı. Anlaşmazlık küçük görünse de iki sanatçı için evrensel düzen fikriyle ilgili temel bir soruydu."]}, "fr": {"q": "Mondrian a quitté De Stijl quand Theo van Doesburg a commencé à utiliser des lignes diagonales.", "exp": "Vrai. Quand Van Doesburg défend les obliques sous le nom d'« élémentarisme », Mondrian, attaché à l'horizontale et à la verticale, quitte le groupe vers 1924.", "detail": ["La revue De Stijl est fondée par Van Doesburg en 1917 et paraît jusqu'à sa mort en 1931. Le désaccord semble petit, mais pour eux il touchait à l'idée d'un ordre universel."]}, "en": {"q": "Mondrian left De Stijl when Theo van Doesburg began to use diagonal lines.", "exp": "True. When Van Doesburg defended diagonals under the name 'Elementarism', Mondrian, who believed only in horizontal and vertical, left the group around 1924.", "detail": ["The De Stijl magazine was founded by Van Doesburg in 1917 and ran until his death in 1931. The quarrel looks small, but for them it touched the idea of a universal order."]}, "id": "x-06-2", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1917, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "sculpture", "tags": ["dada", "modern", "sculpture", "conceptual"], "topics": ["dada", "modern", "sculpture", "conceptual"], "search": {"commons": "Duchamp Fountain 1917 Stieglitz photograph", "wiki": {"en": "Fountain (Duchamp)"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Man Ray – Hediye", "Duchamp – Çeşme", "Oppenheim – Nesne", "Picabia – Kakodilat Gözü"], "exp": "Marcel Duchamp'ın Çeşme'si (1917), 'R. Mutt' imzalı, ters çevrilmiş bir pisuvardır ve hazır-yapıt (readymade) fikrinin simgesidir.", "detail": ["Eser New York'taki Bağımsız Sanatçılar Derneği sergisine gönderildi ve gösterilmedi. Orijinali kayboldu; bugün bilinen kopyalar 1960'larda yapıldı ve birçok müzededir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Man Ray – Cadeau", "Duchamp – Fontaine", "Oppenheim – Objet", "Picabia – L'Œil cacodylate"], "exp": "Fontaine de Marcel Duchamp (1917) est un urinoir retourné, signé « R. Mutt » : c'est le symbole du ready-made.", "detail": ["L'œuvre est envoyée à l'exposition de la Société des artistes indépendants à New York et n'est pas exposée. L'original est perdu ; les répliques connues datent des années 1960 et sont dans plusieurs musées."]}, "en": {"q": "Which work is this?", "opts": ["Man Ray – Gift", "Duchamp – Fountain", "Oppenheim – Object", "Picabia – The Cacodylic Eye"], "exp": "Marcel Duchamp's Fountain (1917) is an upturned urinal signed 'R. Mutt', the symbol of the readymade.", "detail": ["It was sent to the Society of Independent Artists' show in New York and was not displayed. The original is lost; the known replicas date from the 1960s and are in several museums."]}, "id": "x-06-3", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1916, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "performance", "tags": ["dada", "modern", "performance"], "topics": ["dada", "modern", "performance"], "search": {"commons": "Cabaret Voltaire Zurich", "wiki": {"en": "Cabaret Voltaire (Zürich)"}}, "answer": 2, "tr": {"q": "Dada hareketi 1916'da hangi şehirdeki Cabaret Voltaire'de doğdu?", "opts": ["Berlin", "Paris", "Zürih", "New York"], "exp": "Hugo Ball ve Emmy Hennings, Birinci Dünya Savaşı sırasında tarafsız İsviçre'de, Zürih'te Cabaret Voltaire'i açtı.", "detail": ["Tristan Tzara, Hans Arp, Marcel Janco ve Richard Huelsenbeck de katıldı. Anlamsız ses şiirleri, kostümlü performanslar ve şok edici gösterilerle savaşa ve burjuva mantığına karşı çıktılar. Kabare bugün yeniden açık bir mekândır."]}, "fr": {"q": "Dans quelle ville le mouvement Dada est-il né en 1916, au Cabaret Voltaire ?", "opts": ["Berlin", "Paris", "Zurich", "New York"], "exp": "Pendant la Première Guerre mondiale, Hugo Ball et Emmy Hennings ouvrent le Cabaret Voltaire à Zurich, en Suisse neutre.", "detail": ["Tristan Tzara, Hans Arp, Marcel Janco et Richard Huelsenbeck les rejoignent. Avec des poèmes sonores sans sens, des performances costumées et des spectacles choquants, ils s'opposent à la guerre et à la logique bourgeoise. Le cabaret est de nouveau ouvert aujourd'hui."]}, "en": {"q": "In which city was Dada born in 1916, at the Cabaret Voltaire?", "opts": ["Berlin", "Paris", "Zurich", "New York"], "exp": "During the First World War, Hugo Ball and Emmy Hennings opened the Cabaret Voltaire in Zurich, in neutral Switzerland.", "detail": ["Tristan Tzara, Hans Arp, Marcel Janco and Richard Huelsenbeck joined them. With nonsense sound poems, costumed performances and shocking shows, they opposed the war and bourgeois logic. The cabaret is open again today."]}, "id": "x-06-4", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1919, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "design", "tags": ["dada", "modern", "design", "women"], "topics": ["dada", "modern", "design", "women"], "search": {"commons": "Hannah Höch Cut with the Kitchen Knife", "wiki": {"en": "Hannah Höch Cut with the Kitchen Knife"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Berlin Dada grubunun neredeyse tek kadın üyesiydim.", "Gazete ve dergilerden kestiğim görüntülerle fotomontajlar yaptım.", "En ünlü eserim 'Dada Mutfak Bıçağıyla Weimar Cumhuriyeti'nin Son Bira Göbeği Kültür Çağını Kes'tir."], "opts": ["Hannah Höch", "Sophie Taeuber-Arp", "Emmy Hennings", "Elsa von Freytag-Loringhoven"], "exp": "Cevap Hannah Höch'tür. Fotomontajın öncülerindendir.", "detail": ["Höch, kadınların 'Yeni Kadın' olarak değişen rolünü ve Weimar toplumunu ironik kolajlarla eleştirdi. Bu uzun başlıklı eser (1919–20) Berlin'deki Neue Nationalgalerie'dedir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'étais presque la seule femme du groupe Dada de Berlin.", "J'ai fait des photomontages avec des images découpées dans les journaux et les magazines.", "Mon œuvre la plus célèbre s'intitule « Coupe au couteau de cuisine Dada à travers la dernière époque culturelle de la République de Weimar »."], "opts": ["Hannah Höch", "Sophie Taeuber-Arp", "Emmy Hennings", "Elsa von Freytag-Loringhoven"], "exp": "La réponse est Hannah Höch, pionnière du photomontage.", "detail": ["Höch critique avec ironie la société de Weimar et le nouveau rôle de la « femme nouvelle ». Cette œuvre au long titre (1919–1920) est à la Neue Nationalgalerie de Berlin."]}, "en": {"q": "Who am I?", "clues": ["I was almost the only woman in the Berlin Dada group.", "I made photomontages with images cut from newspapers and magazines.", "My best-known work is 'Cut with the Kitchen Knife Dada through the Last Weimar Beer-Belly Cultural Epoch of Germany'."], "opts": ["Hannah Höch", "Sophie Taeuber-Arp", "Emmy Hennings", "Elsa von Freytag-Loringhoven"], "exp": "The answer is Hannah Höch, a pioneer of photomontage.", "detail": ["Höch used ironic collage to criticise Weimar society and the changing role of the 'New Woman'. This long-titled work (1919–20) is in the Neue Nationalgalerie in Berlin."]}, "id": "x-06-5", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1919, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "concept", "tags": ["dada", "modern", "conceptual"], "topics": ["dada", "modern", "conceptual"], "search": {"commons": "L.H.O.O.Q. Duchamp", "wiki": {"en": "L.H.O.O.Q. Duchamp"}}, "answer": true, "tr": {"q": "Duchamp, Mona Lisa'nın ucuz bir kartpostal reprodüksiyonuna bıyık ve sakal çizip altına 'L.H.O.O.Q.' yazdı.", "exp": "Doğru. 1919 tarihli eser, Fransızca okunuşuyla kaba bir cinas oluşturan harflerle Batı sanatının en ünlü ikonuyla alay eder.", "detail": ["Duchamp bu 'düzeltilmiş hazır-yapıt' ile sanatın kutsallığını ve müze kültürünü sorguladı. 1965'te bıyıksız bir kartpostalı 'L.H.O.O.Q. Shaved' adıyla sergiledi."]}, "fr": {"q": "Duchamp a dessiné une moustache et une barbiche sur une carte postale bon marché de la Joconde et a écrit « L.H.O.O.Q. » dessous.", "exp": "Vrai. L'œuvre de 1919 se moque de l'icône la plus célèbre de l'art occidental, avec des lettres qui forment un jeu de mots grossier en français.", "detail": ["Avec ce « ready-made rectifié », Duchamp interroge le caractère sacré de l'art et la culture des musées. En 1965, il expose une carte sans moustache sous le titre « L.H.O.O.Q. rasée »."]}, "en": {"q": "Duchamp drew a moustache and goatee on a cheap postcard of the Mona Lisa and wrote 'L.H.O.O.Q.' under it.", "exp": "True. The 1919 work mocks the most famous icon of Western art, with letters that form a rude pun when read aloud in French.", "detail": ["With this 'rectified readymade', Duchamp questioned the sacred status of art and museum culture. In 1965 he showed a postcard without the moustache as 'L.H.O.O.Q. Shaved'."]}, "id": "x-06-6", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1931, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "painting", "tags": ["surrealism", "modern", "painting"], "topics": ["surrealism", "modern", "painting"], "search": {"commons": "Dalí The Persistence of Memory", "wiki": {"en": "The Persistence of Memory"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Magritte – Bu Bir Pipo Değildir", "Ernst – Çarşı Yalnızlığı", "Dalí – Belleğin Azmi", "Tanguy – Gün Işığı Yavaşlığı"], "exp": "Salvador Dalí'nin Belleğin Azmi (1931), Katalan sahilinde eriyen saatleriyle Sürrealizmin en tanınan imgesidir.", "detail": ["Dalí, kendi 'paranoyak-eleştirel yöntemi' ile rüya imgelerini fotoğraf gibi net bir teknikle resmetti. Tablo oldukça küçüktür (24 × 33 cm) ve New York'taki MoMA'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Magritte – Ceci n'est pas une pipe", "Ernst – L'Ange du foyer", "Dalí – La Persistance de la mémoire", "Tanguy – Lenteur du jour"], "exp": "La Persistance de la mémoire de Salvador Dalí (1931), avec ses montres molles sur une côte catalane, est l'image la plus connue du surréalisme.", "detail": ["Avec sa « méthode paranoïaque-critique », Dalí peint des images de rêve avec une précision photographique. Le tableau est assez petit (24 × 33 cm) et se trouve au MoMA."]}, "en": {"q": "Which work is this?", "opts": ["Magritte – This Is Not a Pipe", "Ernst – The Angel of Hearth and Home", "Dalí – The Persistence of Memory", "Tanguy – Slowness of Day"], "exp": "Salvador Dalí's The Persistence of Memory (1931), with its melting watches on a Catalan coast, is the best-known image of Surrealism.", "detail": ["With his 'paranoiac-critical method', Dalí painted dream images with photographic precision. The painting is quite small (24 × 33 cm) and is in MoMA."]}, "id": "x-06-7", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1924, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "concept", "tags": ["surrealism", "modern"], "topics": ["surrealism", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1924'te 'Sürrealizm Manifestosu'nu yazan ve akımın lideri olan kimdir?", "opts": ["Louis Aragon", "André Breton", "Paul Éluard", "Philippe Soupault"], "exp": "André Breton, 1924'teki manifestosunda Sürrealizmi 'aklın hiçbir denetimi olmadan, düşüncenin gerçek işleyişini ifade eden saf psişik otomatizm' olarak tanımladı.", "detail": ["Breton, Freud'un bilinçaltı ve rüya kuramlarından etkilendi. Grup Paris'te toplandı; Breton anlaşamadığı üyeleri sık sık dışarıda bıraktı ve 'Sürrealizmin Papası' diye anıldı."]}, "fr": {"q": "Qui a écrit le « Manifeste du surréalisme » en 1924 et dirigé le mouvement ?", "opts": ["Louis Aragon", "André Breton", "Paul Éluard", "Philippe Soupault"], "exp": "Dans son manifeste de 1924, André Breton définit le surréalisme comme un « automatisme psychique pur » qui exprime le fonctionnement réel de la pensée, sans contrôle de la raison.", "detail": ["Breton s'inspire des théories de Freud sur l'inconscient et le rêve. Le groupe se réunit à Paris ; Breton exclut souvent les membres avec qui il n'est pas d'accord, d'où son surnom de « pape du surréalisme »."]}, "en": {"q": "Who wrote the 'Surrealist Manifesto' in 1924 and led the movement?", "opts": ["Louis Aragon", "André Breton", "Paul Éluard", "Philippe Soupault"], "exp": "In his 1924 manifesto, André Breton defined Surrealism as 'pure psychic automatism' expressing the real working of thought, without any control by reason.", "detail": ["Breton was influenced by Freud's theories of the unconscious and dreams. The group met in Paris; Breton often expelled members he disagreed with, which earned him the nickname 'Pope of Surrealism'."]}, "id": "x-06-8", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1929, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "painting", "tags": ["surrealism", "modern", "painting", "conceptual"], "topics": ["surrealism", "modern", "painting", "conceptual"], "search": {"commons": "Magritte The Treachery of Images", "wiki": {"en": "Magritte The Treachery of Images"}}, "answer": false, "tr": {"q": "René Magritte'in 'Bu bir pipo değildir' yazılı tablosunun adı 'Belleğin Azmi'dir.", "exp": "Yanlış. Tablonun adı 'İmgelerin İhaneti'dir (1929). 'Belleğin Azmi' Dalí'nin eriyen saatli tablosudur.", "detail": ["Magritte, bir pipo resminin gerçek bir pipo olmadığını hatırlatarak imge ile nesne arasındaki ilişkiyi sorguladı. Filozof Michel Foucault bu eser üzerine bir kitap yazdı. Tablo Los Angeles County Müzesi'ndedir (LACMA)."]}, "fr": {"q": "Le tableau de René Magritte où l'on lit « Ceci n'est pas une pipe » s'intitule « La Persistance de la mémoire ».", "exp": "Faux. Il s'intitule « La Trahison des images » (1929). « La Persistance de la mémoire » est le tableau aux montres molles de Dalí.", "detail": ["Magritte rappelle que l'image d'une pipe n'est pas une vraie pipe et interroge le lien entre image et objet. Le philosophe Michel Foucault a écrit un livre sur cette œuvre. Elle est au LACMA, à Los Angeles."]}, "en": {"q": "René Magritte's painting with the words 'This is not a pipe' is titled 'The Persistence of Memory'.", "exp": "False. It is titled 'The Treachery of Images' (1929). 'The Persistence of Memory' is Dalí's painting with melting watches.", "detail": ["Magritte reminds us that a picture of a pipe is not a real pipe and questions the link between image and object. The philosopher Michel Foucault wrote a book about it. It is in LACMA in Los Angeles."]}, "id": "x-06-9", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1930, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "painting", "tags": ["surrealism", "modern", "painting"], "topics": ["surrealism", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Sürrealist sanatçıları teknikleriyle eşleştir.", "left": ["Max Ernst", "Salvador Dalí", "Joan Miró", "André Masson"], "right": ["Frottaj ve grattaj", "Paranoyak-eleştirel yöntem", "Biyomorfik, şiirsel işaretler", "Otomatik çizim ve kum resimleri"], "exp": "Sürrealistler bilinçaltına ulaşmak için farklı teknikler geliştirdi.", "detail": ["Ernst ahşap gibi dokulu yüzeylerin üzerine kâğıt koyup kurşunkalemle sürterek frottajı buldu. Masson, tuvale tutkal sürüp kum serperek rastlantıyı kullandı. Miró ise rüya gibi, renkli işaretlerden bir dil oluşturdu."]}, "fr": {"q": "Associe chaque artiste surréaliste à sa technique.", "left": ["Max Ernst", "Salvador Dalí", "Joan Miró", "André Masson"], "right": ["Frottage et grattage", "Méthode paranoïaque-critique", "Signes poétiques et biomorphiques", "Dessin automatique et tableaux de sable"], "exp": "Les surréalistes ont inventé plusieurs techniques pour atteindre l'inconscient.", "detail": ["Ernst invente le frottage en frottant un crayon sur un papier posé sur du bois. Masson étale de la colle sur la toile et y jette du sable pour utiliser le hasard. Miró crée un langage de signes colorés, comme dans un rêve."]}, "en": {"q": "Match each Surrealist artist with his technique.", "left": ["Max Ernst", "Salvador Dalí", "Joan Miró", "André Masson"], "right": ["Frottage and grattage", "Paranoiac-critical method", "Poetic, biomorphic signs", "Automatic drawing and sand paintings"], "exp": "The Surrealists invented several techniques to reach the unconscious.", "detail": ["Ernst invented frottage by rubbing a pencil over paper laid on wood. Masson spread glue on canvas and threw sand on it to use chance. Miró created a language of colourful, dreamlike signs."]}, "id": "x-06-10", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1914, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["metaphysical", "modern", "painting"], "topics": ["metaphysical", "modern", "painting"], "search": {"commons": "Giorgio de Chirico Mystery and Melancholy of a Street", "wiki": {"en": "Giorgio de Chirico Mystery and Melancholy of a Street"}}, "answer": 0, "tr": {"q": "Bu tarz, boş meydanlar, uzun gölgeler ve kemerli binalarla hangi ressamı akla getirir?", "opts": ["Giorgio de Chirico", "Carlo Carrà", "Giorgio Morandi", "Edward Hopper"], "exp": "Boş, sessiz meydanlar, keskin gölgeler ve uzak trenler Giorgio de Chirico'nun 'Metafizik Resim' üslubunun işaretleridir.", "detail": ["De Chirico 1910–1919 arasında yaptığı bu resimlerle Sürrealistleri derinden etkiledi. 'Bir Sokağın Gizemi ve Melankolisi' (1914), çember çeviren bir kız çocuğunun gölgesiyle ünlüdür."]}, "fr": {"q": "Avec ses places vides, ses longues ombres et ses arcades, ce style fait penser à quel peintre ?", "opts": ["Giorgio De Chirico", "Carlo Carrà", "Giorgio Morandi", "Edward Hopper"], "exp": "Des places vides et silencieuses, des ombres nettes, des trains lointains : ce sont les signes de la « peinture métaphysique » de Giorgio De Chirico.", "detail": ["Avec ces tableaux de 1910–1919, De Chirico influence fortement les surréalistes. « Mystère et mélancolie d'une rue » (1914) est célèbre pour la petite fille qui court avec un cerceau."]}, "en": {"q": "With its empty squares, long shadows and arcades, this style recalls which painter?", "opts": ["Giorgio de Chirico", "Carlo Carrà", "Giorgio Morandi", "Edward Hopper"], "exp": "Empty, silent squares, sharp shadows and distant trains are the signs of Giorgio de Chirico's 'Metaphysical Painting'.", "detail": ["With these paintings of 1910–1919, de Chirico deeply influenced the Surrealists. 'Mystery and Melancholy of a Street' (1914) is famous for the girl running with a hoop."]}, "id": "x-06-11", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1917, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "painting", "tags": ["metaphysical", "modern", "painting"], "topics": ["metaphysical", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "De Chirico ve Carlo Carrà, 'Pittura Metafisica'yı 1917'de hangi İtalyan şehrindeki askerî hastanede tanışarak geliştirdiler?", "opts": ["Torino", "Milano", "Roma", "Ferrara"], "exp": "İki ressam Birinci Dünya Savaşı sırasında Ferrara'daki bir askerî hastanede bir araya geldi; Ferrara'nın sessiz meydanları da resimlerine girdi.", "detail": ["Ferrara dönemi, terzi mankenleri ve iç içe geçmiş mekânlarla doludur. Giorgio Morandi de bir süre bu üsluba yaklaştı. Grup kısa sürdü, ama etkisi Sürrealizmde ve İtalyan 'Novecento'da devam etti."]}, "fr": {"q": "Dans quelle ville italienne De Chirico et Carlo Carrà se sont-ils rencontrés en 1917, dans un hôpital militaire, pour développer la « peinture métaphysique » ?", "opts": ["Turin", "Milan", "Rome", "Ferrare"], "exp": "Les deux peintres se retrouvent à Ferrare pendant la Première Guerre mondiale, dans un hôpital militaire ; les places calmes de la ville entrent dans leurs tableaux.", "detail": ["La période de Ferrare est pleine de mannequins de couturier et d'espaces imbriqués. Giorgio Morandi s'approche aussi un temps de ce style. Le groupe dure peu, mais son influence continue dans le surréalisme et le « Novecento » italien."]}, "en": {"q": "In which Italian city did de Chirico and Carlo Carrà meet in a military hospital in 1917 and develop 'Metaphysical Painting'?", "opts": ["Turin", "Milan", "Rome", "Ferrara"], "exp": "The two painters met in a military hospital in Ferrara during the First World War; the city's quiet squares entered their paintings.", "detail": ["The Ferrara period is full of tailor's dummies and interlocking spaces. Giorgio Morandi also came close to this style for a while. The group was short-lived, but its influence continued in Surrealism and the Italian 'Novecento'."]}, "id": "x-06-12", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1928, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "painting", "tags": ["newobjectivity", "modern", "painting"], "topics": ["newobjectivity", "modern", "painting"], "search": {"commons": "Otto Dix Metropolis triptych", "wiki": {"en": "Otto Dix Metropolis triptych"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Birinci Dünya Savaşı'nda makineli tüfekçi olarak savaştım.", "1924'te savaşın dehşetini gösteren 50 gravürlük 'Savaş' serisini yaptım.", "Weimar Berlin'inin gece hayatını 'Metropolis' triptiğinde sert ve ironik biçimde resmettim."], "opts": ["George Grosz", "Otto Dix", "Max Beckmann", "Christian Schad"], "exp": "Cevap Otto Dix'tir. Yeni Nesnellik (Neue Sachlichkeit) akımının önde gelen ressamıdır.", "detail": ["Dix, sakatlanmış savaş gazilerini ve kentin zengin-yoksul karşıtlığını acımasız bir gerçekçilikle gösterdi. 'Metropolis' (1927–28) Stuttgart Kunstmuseum'dadır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai combattu comme mitrailleur pendant la Première Guerre mondiale.", "En 1924, j'ai publié « La Guerre », une série de 50 gravures sur l'horreur de la guerre.", "J'ai peint la vie nocturne de Berlin sous Weimar dans le triptyque « Metropolis », de façon dure et ironique."], "opts": ["George Grosz", "Otto Dix", "Max Beckmann", "Christian Schad"], "exp": "La réponse est Otto Dix, l'un des grands peintres de la Nouvelle Objectivité (Neue Sachlichkeit).", "detail": ["Dix montre avec un réalisme sans pitié les anciens soldats mutilés et les contrastes entre riches et pauvres. « Metropolis » (1927–1928) est au Kunstmuseum de Stuttgart."]}, "en": {"q": "Who am I?", "clues": ["I fought as a machine-gunner in the First World War.", "In 1924 I published 'Der Krieg', a series of 50 prints on the horror of war.", "I painted the nightlife of Weimar Berlin in the 'Metropolis' triptych, in a harsh, ironic way."], "opts": ["George Grosz", "Otto Dix", "Max Beckmann", "Christian Schad"], "exp": "The answer is Otto Dix, a leading painter of the New Objectivity (Neue Sachlichkeit).", "detail": ["Dix showed maimed war veterans and the contrast of rich and poor with merciless realism. 'Metropolis' (1927–28) is in the Kunstmuseum Stuttgart."]}, "id": "x-06-13", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1925, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "painting", "tags": ["newobjectivity", "modern", "painting"], "topics": ["newobjectivity", "modern", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "'Neue Sachlichkeit' (Yeni Nesnellik) adı 1925'te hangi şehirde açılan bir sergiden gelir?", "opts": ["Berlin", "Dresden", "Mannheim", "Münih"], "exp": "Kunsthalle Mannheim'ın müdürü Gustav Friedrich Hartlaub 1925'te 'Neue Sachlichkeit' adlı sergiyi düzenledi.", "detail": ["Akım Ekspresyonizmin duygusal patlamalarına karşı soğuk, net ve gerçekçi bir bakışı savundu. George Grosz, Otto Dix ve Christian Schad en tanınan isimlerdir."]}, "fr": {"q": "Le nom « Neue Sachlichkeit » (Nouvelle Objectivité) vient d'une exposition de 1925 dans quelle ville ?", "opts": ["Berlin", "Dresde", "Mannheim", "Munich"], "exp": "Gustav Friedrich Hartlaub, directeur de la Kunsthalle de Mannheim, organise l'exposition « Neue Sachlichkeit » en 1925.", "detail": ["Le mouvement oppose aux explosions émotionnelles de l'expressionnisme un regard froid, net et réaliste. George Grosz, Otto Dix et Christian Schad sont les noms les plus connus."]}, "en": {"q": "The name 'Neue Sachlichkeit' (New Objectivity) comes from a 1925 exhibition in which city?", "opts": ["Berlin", "Dresden", "Mannheim", "Munich"], "exp": "Gustav Friedrich Hartlaub, director of the Kunsthalle Mannheim, organised the 'Neue Sachlichkeit' exhibition in 1925.", "detail": ["The movement set a cold, clear, realistic gaze against the emotional outbursts of Expressionism. George Grosz, Otto Dix and Christian Schad are the best-known names."]}, "id": "x-06-14", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1919, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "design", "tags": ["bauhaus", "modern", "design", "architecture"], "topics": ["bauhaus", "modern", "design", "architecture"], "search": {"commons": "Bauhaus Dessau building", "wiki": {"en": "Bauhaus Dessau"}}, "answer": 0, "tr": {"q": "Bauhaus okulu 1919'da kim tarafından kuruldu?", "opts": ["Walter Gropius", "Ludwig Mies van der Rohe", "Le Corbusier", "Marcel Breuer"], "exp": "Mimar Walter Gropius 1919'da Weimar'da Bauhaus'u kurdu ve sanat ile zanaatı birleştirmeyi hedefledi.", "detail": ["Okul 1925'te Dessau'ya, 1932'de Berlin'e taşındı ve 1933'te Nazi baskısıyla kapandı. Mies van der Rohe son müdürüydü; Breuer önce öğrenci, sonra öğretmendi."]}, "fr": {"q": "Qui a fondé l'école du Bauhaus en 1919 ?", "opts": ["Walter Gropius", "Ludwig Mies van der Rohe", "Le Corbusier", "Marcel Breuer"], "exp": "L'architecte Walter Gropius fonde le Bauhaus à Weimar en 1919, avec l'idée d'unir l'art et l'artisanat.", "detail": ["L'école déménage à Dessau en 1925, à Berlin en 1932, et ferme en 1933 sous la pression nazie. Mies van der Rohe en a été le dernier directeur ; Breuer y a été élève puis professeur."]}, "en": {"q": "Who founded the Bauhaus school in 1919?", "opts": ["Walter Gropius", "Ludwig Mies van der Rohe", "Le Corbusier", "Marcel Breuer"], "exp": "The architect Walter Gropius founded the Bauhaus in Weimar in 1919, aiming to unite art and craft.", "detail": ["The school moved to Dessau in 1925, to Berlin in 1932, and closed in 1933 under Nazi pressure. Mies van der Rohe was its last director; Breuer was first a student, then a teacher."]}, "id": "x-06-15", "t": 1794800000000}, {"type": "order", "level": 2, "year": 1925, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "design", "tags": ["bauhaus", "modern", "design"], "topics": ["bauhaus", "modern", "design"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1919", "1925", "1932", "1933"], "tr": {"q": "Bauhaus'un tarihindeki bu olayları eskiden yeniye sırala.", "items": ["Weimar'da kuruluş", "Dessau'ya taşınma", "Berlin'e taşınma", "Okulun kapanması"], "exp": "Bauhaus 1919'da Weimar'da kuruldu, 1925'te Dessau'ya, 1932'de Berlin'e taşındı ve 1933'te kapandı.", "detail": ["Kısa ömrüne rağmen okul, öğretmenleri ve öğrencileri aracılığıyla dünyaya yayıldı. Gropius ve Mies ABD'ye, Moholy-Nagy Chicago'ya giderek 'Yeni Bauhaus'u kurdu."]}, "fr": {"q": "Classe ces événements de l'histoire du Bauhaus du plus ancien au plus récent.", "items": ["La fondation à Weimar", "Le déménagement à Dessau", "Le déménagement à Berlin", "La fermeture de l'école"], "exp": "Le Bauhaus est fondé à Weimar en 1919, part à Dessau en 1925, à Berlin en 1932 et ferme en 1933.", "detail": ["Malgré sa courte vie, l'école se diffuse dans le monde par ses professeurs et ses élèves. Gropius et Mies partent aux États-Unis ; Moholy-Nagy fonde le « New Bauhaus » à Chicago."]}, "en": {"q": "Put these events in the history of the Bauhaus in order, oldest first.", "items": ["Founding in Weimar", "Move to Dessau", "Move to Berlin", "Closure of the school"], "exp": "The Bauhaus was pire aussi des textiles anciens du Pérou et écrit un livre important, « On Weaving ». Au Bauhaus, les femmes étaient souvent orientées vers le tissage ; cet atelier a pourtant été l'un des plus réussis de l'école."]}, "en": {"q": "Who am I?", "clues": ["At the Bauhaus I wanted to study painting, but I was sent to the weaving workshop because I was a woman.", "I turned weaving into a modern field of art and design.", "In 1949 I was the first textile artist to have a solo show at MoMA; my husband was a painter."], "opts": ["Gunta Stölzl", "Marianne Brandt", "Anni Albers", "Lucia Moholy"], "exp": "The answer is Anni Albers. After the Bauhaus she taught with her husband, the painter Josef Albers, at Black Mountain College in the USA.", "detail": ["She was also inspired by ancient Peruvian textiles and wrote an important book, 'On Weaving'. At the Bauhaus women were often steered towards weaving, yet this workshop became one of the school's most successful."]}, "id": "x-06-17", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1925, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "design", "tags": ["bauhaus", "modern", "design"], "topics": ["bauhaus", "modern", "design"], "search": {"commons": "Marcel Breuer Wassily Chair", "wiki": {"en": "Marcel Breuer Wassily Chair"}}, "answer": true, "tr": {"q": "Marcel Breuer'in bükülmüş çelik borudan 'Wassily' sandalyesi, bisiklet gidonundan esinlenmiştir.", "exp": "Doğru. Breuer, 1925 civarında bisikletinin hafif çelik borularından etkilenerek bu sandalyeyi tasarladı.", "detail": ["Sandalye, Bauhaus'ta öğretmen olan Wassily Kandinsky'nin adını sonradan aldı; Kandinsky bir kopyasını kullanıyordu. Hâlâ üretilen bu tasarım, modern mobilyanın simgelerinden biridir."]}, "fr": {"q": "Le fauteuil « Wassily » de Marcel Breuer, en tube d'acier cintré, s'inspire d'un guidon de vélo.", "exp": "Vrai. Vers 1925, Breuer s'inspire des tubes d'acier légers de son vélo pour dessiner ce fauteuil.", "detail": ["Le fauteuil a pris plus tard le nom de Wassily Kandinsky, professeur au Bauhaus, qui en possédait un exemplaire. Encore produit aujourd'hui, c'est un symbole du mobilier moderne."]}, "en": {"q": "Marcel Breuer's bent steel-tube 'Wassily' chair was inspired by bicycle handlebars.", "exp": "True. Around 1925, Breuer was inspired by the light steel tubes of his bicycle when he designed the chair.", "detail": ["The chair later took the name of Wassily Kandinsky, a Bauhaus teacher who owned one. Still made today, it is a symbol of modern furniture."]}, "id": "x-06-18", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1930, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "americas", "medium": "arch", "tags": ["artdeco", "modern", "architecture", "r-namerica"], "topics": ["artdeco", "modern", "architecture", "r-namerica"], "search": {"commons": "Chrysler Building spire", "wiki": {"en": "Chrysler Building"}}, "answer": 1, "tr": {"q": "Bu yapı hangisi?", "opts": ["Empire State Binası", "Chrysler Binası", "Rockefeller Center", "Flatiron Binası"], "exp": "New York'taki Chrysler Binası (1930), mimar William Van Alen'in tasarladığı paslanmaz çelik tepesiyle Art Deco'nun simgesidir.", "detail": ["Kısa bir süre dünyanın en yüksek binası oldu, ama 1931'de Empire State Binası onu geçti. Cephedeki kartal başları ve radyatör kapağı süsleri Chrysler otomobillerinden esinlenir."]}, "fr": {"q": "Quel est ce bâtiment ?", "opts": ["L'Empire State Building", "Le Chrysler Building", "Le Rockefeller Center", "Le Flatiron Building"], "exp": "Le Chrysler Building à New York (1930), dessiné par William Van Alen, est un symbole de l'Art déco avec sa flèche en acier inoxydable.", "detail": ["Il a été un temps le plus haut bâtiment du monde, avant d'être dépassé par l'Empire State Building en 1931. Ses têtes d'aigle et ses ornements imitent les voitures Chrysler."]}, "en": {"q": "Which building is this?", "opts": ["The Empire State Building", "The C s venues du cubisme à une élégance moderne et luxueuse.", "detail": ["Elle incarne l'image libre de la « femme nouvelle » des années 1920. Redécouverte dans les années 1970, elle est collectionnée par des personnalités comme Madonna."]}, "en": {"q": "Who am I?", "clues": ["I was born in Warsaw and fled to Paris after the Russian Revolution.", "With my shiny, metallic figures I became the symbol of Art Deco portraiture.", "My 'Self-Portrait in the Green Bugatti' (1929) was made for the cover of a German fashion magazine."], "opts": ["Tamara de Lempicka", "Sonia Delaunay", "Marie Laurencin", "Leonor Fini"], "exp": "The answer is Tamara de Lempicka. She joined geometric forms taken from Cubism with a modern, luxurious elegance.", "detail": ["She embodied the free 'new woman' of the 1920s. Rediscovered in the 1970s, she has been collected by figures such as Madonna."]}, "id": "x-07-2", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1922, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "americas", "medium": "painting", "tags": ["muralism", "modern", "painting", "r-latam"], "topics": ["muralism", "modern", "painting", "r-latam"], "search": {"commons": "Diego Rivera Detroit Industry Murals", "wiki": {"en": "Diego Rivera Detroit Industry Murals"}}, "answer": 2, "tr": {"q": "Meksika Muralizminin 'üç büyükleri' arasında hangisi yoktur?", "opts": ["Diego Rivera", "José Clemente Orozco", "Frida Kahlo", "David Alfaro Siqueiros"], "exp": "Meksika Muralizminin üç büyük ismi Rivera, Orozco ve Siqueiros'tur. Frida Kahlo şövale resmi ve otoportreleriyle tanınır.", "detail": ["Devrimden sonra Meksika hükümeti, halkı eğitmek için kamu binalarının duvarlarına dev resimler yaptırdı. Rivera'nın 'Detroit Sanayisi' freskleri (1932–33) ABD'de de büyük ilgi gördü."]}, "fr": {"q": "Lequel de ces artistes ne fait PAS partie des « trois grands » du muralisme mexicain ?", "opts": ["Diego Rivera", "José Clemente Orozco", "Frida Kahlo", "David Alfaro Siqueiros"], orps, sa douleur et son identité au centre de sa peinture. Breton la voyait comme surréaliste, mais elle disait : « Je n'ai jamais peint mes rêves, j'ai peint ma propre réalité. » Le tableau est au Museo de Arte Moderno de Mexico."]}, "en": {"q": "Which work is this?", "opts": ["Rivera – The Flower Carrier", "Tamayo – Watermelons", "Leonora Carrington – Self-Portrait", "Kahlo – The Two Fridas"], "exp": "Frida Kahlo's The Two Fridas (1939), painted the year she divorced Diego Rivera, shows two Fridas — in European and Mexican dress — joined by their hearts.", "detail": ["Kahlo put her own body, pain and identity at the centre of her art. Breton saw her as a Surrealist, but she said: 'I never painted dreams, I painted my own reality.' The painting is in the Museo de Arte Moderno in Mexico City."]}, "id": "x-07-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1925, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "americas", "medium": "concept", "tags": ["harlem", "modern", "r-namerica"], "topics": ["harlem", "modern", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1920'lerde New York'ta Afro-Amerikan sanat, edebiyat ve müziğin büyük bir patlama yaşadığı döneme ne ad verilir?", "opts": ["Beat Kuşağı", "Harlem Rönesansı", "Chicago Okulu", "Ashcan Okulu"], "exp": "Harlem Rönesansı, 1920'ler ve 1930'larda Harlem'de gelişen Afro-Amerikan kültürel hareketidir.", "detail": ["Filozof Alain Locke'un 1925 tarihli 'The New Negro' antolojisi hareketin manifestosu sayılır. Resimde Aaron Douglas, heykelde Augusta Savage, edebiyatta Langston Hughes ve Zora Neale Hurston öne çıktı."]}, "fr": {"q": "Comment appelle-t-on la grande explosion de l'art, de la littérature et de la musique afro-américains à New York dans les années 1920 ?", "opts": ["La Beat Generation", "La Renaissance de Harlem", "L'école de Chicago", "L'Ashcan School"], "exp": "La Renaissance de Harlem est un mouvement culturel afro-américain qui se développe à Harlem dans les années 1920 et 1930.", "detail": ["L'anthologie « The New Negro » (1925) du philosophe Alain Locke est vue comme son manifeste. Aaron Douglas en peinture, Augusta Savage en sculpture, Langston Hughes et Zora Neale Hurston en littérature en sont des figures majeures."]}, "en": {"q": "What is the name of the great flowering of African American art, literature and music in New York in the 1920s?", "opts": ["The Beat Generation", "The Harlem Renaissance", "The Chicago School", "The Ashcan School"], "exp": "The Harlem Renaissance was an African American cultural movement that grew in Harlem in the 1920s and 1930s.", "detail": ["The philosopher Alain Locke's anthology 'The New Negro' (1925) is seen as its manifesto. Aaron Douglas in painting, Augusta Savage in sculpture, and Langston Hughes and Zora Neale Hurston in literature are key figures."]}, "id": "x-07-6", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1934, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "americas", "medium": "painting", "tags": ["harlem", "modern", "painting", "r-namerica"], "topics": ["harlem", "modern", "painting", "r-namerica"], "search": {"commons": "Aaron Douglas Aspects of Negro Life", "wiki": {"en": "Aaron Douglas Aspects of Negro Life"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Kansas'ta doğdum ve 1925'te Harlem'e taşındım.", "Siluet figürler, eşmerkezli daireler ve Afrika sanatından esinlenen stilize biçimler kullandım.", "1934'te New York Halk Kütüphanesi'nin bir şubesi için 'Zenci Yaşamının Görünümleri' duvar resimlerini yaptım."], "opts": ["Jacob Lawrence", "Romare Bearden", "Aaron Douglas", "Archibald Motley"], "exp": "Cevap Aaron Douglas'tır. 'Harlem Rönesansı'nın babası' olarak anılır.", "detail": ["Douglas, Afrika kökenlerinden köleliğe ve modern şehre uzanan bir tarihi duvar resimlerinde anlattı. Bu panolar bugün Harlem'deki Schomburg Siyah Kültür Araştırma Merkezi'ndedir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né au Kansas et je suis arrivé à Harlem en 1925.", "J'ai utilisé des silhouettes, des cercles concentriques et des formes stylisées inspirées de l'art africain.", "En 1934, j'ai peint les fresques « Aspects of Negro Life » pour une annexe de la bibliothèque publique de New York."], "opts": ["Jacob Lawrence", "Romare Bearden", "Aaron Douglas", "Archibald Motley"], "exp": "La réponse est Aaron Douglas, souvent appelé le « père de l'art de la Renaissance de Harlem ».", "detail": ["Douglas raconte dans ses fresques une histoire qui va des racines africaines à l'esclavage, puis à la ville moderne. Ces panneaux sont aujourd'hui au Schomburg Center, à Harlem."]}, "en": {"q": "Who am I?", "clues": ["I was born in Kansas and moved to Harlem in 1925.", "I used silhouettes, concentric circles and stylised forms inspired by African art.", "In 1934 I painted the murals 'Aspects of Negro Life' for a branch of the New York Public Library."], "opts": ["Jacob Lawrence", "Romare Bearden", "Aaron Douglas", "Archibald Motley"], "exp": "The answer is Aaron Douglas, often called the 'father of African American art' of the Harlem Renaissance.", "detail": ["In his murals Douglas told a history from African roots to slavery and the modern city. The panels are today in the Schomburg Center in Harlem."]}, "id": "x-07-7", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1941, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "americas", "medium": "painting", "tags": ["harlem", "modern", "painting", "r-namerica"], "topics": ["harlem", "modern", "painting", "r-namerica"], "search": {"commons": "Jacob Lawrence Migration Series", "wiki": {"en": "Jacob Lawrence Migration Series"}}, "answer": true, "tr": {"q": "Jacob Lawrence'ın 60 panoluk 'Göç Serisi', Afro-Amerikalıların Güney'den Kuzey'in şehirlerine Büyük Göç'ünü anlatır.", "exp": "Doğru. Lawrence 1940–41'de bu seriyi yaptı; o sırada sadece 23 yaşındaydı.", "detail": ["Seri, kısa metinlerle birlikte okunan sade, renkli panellerden oluşur. Paneller ikiye bölündü: tek sayılılar MoMA'da, çift sayılılar Washington'daki Phillips Collection'dadır."]}, "fr": {"q": "La « Migration Series » de Jacob Lawrence, en 60 panneaux, raconte la Grande Migration des Afro-Américains du Sud vers les villes du Nord.", "exp": "Vrai. Lawrence peint cette série en 1940–1941, à seulement 23 ans.", "detail": ["La série est faite de panneaux simples et colorés, accompagnés de courts textes. Les panneaux sont partagés : les numéros impairs sont au MoMA, les pairs à la Phillips Collection de Washington."]}, "en": {"q": "Jacob Lawrence's 60-panel 'Migration Series' tells the story of the Great Migration of African Americans from the South to Northern cities.", "exp": "True. Lawrence painted the series in 1940–41, when he was only 23.", "detail": ["The series is made of simple, colourful panels read with short captions. The panels were split: the odd numbers are at MoMA, the even numbers at the Phillips Collection in Washington."]}, "id": "x-07-8", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1934, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "concept", "tags": ["socialistrealism", "modern"], "topics": ["socialistrealism", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "Sosyalist Gerçekçilik 1934'te hangi ülkede resmî sanat doktrini olarak ilan edildi?", "opts": ["Sovyetler Birliği", "Çin", "Doğu Almanya", "Küba"], "exp": "Sosyalist Gerçekçilik, 1934'teki Birinci Sovyet Yazarlar Kongresi'nde resmî doktrin olarak benimsendi.", "detail": ["Sanatın gerçekliği 'devrimci gelişimi içinde' göstermesi ve halkı sosyalist ideallerle eğitmesi beklendi. Avangart deneyler bastırıldı; bu doktrin daha sonra Çin, Doğu Avrupa ve Kuzey Kore'de de uygulandı."]}, "fr": {"q": "Dans quel pays le réalisme socialiste est-il devenu doctrine artistique officielle en 1934 ?", "opts": ["L'Union soviétique", "La Chine", "L'Allemagne de l'Est", "Cuba"], "exp": "Le réalisme socialiste est adopté comme doctrine officielle au premier Congrès des écrivains soviétiques, en 1934.", "detail": ["L'art doit montrer la réalité « dans son développement révolutionnaire » et éduquer le peuple. Les expériences d'avant-garde sont réprimées ; la doctrine sera ensuite appliquée en Chine, en Europe de l'Est et en Corée du Nord."]}, "en": {"q": "In which country did Socialist Realism become the official art doctrine in 1934?", "opts": ["The Soviet Union", "China", "East Germany", "Cuba"], "exp": "Socialist Realism was adopted as official doctrine at the First Congress of Soviet Writers in 1934.", "detail": ["Art had to show reality 'in its revolutionary development' and educate the people. Avant-garde experiments were suppressed; the doctrine was later applied in China, Eastern Europe and North Korea."]}, "id": "x-07-9", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1937, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "sculpture", "tags": ["socialistrealism", "modern", "sculpture", "women"], "topics": ["socialistrealism", "modern", "sculpture", "women"], "search": {"commons": "Worker and Kolkhoz Woman Mukhina", "wiki": {"en": "Worker and Kolkhoz Woman"}}, "answer": 1, "tr": {"q": "Bu heykel hangisi?", "opts": ["Anavatan Çağırıyor – Vuchetich", "İşçi ve Kolhozcu Kadın – Vera Mukhina", "Lenin Anıtı – Andreev", "Zafer Anıtı – Tomsky"], "exp": "Vera Mukhina'nın paslanmaz çelik 'İşçi ve Kolhozcu Kadın' heykeli, 1937 Paris Dünya Fuarı'nda Sovyet pavyonunun tepesinde yer aldı.", "detail": ["Orak ve çekici havaya kaldıran iki figür, işçi ile köylünün birliğini simgeler. Pavyon, karşısındaki Nazi Almanyası pavyonuyla karşı karşıya duruyordu. Heykel bugün Moskova'da yüksek bir kaide üzerindedir."]}, "fr": {"q": "Quelle est cette sculpture ?", "opts": ["La Mère-Patrie appelle – Voutchetitch", "L'Ouvrier et la Kolkhozienne – Vera Moukhina", "Monument à Lénine – Andreïev", "Monument de la Victoire – Tomski"], "exp": "La sculpture en acier inoxydable de Vera Moukhina, « L'Ouvrier et la Kolkhozienne », couronnait le pavillon soviétique à l'Exposition de Paris en 1937.", "detail": ["Les deux figures qui lèvent la faucille et le marteau symbolisent l'union des ouvriers et des paysans. Le pavillon faisait face à celui de l'Allemagne nazie. La statue est aujourd'hui à Moscou, sur un haut socle."]}, "en": {"q": "Which sculpture is this?", "opts": ["The Motherland Calls – Vuchetich", "Worker and Kolkhoz Woman – Vera Mukhina", "Lenin Monument – Andreyev", "Victory Monument – Tomsky"], "exp": "Vera Mukhina's stainless-steel 'Worker and Kolkhoz Woman' stood on top of the Soviet pavilion at the 1937 Paris Exposition.", "detail": ["The two figures raising the hammer and sickle symbolise the union of workers and peasants. The pavilion faced the Nazi German pavilion. The statue now stands in Moscow on a high base."]}, "id": "x-07-10", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "painting", "tags": ["abstractexpr", "postwar", "painting", "r-namerica"], "topics": ["abstractexpr", "postwar", "painting", "r-namerica"], "search": {"commons": "Jackson Pollock Autumn Rhythm", "wiki": {"en": "Autumn Rhythm (Number 30)"}}, "answer": 0, "tr": {"q": "Bu tarz, boyanın tuvale damlatılıp serpildiği hangi sanatçıyla özdeşleşir?", "opts": ["Jackson Pollock", "Mark Rothko", "Barnett Newman", "Clyfford Still"], "exp": "Jackson Pollock, tuvali yere serip boyayı damlatarak ve serperek 'drip painting' tekniğini geliştirdi.", "detail": ["Eleştirmen Harold Rosenberg bu tür resme 'Aksiyon Resmi' dedi; tuval bir eylem alanı oldu. Hans Namuth'un 1950'deki fotoğrafları ve filmi Pollock'un çalışma biçimini ünlü yaptı. 'Sonbahar Ritmi' Metropolitan Müzesi'ndedir."]}, "fr": {"q": "Ce style, où la peinture est versée et projetée sur la toile, est associé à quel artiste ?", "opts": ["Jackson Pollock", "Mark Rothko", "Barnett Newman", "Clyfford Still"], "exp": "Jackson Pollock pose la toile au sol et y fait couler et projette la peinture : c'est le « dripping ».", "detail": ["Le critique Harold Rosenberg appelle cette peinture « Action Painting » : la toile devient un lieu d'action. Les photos et le film de Hans Namuth (1950) ont rendu célèbre sa façon de travailler. « Autumn Rhythm » est au Metropolitan Museum."]}, "en": {"q": "This style, where paint is dripped and flung onto the canvas, is linked to which artist?", "opts": ["Jackson Pollock", "Mark Rothko", "Barnett Newman", "Clyfford Still"], "exp": "Jackson Pollock laid the canvas on the floor and dripped and flung paint onto it, the 'drip painting' technique.", "detail": ["The critic Harold Rosenberg called this 'Action Painting': the canvas became an arena for action. Hans Namuth's 1950 photos and film made Pollock's way of working famous. 'Autumn Rhythm' is in the Metropolitan Museum."]}, "id": "x-07-11", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1971, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "painting", "tags": ["abstractexpr", "postwar", "painting", "r-namerica"], "topics": ["abstractexpr", "postwar", "painting", "r-namerica"], "search": {"commons": "Rothko Chapel Houston", "wiki": {"en": "Rothko Chapel"}}, "answer": 2, "tr": {"q": "Mark Rothko'nun 14 koyu renkli büyük tablosu için özel olarak yapılan şapel hangi şehirdedir?", "opts": ["New York", "Chicago", "Houston", "Los Angeles"], "exp": "Rothko Şapeli, koleksiyoncular John ve Dominique de Menil tarafından Houston'da yaptırıldı ve 1971'de açıldı.", "detail": ["Rothko, şapelin açılışını göremedi; 1970'te hayatını kaybetti. Mekân, tüm inançlara açık bir meditasyon yeri olarak tasarlandı. Önündeki 'Kırık Dikilitaş' heykeli Barnett Newman'ındır."]}, "fr": {"q": "Dans quelle ville se trouve la chapelle construite spécialement pour quatorze grandes toiles sombres de Mark Rothko ?", "opts": ["New York", "Chicago", "Houston", "Los Angeles"], "exp": "La Rothko Chapel a été construite à Houston par les collectionneurs John et Dominique de Menil ; elle a ouvert en 1971.", "detail": ["Rothko n'a pas vu l'ouverture : il est mort en 1970. Le lieu est conçu comme un espace de méditation ouvert à toutes les croyances. La sculpture « Broken Obelisk » devant la chapelle est de Barnett Newman."]}, "en": {"q": "In which city is the chapel built especially for fourteen large dark paintings by Mark Rothko?", "opts": ["New York", "Chicago", "Houston", "Los Angeles"], "exp": "The Rothko Chapel was built in Houston by the collectors John and Dominique de Menil and opened in 1971.", "detail": ["Rothko did not see it open; he died in 1970. The space was designed as a place of meditation open to all faiths. The 'Broken Obelisk' sculpture in front is by Barnett Newman."]}, "id": "x-07-12", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1952, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "painting", "tags": ["abstractexpr", "postwar", "painting", "women", "r-namerica"], "topics": ["abstractexpr", "postwar", "painting", "women", "r-namerica"], "search": {"commons": "Helen Frankenthaler Mountains and Sea", "wiki": {"en": "Helen Frankenthaler Mountains and Sea"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["New York'ta doğdum ve 1950'lerde Soyut Ekspresyonizmin ikinci kuşağında yer aldım.", "1952'de seyreltilmiş boyayı astarsız tuvale emdirerek 'Dağlar ve Deniz'i yaptım.", "Bu 'soak-stain' (emdirme) tekniğim Morris Louis ve Kenneth Noland'ı etkiledi ve Renk Alanı resmine yol açtı."], "opts": ["Lee Krasner", "Joan Mitchell", "Elaine de Kooning", "Helen Frankenthaler"], "exp": "Cevap Helen Frankenthaler'dir. Emdirme tekniğiyle Soyut Ekspresyonizmden Renk Alanı resmine köprü kurdu.", "detail": ["'Dağlar ve Deniz' (1952), Nova Scotia gezisinden sonra yapıldı ve Washington'daki National Gallery of Art'a uzun süreli ödünç verilmiştir. Frankenthaler bir dönem Robert Motherwell ile evliydi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à New York et j'ai fait partie de la deuxième génération de l'expressionnisme abstrait dans les années 1950.", "En 1952, j'ai peint « Mountains and Sea » en faisant pénétrer de la peinture diluée dans une toile non préparée.", "Ma technique du « soak-stain » a influencé Morris Louis et Kenneth Noland et a ouvert la voie au Color Field."], "opts": ["Lee Krasner", "Joan Mitchell", "Elaine de Kooning", "Helen Frankenthaler"], "exp": "La réponse est Helen Frankenthaler. Avec sa technique d'imprégnation, elle relie l'expressionnisme abstrait à la peinture Color Field.", "detail": ["« Mountains and Sea » (1952) a été peint après un voyage en Nouvelle-Écosse ; il est prêté à long terme à la National Gallery of Art de Washington. Frankenthaler a été mariée un temps à Robert Motherwell."]}, "en": {"q": "Who am I?", "clues": ["I was born in New York and belonged to the second generation of Abstract Expressionism in the 1950s.", "In 1952 I made 'Mountains and Sea' by soaking thinned paint into unprimed canvas.", "My 'soak-stain' technique influenced Morris Louis and Kenneth Noland and led to Color Field painting."], "opts": ["Lee Krasner", "Joan Mitchell", "Elaine de Kooning", "Helen Frankenthaler"], "exp": "The answer is Helen Frankenthaler. With her soak-stain technique she bridged Abstract Expressionism and Color Field painting.", "detail": ["'Mountains and Sea' (1952) was painted after a trip to Nova Scotia and is on long-term loan to the National Gallery of Art in Washington. Frankenthaler was once married to Robert Motherwell."]}, "id": "x-07-13", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "concept", "tags": ["abstractexpr", "postwar", "r-namerica"], "topics": ["abstractexpr", "postwar", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Bazı tarihçilere göre ABD hükümeti, Soğuk Savaş sırasında Soyut Ekspresyonizmi 'özgür dünyanın' sanatı olarak yurt dışında tanıtılmasını dolaylı biçimde destekledi.", "exp": "Doğru. Araştırmalar, CIA bağlantılı Kültürel Özgürlük Kongresi gibi kuruluşların ve MoMA'nın uluslararası programlarının bu sanatı yurt dışında tanıttığını gösterir.", "detail": ["Serge Guilbaut'nun 'New York Modern Sanat Fikrini Nasıl Çaldı' (1983) kitabı bu konuyu tartışır. Sanatçıların çoğu bu politikadan habersizdi; konu bugün de tarihçiler arasında tartışmalıdır."]}, "fr": {"q": "Selon certains historiens, le gouvernement américain a soutenu indirectement l'expressionnisme abstrait à l'étranger pendant la guerre froide, comme l'art du « monde libre ».", "exp": "Vrai. Des recherches montrent que des organisations liées à la CIA, comme le Congrès pour la liberté de la culture, et les programmes internationaux du MoMA ont fait connaître cet art à l'étranger.", "detail": ["Le livre de Serge Guilbaut « Comment New York vola l'idée d'art moderne » (1983) discute ce sujet. La plupart des artistes ne savaient rien de cette politique ; la question reste débattue."]}, "en": {"q": "According to some historians, the US government indirectly supported Abstract Expressionism abroad during the Cold War as the art of the 'free world'.", "exp": "True. Research shows that CIA-linked bodies such as the Congress for Cultural Freedom, and MoMA's international programmes, promoted this art abroad.", "detail": ["Serge Guilbaut's book 'How New York Stole the Idea of Modern Art' (1983) discusses the topic. Most artists knew nothing about this policy; the question is still debated."]}, "id": "x-07-14", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1945, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "europe", "medium": "painting", "tags": ["artbrut", "postwar", "painting"], "topics": ["artbrut", "postwar", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "Psikiyatri hastaları, yalnız yaşayanlar ve eğitimsiz kişilerin akademik kurallardan uzak sanatına 'Art Brut' adını veren sanatçı kimdir?", "opts": ["André Breton", "Jean Dubuffet", "Hans Prinzhorn", "Asger Jorn"], "exp": "Fransız sanatçı Jean Dubuffet 1945'te 'Art Brut' (ham sanat) terimini ortaya attı ve bu eserleri toplamaya başladı.", "detail": ["Dubuffet, kültürün etkilemediği 'saf' bir yaratıcılık aradı. Koleksiyonu bugün İsviçre'nin Lozan şehrindeki Collection de l'Art Brut'tadır. İngilizcede benzer bir anlamda 'Outsider Art' terimi kullanılır."]}, "fr": {"q": "Quel artiste a donné le nom d'« art brut » à l'art de patients psychiatriques, de solitaires et d'autodidactes, loin des règles académiques ?", "opts": ["André Breton", "Jean Dubuffet", "Hans Prinzhorn", "Asger Jorn"], "exp": "L'artiste français Jean Dubuffet invente le terme « art brut » en 1945 et commence à collectionner ces œuvres.", "detail": ["Dubuffet cherche une créativité « pure », non touchée par la culture. Sa collection est aujourd'hui à la Collection de l'Art Brut, à Lausanne. En anglais, on parle aussi d'« Outsider Art »."]}, "en": {"q": "Which artist gave the name 'Art Brut' to the art of psychiatric patients, loners and self-taught people, far from academic rules?", "opts": ["André Breton", "Jean Dubuffet", "Hans Prinzhorn", "Asger Jorn"], "exp": "The French artist Jean Dubuffet coined 'Art Brut' (raw art) in 1945 and began collecting these works.", "detail": ["Dubuffet looked for a 'pure' creativity untouched by culture. His collection is now in the Collection de l'Art Brut in Lausanne. In English the similar term 'Outsider Art' is also used."]}, "id": "x-07-15", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1910, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "americas", "medium": "painting", "tags": ["artbrut", "c19", "painting", "r-namerica"], "topics": ["artbrut", "c19", "painting", "r-namerica"], "search": {"commons": "Henry Darger In the Realms of the Unreal", "wiki": {"en": "Henry Darger In the Realms of the Unreal"}}, "answer": true, "tr": {"q": "Henry Darger'in 15.000 sayfayı aşan resimli romanı, ancak ölümünden sonra ev sahibi tarafından odasında bulundu.", "exp": "Doğru. Chicago'da bir kapıcı olarak yalnız yaşayan Darger 1973'te öldü; ev sahibi Nathan Lerner eserleri keşfetti.", "detail": ["'Gerçek Dışının Diyarlarında' adlı destan, Vivian Kızları'nın savaşlarını anlatır ve kolajla çizilmiş yüzlerce büyük resim içerir. Darger bugün Outsider Art'ın en ünlü isimlerinden biridir; eserleri New York'taki American Folk Art Museum'da korunur."]}, "fr": {"q": "Le roman illustré de plus de 15 000 pages d'Henry Darger n'a été découvert dans sa chambre par son propriétaire qu'après sa mort.", "exp": "Vrai. Darger, concierge solitaire à Chicago, meurt en 1973 ; son propriétaire, Nathan Lerner, découvre ses œuvres.", "detail": ["L'épopée « In the Realms of the Unreal » raconte les guerres des Vivian Girls, avec des centaines de grandes images dessinées et collées. Darger est aujourd'hui une figure majeure de l'Outsider Art ; ses œuvres sont conservées à l'American Folk Art Museum de New York."]}, "en": {"q": "Henry Darger's illustrated novel of over 15,000 pages was only found in his room by his landlord after his death.", "exp": "True. Darger, a lonely janitor in Chicago, died in 1973; his landlord, Nathan Lerner, found the works.", "detail": ["The epic 'In the Realms of the Unreal' tells the wars of the Vivian Girls, with hundreds of large drawn and collaged pictures. Darger is now one of the best-known Outsider artists; his works are kept at the American Folk Art Museum in New York."]}, "id": "x-07-16", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1948, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "europe", "medium": "painting", "tags": ["cobra", "postwar", "painting"], "topics": ["cobra", "postwar", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "CoBrA grubunun adı neyin kısaltmasıdır?", "opts": ["Üç kurucusunun soyadlarının", "'Couleur, Brut, Abstraction' kelimelerinin", "Kopenhag, Brüksel ve Amsterdam şehirlerinin", "Bir derginin adının"], "exp": "CoBrA, 1948'de Paris'te kurulan ve üyelerinin geldiği Kopenhag, Brüksel ve Amsterdam şehirlerinin baş harflerinden oluşan bir gruptur.", "detail": ["Asger Jorn, Karel Appel, Constant ve Christian Dotremont gibi sanatçılar çocuk çizimlerinden, halk sanatından ve spontane jestten ilham aldı. Grup 1951'de dağıldı, ama Avrupa savaş sonrası sanatında güçlü bir iz bıraktı."]}, "fr": {"q": "De quoi le nom du groupe CoBrA est-il l'abréviation ?", "opts": ["Des noms de ses trois fondateurs", "Des mots « Couleur, Brut, Abstraction »", "Des villes de Copenhague, Bruxelles et Amsterdam", "Du titre d'une revue"], "exp": "CoBrA, fondé à Paris en 1948, tire son nom des initiales de Copenhague, Bruxelles et Amsterdam, villes d'origine de ses membres.", "detail": ["Asger Jorn, Karel Appel, Constant et Christian Dotremont s'inspirent des dessins d'enfants, de l'art populaire et du geste spontané. Le groupe se dissout en 1951, mais marque fortement l'art européen d'après-guerre."]}, "en": {"q": "What does the name of the CoBrA group stand for?", "opts": ["The surnames of its three founders", "The words 'Couleur, Brut, Abstraction'", "The cities of Copenhagen, Brussels and Amsterdam", "The title of a magazine"], "exp": "CoBrA, founded in Paris in 1948, takes its name from the initials of Copenhagen, Brussels and Amsterdam, its members' home cities.", "detail": ["Artists such as Asger Jorn, Karel Appel, Constant and Christian Dotremont drew on children's drawings, folk art and spontaneous gesture. The group broke up in 1951 but left a strong mark on postwar European art."]}, "id": "x-07-17", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1956, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "europe", "medium": "arch", "tags": ["cobra", "postwar", "architecture"], "topics": ["cobra", "postwar", "architecture"], "search": {"commons": "Constant New Babylon", "wiki": {"en": "Constant New Babylon"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["CoBrA'nın Hollandalı kurucularından biriydim.", "Daha sonra Durumcu (Situasyonist) Enternasyonal ile ilişki kurdum.", "1956'dan itibaren yaklaşık yirmi yıl boyunca 'Yeni Babil' adlı ütopik bir şehir için maketler ve çizimler yaptım."], "opts": ["Constant Nieuwenhuys", "Karel Appel", "Corneille", "Guy Debord"], "exp": "Cevap Constant (Constant Nieuwenhuys)'tır. 'Yeni Babil', insanların çalışmak zorunda olmadığı, oyun için yaşanan göçebe bir kent hayaliydi.", "detail": ["Constant'ın maketleri yerden yükselen, birbirine bağlı dev yapılardan oluşur. Bu proje sonraki deneysel mimarlara ilham verdi. Eserlerinin büyük kısmı Lahey'deki Kunstmuseum'dadır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai été l'un des fondateurs néerlandais de CoBrA.", "J'ai ensuite été proche de l'Internationale situationniste.", "À partir de 1956, pendant presque vingt ans, j'ai fait des maquettes et des dessins pour une ville utopique, « New Babylon »."], "opts": ["Constant Nieuwenhuys", "Karel Appel", "Corneille", "Guy Debord"], "exp": "La réponse est Constant (Constant Nieuwenhuys). New Babylon était le rêve d'une ville nomade où l'on ne travaille plus et où l'on vit pour le jeu.", "detail": ["Ses maquettes montrent d'immenses structures reliées, levées au-dessus du sol. Ce projet a inspiré des architectes expérimentaux. Une grande partie de ses œuvres est au Kunstmuseum de La Haye."]}, "en": {"q": "Who am I?", "clues": ["I was one of the Dutch founders of CoBrA.", "Later I was linked with the Situationist International.", "From 1956, for almost twenty years, I made models and drawings for a utopian city called 'New Babylon'."], "opts": ["Constant Nieuwenhuys", "Karel Appel", "Corneille", "Guy Debord"], "exp": "The answer is Constant (Constant Nieuwenhuys). New Babylon was a dream of a nomadic city where people no longer work and live for play.", "detail": ["His models show huge linked structures raised above the ground. The project inspired later experimental architects. Many of his works are in the Kunstmuseum in The Hague."]}, "id": "x-07-18", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1956, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "asia", "medium": "performance", "tags": ["gutai", "postwar", "performance", "women", "r-fareast"], "topics": ["gutai", "postwar", "performance", "women", "r-fareast"], "search": {"commons": "Atsuko Tanaka Electric Dress", "wiki": {"en": "Atsuko Tanaka Electric Dress"}}, "answer": true, "tr": {"q": "Gutai sanatçısı Atsuko Tanaka, 1956'da yanıp sönen ampuller ve floresan tüplerden oluşan bir 'Elektrikli Elbise' giydi.", "exp": "Doğru. 'Elektrikli Elbise' (Denki Fuku, 1956) boyanmış ampuller ve tüplerden oluşan, giyilebilir bir eserdi.", "detail": ["Tanaka, ışığın ve elektriğin hem güzel hem tehlikeli yönünü bedeniyle deneyimledi. Eser bugün performans, giyilebilir teknoloji ve yeni medya sanatının öncülerinden biri sayılır."]}, "fr": {"q": "L'artiste Gutai Atsuko Tanaka a porté en 1956 une « Robe électrique » faite d'ampoules et de tubes fluorescents qui clignotaient.", "exp": "Vrai. La « Robe électrique » (Denki Fuku, 1956) était une œuvre portable faite d'ampoules et de tubes peints.", "detail": ["Tanaka vit avec son corps la beauté et le danger de la lumière et de l'électricité. L'œuvre est vue aujourd'hui comme un précurseur de la performance, de la technologie portable et de l'art des nouveaux médias."]}, "en": {"q": "The Gutai artist Atsuko Tanaka wore an 'Electric Dress' of flashing light bulbs and fluorescent tubes in 1956.", "exp": "True. The 'Electric Dress' (Denki Fuku, 1956) was a wearable work made of painted bulbs and tubes.", "detail": ["Tanaka experienced with her body both the beauty and the danger of light and electricity. The work is now seen as a forerunner of performance, wearable technology and new media art."]}, "id": "x-08-0", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1957, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "asia", "medium": "performance", "tags": ["gutai", "postwar", "performance", "r-fareast"], "topics": ["gutai", "postwar", "performance", "r-fareast"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "Gutai'nin 1957'de Osaka'da düzenlediği ve sanatı bir tiyatro sahnesinde sergilediği etkinliğin adı nedir?", "opts": ["Açık Hava Sergisi", "Gökyüzü Festivali", "Mono-ha Sergisi", "Gutai Sahne Sanatı"], "exp": "Gutai 1957'de Osaka ve Tokyo'da 'Gutai Sahne Sanatı' (Butai o shiyō suru Gutai bijutsu) etkinliklerini düzenledi.", "detail": ["Bu gösterilerde balonlar patlatıldı, dumanlar ve ışıklar sahneye taşındı. Gutai daha önce 1955–56'da Ashiya'da açık hava sergileri ve 1960'ta 'Gökyüzü Festivali' de yaptı. Bu çalışmalar happening'lerin öncüsü sayılır."]}, "fr": {"q": "Comment s'appelle l'événement de 1957 où Gutai a présenté l'art sur une scène de théâtre à Osaka ?", "opts": ["Exposition en plein air", "Festival du ciel", "Exposition Mono-ha", "L'art Gutai sur scène"], "exp": "En 1957, Gutai organise à Osaka et à Tokyo « L'art Gutai sur scène » (Butai o shiyō suru Gutai bijutsu).", "detail": ["Dans ces spectacles, on fait éclater des ballons, on fait entrer fumées et lumières sur scène. Gutai avait déjà organisé des expositions en plein air à Ashiya en 1955–1956 et fera un « Festival du ciel » en 1960. On les voit comme des précurseurs des happenings."]}, "en": {"q": "What was the 1957 event in Osaka where Gutai presented art on a theatre stage called?", "opts": ["Outdoor Exhibition", "Sky Festival", "Mono-ha Exhibition", "Gutai Art on the Stage"], "exp": "In 1957 Gutai held 'Gutai Art on the Stage' (Butai o shiyō suru Gutai bijutsu) in Osaka and Tokyo.", "detail": ["In these shows balloons burst and smoke and lights filled the stage. Gutai had already held outdoor exhibitions in Ashiya in 1955–56 and would hold a 'Sky Festival' in 1960. These works are seen as forerunners of happenings."]}, "id": "x-08-1", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1962, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "performance", "tags": ["fluxus", "postwar", "performance", "conceptual"], "topics": ["fluxus", "postwar", "performance", "conceptual"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "Fluxus hareketinin adını koyan ve örgütleyicisi olan sanatçı kimdir?", "opts": ["George Maciunas", "John Cage", "Joseph Beuys", "Allan Kaprow"], "exp": "Litvanya doğumlu George Maciunas, 'akış' anlamına gelen Fluxus adını verdi ve 1962'de Wiesbaden'de ilk festivalleri düzenledi.", "detail": ["Fluxus müziği, şiiri, performansı ve günlük eylemleri birleştirdi; 'event score' denen kısa talimatlar yazıldı. Yoko Ono, Nam June Paik ve George Brecht grubun önemli isimlerindendir. John Cage ise önemli bir ilham kaynağıydı."]}, "fr": {"q": "Quel artiste a donné son nom au mouvement Fluxus et l'a organisé ?", "opts": ["George Maciunas", "John Cage", "Joseph Beuys", "Allan Kaprow"], "exp": "George Maciunas, né en Lituanie, choisit le nom Fluxus (« flux ») et organise les premiers festivals à Wiesbaden en 1962.", "detail": ["Fluxus mélange musique, poésie, performance et gestes quotidiens ; on écrit de courtes instructions appelées « event scores ». Yoko Ono, Nam June Paik et George Brecht en sont des figures importantes. John Cage est une grande source d'inspiration."]}, "en": {"q": "Which artist named the Fluxus movement and organised it?", "opts": ["George Maciunas", "John Cage", "Joseph Beuys", "Allan Kaprow"], "exp": "Lithuanian-born George Maciunas chose the name Fluxus ('flow') and organised the first festivals in Wiesbaden in 1962.", "detail": ["Fluxus mixed music, poetry, performance and everyday actions; artists wrote short instructions called 'event scores'. Yoko Ono, Nam June Paik and George Brecht were key figures. John Cage was a major inspiration."]}, "id": "x-08-2", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1964, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "asia", "medium": "performance", "tags": ["fluxus", "postwar", "performance", "women", "r-fareast"], "topics": ["fluxus", "postwar", "performance", "women", "r-fareast"], "search": {"commons": "Yoko Ono Cut Piece", "wiki": {"en": "Yoko Ono Cut Piece"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Tokyo'da doğdum ve 1950'lerin sonunda New York'ta Fluxus çevresine katıldım.", "1964'te 'Kesme Parçası'nda sahnede oturdum ve izleyicileri elbisemden parça kesmeye davet ettim.", "1964'te 'Grapefruit' adlı talimat kitabımı yayımladım."], "opts": ["Shigeko Kubota", "Yoko Ono", "Yayoi Kusama", "Takako Saito"], "exp": "Cevap Yoko Ono'dur. Kavramsal sanatın ve performansın öncülerindendir.", "detail": ["'Kesme Parçası' ilk kez 1964'te Kyoto'da yapıldı; savunmasızlık, şiddet ve izleyicinin sorumluluğu üzerine güçlü bir eserdir. Ono'nun 'Grapefruit' kitabındaki talimatlar, okurun zihninde gerçekleşen eserlerdir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Tokyo et j'ai rejoint le milieu Fluxus à New York à la fin des années 1950.", "En 1964, dans « Cut Piece », je me suis assise sur scène et j'ai invité le public à couper des morceaux de mes vêtements.", "En 1964, j'ai publié « Grapefruit », un livre d'instructions."], "opts": ["Shigeko Kubota", "Yoko Ono", "Yayoi Kusama", "Takako Saito"], "exp": "La réponse est Yoko Ono, pionnière de l'art conceptuel et de la performance.", "detail": ["« Cut Piece » est présenté pour la première fois à Kyoto en 1964 ; c'est une œuvre forte sur la vulnérabilité, la violence et la responsabilité du public. Les instructions de « Grapefruit » sont des œuvres qui se réalisent dans l'esprit du lecteur."]}, "en": {"q": "Who am I?", "clues": ["I was born in Tokyo and joined the Fluxus circle in New York at the end of the 1950s.", "In 1964, in 'Cut Piece', I sat on stage and invited the audience to cut pieces from my clothes.", "In 1964 I published 'Grapefruit', a book of instructions."], "opts": ["Shigeko Kubota", "Yoko Ono", "Yayoi Kusama", "Takako Saito"], "exp": "The answer is Yoko Ono, a pioneer of conceptual art and performance.", "detail": ["'Cut Piece' was first performed in Kyoto in 1964; it is a powerful work about vulnerability, violence and the audience's responsibility. The instructions in 'Grapefruit' are works that happen in the reader's mind."]}, "id": "x-08-3", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1963, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "asia", "medium": "newmedia", "tags": ["fluxus", "postwar", "newmedia", "r-fareast"], "topics": ["fluxus", "postwar", "newmedia", "r-fareast"], "search": {"commons": "Nam June Paik TV Buddha", "wiki": {"en": "Nam June Paik TV Buddha"}}, "answer": true, "tr": {"q": "Nam June Paik, 1963'te Almanya'daki Wuppertal'de değiştirilmiş televizyonlarla bir sergi açtı ve 'video sanatının babası' olarak anılır.", "exp": "Doğru. 'Müzik Sergisi – Elektronik Televizyon' 1963'te Galerie Parnass'ta açıldı.", "detail": ["Paik, televizyon görüntülerini mıknatıslarla ve devrelerle bozdu. Daha sonra 'TV Buda' (1974) gibi eserlerde izlemek ve izlenmek üzerine düşündü. 'Elektronik süper otoyol' ifadesini de ilk kullananlardan biridir."]}, "fr": {"q": "Nam June Paik a ouvert en 1963 à Wuppertal, en Allemagne, une exposition de téléviseurs modifiés ; on l'appelle le « père de l'art vidéo ».", "exp": "Vrai. « Exposition of Music – Electronic Television » ouvre en 1963 à la Galerie Parnass.", "detail": ["Paik déforme les images télévisées avec des aimants et des circuits. Plus tard, dans « TV Buddha » (1974), il réfléchit au fait de regarder et d'être regardé. Il est aussi l'un des premiers à parler d'« autoroute électronique »."]}, "en": {"q": "In 1963 Nam June Paik opened a show of altered television sets in Wuppertal, Germany, and he is called the 'father of video art'.", "exp": "True. 'Exposition of Music – Electronic Television' opened in 1963 at the Galerie Parnass.", "detail": ["Paik distorted TV images with magnets and circuits. Later, in works such as 'TV Buddha' (1974), he reflected on watching and being watched. He was also one of the first to speak of an 'electronic superhighway'."]}, "id": "x-08-4", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1960, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "performance", "tags": ["nouveaurealisme", "postwar", "performance", "painting"], "topics": ["nouveaurealisme", "postwar", "performance", "painting"], "search": {"commons": "Yves Klein Anthropometry", "wiki": {"en": "Yves Klein Anthropometry"}}, "answer": 2, "tr": {"q": "Yves Klein'ın 'Antropometriler' serisinde ne yapılır?", "opts": ["Sanatçı kendi bedenini boyar ve tuvale yatar", "İzleyiciler tuvale ayak izleri bırakır", "Mavi boyaya bulanmış kadın modeller bedenlerini tuvale bastırır", "Ateşle tuvale izler yakılır"], "exp": "Klein, 1960'ta Paris'te bir orkestranın tek notalık 'Monoton Senfoni'si eşliğinde, IKB mavisine bulanan modellerin bedenlerini tuvale bastırmasını yönetti.", "detail": ["Klein buna 'canlı fırçalar' dedi ve kendisi boyaya dokunmadı. Bu performans, kadın bedeninin araç olarak kullanılması açısından bugün de tartışılır. Klein'ın patentli rengi 'International Klein Blue' (IKB) olarak bilinir."]}, "fr": {"q": "Que se passe-t-il dans la série des « Anthropométries » d'Yves Klein ?", "opts": ["L'artiste peint son propre corps et se couche sur la toile", "Les spectateurs laissent des traces de pas sur la toile", "Des modèles couvertes de peinture bleue impriment leur corps sur la toile", "On brûle des
