 cartel:{who:{tr:"Osman Hamdi Bey",fr:"Osman Hamdi Bey"},what:{tr:"Kaplumbağa Terbiyecisi",fr:"L'Éleveur de tortues"},when:{tr:"1906",fr:"1906"},how:{tr:"Tuval üzerine yağlıboya",fr:"Huile sur toile"},where:{tr:"Pera Müzesi, İstanbul",fr:"Musée de Pera, Istanbul"}},
 tr:{
  q:"'Kaplumbağa Terbiyecisi'nin ressamı Osman Hamdi Bey, resim dışında en çok neyle tanınır?",
  opts:["İstanbul Arkeoloji Müzeleri'ni geliştirmesi ve bugünkü Mimar Sinan Güzel Sanatlar Üniversitesi'nin temeli olan Sanayi-i Nefise Mektebi'ni kurmasıyla","Osmanlı'nın ilk fotoğraf stüdyosunu açmasıyla","Topkapı Sarayı'nın baş mimarı olmasıyla","İlk Türk romanını yazmasıyla"],
  exp:"Paris'te Gérôme ve Boulanger'nin atölyelerinde eğitim alan Osman Hamdi, 1881'de Müze-i Hümayun'un müdürü oldu ve 1882'de Sanayi-i Nefise Mektebi'ni kurdu. Sayda kazısında İskender Lahdi'ni de o gün ışığına çıkardı.",
  detail:["Tabloda kaftanlı yaşlı bir adam, sırtında nakkare, elinde ney ile kaplumbağaları eğitmeye çalışır. Resim çoğu zaman Osmanlı'da reformların yavaşlığına ironik bir gönderme olarak okunur. Sahne Bursa Yeşil Camii'nin üst katında geçer ve figür için sanatçı kendi yüzünü kullanmıştır.","Eser 2004'te Pera Müzesi tarafından, o güne kadar bir Türk tablosuna ödenen en yüksek fiyatla satın alındı.","Osman Hamdi, Avrupa'daki oryantalist resmin dilini kullanır; ama dışarıdan değil, içeriden bakan bir Osmanlı aydını olarak. Bu ikili konum, eserlerini bugün de hem tartışmalı hem çok ilgi çekici kılıyor."]
 },
 fr:{
  q:"Osman Hamdi Bey, peintre de « L'Éleveur de tortues », est surtout connu, en dehors de la peinture, pour quoi ?",
  opts:["Avoir développé les musées archéologiques d'Istanbul et fondé l'École des beaux-arts (Sanayi-i Nefise), ancêtre de l'actuelle université des beaux-arts Mimar Sinan","Avoir ouvert le premier studio de photographie ottoman","Avoir été l'architecte en chef du palais de Topkapı","Avoir écrit le premier roman turc"],
  exp:"Formé à Paris dans les ateliers de Gérôme et de Boulanger, Osman Hamdi est devenu directeur du Musée impérial en 1881 et a fondé l'École des beaux-arts en 1882. C'est aussi lui qui a mis au jour le sarcophage d'Alexandre lors des fouilles de Sidon.",
  detail:["Dans le tableau, un vieil homme en caftan, une timbale dans le dos et une flûte ney à la main, essaie de dresser des tortues. On y lit souvent une allusion ironique à la lenteur des réformes ottomanes. La scène se passe à l'étage de la Mosquée verte de Bursa, et l'artiste a utilisé son propre visage pour le personnage.","En 2004, l'œuvre a été achetée par le musée de Pera au prix le plus élevé jamais payé jusque-là pour un tableau turc.","Osman Hamdi utilise le langage de la peinture orientaliste européenne, mais en intellectuel ottoman qui regarde de l'intérieur, et non de l'extérieur. Cette double position rend ses œuvres à la fois discutées et fascinantes aujourd'hui."]
 }
},
{
 id:"hokusai", region:"asia", medium:"print", era:{tr:"Edo dönemi Japonya",fr:"Japon, époque d'Edo"}, year:1831,
 search:{commons:"Great Wave off Kanagawa", wiki:{tr:"Kanagawa Açıklarında Büyük Dalga", fr:"La Grande Vague de Kanagawa"}}, pd:true,

 cartel:{who:{tr:"Katsushika Hokusai",fr:"Katsushika Hokusai"},what:{tr:"Kanagawa Açıklarında Büyük Dalga",fr:"La Grande Vague de Kanagawa"},when:{tr:"y. 1831",fr:"v. 1831"},how:{tr:"Ağaç baskı (ukiyo-e)",fr:"Gravure sur bois (ukiyo-e)"},where:{tr:"Çok sayıda baskı: MET, British Museum, Guimet",fr:"Nombreux tirages : MET, British Museum, Guimet"}},
 tr:{
  q:"Hokusai'nin 'Kanagawa Açıklarında Büyük Dalga'sı hangi teknikle üretildi ve hangi seriye aittir?",
  opts:["İpek üzerine mürekkep; 'Genji'nin Hikâyesi' serisi","Ağaç baskı (ukiyo-e); 'Fuji Dağı'nın 36 Görünümü' serisi","Bakır gravür; 'Edo'nun 100 Ünlü Manzarası' serisi","Lake panel; 'Tōkaidō'nun 53 Durağı' serisi"],
  exp:"Yaklaşık 1831'de yayımlanan Büyük Dalga, oyulmuş ahşap kalıplarla binlerce kez basılabilen bir ukiyo-e baskısıdır. Japonya'ya yeni gelen sentetik Prusya mavisi, dalganın canlı rengini mümkün kıldı.",
  detail:["Uzakta küçücük görünen Fuji Dağı, kompozisyonun gerçek konusudur. Alçak ufuk çizgisi ve derinlik duygusu, Hokusai'nin Hollandalı tüccarlar aracılığıyla tanıdığı Batı perspektifinden de etkilenir.","1850'lerde Japonya'nın dışa açılmasından sonra bu baskılar Avrupa'ya ulaştı ve 'Japonizm' akımını doğurdu. Monet, Giverny'deki evinde 200'den fazla Japon baskısı topladı. Debussy'nin 'La Mer' partisyonunun kapağında da Büyük Dalga'dan uyarlanmış bir görsel var.","Tuzak şıklar: 'Edo'nun 100 Ünlü Manzarası' ve 'Tōkaidō'nun 53 Durağı' Hokusai'nin değil, genç rakibi Hiroshige'nin serileridir; ikisi de ağaç baskıdır."]
 },
 fr:{
  q:"Avec quelle technique « La Grande Vague de Kanagawa » de Hokusai a-t-elle été réalisée, et à quelle série appartient-elle ?",
  opts:["Encre sur soie ; série « Le Dit du Genji »","Gravure sur bois (ukiyo-e) ; série « Trente-six vues du mont Fuji »","Gravure sur cuivre ; série « Cent vues célèbres d'Edo »","Panneau laqué ; série « Les Cinquante-trois Relais du Tōkaidō »"],
  exp:"Publiée vers 1831, la Grande Vague est une estampe ukiyo-e, que l'on pouvait imprimer des milliers de fois à partir de planches de bois gravées. Le bleu de Prusse synthétique, récemment arrivé au Japon, a rendu possible la couleur vive de la vague.",
  detail:["Le mont Fuji, minuscule au loin, est le véritable sujet de la composition. La ligne d'horizon basse et l'impression de profondeur doivent aussi beaucoup à la perspective occidentale, que Hokusai a connue grâce aux marchands hollandais.","Après l'ouverture du Japon dans les années 1850, ces estampes sont arrivées en Europe et ont donné naissance au « japonisme ». Monet a réuni plus de 200 estampes japonaises dans sa maison de Giverny. La couverture de la partition de « La Mer » de Debussy reprend aussi une image adaptée de la Grande Vague.","Les pièges : les « Cent vues célèbres d'Edo » et « Les Cinquante-trois Relais du Tōkaidō » ne sont pas de Hokusai, mais de son jeune rival Hiroshige ; ce sont aussi des gravures sur bois."]
 }
},

 tr:{
  q:"Hindistan'daki Ajanta mağaraları neyle ünlüdür?",
  opts:["Hindu tapınak heykelleriyle dolu bir Babür sarayı olmasıyla","Kayaya oyulmuş Budist manastırları ve Buda'nın önceki yaşamlarını anlatan duvar resimleriyle","Hindistan'ın en eski camisi olmasıyla","Tac Mahal'in mermerinin çıkarıldığı ocaklar olmasıyla"],
  exp:"Ajanta'da MÖ 2. yüzyıl ile MS 5. yüzyıl arasında kayaya oyulmuş yaklaşık 30 mağara bulunur. Duvar resimleri Jataka hikâyelerini, yani Buda'nın önceki yaşamlarını anlatır ve Güney Asya resminin başyapıtları sayılır.",
  detail:["Mağaralar yüzyıllarca ormanın içinde unutuldu. 1819'da kaplan avlayan İngiliz subayı John Smith onları yeniden keşfetti ve bir duvara adını kazıdı.","En ünlü figürlerden biri, Mağara 1'deki Bodhisattva Padmapani'dir: ağır göz kapakları, elinde nilüfer ve zarif, kavisli bir duruş. Resimler, kil, saman ve kireçten bir sıvanın üzerine mineral pigmentlerle yapılmıştır.","Ajanta 1983'te UNESCO listesine girdi. Yakındaki Ellora'da ise Budist, Hindu ve Jain mağaraları yan yana durur."]
 },
 fr:{
  q:"Pour quoi les grottes d'Ajantâ, en Inde, sont-elles célèbres ?",
  opts:["C'est un palais moghol rempli de sculptures de temples hindous","Ce sont des monastères bouddhistes creusés dans la roche, avec des peintures murales qui racontent les vies antérieures du Bouddha","C'est la plus ancienne mosquée de l'Inde","Ce sont les carrières d'où vient le marbre du Taj Mahal"],
  exp:"Ajantâ compte une trentaine de grottes creusées dans la roche entre le IIe siècle av. J.-C. et le Ve siècle. Les peintures murales racontent les Jataka, c'est-à-dire les vies antérieures du Bouddha, et sont considérées comme des chefs-d'œuvre de la peinture d'Asie du Sud.",
  detail:["Les grottes ont été oubliées dans la forêt pendant des siècles. En 1819, un officier britannique, John Smith, les a redécouvertes en chassant le tigre, et il a gravé son nom sur un mur.","L'une des figures les plus célèbres est le bodhisattva Padmapani, dans la grotte 1 : paupières lourdes, lotus à la main et posture élégante et courbée. Les peintures ont été réalisées avec des pigments minéraux sur un enduit d'argile, de paille et de chaux.","Ajantâ est inscrit au patrimoine de l'UNESCO depuis 1983. Tout près, à Ellora, des grottes bouddhistes, hindoues et jaïnes se trouvent côte à côte."]
 }
},

 cartel:{who:{tr:"Filippo Brunelleschi",fr:"Filippo Brunelleschi"},what:{tr:"Perspektif deneyi",fr:"Expérience de la perspective"},when:{tr:"y. 1415",fr:"v. 1415"},how:{tr:"Boyalı pano ve ayna (kayıp)",fr:"Panneau peint et miroir (perdus)"},where:{tr:"San Giovanni Vaftizhanesi, Floransa",fr:"Baptistère Saint-Jean, Florence"}},
 tr:{
  q:"15. yüzyıl başında Floransa Vaftizhanesi'ni bir ayna ve delikli bir panoyla resmederek doğrusal perspektifi deneysel olarak gösteren kimdir?",
  opts:["Giotto","Filippo Brunelleschi","Leonardo da Vinci","Sandro Botticelli"],
  exp:"Mimar Brunelleschi'nin 1415 civarındaki deneyi, tek bir kaçış noktasına dayanan doğrusal perspektifin ilk kanıtı sayılır. Leon Battista Alberti 1435'te 'De pictura' adlı incelemesinde yöntemi ressamlar için kurallara bağladı.",
  detail:["Deney şöyleydi: Brunelleschi vaftizhaneyi bir panoya boyadı ve kaçış noktasına bir delik açtı. İzleyici panonun arkasından delikten bakıyor, önüne tutulan aynada resmi görüyordu. Ayna indirildiğinde resim ile gerçek bina birebir örtüşüyordu.","Masaccio'nun Santa Maria Novella'daki 'Kutsal Üçleme' freski (y. 1427), yöntemin ilk büyük uygulamalarından biridir; resmin görselini bağlantıdan açabilirsiniz.","Brunelleschi aynı zamanda Floransa Katedrali'nin dev kubbesinin mimarıdır. Giotto ise bir asır önce derinliği sezgisel olarak kurmuştu; ama tek kaçış noktalı sistematik bir yöntem yoktu."]
 },
 fr:{
  q:"Au début du XVe siècle, qui a démontré expérimentalement la perspective linéaire en représentant le baptistère de Florence avec un miroir et un panneau percé ?",
  opts:["Giotto","Filippo Brunelleschi","Léonard de Vinci","Sandro Botticelli"],
  exp:"L'expérience de l'architecte Brunelleschi, vers 1415, est considérée comme la première preuve de la perspective linéaire fondée sur un point de fuite unique. En 1435, Leon Battista Alberti a fixé la méthode en règles pour les peintres dans son traité « De pictura ».",
  detail:["L'expérience se déroulait ainsi : Brunelleschi a peint le baptistère sur un panneau et a percé un trou au point de fuite. Le spectateur regardait par le trou, depuis l'arrière du panneau, et voyait le tableau dans un miroir tenu devant lui. Quand on baissait le miroir, le tableau et le vrai bâtiment se superposaient parfaitement.","La fresque de la « Trinité » de Masaccio, à Santa Maria Novella (v. 1427), est l'une des premières grandes applications de la méthode ; vous pouvez ouvrir son image grâce au lien.","Brunelleschi est aussi l'architecte de l'immense coupole de la cathédrale de Florence. Un siècle plus tôt, Giotto avait construit la profondeur de façon intuitive, mais sans méthode systématique à point de fuite unique."]
 }
},

 tr:{
  q:"Velázquez'in 'Las Meninas' (1656) tablosunda kral IV. Felipe ve kraliçe Mariana nerede görünür?",
  opts:["Tablonun merkezinde, tahtta","Arka duvardaki aynada, yansıma olarak","Kapı eşiğinde duran figürler olarak","Hiç görünmezler; yalnızca adları yazılıdır"],
  exp:"Kraliyet çifti yalnızca arka duvardaki aynada görünür; yani tam olarak bizim, izleyicinin durduğu yerdedirler. Velázquez kendini de büyük bir tuvalin başında resmederek 'kim kime bakıyor' sorusunu sonsuz bir oyuna dönüştürür.",
  detail:["Merkezde Infanta Margarita Teresa, onun etrafında nedimeler (meninas), cüceler Mari Bárbola ve Nicolasito ve bir köpek var. Arkadaki kapıda duran figür, saray görevlisi José Nieto'dur.","Velázquez'in göğsündeki kırmızı Santiago tarikatı haçı, resim bittikten sonra eklendi; ressam tarikata ancak 1659'da kabul edildi.","Filozof Michel Foucault, 'Kelimeler ve Şeyler' (1966) kitabını bu tablonun analiziyle açar. Picasso da 1957'de tabloya 58 yorum yaptı; bunlar Barselona'daki Picasso Müzesi'ndedir."]
 },
 fr:{
  q:"Dans « Les Ménines » (1656) de Velázquez, où voit-on le roi Philippe IV et la reine Marianne ?",
  opts:["Au centre du tableau, sur le trône","Dans le miroir du mur du fond, en reflet","Debout sur le seuil de la porte","On ne les voit pas ; seuls leurs noms sont écrits"],
  exp:"Le couple royal n'apparaît que dans le miroir du mur du fond : ils se trouvent donc exactement là où nous sommes, nous, les spectateurs. En se peignant lui-même devant une grande toile, Velázquez transforme la question « qui regarde qui ? » en un jeu infini.",
  detail:["Au centre, on voit l'infante Marguerite-Thérèse, entourée de ses demoiselles d'honneur (les meninas), des nains Mari Bárbola et Nicolasito, et d'un chien. La figure debout dans la porte du fond est José Nieto, un officier de la cour.","La croix rouge de l'ordre de Santiago sur la poitrine de Velázquez a été ajoutée après la fin du tableau ; le peintre n'a été admis dans l'ordre qu'en 1659.","Le philosophe Michel Foucault ouvre « Les Mots et les Choses » (1966) par une analyse de ce tableau. Picasso en a aussi fait 58 interprétations en 1957 ; elles se trouvent au musée Picasso de Barcelone."]
 }

 tr:{

  exp:"1874'te Paris'teki ilk bağımsız sergide Monet'nin Le Havre limanındaki gün doğumunu gösteren tablosu da vardı. Eleştirmen Louis Leroy, Le Charivari gazetesindeki alaycı yazısında sanatçılara 'izlenimciler' dedi; sanatçılar bu adı sahiplendi.",
  detail:["Sergi 35 Boulevard des Capucines'te, fotoğrafçı Nadar'ın eski atölyesinde açıldı. Degas, Renoir, Pissarro, Morisot ve Cézanne katıldı.","Tuzak şık: Manet bu sergiye hiç katılmadı. Grubun öncülerinden sayılsa da resmî Salon'da kabul görmeyi tercih etti.","Tablo bugün Musée Marmottan Monet'de. Paris'teyseniz 16. bölgedeki bu müze, dünyanın en büyük Monet koleksiyonlarından birine ev sahipliği yapıyor."]

 fr:{
  q:"D'où vient le nom « impressionnisme » ?",
  opts:["D'un article de critique qui se moquait du tableau « Impression, soleil levant » de Monet","D'un manifeste publié par Manet","D'une catégorie officielle de prix du Salon de Paris","D'un poème de Baudelaire"],
  exp:"En 1874, lors de la première exposition indépendante à Paris, on pouvait voir le tableau de Monet montrant un lever de soleil sur le port du Havre. Le critique Louis Leroy, dans un article moqueur du journal Le Charivari, a appelé ces artistes les « impressionnistes » ; les artistes ont adopté ce nom.",
  detail:["L'exposition a ouvert au 35, boulevard des Capucines, dans l'ancien atelier du photographe Nadar. Degas, Renoir, Pissarro, Morisot et Cézanne y ont participé.","Le piège : Manet n'a jamais participé à cette exposition. Même s'il est considéré comme un précurseur du groupe, il préférait être reconnu au Salon officiel.","Le tableau se trouve aujourd'hui au musée Marmottan Monet. Si vous êtes à Paris, ce musée du 16e arrondissement abrite l'une des plus grandes collections de Monet au monde."]

 cartel:{who:{tr:"Nicéphore Niépce",fr:"Nicéphore Niépce"},what:{tr:"Le Gras'dan Görünüm",fr:"Point de vue du Gras"},when:{tr:"y. 1826–1827",fr:"v. 1826–1827"},how:{tr:"Heliografi, kalay levha üzerine Yudea bitümü",fr:"Héliographie, bitume de Judée sur étain"},where:{tr:"Harry Ransom Center, Austin (Teksas)",fr:"Harry Ransom Center, Austin (Texas)"}},
 tr:{
  q:"Günümüze ulaşan, kamerayla çekilmiş en eski fotoğraf kime aittir?",
  opts:["Louis Daguerre","Nicéphore Niépce","William Henry Fox Talbot","Nadar"],
  exp:"Niépce, 1826–1827 civarında Saint-Loup-de-Varennes'teki evinin penceresinden 'Le Gras'dan Görünüm'ü kaydetti. Yudea bitümüyle kaplı kalay bir levha saatlerce, belki günlerce ışığa tutuldu; Niépce bu tekniğe heliografi adını verdi.",
  detail:["Daguerre, Niépce'in ortağıydı. Niépce 1833'te öldükten sonra Daguerre çok daha hızlı olan dagerotipi geliştirdi.","1839'da François Arago buluşu Bilimler Akademisi'nde tanıttı; Fransız devleti buluşu satın alıp dünyaya 'armağan etti'. Aynı yıllarda İngiltere'de Talbot negatif-pozitif yöntemini geliştirdi; çoğaltılabilir fotoğrafın atası budur.","Niépce'in levhası bugün Teksas Üniversitesi'ndeki Harry Ransom Center'da korunuyor. Evi ise Saint-Loup-de-Varennes'te müze olarak ziyaret edilebiliyor."]
 },
 fr:{
  q:"À qui doit-on la plus ancienne photographie prise avec un appareil qui nous soit parvenue ?",
  opts:["Louis Daguerre","Nicéphore Niépce","William Henry Fox Talbot","Nadar"],
  exp:"Vers 1826–1827, Niépce a fixé le « Point de vue du Gras » depuis la fenêtre de sa maison à Saint-Loup-de-Varennes. Une plaque d'étain recouverte de bitume de Judée a été exposée à la lumière pendant des heures, peut-être des jours ; Niépce a appelé cette technique l'héliographie.",
  detail:["Daguerre était l'associé de Niépce. Après la mort de Niépce en 1833, Daguerre a mis au point le daguerréotype, beaucoup plus rapide.","En 1839, François Arago a présenté l'invention à l'Académie des sciences ; l'État français l'a achetée et l'a « offerte au monde ». À la même époque, en Angleterre, Talbot a mis au point le procédé négatif-positif ; c'est l'ancêtre de la photographie reproductible.","La plaque de Niépce est aujourd'hui conservée au Harry Ransom Center de l'université du Texas. Sa maison de Saint-Loup-de-Varennes se visite comme un musée."]
 }
},

 cartel:{who:{tr:"Auguste ve Louis Lumière",fr:"Auguste et Louis Lumière"},what:{tr:"Lumière Fabrikasından Çıkış",fr:"La Sortie de l'usine Lumière à Lyon"},when:{tr:"1895",fr:"1895"},how:{tr:"35 mm film, sinematograf",fr:"Film 35 mm, cinématographe"},where:{tr:"Institut Lumière, Lyon",fr:"Institut Lumière, Lyon"}},
 tr:{
  q:"Lumière Kardeşler'in 28 Aralık 1895'teki ilk ücretli halka açık sinema gösterimi nerede yapıldı?",
  opts:["Lyon Opera Binası'nda","Paris'te Grand Café'nin Salon Indien'inde","Berlin'de Wintergarten'de","New York'ta Koster & Bial's Music Hall'da"],
  exp:"Gösterim Paris'te, Boulevard des Capucines'teki Grand Café'nin bodrum katındaki 'Salon Indien'de yapıldı. Her biri yaklaşık 50 saniyelik on kısa film arasında 'Lumière Fabrikasından Çıkış' da vardı.",
  detail:["Ünlü efsaneye göre 'Trenin Gara Girişi' seyircileri dehşete düşürüp kaçıştırdı. Oysa bu film ilk programda yoktu ve panik hikâyesi büyük ölçüde abartılmıştır.","Sinematograf hem kamera, hem baskı makinesi, hem de projektördü. Edison'un Kinetoskop'u ise tek kişinin içine baktığı bir kutuydu. Tuzak şıklar: Berlin'de Skladanowsky kardeşler Kasım 1895'te kendi gösterimlerini yapmıştı; New York'taki gösterim ise Edison'un 1896'daki Vitascope'uydu.","Güzel bir tesadüf: 1874 İzlenimci sergisi Boulevard des Capucines 35 numaradaydı, sinemanın doğduğu Grand Café ise 14 numarada. İki sanat devrimi aynı caddede doğdu."]
 },
 fr:{
  q:"Où a eu lieu la première projection publique et payante des frères Lumière, le 28 décembre 1895 ?",
  opts:["À l'Opéra de Lyon","Au Salon indien du Grand Café, à Paris","Au Wintergarten, à Berlin","Au Koster & Bial's Music Hall, à New York"],
  exp:"La projection a eu lieu à Paris, au « Salon indien », au sous-sol du Grand Café, boulevard des Capucines. Parmi les dix courts films d'environ 50 secondes chacun, il y avait « La Sortie de l'usine Lumière à Lyon ».",
  detail:["Selon une légende célèbre, « L'Arrivée d'un train en gare de La Ciotat » aurait terrifié les spectateurs, qui se seraient enfuis. Pourtant, ce film ne faisait pas partie du premier programme, et l'histoire de la panique est largement exagérée.","Le cinématographe était à la fois une caméra, une tireuse et un projecteur. Le kinétoscope d'Edison, lui, était une boîte dans laquelle une seule personne regardait. Les pièges : à Berlin, les frères Skladanowsky avaient fait leur propre projection en novembre 1895 ; à New York, il s'agissait du Vitascope d'Edison, en 1896.","Une belle coïncidence : l'exposition impressionniste de 1874 se tenait au 35, boulevard des Capucines, et le Grand Café, où est né le cinéma, au 14. Deux révolutions artistiques sont nées dans la même rue."]
 }
},
{
 id:"corbusier", region:"europe", medium:"arch", era:{tr:"Modernizm",fr:"Modernisme"}, year:1929,
 search:{commons:"Villa Savoye", wiki:{tr:"Villa Savoye", fr:"Villa Savoye"}}, pd:false,

 cartel:{who:{tr:"Le Corbusier ve Pierre Jeanneret",fr:"Le Corbusier et Pierre Jeanneret"},what:{tr:"Villa Savoye",fr:"Villa Savoye"},when:{tr:"1928–1931",fr:"1928–1931"},how:{tr:"Betonarme",fr:"Béton armé"},where:{tr:"Poissy (Yvelines)",fr:"Poissy (Yvelines)"}},
 tr:{
  q:"Hangisi Le Corbusier'nin 'Yeni Mimarinin Beş Noktası'ndan biri değildir?",
  opts:["Pilotiler (taşıyıcı ince sütunlar)","Çatı bahçesi","Yatay bant pencere","Süslemeli taş cephe"],
  exp:"1927'de tanımlanan beş nokta şunlardır: pilotiler, çatı bahçesi, serbest plan, yatay bant pencere ve serbest cephe. Betonarme iskelet duvarları taşıyıcılıktan kurtarır; süsleme ise bu modernist programın tam karşıtıdır.",
  detail:["Villa Savoye (1928–1931), beş noktanın neredeyse bir manifestosudur. Paris'ten RER A hattıyla Poissy'ye gidip gezebilirsiniz.","Le Corbusier evi 'içinde yaşanacak bir makine' olarak tanımladı. Süsleme karşıtlığının öncülerinden biri, Adolf Loos'un 1908 tarihli 'Süsleme ve Suç' yazısıdır.","Le Corbusier'nin 17 eseri 2016'da UNESCO listesine girdi. Ama mirası tartışmalıdır: Paris'in tarihî merkezini yıkıp kulelerle değiştirmeyi öneren 'Plan Voisin' ve Vichy rejimiyle kurduğu ilişkiler bugün de eleştiriliyor."]
 },
 fr:{
  q:"Lequel de ces éléments ne fait pas partie des « Cinq points de l'architecture moderne » de Le Corbusier ?",
  opts:["Les pilotis","Le toit-jardin","La fenêtre en longueur","La façade en pierre ornementée"],
  exp:"Les cinq points, définis en 1927, sont : les pilotis, le toit-jardin, le plan libre, la fenêtre en longueur et la façade libre. L'ossature en béton armé libère les murs de leur rôle porteur ; l'ornement est l'exact opposé de ce programme moderniste.",
  detail:["La villa Savoye (1928–1931) est presque un manifeste des cinq points. Depuis Paris, vous pouvez aller la visiter à Poissy avec le RER A.","Le Corbusier a défini la maison comme une « machine à habiter ». L'un des précurseurs du refus de l'ornement est le texte d'Adolf Loos, « Ornement et crime », de 1908.","Dix-sept œuvres de Le Corbusier ont été inscrites au patrimoine de l'UNESCO en 2016. Mais son héritage est discuté : le « plan Voisin », qui proposait de raser le centre historique de Paris pour le remplacer par des tours, et ses liens avec le régime de Vichy sont encore critiqués aujourd'hui."]
 }
},

 cartel:{who:{tr:"Marcel Duchamp",fr:"Marcel Duchamp"},what:{tr:"Çeşme",fr:"Fontaine"},when:{tr:"1917 (kopya 1964)",fr:"1917 (réplique 1964)"},how:{tr:"Porselen pisuar, hazır nesne",fr:"Urinoir en porcelaine, ready-made"},where:{tr:"Kopyası: Centre Pompidou, Paris",fr:"Réplique : Centre Pompidou, Paris"}},
 tr:{
  q:"Marcel Duchamp'ın 1917'de 'R. Mutt' imzasıyla bir sergiye gönderdiği hazır nesne hangisidir?",
  opts:["Bisiklet Tekerleği","Çeşme (ters çevrilmiş bir pisuar)","Şişe Kurutucu","L.H.O.O.Q. (bıyıklı Mona Lisa)"],
  exp:"New York'taki Bağımsız Sanatçılar Derneği sergisine gönderilen 'Çeşme', jüri olmayacağı ilan edilmiş olmasına rağmen sergilenmedi. Duchamp'ın 'ready-made' fikri sanatı, el emeğinden çok sanatçının seçiminden doğan bir düşünce olarak yeniden tanımladı.",
  detail:["Orijinal nesne kayıp; geriye yalnızca fotoğrafçı Alfred Stieglitz'in çektiği fotoğraf kaldı. Müzelerdeki örnekler 1950'ler ve 60'larda yapılmış kopyalardır; birini Paris'te Centre Pompidou'da görebilirsiniz.","2004'te 500 sanat uzmanıyla yapılan bir ankette 'Çeşme' 20. yüzyılın en etkili sanat eseri seçildi. Bazı araştırmacılar fikrin aslında Dadacı sanatçı Elsa von Freytag-Loringhoven'a ait olabileceğini öne sürüyor; bu iddia hâlâ tartışmalı.","Diğer şıklar da Duchamp'ın eserleridir: 'Bisiklet Tekerleği' (1913) ilk hazır nesne sayılır, L.H.O.O.Q. ise 1919'da Mona Lisa kartpostalına bıyık çizdiği eserdir."]
 },
 fr:{
  q:"Quel ready-made Marcel Duchamp a-t-il envoyé à une exposition en 1917, signé « R. Mutt » ?",
  opts:["Roue de bicyclette","Fontaine (un urinoir renversé)","Porte-bouteilles","L.H.O.O.Q. (la Joconde moustachue)"],
  exp:"Envoyée à l'exposition de la Société des artistes indépendants de New York, « Fontaine » n'a pas été exposée, alors qu'on avait annoncé qu'il n'y aurait pas de jury. L'idée du ready-made a redéfini l'art comme une pensée née du choix de l'artiste plutôt que du travail de la main.",

 cartel:{who:{tr:"El Lissitzky",fr:"El Lissitzky"},what:{tr:"Beyazları Kızıl Kamayla Vur",fr:"Battez les Blancs avec le coin rouge"},when:{tr:"1919–1920",fr:"1919–1920"},how:{tr:"Litografi afiş",fr:"Affiche lithographiée"},where:{tr:"Rusya (İç Savaş dönemi)",fr:"Russie (guerre civile)"}},
 tr:{
  q:"Rus İç Savaşı sırasında, kırmızı bir üçgenin beyaz bir daireyi delmesiyle siyasi mesajını tamamen geometrik biçimlerle veren 'Beyazları Kızıl Kamayla Vur' afişinin sanatçısı kimdir?",
  opts:["El Lissitzky","Aleksandr Rodçenko","Kazimir Maleviç","Wassily Kandinsky"],
  exp:"El Lissitzky 1919–1920'de, Maleviç'in Süprematist dilini siyasi propagandaya uyguladı. Kızıl üçgen Bolşevikleri, beyaz daire karşı-devrimci 'Beyazlar'ı temsil eder: soyut biçim, kitlelere mesaj taşıyan bir araca dönüşür.",
  detail:["Konstrüktivistler sanatı 'saf' bir uğraş olarak değil, toplumu inşa etmenin aracı olarak gördü: afiş, kitap, mobilya, kumaş, sahne ve mimari. Rodçenko'nun fotoğrafları ve fotomontajları da bu anlayışın ürünüdür.","El Lissitzky, 'Proun' adını verdiği deneylerle resim ile mimari arasında bir köprü kurdu. Berlin'deki yılları, Konstrüktivist fikirlerin Bauhaus'a ve De Stijl'e ulaşmasında önemli rol oynadı.","Bu kırmızı kama imgesi grafik tasarımda ve albüm kapaklarında hâlâ sık sık alıntılanır; tasarım tarihinin en etkili afişlerinden biridir."]
 },
 fr:{
  q:"Pendant la guerre civile russe, qui a créé l'affiche « Battez les Blancs avec le coin rouge », où un triangle rouge transperce un cercle blanc pour transmettre un message politique uniquement par des formes géométriques ?",
  opts:["El Lissitzky","Alexandre Rodtchenko","Kasimir Malevitch","Vassily Kandinsky"],
  exp:"En 1919–1920, El Lissitzky a appliqué le langage suprématiste de Malevitch à la propagande politique. Le triangle rouge représente les bolcheviks, et le cercle blanc les « Blancs » contre-révolutionnaires : la forme abstraite devient un outil qui transmet un message aux masses.",
  detail:["Les constructivistes ne voyaient pas l'art comme une activité « pure », mais comme un outil pour construire la société : affiches, livres, mobilier, tissus, scène et architecture. Les photographies et photomontages de Rodtchenko sont aussi le fruit de cette vision.","Avec ses expériences appelées « Proun », El Lissitzky a créé un pont entre la peinture et l'architecture. Ses années à Berlin ont joué un rôle important dans la diffusion des idées constructivistes vers le Bauhaus et De Stijl.","Cette image du coin rouge est encore souvent citée dans le graphisme et sur les pochettes d'albums ; c'est l'une des affiches les plus influentes de l'histoire du design."]
 }
},
{
 id:"m-sequence2", type:"order", region:"europe", medium:"concept", era:{tr:"1913–1937",fr:"1913–1937"}, year:1913,
 search:{commons:"", wiki:{tr:"Dadaizm", fr:"Dada"}},
 years:["1913","1916","1924","1937"],
 tr:{
  q:"Bu sergi ve olayları eskiden yeniye doğru sırala.",
  items:["New York'ta Armory Show, Avrupa avangardını Amerika'ya tanıtır","Zürih'te Cabaret Voltaire'de Dada doğar","André Breton Sürrealizm Manifestosu'nu yayımlar","Naziler Münih'te 'Yozlaşmış Sanat' sergisini açar"],
  notes:["1913: New York'taki Armory Show, Duchamp ve Matisse gibi Avrupalı avangartları Amerikan izleyicisine ilk kez geniş ölçekte gösterdi.", "1916: Birinci Dünya Savaşı sürerken tarafsız İsviçre'ye sığınan sanatçılar Zürih'te Dada'yı başlattı.", "1924: Breton'un manifestosu Sürrealizmi resmen başlattı; Dada'nın yıkıcılığı yerine bilinçaltını keşfetmeyi önerdi.", "1937: Naziler modern sanatı aşağılamak için Münih'te sergiledi; aynı günlerde 'onaylı' Alman sanatının büyük sergisini de açtılar."],
  exp:"Armory Show (1913) Amerikan izleyicisini Kübizmle sarstı; Dada (1916) savaşın saçmalığına karşı bir anti-sanat olarak doğdu; Sürrealizm (1924) Dada'nın içinden çıkıp bilinçaltını keşfetti; 1937'de ise Naziler modern sanatı alay konusu yapmak için sergiledi.",
  detail:["Armory Show'un en büyük skandalı Duchamp'ın 'Merdivenden İnen Çıplak, No. 2' tablosuydu; bir eleştirmen onu bir kiremit fabrikasındaki patlamaya benzetti.","Breton, Freud'dan esinlenerek 'otomatik yazı'yı önerdi: aklın denetimi olmadan, düşüncenin kendiliğinden akışı. Sürrealizmin merkezi Paris'ti; Dalí, Magritte, Max Ernst ve Leonora Carrington hareketle ilişkilendirildi.","'Yozlaşmış Sanat' sergisi iki milyondan fazla ziyaretçiyle dönemin en kalabalık modern sanat sergisi oldu. Aynı yıllarda Alman müzelerinden binlerce eser toplatıldı, satıldı ya da yok edildi."]
 },
 fr:{
  q:"Classez ces expositions et événements du plus ancien au plus récent.",
  items:["L'Armory Show fait découvrir l'avant-garde européenne à New York","Dada naît au Cabaret Voltaire, à Zurich","André Breton publie le Manifeste du surréalisme","Les nazis ouvrent l'exposition « Art dégénéré » à Munich"],
  notes:["1913 : l'Armory Show de New York montre pour la première fois à grande échelle des avant-gardes européennes, comme Duchamp et Matisse, au public américain.", "1916 : pendant la Première Guerre mondiale, des artistes réfugiés dans la Suisse neutre lancent Dada à Zurich.", "1924 : le manifeste de Breton fonde officiellement le surréalisme ; au lieu de la destruction de Dada, il propose d'explorer l'inconscient.", "1937 : les nazis exposent l'art moderne à Munich pour l'humilier ; au même moment, ils ouvrent une grande exposition de l'art allemand « approuvé »."],
  exp:"L'Armory Show (1913) a choqué le public américain avec le cubisme ; Dada (1916) est né comme un anti-art contre l'absurdité de la guerre ; le surréalisme (1924) est sorti de Dada pour explorer l'inconscient ; en 1937, les nazis ont exposé l'art moderne pour le ridiculiser.",
  detail:["Le plus grand scandale de l'Armory Show a été le « Nu descendant un escalier n° 2 » de Duchamp ; un critique l'a comparé à une explosion dans une fabrique de tuiles.","Inspiré par Freud, Breton a proposé « l'écriture automatique » : le flux spontané de la pensée, sans contrôle de la raison. Le centre du surréalisme était Paris ; Dalí, Magritte, Max Ernst et Leonora Carrington ont été associés au mouvement.","Avec plus de deux millions de visiteurs, l'exposition « Art dégénéré » a été l'exposition d'art moderne la plus fréquentée de l'époque. Pendant ces années, des milliers d'œuvres ont été saisies dans les musées allemands, vendues ou détruites."]
 }
},

 cartel:{who:{tr:"Tarsila do Amaral",fr:"Tarsila do Amaral"},what:{tr:"Abaporu",fr:"Abaporu"},when:{tr:"1928",fr:"1928"},how:{tr:"Tuval üzerine yağlıboya",fr:"Huile sur toile"},where:{tr:"MALBA, Buenos Aires",fr:"MALBA, Buenos Aires"}},
 tr:{
  q:"Tarsila do Amaral'ın 'Abaporu' (1928) tablosu hangi Brezilya modernist fikrinin simgesi oldu?",
  opts:["Antropofaji: Avrupa kültürünü 'yiyip' sindirerek yeni bir Brezilya sanatı yaratmak","Muralizm: devrimi kamusal duvar resimleriyle halka anlatmak","Primitivizm: Avrupa'dan tamamen kopup yalnızca yerli geleneklere dönmek","Konstrüktivizm: sanatı endüstriyel üretime adamak"],
  exp:"Abaporu, Tupi dilinde 'insan yiyen' anlamına gelir. Şair Oswald de Andrade, tablodan etkilenerek 1928'de 'Antropofaji Manifestosu'nu yazdı: Brezilya, Avrupa avangardını taklit etmek yerine onu yutup kendi kültürüne dönüştürmeliydi.",
  detail:["Tarsila tabloyu, o dönem eşi olan Oswald de Andrade'a doğum günü hediyesi olarak verdi. Dev ayaklar ve küçük baş, düşünceden çok bedenle ve toprakla var olan bir figür önerir; yanında bir kaktüs ve güneş vardır.","Tarsila Paris'te Fernand Léger ve André Lhote'un atölyelerinde çalıştı; yani Avrupa modernizmini içeriden tanıyordu. Antropofaji bu yüzden bir reddediş değil, bir sindirme stratejisiydi.","Tuzak şık 'Muralizm', aynı yıllarda Meksika'da Diego Rivera, José Clemente Orozco ve David Alfaro Siqueiros'un hareketidir. Abaporu bugün Buenos Aires'teki MALBA müzesinde."]
 },
 fr:{
  q:"Le tableau « Abaporu » (1928) de Tarsila do Amaral est devenu le symbole de quelle idée moderniste brésilienne ?",
  opts:["L'anthropophagie : « dévorer » la culture européenne pour créer un nouvel art brésilien","Le muralisme : raconter la révolution au peuple par des peintures murales publiques","Le primitivisme : rompre totalement avec l'Europe pour revenir aux seules traditions autochtones","Le constructivisme : consacrer l'art à la production industrielle"],
  exp:"« Abaporu » signifie « homme qui mange » en langue tupi. Inspiré par le tableau, le poète Oswald de Andrade a écrit en 1928 le « Manifeste anthropophage » : au lieu d'imiter l'avant-garde européenne, le Brésil devait l'avaler et la transformer en sa propre culture.",
  detail:["Tarsila a offert le tableau à Oswald de Andrade, alors son mari, pour son anniversaire. Les pieds immenses et la petite tête suggèrent une figure qui existe par le corps et la terre plutôt que par la pensée ; à côté, on voit un cactus et un soleil.","Tarsila a travaillé à Paris dans les ateliers de Fernand Léger et d'André Lhote ; elle connaissait donc le modernisme européen de l'intérieur. L'anthropophagie n'était pas un rejet, mais une stratégie de digestion.","Le piège, le « muralisme », est le mouvement mexicain de Diego Rivera, José Clemente Orozco et David Alfaro Siqueiros, à la même époque. « Abaporu » se trouve aujourd'hui au MALBA, à Buenos Aires."]
 }
},
{
 id:"m-dgrubu", type:"tf", region:"anatolia", medium:"painting", era:{tr:"Türk modernizmi",fr:"Modernisme turc"}, year:1933,
 search:{commons:"", wiki:{tr:"D Grubu", fr:"Groupe D"}},
 answer:true,
 tr:{
  q:"1933'te İstanbul'da kurulan D Grubu, Türk resminde Kübizm ve Konstrüktivizm gibi modern akımları savunan öncü bir sanatçı topluluğuydu.",
  exp:"Doğru. Zeki Faik İzer, Nurullah Berk, Cemal Tollu, Elif Naci, Abidin Dino ve heykeltıraş Zühtü Müridoğlu'nun kurduğu grup, İzlenimci 'Çallı kuşağı'na karşı daha geometrik ve yapısal bir modernizm önerdi.",
  detail:["Grubun adı, Türkiye'de kurulan dördüncü sanat birliği olmasından gelir: alfabenin dördüncü harfi. İlk sergisini 1933'te Beyoğlu'nda Mimoza adlı bir şapka mağazasında açtı.","Üyelerin çoğu Paris'te André Lhote ve Fernand Léger'nin atölyelerinde çalışmıştı. Kübizmi Türkiye'ye taşıdılar ama onu yerel motiflerle, minyatür ve halk sanatı geleneğiyle birleştirmeye çalıştılar.","Abidin Dino daha sonra Paris'e yerleşti ve uluslararası bir kariyer yaptı. D Grubu'nun açtığı yol, 1940'lardaki Yeniler Grubu'na ve Türk soyut sanatının gelişimine zemin hazırladı."]
 },
 fr:{
  q:"Fondé à Istanbul en 1933, le Groupe D était un collectif d'artistes pionnier qui défendait des mouvements modernes comme le cubisme et le constructivisme dans la peinture turque.",
  exp:"Vrai. Fondé par Zeki Faik İzer, Nurullah Berk, Cemal Tollu, Elif Naci, Abidin Dino et le sculpteur Zühtü Müridoğlu, le groupe proposait un modernisme plus géométrique et structuré, face à la « génération Çallı », d'inspiration impressionniste.",
  detail:["Le nom du groupe vient du fait qu'il était la quatrième association d'artistes fondée en Turquie : la quatrième lettre de l'alphabet. Sa première exposition a eu lieu en 1933 à Beyoğlu, dans un magasin de chapeaux appelé Mimoza.","La plupart des membres avaient travaillé à Paris dans les ateliers d'André Lhote et de Fernand Léger. Ils ont apporté le cubisme en Turquie, mais ont cherché à le mêler aux motifs locaux, à la tradition de la miniature et à l'art populaire.","Abidin Dino s'est ensuite installé à Paris et a mené une carrière internationale. Le chemin ouvert par le Groupe D a préparé le Groupe des Nouveaux, dans les années 1940, et le développement de l'art abstrait turc."]
 }
}
];

 fr:['L\'impressionnisme est né à Paris dans les années 1870, avec un groupe de peintres opposés aux règles strictes du Salon officiel. Ils peignaient en plein air, avec des touches rapides et visibles, pour saisir la lumière, l\'air et la vie moderne.','Le nom vient d\'un tableau de Monet montré lors de la première exposition indépendante, en 1874. Des ombres colorées au lieu du noir, des couleurs pures et des sujets quotidiens ont transformé la peinture occidentale et ouvert la voie à l\'art moderne.'],
 en:['Impressionism emerged in Paris in the 1870s, led by painters who rejected the strict rules of the official Salon. They worked outdoors with quick, visible brushstrokes to capture fleeting light, atmosphere and modern city life.','The name comes from a Monet painting shown at the first independent exhibition in 1874. Coloured shadows instead of black, pure unmixed colours and everyday subjects transformed Western painting and opened the way to modern art.']},

 tr:['Post-izlenimcilik tek bir akım değil, İzlenimcilikten yola çıkıp onu aşan sanatçılar için sonradan kullanılan bir şemsiye terimdir. Eleştirmen Roger Fry bu adı 1910\'da Londra\'da düzenlediği sergi için kullandı.','Cézanne doğayı geometrik yapılara indirdi, Van Gogh rengi duygunun dili yaptı, Gauguin düz renk alanları ve sembollerle çalıştı, Seurat ise noktacılıkla rengi bilimsel olarak böldü. Bu farklı yollar Kübizm, Fovizm ve Dışavurumculuğa zemin hazırladı.'],
 fr:['Le postimpressionnisme n\'est pas un mouvement unique, mais un terme employé plus tard pour des artistes partis de l\'impressionnisme pour le dépasser. Le critique Roger Fry a utilisé ce nom pour une exposition à Londres, en 1910.','Cézanne a réduit la nature à des structures géométriques, Van Gogh a fait de la couleur le langage de l\'émotion, Gauguin a travaillé avec des aplats et des symboles, et Seurat a divisé la couleur avec le pointillisme. Ces chemins ont préparé le cubisme, le fauvisme et l\'expressionnisme.'],
 en:['Post-Impressionism is not a single movement but a later umbrella term for artists who started from Impressionism and went beyond it. The critic Roger Fry used the name for an exhibition he organised in London in 1910.','Cézanne reduced nature to geometric structures, Van Gogh made colour the language of emotion, Gauguin used flat areas of colour and symbols, and Seurat divided colour scientifically with pointillism. These paths prepared Cubism, Fauvism and Expressionism.']},

 tr:['Art Nouveau, 19. yüzyılın sonunda Avrupa\'da ortaya çıkan, bitkilerden ve doğadan esinlenen kıvrımlı çizgileriyle tanınan bir üsluptur. Ülkeye göre farklı adlar aldı: Almanya\'da Jugendstil, Viyana\'da Sezession, Katalonya\'da Modernisme.','Akım resimle yetinmedi; mimari, afiş, mobilya, cam ve mücevheri tek bir bütün olarak tasarlamak istedi. Paris metrosunun Guimard girişleri ve Gaudí\'nin Barselona\'daki binaları, sanatın gündelik hayata taşınmasının en bilinen örnekleridir.'],
 fr:['L\'Art nouveau est un style apparu en Europe à la fin du XIXe siècle, reconnaissable à ses lignes courbes inspirées des plantes et de la nature. Il a pris des noms différents selon les pays : Jugendstil en Allemagne, Sécession à Vienne, Modernisme en Catalogne.','Le mouvement ne s\'est pas limité à la peinture : il voulait concevoir comme un tout l\'architecture, l\'affiche, le mobilier, le verre et le bijou. Les entrées du métro parisien de Guimard et les bâtiments de Gaudí à Barcelone en sont des exemples célèbres.'],
 en:['Art Nouveau is a style that appeared in Europe at the end of the 19th century, recognisable by curving lines inspired by plants and nature. It took different names by country: Jugendstil in Germany, Secession in Vienna, Modernisme in Catalonia.','The movement went beyond painting: it aimed to design architecture, posters, furniture, glass and jewellery as one whole. Guimard\'s Paris Métro entrances and Gaudí\'s buildings in Barcelona are famous examples of art entering everyday life.']},

 tr:['Fovizm kısa ama etkili bir akımdır: 1905 Sonbahar Salonu\'nda Matisse, Derain ve arkadaşlarının resimleri yan yana asılınca eleştirmen Louis Vauxcelles onlara "fov", yani vahşi hayvanlar dedi.','Fovlar rengi doğayı taklit etmekten kurtardı: yüzler yeşil, ağaçlar kırmızı olabilirdi. Saf ve parlak renkler, duyguyu ve resmin kendi düzenini ifade etmek için kullanıldı. Bu özgürlük Dışavurumculuğu ve sonraki soyut resmi doğrudan etkiledi.'],
 fr:['Le fauvisme est un mouvement court mais influent : au Salon d\'automne de 1905, les tableaux de Matisse, Derain et leurs amis ont été accrochés ensemble, et le critique Louis Vauxcelles les a appelés les « fauves ».','Les fauves ont libéré la couleur de l\'imitation de la nature : un visage pouvait être vert, un arbre rouge. Les couleurs pures et vives servaient à exprimer l\'émotion et l\'ordre propre du tableau. Cette liberté a influencé l\'expressionnisme et l\'abstraction.'],
 en:['Fauvism was short-lived but influential: at the 1905 Salon d\'Automne, paintings by Matisse, Derain and their friends were hung together, and the critic Louis Vauxcelles called them "fauves", wild beasts.','The Fauves freed colour from imitating nature: a face could be green, a tree red. Pure, bright colours expressed emotion and the painting\'s own order. This freedom directly influenced Expressionism and later abstract painting.']},

  {t:{tr:'Picasso\'nun Portresi',fr:'Portrait de Picasso',en:'Portrait of Pablo Picasso'},a:'Juan Gris',y:'1912',m:'Art Institute of Chicago',c:'Juan Gris Portrait of Pablo Picasso 1912'}],
 tr:['Kübizm, Picasso ile Braque\'ın 1907–1914 arasında birlikte geliştirdiği, Rönesans\'tan beri süren tek bakış noktalı perspektifi yıkan akımdır. Nesneler aynı anda birçok açıdan görülüyor, geometrik düzlemlere bölünüyordu.','İlk evreye analitik Kübizm denir: renkler kahverengi ve griye iner, biçimler parçalanır. Sonraki sentetik evrede kolaj ve gazete kâğıdı gibi gerçek malzemeler resme girdi. Kübizm, 20. yüzyıl sanatının neredeyse bütün avangart akımlarını etkiledi.'],
 fr:['Le cubisme, développé ensemble par Picasso et Braque entre 1907 et 1914, a brisé la perspective à point de vue unique héritée de la Renaissance. Les objets étaient montrés sous plusieurs angles à la fois, découpés en plans géométriques.','La première phase s\'appelle le cubisme analytique : les couleurs se réduisent aux bruns et aux gris, les formes se fragmentent. Dans la phase synthétique, le collage et des matériaux réels comme le papier journal entrent dans le tableau.'],
 en:['Cubism, developed jointly by Picasso and Braque between 1907 and 1914, broke the single-viewpoint perspective inherited from the Renaissance. Objects were shown from several angles at once and broken into geometric planes.','The first phase is called Analytic Cubism: colours are reduced to browns and greys and forms are fragmented. In the later Synthetic phase, collage and real materials such as newspaper entered the picture. Cubism influenced almost every avant-garde of the 20th century.']},
futurism:{years:'1909–1944',wiki:{tr:'Fütürizm',fr:'Futurisme',en:'Futurism'},
 artists:['Filippo Tommaso Marinetti','Umberto Boccioni','Giacomo Balla','Gino Severini','Natalia Gonçarova'],
 works:[{t:{tr:'Mekânda Sürekliliğin Eşsiz Biçimleri',fr:'Formes uniques de la continuité dans l\'espace',en:'Unique Forms of Continuity in Space'},a:'Umberto Boccioni',y:'1913',m:'MoMA, New York',c:'Boccioni Unique Forms of Continuity in Space'},
  {t:{tr:'Şehir Yükseliyor',fr:'La ville qui monte',en:'The City Rises'},a:'Umberto Boccioni',y:'1910',m:'MoMA, New York',c:'Boccioni The City Rises 1910'},
  {t:{tr:'Tasmalı Köpeğin Dinamizmi',fr:'Dynamisme d\'un chien en laisse',en:'Dynamism of a Dog on a Leash'},a:'Giacomo Balla',y:'1912',m:'Buffalo AKG Art Museum',c:'',pd:false}],
 tr:['Fütürizm, şair Marinetti\'nin 1909\'da Le Figaro\'da yayımladığı manifestoyla başladı. Hareket geçmişi ve müzeleri reddetti; hızı, makineyi, otomobili, elektriği ve kalabalık modern şehri yüceltti.','Ressamlar ve heykeltıraşlar hareketi ve zamanı tek bir görüntüde göstermeye çalıştı. Manifestonun savaşı övmesi ve bazı üyelerin sonradan faşizme yakınlaşması, akımın mirasını tartışmalı kılar. Rusya\'da Kübizm\'le birleşerek Kübo-Fütürizm\'i doğurdu.'],
 fr:['Le futurisme a commencé avec le manifeste publié par le poète Marinetti dans Le Figaro, en 1909. Le mouvement rejetait le passé et les musées ; il célébrait la vitesse, la machine, l\'automobile, l\'électricité et la grande ville moderne.','Peintres et sculpteurs cherchaient à montrer le mouvement et le temps dans une seule image. L\'éloge de la guerre dans le manifeste et le rapprochement de certains membres avec le fascisme rendent son héritage discuté.'],
 en:['Futurism began with the manifesto the poet Marinetti published in Le Figaro in 1909. The movement rejected the past and museums, and celebrated speed, machines, cars, electricity and the crowded modern city.','Painters and sculptors tried to show movement and time in a single image. The manifesto\'s praise of war and some members\' later closeness to Fascism make its legacy controversial. In Russia it merged with Cubism into Cubo-Futurism.']},
constructivism:{years:'1913–1930',wiki:{tr:'Konstrüktivizm (sanat)',fr:'Constructivisme (art)',en:'Constructivism (art)'},
 artists:['Vladimir Tatlin','Aleksandr Rodçenko','El Lissitzky','Lyubov Popova','Varvara Stepanova','Kazimir Maleviç'],
 works:[{t:{tr:'Siyah Kare',fr:'Carré noir',en:'Black Square'},a:'Kazimir Maleviç',y:'1915',m:'Tretyakov Galerisi, Moskova',c:'Malevich Black Square 1915'},
  {t:{tr:'Beyazları Kızıl Kamayla Vur',fr:'Battez les Blancs avec le coin rouge',en:'Beat the Whites with the Red Wedge'},a:'El Lissitzky',y:'1919–1920',m:'',c:'Beat the Whites with the Red Wedge'},
  {t:{tr:'III. Enternasyonal Anıtı (maket)',fr:'Monument à la IIIe Internationale (maquette)',en:'Monument to the Third International (model)'},a:'Vladimir Tatlin',y:'1919–1920',m:'',c:'Tatlin Tower model 1920'}],
 tr:['Konstrüktivizm, 1917 Devrimi çevresinde Rusya\'da gelişti. Sanatı bireysel bir ifade değil, yeni toplumu "inşa etmenin" aracı olarak gördü; demir, cam ve ahşap gibi endüstriyel malzemelerle çalıştı.','Konstrüktivistler afiş, kitap, kumaş, mobilya, sahne ve mimari tasarladı. Maleviç\'in Süprematizmi geometrik dilin kaynağıydı. El Lissitzky gibi sanatçılar bu fikirleri Bauhaus\'a ve De Stijl\'e taşıdı; modern grafik tasarımın büyük kısmı bu mirastan gelir.'],
 fr:['Le constructivisme s\'est développé en Russie autour de la révolution de 1917. Il voyait l\'art non comme une expression individuelle, mais comme un outil pour « construire » la société nouvelle, avec des matériaux industriels comme le fer, le verre et le bois.','Les constructivistes ont conçu des affiches, des livres, des tissus, des meubles, des décors et des bâtiments. Le suprématisme de Malevitch était la source de ce langage géométrique. El Lissitzky a transmis ces idées au Bauhaus et à De Stijl.'],
 en:['Constructivism developed in Russia around the 1917 Revolution. It saw art not as personal expression but as a tool to "construct" the new society, using industrial materials such as iron, glass and wood.','Constructivists designed posters, books, textiles, furniture, stage sets and buildings. Malevich\'s Suprematism was the source of their geometric language. Artists like El Lissitzky carried these ideas to the Bauhaus and De Stijl; much of modern graphic design comes from this legacy.']},
dada:{years:'1916–1924',wiki:{tr:'Dadaizm',fr:'Dada',en:'Dada'},
 artists:['Hugo Ball','Tristan Tzara','Hans Arp','Hannah Höch','Marcel Duchamp','Man Ray'],
 works:[{t:{tr:'Cabaret Voltaire\'de Hugo Ball',fr:'Hugo Ball au Cabaret Voltaire',en:'Hugo Ball at the Cabaret Voltaire'},a:'fotoğraf',y:'1916',m:'Zürih',c:'Hugo Ball Cabaret Voltaire 1916 costume'},
  {t:{tr:'Çeşme',fr:'Fontaine',en:'Fountain'},a:'Marcel Duchamp',y:'1917',m:'Kopyası: Centre Pompidou',c:'',pd:false},
  {t:{tr:'Mutfak Bıçağıyla Kesmek',fr:'Coupé au couteau de cuisine',en:'Cut with the Kitchen Knife'},a:'Hannah Höch',y:'1919–1920',m:'Nationalgalerie, Berlin',c:'',pd:false}],
 tr:['Dada, Birinci Dünya Savaşı sırasında, 1916\'da Zürih\'teki Cabaret Voltaire\'de doğdu. Savaşın akıl dışılığına öfkelenen sanatçılar, akla, mantığa ve geleneksel sanata karşı bir "anti-sanat" önerdi.','Ses şiirleri, rastlantıyla yapılan kolajlar, fotomontajlar ve hazır nesneler Dada\'nın araçlarıydı. Hareket kısa sürede Berlin, Paris ve New York\'a yayıldı; Sürrealizm, kavramsal sanat ve performans sanatı doğrudan bu kökten beslendi.'],
 fr:['Dada est né pendant la Première Guerre mondiale, en 1916, au Cabaret Voltaire de Zurich. Révoltés par l\'absurdité de la guerre, des artistes ont proposé un « anti-art » contre la raison, la logique et l\'art traditionnel.','Poèmes sonores, collages faits au hasard, photomontages et ready-made étaient ses outils. Le mouvement s\'est vite répandu à Berlin, Paris et New York ; le surréalisme, l\'art conceptuel et la performance en sont les héritiers directs.'],
 en:['Dada was born during the First World War, in 1916, at the Cabaret Voltaire in Zurich. Outraged by the madness of the war, artists proposed an "anti-art" against reason, logic and traditional art.','Sound poems, chance collages, photomontage and readymades were its tools. The movement soon spread to Berlin, Paris and New York; Surrealism, conceptual art and performance art grew directly from it.']},
surrealism:{years:'1924–1966',wiki:{tr:'Gerçeküstücülük',fr:'Surréalisme',en:'Surrealism'},
 artists:['André Breton','Salvador Dalí','René Magritte','Max Ernst','Leonora Carrington','Meret Oppenheim'],
 works:[{t:{tr:'Belleğin Azmi',fr:'La Persistance de la mémoire',en:'The Persistence of Memory'},a:'Salvador Dalí',y:'1931',m:'MoMA, New York',c:'',pd:false},
  {t:{tr:'İmgelerin İhaneti',fr:'La Trahison des images',en:'The Treachery of Images'},a:'René Magritte',y:'1929',m:'LACMA, Los Angeles',c:'',pd:false},
  {t:{tr:'Nesne (kürklü fincan)',fr:'Objet (Le Déjeuner en fourrure)',en:'Object (fur-covered teacup)'},a:'Meret Oppenheim',y:'1936',m:'MoMA, New York',c:'',pd:false}],
 tr:['Sürrealizm, André Breton\'un 1924\'te Paris\'te yayımladığı manifestoyla başladı. Freud\'un bilinçaltı kuramından esinlenerek rüyaları, arzuları ve aklın denetimi dışındaki düşünceyi sanatın merkezine koydu.','Sanatçılar otomatik yazı, beklenmedik nesne karşılaştırmaları ve rüya gibi gerçekçi sahneler kullandı. Dalí ve Magritte\'in yanında Leonora Carrington ve Meret Oppenheim gibi kadın sanatçılar da hareketin önemli figürleriydi; akım edebiyat ve sinemayı da derinden etkiledi.'],
 fr:['Le surréalisme a commencé avec le manifeste publié par André Breton à Paris, en 1924. Inspiré par la théorie de l\'inconscient de Freud, il a placé le rêve, le désir et la pensée libérée du contrôle de la raison au centre de l\'art.','Les artistes utilisaient l\'écriture automatique, des rencontres d\'objets inattendues et des scènes réalistes comme des rêves. À côté de Dalí et Magritte, des femmes comme Leonora Carrington et Meret Oppenheim ont joué un rôle important.'],
 en:['Surrealism began with the manifesto André Breton published in Paris in 1924. Inspired by Freud\'s theory of the unconscious, it put dreams, desire and thought free from reason\'s control at the centre of art.','Artists used automatic writing, unexpected combinations of objects and dreamlike realistic scenes. Alongside Dalí and Magritte, women such as Leonora Carrington and Meret Oppenheim were key figures; the movement deeply influenced literature and cinema.']},
bauhaus:{years:'1919–1933',wiki:{tr:'Bauhaus',fr:'Bauhaus',en:'Bauhaus'},
 artists:['Walter Gropius','Ludwig Mies van der Rohe','Wassily Kandinsky','Paul Klee','Anni Albers','Marianne Brandt'],
 works:[{t:{tr:'Bauhaus binası, Dessau',fr:'Bâtiment du Bauhaus, Dessau',en:'Bauhaus Building, Dessau'},a:'Walter Gropius',y:'1925–1926',m:'Dessau',c:'Bauhaus Dessau building Gropius'},
  {t:{tr:'Kompozisyon VIII',fr:'Composition VIII',en:'Composition VIII'},a:'Wassily Kandinsky',y:'1923',m:'Guggenheim, New York',c:'Kandinsky Composition VIII 1923'},
  {t:{tr:'Ad Parnassum',fr:'Ad Parnassum',en:'Ad Parnassum'},a:'Paul Klee',y:'1932',m:'Kunstmuseum Bern',c:'Paul Klee Ad Parnassum'}],
 tr:['Bauhaus, Walter Gropius\'un 1919\'da Weimar\'da kurduğu bir sanat ve tasarım okuludur. Amacı sanatı, zanaatı ve endüstriyi birleştirmek, güzel ve işlevsel nesneleri herkes için üretilebilir kılmaktı.','Okul 1925\'te Dessau\'ya, 1932\'de Berlin\'e taşındı ve 1933\'te Nazi baskısıyla kapandı. Kandinsky ve Klee gibi ressamlar burada ders verdi; dokuma, mobilya ve tipografi atölyeleri bugünkü modern tasarımın temelini attı.'],
 fr:['Le Bauhaus est une école d\'art et de design fondée par Walter Gropius à Weimar, en 1919. Son but était d\'unir l\'art, l\'artisanat et l\'industrie, et de rendre des objets beaux et fonctionnels accessibles à tous.','L\'école a déménagé à Dessau en 1925, puis à Berlin en 1932, et a fermé en 1933 sous la pression des nazis. Kandinsky et Klee y ont enseigné ; les ateliers de tissage, de mobilier et de typographie ont posé les bases du design moderne.'],
 en:['The Bauhaus was an art and design school founded by Walter Gropius in Weimar in 1919. Its aim was to unite art, craft and industry, and to make beautiful, functional objects that could be produced for everyone.','The school moved to Dessau in 1925 and to Berlin in 1932, and closed in 1933 under Nazi pressure. Painters such as Kandinsky and Klee taught there; its weaving, furniture and typography workshops laid the foundations of modern design.']},
abstractexpr:{years:'y. 1943–1960',wiki:{tr:'Soyut dışavurumculuk',fr:'Expressionnisme abstrait',en:'Abstract expressionism'},
 artists:['Jackson Pollock','Willem de Kooning','Mark Rothko','Lee Krasner','Joan Mitchell','Helen Frankenthaler'],
 works:[{t:{tr:'Sonbahar Ritmi (Numara 30)',fr:'Autumn Rhythm (Number 30)',en:'Autumn Rhythm (Number 30)'},a:'Jackson Pollock',y:'1950',m:'Metropolitan Museum, New York',c:'',pd:false},
  {t:{tr:'Numara 61 (Pas ve Mavi)',fr:'No. 61 (Rouille et bleu)',en:'No. 61 (Rust and Blue)'},a:'Mark Rothko',y:'1953',m:'MOCA, Los Angeles',c:'',pd:false},
  {t:{tr:'Mevsimler',fr:'Les Saisons',en:'The Seasons'},a:'Lee Krasner',y:'1957',m:'Whitney Museum, New York',c:'',pd:false}],
 tr:['Soyut Dışavurumculuk, İkinci Dünya Savaşı sonrasında New York\'ta gelişti ve sanat dünyasının merkezini Paris\'ten New York\'a taşıdı. Büyük ölçekli tuvaller, figürsüz ama yoğun duygusal bir resim dili kullandı.','Akımın iki ana kolu vardır: Pollock ve de Kooning\'in hareketli, jestüel "aksiyon resmi" ile Rothko ve Newman\'ın geniş, sakin "renk alanı" resmi. Lee Krasner, Joan Mitchell ve Helen Frankenthaler gibi kadın sanatçıların katkısı uzun süre göz ardı edildi.'],
 fr:['L\'expressionnisme abstrait s\'est développé à New York après la Seconde Guerre mondiale et a déplacé le centre du monde de l\'art de Paris à New York. Il utilisait de très grandes toiles et un langage sans figures, mais très émotionnel.','Il a deux grandes branches : l\'« action painting » gestuelle de Pollock et de Kooning, et la peinture « color field », large et calme, de Rothko et Newman. Le rôle de femmes comme Lee Krasner, Joan Mitchell et Helen Frankenthaler a longtemps été ignoré.'],
 en:['Abstract Expressionism developed in New York after the Second World War and moved the centre of the art world from Paris to New York. It used very large canvases and a language without figures but full of emotion.','It has two main branches: the gestural "action painting" of Pollock and de Kooning, and the broad, calm "colour field" painting of Rothko and Newman. The role of women such as Lee Krasner, Joan Mitchell and Helen Frankenthaler was long overlooked.']},
popart:{years:'y. 1955–1970',wiki:{tr:'Pop art',fr:'Pop art',en:'Pop art'},
 artists:['Richard Hamilton','Andy Warhol','Roy Lichtenstein','Claes Oldenburg','James Rosenquist','Marisol'],
 works:[{t:{tr:'Bugünün evlerini bu kadar farklı, bu kadar çekici yapan nedir?',fr:'Just what is it that makes today\'s homes so different, so appealing?',en:'Just what is it that makes today\'s homes so different, so appealing?'},a:'Richard Hamilton',y:'1956',m:'Kunsthalle Tübingen',c:'',pd:false},
  {t:{tr:'Campbell Çorba Kutuları',fr:'Campbell\'s Soup Cans',en:'Campbell\'s Soup Cans'},a:'Andy Warhol',y:'1962',m:'MoMA, New York',c:'',pd:false},
  {t:{tr:'Whaam!',fr:'Whaam!',en:'Whaam!'},a:'Roy Lichtenstein',y:'1963',m:'Tate Modern, Londra',c:'',pd:false}],
 tr:['Pop Art 1950\'lerin ortasında Londra\'da, Independent Group çevresinde doğdu ve 1960\'larda New York\'ta zirveye ulaştı. Reklamları, çizgi romanları, ünlüleri ve tüketim ürünlerini sanatın konusu yaptı.','Sanatçılar serigrafi gibi seri üretim tekniklerini kullanarak "yüksek sanat" ile popüler kültür arasındaki sınırı sorguladı. Warhol\'un tekrar eden görüntüleri ve Lichtenstein\'ın büyütülmüş çizgi roman kareleri akımın en tanınmış imgeleridir.'],
 fr:['Le pop art est né à Londres au milieu des années 1950, autour de l\'Independent Group, et a atteint son sommet à New York dans les années 1960. Il a pris comme sujets la publicité, la bande dessinée, les célébrités et les produits de consommation.','Avec des techniques de production en série comme la sérigraphie, les artistes ont interrogé la frontière entre le « grand art » et la culture populaire. Les images répétées de Warhol et les cases agrandies de Lichtenstein sont ses images les plus connues.'],
 en:['Pop Art was born in London in the mid-1950s, around the Independent Group, and peaked in New York in the 1960s. It made advertising, comics, celebrities and consumer goods the subject of art.','Using mass-production techniques such as screen printing, artists questioned the line between "high art" and popular culture. Warhol\'s repeated images and Lichtenstein\'s enlarged comic panels are its best-known images.']},
minimalism:{years:'y. 1960–1975',wiki:{tr:'Minimalizm',fr:'Art minimal',en:'Minimalism'},
 artists:['Donald Judd','Carl Andre','Dan Flavin','Sol LeWitt','Agnes Martin','Robert Morris'],
 works:[{t:{tr:'Adsız (Yığın)',fr:'Sans titre (Pile)',en:'Untitled (Stack)'},a:'Donald Judd',y:'1967',m:'MoMA, New York',c:'',pd:false},
  {t:{tr:'Eşdeğer VIII',fr:'Equivalent VIII',en:'Equivalent VIII'},a:'Carl Andre',y:'1966',m:'Tate, Londra',c:'',pd:false},
  {t:{tr:'V. Tatlin için "anıt" serisi',fr:'Série « monument » pour V. Tatline',en:'"monument" for V. Tatlin series'},a:'Dan Flavin',y:'1964–1990',m:'çeşitli koleksiyonlar',c:'',pd:false}],
 tr:['Minimalizm 1960\'larda ABD\'de, Soyut Dışavurumculuğun duygusal yoğunluğuna tepki olarak gelişti. Basit geometrik biçimler, endüstriyel malzemeler ve tekrar eden birimler kullandı.','Minimalist eser bir şeyi temsil etmez; nesnenin kendisi, mekân ve izleyicinin bedeni arasındaki ilişkiyi öne çıkarır. Judd\'un kutuları, Andre\'nin yere dizilmiş tuğlaları ve Flavin\'in floresan lambaları bu yaklaşımın simgeleridir.'],
 fr:['L\'art minimal s\'est développé aux États-Unis dans les années 1960, en réaction à l\'intensité émotionnelle de l\'expressionnisme abstrait. Il utilise des formes géométriques simples, des matériaux industriels et des unités répétées.','L\'œuvre minimale ne représente rien : elle met en avant la relation entre l\'objet lui-même, l\'espace et le corps du spectateur. Les boîtes de Judd, les briques posées au sol par Andre et les tubes fluorescents de Flavin en sont les symboles.'],
 en:['Minimalism developed in the United States in the 1960s, as a reaction to the emotional intensity of Abstract Expressionism. It used simple geometric forms, industrial materials and repeated units.','A Minimalist work represents nothing; it stresses the relationship between the object itself, the space and the viewer\'s body. Judd\'s boxes, Andre\'s bricks laid on the floor and Flavin\'s fluorescent lights are its emblems.']},
conceptual:{years:'1960\'lar–1970\'ler',wiki:{tr:'Kavramsal sanat',fr:'Art conceptuel',en:'Conceptual art'},
 artists:['Joseph Kosuth','Sol LeWitt','Yoko Ono','Lawrence Weiner','On Kawara','Marcel Duchamp (öncü)'],
 works:[{t:{tr:'Bir ve Üç Sandalye',fr:'Une et trois chaises',en:'One and Three Chairs'},a:'Joseph Kosuth',y:'1965',m:'MoMA ve Centre Pompidou',c:'',pd:false},
  {t:{tr:'Grapefruit (talimat kitabı)',fr:'Grapefruit (livre d\'instructions)',en:'Grapefruit (instruction book)'},a:'Yoko Ono',y:'1964',m:'',c:'',pd:false},
  {t:{tr:'Today (Bugün) serisi',fr:'Série Today',en:'Today series'},a:'On Kawara',y:'1966–2013',m:'',c:'',pd:false}],
 tr:['Kavramsal sanat 1960\'larda, sanatın asıl değerinin nesnede değil fikirde olduğunu savunarak gelişti. Bir eser bir talimat, bir metin, bir fotoğraf ya da bir belge olabilirdi; el becerisi ikinci plana düştü.','Kökleri Duchamp\'ın hazır nesnelerine uzanır. Sol LeWitt 1967\'de fikrin eseri yaratan makine olduğunu yazdı. Akım, sanat kurumlarını ve sanatın ne olduğunu sorgulayan bugünkü çağdaş sanatın büyük bölümünün temelidir.'],
 fr:['L\'art conceptuel s\'est développé dans les années 1960, en affirmant que la vraie valeur de l\'art est dans l\'idée et non dans l\'objet. Une œuvre pouvait être une instruction, un texte, une photographie ou un document ; le savoir-faire passait au second plan.','Ses racines remontent aux ready-made de Duchamp. En 1967, Sol LeWitt a écrit que l\'idée devient une machine qui fait l\'art. Ce mouvement est à la base d\'une grande partie de l\'art contemporain.'],
 en:['Conceptual art developed in the 1960s, arguing that the real value of art lies in the idea rather than the object. A work could be an instruction, a text, a photograph or a document; manual skill became secondary.','Its roots go back to Duchamp\'s readymades. In 1967 Sol LeWitt wrote that the idea becomes a machine that makes the art. The movement underlies much of today\'s contemporary art, which questions institutions and what art is.']}

const norm=s=>s.toLowerCase().replace(/’/g,"'");
const DICT={fr:{},en:{}}; const PH={fr:{list:[],first:{}},en:{list:[],first:{}}};
DICT_RAW.split('\n').forEach(l=>{const i=l.indexOf('\t'); if(i>0) DICT.fr[norm(l.slice(0,i))]=l.slice(i+1);});
DICT.fr["c'est-à-dire"]='yani';
const TOKEN_RE=/(av\. [Jj]\.-[Cc]\.)|([\p{L}\p{M}](?:[\p{L}\p{M}'’\-]*[\p{L}\p{M}])?)|([^\p{L}\p{M}]+)/gu;
const ELISION=/^(l|d|j|n|s|c|m|t|qu|jusqu|lorsqu|puisqu)(['’])(.+)$/i;
function tokenize(text,lang){
  const out=[];let m;TOKEN_RE.lastIndex=0;
  while((m=TOKEN_RE.exec(text))){
    if(m[1]) out.push({t:m[1],k:'av. j.-c.',w:true});
    else if(m[2]){ const s=m[2], e=lang==='fr'&&s.match(ELISION);
      if(e && !(norm(s) in DICT.fr)){ out.push({t:e[1]+e[2],k:norm(e[1]),w:true}); out.push({t:e[3],k:norm(e[3]),w:true}); }
      else { let k=norm(s); if(lang==='en') k=k.replace(/'s$/,''); out.push({t:s,k,w:true}); } }
    else out.push({t:m[3],w:false});
  }
  return out;
}
function addPhrase(lang,p,mean){
  const keys=tokenize(p,lang).filter(t=>t.w).map(t=>t.k); if(!keys.length) return;
  const P=PH[lang]; const sig=keys.join(' '); if(P.list.some(x=>x.sig===sig)) return;
  const id=P.list.length; P.list.push({text:p,keys,mean,sig}); (P.first[keys[0]]=P.first[keys[0]]||[]).push(id);
  P.first[keys[0]].sort((a,b)=>P.list[b].keys.length-P.list[a].keys.length);
}
PHRASES_RAW.split('\n').forEach(l=>{const i=l.indexOf('\t'); if(i>0) addPhrase('fr',l.slice(0,i),l.slice(i+1));});
function addGlossary(g,lang){
  if(!g||typeof g!=='object') return;
  Object.entries(g).forEach(([k,v])=>{ if(typeof v!=='string'||!k) return; const keys=tokenize(k,lang).filter(t=>t.w).map(t=>t.k);
    if(keys.length===1){ if(!(keys[0] in DICT[lang])) DICT[lang][keys[0]]=v; } else if(keys.length>1) addPhrase(lang,k,v); });
}
function rich(text,lang){
  text=String(text==null?'':text); lang=lang||S.lang;
  if(lang==='tr'||!S.tapTr) return esc(text);
  const toks=tokenize(text,lang), P=PH[lang], D=DICT[lang];
  const wi=[];toks.forEach((t,i)=>{if(t.w) wi.push(i);});
  const ph=new Array(toks.length).fill(-1);
  for(let a=0;a<wi.length;a++){
    const ti=wi[a]; if(ph[ti]>=0) continue; const c=P.first[toks[ti].k]; if(!c) continue;
    for(const id of c){ const ks=P.list[id].keys; if(ks.length===1&&(toks[ti].k in D)) continue; let ok=true;
      for(let j=0;j<ks.length;j++){ const tj=wi[a+j]; if(tj===undefined||toks[tj].k!==ks[j]){ok=false;break;}
        if(j>0){ for(let s=wi[a+j-1]+1;s<tj;s++){ if(!/^[\s ]+$/.test(toks[s].t)){ok=false;break;} } if(!ok) break; } }
      if(ok){ for(let j=0;j<ks.length;j++) ph[wi[a+j]]=id; break; } }
  }
  return toks.map((t,i)=>{ if(!t.w) return esc(t.t); const sv=notebook.has(lang+':'+t.k)?' saved':''; const p=ph[i]>=0?` data-ph="${ph[i]}"`:''; return `<span class="w${sv}" data-k="${esc(t.k)}" data-l="${lang}"${p}>${esc(t.t)}</span>`; }).join('');
}

function dbSet(key,val){ if(!DB||!UID) return; try{ Promise.resolve(ucol().doc(key).set(val)).catch(()=>{}); }catch(e){} }
function dbDel(key){ if(!DB||!UID) return; try{ Promise.resolve(ucol().doc(key).delete()).catch(()=>{}); }catch(e){} }
function docsOf(res){ return (Array.isArray(res)?res:(res&&res.docs)||[]).map(d=>{ const x=typeof d.data==='function'?d.data():(d.data&&d.kind===undefined&&typeof d.data==='object'?d.data:d); return x; }).filter(Boolean); }
function race(p,ms){ return Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]); }

function render(){

/* ================= picking & sessions ================= */
function matchesTopic(q,topic){ return topic==='mix' || (q.topics||[]).includes(topic); }
function hasImage(q){ return !!(IMGMAP[q.id]||(WEB&&q.search&&q.search.commons)); }
function usable(q){ if(q.type==='identify'&&!hasImage(q)) return false; return true; }
function curLevel(topic){ return S.levelMode==='auto'?(S.levels[topic]||2):S.levelMode; }
function candidates(topic,unseenOnly=true){ const out=[]; BANK.forEach(q=>{ if(!matchesTopic(q,topic)||!usable(q)) return; if(unseenOnly&&S.seen[q.id]) return; out.push(q); }); return out; }
function pickNext(topic){
  const due=S.wrongQ.findIndex(w=>w.due<=S.counter&&BANK.get(w.id)&&matchesTopic(BANK.get(w.id),topic));
  if(due>=0){ const id=S.wrongQ[due].id; S.wrongQ.splice(due,1); return id; }
  const lv=curLevel(topic); const c=candidates(topic); if(!c.length) return null;
  let best=99; c.forEach(q=>{best=Math.min(best,Math.abs((q.level||2)-lv));});
  const pool=c.filter(q=>Math.abs((q.level||2)-lv)===best);
  const types={}; (S.session?S.session.list.slice(-3):[]).forEach(id=>{const q=BANK.get(id); if(q) types[q.type]=(types[q.type]||0)+1;});
  pool.sort(()=>Math.random()-0.5).sort((a,b)=>(types[a.type]||0)-(types[b.type]||0));
  return pool[0].id;
}
function startTopic(topic){
  S.topic=topic;
  if(!S.session||S.session.topic!==topic) S.session={topic,list:[],pos:0,ans:{},clues:{}};
  V.work={}; S.introSeen=S.introSeen||{};
  if(introEligible(topic)&&(introOf(topic)||SAMPLE)&&!S.introSeen[topic]){ V.view='intro'; save(); render(); window.scrollTo({top:0}); prefetch(); return; }
  V.view='quiz'; save(); advance(true);
}
function advance(initial){
  const s=S.session;
  if(initial&&s.list.length&&s.ans[s.list[s.pos]]===undefined){ render(); prefetch(); return; }
  if(s.pos<s.list.length-1){ s.pos++; save(); render(); window.scrollTo({top:0}); return; }
  const id=pickNext(s.topic);
  if(id){ s.list.push(id); s.pos=s.list.length-1; V.waiting=false; save(); render(); window.scrollTo({top:0}); prefetch(); }
  else { V.waiting=true; render(); prefetch(true); }
}
function currentQ(){ const s=S.session; return s&&s.list.length?BANK.get(s.list[s.pos]):null; }

/* ================= answering ================= */
function commit(q,v,ok){
  const s=S.session; s.ans[q.id]={v,ok}; S.seen[q.id]=1; S.counter++;
  const today=new Date().toISOString().slice(0,10); if(S.day.d!==today) S.day={d:today,n:0,ok:0}; S.day.n++; if(ok) S.day.ok++;
  S.streak=ok?S.streak+1:0;
  if(!ok) S.wrongQ.push({id:q.id,due:S.counter+8});
  if(S.levelMode==='auto'){ const t=s.topic; const r=(S.recent[t]=S.recent[t]||[]); r.push(ok?1:0); if(r.length>8) r.shift();
    if(r.length>=6){ const rate=r.reduce((a,b)=>a+b,0)/r.length; const cur=S.levels[t]||2;
      if(rate>=0.75&&cur<4){ S.levels[t]=cur+1; S.recent[t]=[]; toast(`${T('levelUp')}: ${L(LEVELS[cur+1])} ${dots(cur+1)}`); }
      else if(rate<=0.4&&cur>1){ S.levels[t]=cur-1; S.recent[t]=[]; toast(`${T('levelDown')}: ${L(LEVELS[cur-1])} ${dots(cur-1)}`); } } }
  save(); renderQuiz(); prefetch();
}
function W(id){ return V.work[id]||(V.work[id]={seq:[],map:{},sel:null,pending:null}); }

/* ================= quiz render ================= */
function qText(q,lang){ return q[lang]||null; }
function renderQuiz(){
  const s=S.session; const tinfo=topicInfo(s?s.topic:'mix');
  if(V.waiting||!s||!s.list.length){
    setBand(tinfo.region||'world');
    const genOn=!!SAMPLE;
    $('app').innerHTML=renderBand(`<div class="qhead"><span class="qnum">···</span><div class="qtags"><span>${esc(L(tinfo))}</span></div></div>`)+`<main><div class="wait">
      ${genOn?`<div class="loader"><i></i></div><strong>${T('preparing')}</strong><span class="note" style="max-width:420px">${T('prepNote')}</span>${V.gen&&V.gen.error?`<span class="err">${esc(V.gen.error)}</span><button class="btn" data-act="retrygen">↻</button>`:''}`
      :`<strong>${T('noGen')}</strong><button class="btn primary" data-act="again">${T('again')}</button>`}
      <button class="btn" data-act="home">${T('home')}</button></div></main>`+renderMenu();
    return;
  }
  const q=currentQ(); if(!q){ s.list.splice(s.pos,1); s.pos=Math.max(0,s.list.length-1); save(); return advance(); }
  const lang=S.lang;
  if(!q[lang]){ ensureLang(q,lang); }
  const d=q[lang]||q.tr; const showLang=q[lang]?lang:'tr';
  setBand(q.region||'world');
  const a=s.ans[q.id], done=a!==undefined, w=W(q.id), type=q.type||'mcq';
  const perm=(s.perm=s.perm||{})[q.id]||(s.perm[q.id]=shuffle([0,1,2,3]));
  const num=String(s.pos+1).padStart(3,'0');
  const prog=s.list.slice(-12).map(id=>{const x=s.ans[id]; return `<span class="${x?(x.ok?'ok':'bad'):''}"></span>`;}).join('');
  const head=`<div class="qhead"><span class="qnum">${num}</span>${s.topic.startsWith('a:')?`<button class="gear" data-act="artistpage" data-v="${esc(s.topic.slice(2))}" style="margin-left:auto;order:3;width:auto;padding:0 10px;font-weight:700;font-size:13px;color:var(--bandfg)">ⓘ ${esc(T('artistAbout'))}</button>`:''}${introOf(s.topic)?`<button class="gear" data-act="intro" aria-label="${esc(T('about'))}" style="margin-left:auto;order:3;width:auto;padding:0 10px;font-weight:700;font-size:13px;color:var(--bandfg)">ⓘ ${esc(T('about'))}</button>`:''}<div class="qtags"><span>${esc(L(REGIONS[q.region]||REGIONS.world))} · ${esc(L(q.era))}</span><span>${esc(T('t_'+type))} · ${dots(q.level||2)}</span></div></div><div class="progressline">${prog}</div>`;
  const R=t=>rich(t,showLang);
  let media=imageBlock(q,done);
  let body=`${!q[lang]&&lang!=='tr'?`<span class="note">${T('translating')}</span>`:''}`;
  // question
  if(type==='tf') body+=`<div class="statement"><span class="tag">${T('t_tf').toUpperCase()}</span>${R(d.q)}</div>`;
  else body+=`<h1 class="qtitle">${R(d.q)}</h1>`;
  // type ui
  if(type==='mcq'||type==='identify'||type==='clues'){
    if(type==='clues'){ const shown=done?d.clues.length:Math.min(s.clues[q.id]||1,d.clues.length);
      body+=`<div class="clues">${d.clues.slice(0,shown).map((c,i)=>`<div class="clue"><span class="i">0${i+1}</span><span>${R(c)}</span></div>`).join('')}${!done&&shown<d.clues.length?`<button class="cluemore" data-act="clue">0${shown+1} · ${T('moreClue')}</button>`:''}</div>`; }
    const g2=d.opts.every(o=>o.length<26);
    body+=`<div class="opts${g2?' g2':''}">`+perm.map((oi,i)=>{ let c='opt'; if(done){ c+= oi===q.answer?' right':(oi===a.v?' wrong':' dim'); } else if(w.pending===oi) c+=' pending';
      return `<button class="${c}" data-opt="${oi}" ${done?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${R(d.opts[oi])}</span></button>`; }).join('')+`</div>`;
    if(!done) body+=`<div class="checkrow"><button class="btn band" data-act="confirm" ${w.pending===null?'disabled':''}>${T('confirm')}</button><button class="btn" data-act="skip">${T('skip')}</button></div>`;
  } else if(type==='tf'){
    body+=`<div class="tfrow">`+[true,false].map(v=>{ let c='tfbtn '+(v?'t':'f'); if(done){ if(v!==q.answer) c+=' dim'; } else if(w.pending===v) c+=' pending';
      return `<button class="${c}" data-tf="${v}" ${done?'disabled':''}>${v?'✓':'✕'}<span>${v?T('true_'):T('false_')}</span></button>`; }).join('')+`</div>`;
    if(!done) body+=`<div class="checkrow"><button class="btn band" data-act="confirm" ${w.pending===null?'disabled':''}>${T('confirm')}</button><button class="btn" data-act="skip">${T('skip')}</button></div>`;
  } else if(type==='order'){
    if(!done){ body+=`<p class="howto">${T('orderHow')}</p><div class="opts">`+perm.map(oi=>{ const n=w.seq.indexOf(oi); return `<button class="opt${n>=0?' picked':''}" data-ord="${oi}"><span class="badge">${n>=0?n+1:''}</span><span>${R(d.items[oi])}</span></button>`; }).join('')+`</div><div class="checkrow"><button class="btn band" data-act="checkorder" ${w.seq.length<4?'disabled':''}>${T('check')}</button><button class="btn" data-act="resetwork">${T('reset')}</button></div>`; }
    else { const notes=d.notes||[]; const inplace=a.v.filter((v,i)=>v===i).length;
      body+=`<div class="vtag"><span class="pill ${a.ok?'ok':'bad'}">${inplace} / 4 ${T('inPlace')}</span></div><div class="opts">`+d.items.map((it,i)=>{ const mine=a.v.indexOf(i)+1; const ok=a.v[i]===i;
        return `<div class="ordrow"><span class="badge" style="border:0;background:var(--ink);color:var(--bg)">${i+1}</span><div class="b"><div class="h"><span style="flex:1">${R(it)}</span><span class="yr">${esc((q.years||[])[i]||'')}</span></div>${notes[i]?`<span class="n">${R(notes[i])}</span>`:''}${S.showTr&&showLang!=='tr'&&q.tr.notes&&q.tr.notes[i]?`<span class="trline">${esc(q.tr.notes[i])}</span>`:''}<span class="me ${ok?'ok':'bad'}">${ok?'✓':'✕'} ${T('yourOrder').toLowerCase()}: ${mine}</span></div></div>`; }).join('')+`</div>`; }
  } else if(type==='match'){
    const cols=['#00C2E0','#FFD25E','#FF8FC2','#7CE38B'];
    if(!done){ body+=`<p class="howto">${T('matchHow')}</p><div class="opts">`+d.left.map((l,li)=>{ const r=w.map[li]; return `<button class="mrow${w.sel===li?' sel':''}" data-ml="${li}"><span class="mbadge" style="${r!==undefined?`background:${cols[li]};border:0`:''}">${r!==undefined?li+1:''}</span><span class="l">${R(l)}</span><span class="r">${r!==undefined?R(d.right[r]):''}</span></button>`; }).join('')+`</div><div class="pool">`+
      perm.map(ri=>{ const li=Object.keys(w.map).find(k=>w.map[k]===ri); return `<button class="chip${li!==undefined?' used':''}" data-mr="${ri}">${li!==undefined?`<span class="dot" style="background:${cols[li]}"></span>`:''}${R(d.right[ri])}</button>`; }).join('')+`</div><div class="checkrow"><button class="btn band" data-act="checkmatch" ${Object.keys(w.map).length<4?'disabled':''}>${T('check')} (${Object.keys(w.map).length}/4)</button><button class="btn" data-act="resetwork">${T('reset')}</button></div>`; }
    else { const notes=d.notes||[]; body+=`<div class="opts">`+d.left.map((l,li)=>{ const r=a.v[li], ok=r===li; return `<div class="mrow ${ok?'right':'wrong'}" style="flex-wrap:wrap"><span class="l">${R(l)}</span><span class="r">→ ${R(d.right[r])}${ok?'':` · ✓ ${R(d.right[li])}`}</span>${notes[li]?`<span class="n" style="flex-basis:100%;font-size:13.5px;color:var(--muted)">${R(notes[li])}</span>`:''}</div>`; }).join('')+`</div>`; }
  }
  // verdict
  if(done){
    const ok=a.ok; let extra=''; if(type==='clues'&&ok) extra=` · ${T('cluesUsed')(s.clues[q.id]||1)}`;
    body+=`<section class="verdict"><div class="vtag"><span class="pill ${ok?'ok':'bad'}">${ok?'✓ '+T('correct'):'✕ '+T('wrong')}${extra}</span>${S.streak>2&&ok?`<span class="pill lv">${T('streak')} ${S.streak}</span>`:''}</div>`;
    if(!ok&&(type==='mcq'||type==='identify'||type==='clues')) body+=`<p class="exp"><strong>${T('rightIs')}:</strong> ${R(d.opts[q.answer])}</p>`;

  if(!SAMPLE||introBusy[key]===true) return; introBusy[key]=true;
  const info=topicInfo(key);
  const prompt=`Write a short, accurate introduction to "${info.prompt}" for an art-history learning app (reader: Turkish adult, learning French and English).
Accuracy first: only well-established facts; if unsure, leave it out; no invented quotations.
Return only JSON:
{"years":"main period, e.g. 1905–1908, or empty","wiki":{"tr","fr","en"} Wikipedia article titles,
 "tr":[two paragraphs in Turkish, 90–130 words in total: definition, origins, key ideas, influence],
 "fr":[the same in French, B1–B2],"en":[the same in English, B1–B2],
 "artists":[5–6 leading artists' names, include women artists where relevant],
 "works":[3 key works: {"t":{"tr","fr","en"},"a":"artist","y":"year","m":"current museum/location or empty","pd":true only if the artist died before 1955,"c":"English search words that find this exact work on Wikimedia Commons if pd, else empty"}],
 "glossary":{15–25 French words from the French text → Turkish},"glossary_en":{15–25 English words from the English text → Turkish}}`;
  try{
    let r=await SAMPLE.json(prompt,{modelTier:'default'}); if(!r||!Array.isArray(r.tr)) throw 0;
    try{ const chk=await SAMPLE.json(`You are a strict art-history fact-checker. Check this introduction. Return only JSON {"textOk":true|false,"badWorks":[indices of misattributed or misdated works]}.\n\n${JSON.stringify({text:r.tr,artists:r.artists,works:(r.works||[]).map(w=>({t:w.t&&w.t.en,a:w.a,y:w.y,m:w.m}))})}`,{modelTier:'default'});
      if(chk&&chk.textOk===false){ r=await SAMPLE.json(prompt,{modelTier:'default'}); if(!r||!Array.isArray(r.tr)) throw 0; }
      else if(chk&&Array.isArray(chk.badWorks)){ const bad=new Set(chk.badWorks.map(Number)); r.works=(r.works||[]).filter((w,i)=>!bad.has(i)); } }catch(e){}
    r.artists=(r.artists||[]).filter(x=>typeof x==='string').slice(0,8);
    r.works=(r.works||[]).filter(w=>w&&w.t).map(w=>({t:w.t,a:w.a||'',y:String(w.y||''),m:w.m||'',pd:w.pd===true,c:w.pd===true?(w.c||''):''}));
    r.wiki=r.wiki||{}; addGlossary(r.glossary,'fr'); addGlossary(r.glossary_en,'en');
    GINTROS[key]=r; store('gintros',GINTROS);
    if(DB&&OWNER){ try{ DB.collection('bank').doc(iKey(key)).set({kind:'intro',key,data:JSON.stringify(r)}); }catch(e){} }
    introBusy[key]=false;
  }catch(e){ introBusy[key]='fail'; }
  if(V.view==='intro') renderIntro();
}
