936) was taken during the Great Depression in a pea-pickers' camp in California.", "detail": ["Lange worked for the Farm Security Administration (FSA); the photo helped bring emergency aid. The woman's name, Florence Owens Thompson, was learned years later. The photo is in the Library of Congress."]}, "id": "x-14-1", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1878, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "americas", "medium": "photo", "tags": ["photo", "c19", "cinema", "r-namerica"], "topics": ["photo", "c19", "cinema", "r-namerica"], "search": {"commons": "Muybridge The Horse in Motion", "wiki": {"en": "Muybridge The Horse in Motion"}}, "answer": true, "tr": {"q": "Eadweard Muybridge'in 1878'deki 'Hareket Hâlindeki At' fotoğrafları, dörtnala koşan bir atın dört ayağının da aynı anda yerden kesildiği bir an olduğunu gösterdi.", "exp": "Doğru. Muybridge, sıralı fotoğraf makineleriyle atın koşusunu ardışık karelere böldü ve bu anı belgeledi.", "detail": ["Çalışma, Kaliforniyalı iş adamı Leland Stanford'un merakıyla başladı. Muybridge'in hareketi parçalara ayıran görüntüleri sinemanın öncüleri arasında sayılır ve Duchamp ile Futuristleri de etkiledi."]}, "fr": {"q": "En 1878, les photos du « Cheval en mouvement » d'Eadweard Muybridge ont montré qu'au galop, un cheval a un moment où ses quatre pieds quittent le sol.", "exp": "Vrai. Avec une série d'appareils photo, Muybridge a découpé la course du cheval en images successives et a prouvé ce moment.", "detail": ["Le travail est né de la curiosité de l'homme d'affaires californien Leland Stanford. Ses images qui décomposent le mouvement sont des précurseurs du cinéma et ont inspiré Duchamp et les futuristes."]}, "en": {"q": "Eadweard Muybridge's 1878 'The Horse in Motion' photos showed that a galloping horse has a moment when all four feet are off the ground.", "exp": "True. Using a row of cameras, Muybridge split the horse's run into successive frames and proved this moment.", "detail": ["The work began with the curiosity of the Californian businessman Leland Stanford. His images breaking down motion are seen as forerunners of cinema and inspired Duchamp and the Futurists."]}, "id": "x-14-2", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1952, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "europe", "medium": "photo", "tags": ["photo", "postwar", "r-europe"], "topics": ["photo", "postwar", "r-europe"], "search": {"commons": "Henri Cartier-Bresson Behind the Gare Saint-Lazare", "wiki": {"en": "Henri Cartier-Bresson Behind the Gare Saint-Lazare"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Leica fotoğraf makinemle sokakta, fark edilmeden çalıştım.", "1952'deki kitabımın İngilizce adı 'The Decisive Moment' (Belirleyici An) oldu.", "1947'de Robert Capa ve arkadaşlarımla Magnum Photos ajansını kurdum."], "opts": ["Robert Doisneau", "Henri Cartier-Bresson", "Brassaï", "André Kertész"], "exp": "Cevap Henri Cartier-Bresson'dur. Biçimin ve olayın aynı anda mükemmel bir düzen kurduğu 'belirleyici an' fikrinin babasıdır.", "detail": ["'Saint-Lazare Garı'nın Arkası' (1932), su birikintisi üzerinden atlayan adamla en ünlü fotoğraflarındandır. Paris'te Fondation Henri Cartier-Bresson onun eserlerini korur."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai travaillé dans la rue avec mon Leica, sans me faire remarquer.", "Mon livre de 1952, « Images à la sauvette », s'appelle en anglais « The Decisive Moment ».", "En 1947, j'ai fondé l'agence Magnum Photos avec Robert Capa et des amis."], "opts": ["Robert Doisneau", "Henri Cartier-Bresson", "Brassaï", "André Kertész"], "exp": "La réponse est Henri Cartier-Bresson, père de l'idée de « l'instant décisif », où la forme et l'événement trouvent un ordre parfait au même moment.", "detail": ["« Derrière la gare Saint-Lazare » (1932), avec l'homme qui saute au-dessus d'une flaque, est l'une de ses photos les plus célèbres. La Fondation Henri Cartier-Bresson à Paris conserve son œuvre."]}, "en": {"q": "Who am I?", "clues": ["I worked in the street with my Leica, without being noticed.", "My 1952 book was titled 'The Decisive Moment' in English.", "In 1947 I founded the Magnum Photos agency with Robert Capa and friends."], "opts": ["Robert Doisneau", "Henri Cartier-Bresson", "Brassaï", "André Kertész"], "exp": "The answer is Henri Cartier-Bresson, father of the idea of 'the decisive moment', when form and event find perfect order at the same instant.", "detail": ["'Behind the Gare Saint-Lazare' (1932), with a man leaping over a puddle, is one of his most famous photos. The Fondation Henri Cartier-Bresson in Paris keeps his work."]}, "id": "x-14-3", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1900, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "world", "medium": "photo", "tags": ["photo", "c19", "modern"], "topics": ["photo", "c19", "modern"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["c. 1826", "1839", "1888", "1936"], "tr": {"q": "Fotoğraf tarihindeki bu olayları eskiden yeniye sırala.", "items": ["Niépce'nin bilinen en eski fotoğrafı", "Dagerotipin duyurulması", "Kodak'ın 'Siz düğmeye basın, gerisini biz yaparız' makinesi", "Leica ile çekilen Capa'nın 'Düşen Asker' fotoğrafı"], "exp": "Niépce'nin fotoğrafı yaklaşık 1826–27, dagerotip 1839, ilk Kodak 1888, Capa'nın 'Düşen Asker'i 1936 tarihlidir.", "detail": ["Kodak, fotoğrafı sıradan insanlara açarak amatör fotoğrafçılığı başlattı. Capa'nın İspanya İç Savaşı'nda çekilen fotoğrafının sahnelenmiş olup olmadığı hâlâ tartışılır."]}, "fr": {"q": "Classe ces étapes de l'histoire de la photographie de la plus ancienne à la plus récente.", "items": ["La plus ancienne photo connue de Niépce", "L'annonce du daguerréotype", "L'appareil Kodak « Vous appuyez sur le bouton, nous faisons le reste »", "« Mort d'un soldat républicain » de Capa"], "exp": "La photo de Niépce date d'environ 1826–1827, le daguerréotype de 1839, le premier Kodak de 1888 et la photo de Capa de 1936.", "detail": ["Kodak ouvre la photographie au grand public et lance la photo amateur. On discute encore pour savoir si la photo de Capa, prise pendant la guerre d'Espagne, a été mise en scène."]}, "en": {"q": "Put these events in the history of photography in order, oldest first.", "items": ["Niépce's oldest known photograph", "The announcement of the daguerreotype", "Kodak's 'You press the button, we do the rest' camera", "Capa's 'The Falling Soldier'"], "exp": "Niépce's photo dates from about 1826–27, the daguerreotype from 1839, the first Kodak from 1888 and Capa's 'The Falling Soldier' from 1936.", "detail": ["Kodak opened photography to ordinary people and launched amateur photography. Whether Capa's Spanish Civil War photo was staged is still debated."]}, "id": "x-14-4", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1895, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "c19"], "topics": ["cinema", "c19"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "1895'te Paris'teki Grand Café'de ilk ücretli halka açık film gösterimini kim yaptı?", "opts": ["Thomas Edison", "Georges Méliès", "Alice Guy", "Lumière kardeşler"], "exp": "Auguste ve Louis Lumière, 28 Aralık 1895'te Paris'teki Grand Café'de 'sinematograf' ile ilk ücretli toplu gösterimi yaptı.", "detail": ["Gösterimde 'Lumière Fabrikasından Çıkan İşçiler' gibi kısa filmler vardı. 'Bir Trenin Gara Girişi'nin seyircileri korkutup kaçırdığı hikâyesi ise büyük ölçüde efsanedir. Méliès bu gösterimi izledi ve kısa süre sonra kendi fantastik filmlerini yaptı."]}, "fr": {"q": "Qui a organisé la première projection publique et payante de films, au Grand Café à Paris en 1895 ?", "opts": ["Thomas Edison", "Georges Méliès", "Alice Guy", "Les frères Lumière"], "exp": "Auguste et Louis Lumière organisent la première projection publique payante avec le « cinématographe » le 28 décembre 1895, au Grand Café à Paris.", "detail": ["On y voit de courts films comme « La Sortie de l'usine Lumière ». L'histoire des spectateurs qui fuient devant « L'Arrivée d'un train en gare » est en grande partie une légende. Méliès a assisté à la projection et a bientôt réalisé ses propres films fantastiques."]}, "en": {"q": "Who held the first paid public film screening, at the Grand Café in Paris in 1895?", "opts": ["Thomas Edison", "Georges Méliès", "Alice Guy", "The Lumière brothers"], "exp": "Auguste and Louis Lumière held the first paid public screening with the 'cinématographe' on 28 December 1895 at the Grand Café in Paris.", "detail": ["It included short films such as 'Workers Leaving the Lumière Factory'. The story of audiences fleeing from 'Arrival of a Train' is largely a legend. Méliès saw the screening and soon made his own fantasy films."]}, "id": "x-14-5", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1925, "era": {"tr": "1920'ler", "fr": "Années 1920", "en": "1920s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "modern", "constructivism"], "topics": ["cinema", "modern", "constructivism"], "search": {"commons": "Battleship Potemkin Odessa Steps", "wiki": {"en": "Battleship Potemkin Odessa Steps"}}, "answer": true, "tr": {"q": "Sergey Eisenstein'ın 'Potemkin Zırhlısı' (1925) filmindeki Odessa Merdivenleri sahnesi, montaj tekniğinin en ünlü örneklerinden biridir.", "exp": "Doğru. Eisenstein, kısa ve çarpıcı çekimleri ritmik biçimde birleştirerek izleyicide şok ve duygu yaratan 'çarpışma montajı'nı geliştirdi.", "detail": ["Merdivenlerden aşağı yuvarlanan bebek arabası imgesi sonraki birçok filmde alıntılandı. Sovyet montaj kuramı, Konstrüktivizmle aynı dönemde gelişti ve sinemayı bir 'yeni sanat dili' olarak düşündü."]}, "fr": {"q": "La scène de l'escalier d'Odessa dans « Le Cuirassé Potemkine » (1925) de Sergueï Eisenstein est l'un des exemples les plus célèbres de montage.", "exp": "Vrai. Eisenstein met en rythme des plans courts et frappants pour créer choc et émotion : c'est le « montage des attractions ».", "detail": ["L'image du landau qui dévale l'escalier a été citée dans de nombreux films. La théorie soviétique du montage se développe en même temps que le constructivisme et pense le cinéma comme un nouveau langage."]}, "en": {"q": "The Odessa Steps scene in Sergei Eisenstein's 'Battleship Potemkin' (1925) is one of the most famous examples of montage.", "exp": "True. Eisenstein set short, striking shots in rhythm to create shock and emotion, a method called 'montage of attractions'.", "detail": ["The image of the pram rolling down the steps has been quoted in many later films. Soviet montage theory grew at the same time as Constructivism and saw cinema as a new artistic language."]}, "id": "x-14-6", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1896, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "c19", "women"], "topics": ["cinema", "c19", "women"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Paris'te Gaumont şirketinde sekreter olarak çalışmaya başladım.", "1896'da 'Lahana Perisi' ile kurmaca film yöneten ilk kişilerden biri oldum.", "ABD'ye taşınıp kendi stüdyom Solax'ı kurdum; yüzlerce film yönettim ama uzun süre unutuldum."], "opts": ["Germaine Dulac", "Lois Weber", "Alice Guy-Blaché", "Musidora"], "exp": "Cevap Alice Guy-Blaché'dir. Sinema tarihinin ilk kadın yönetmeni ve kurmaca filmin öncülerinden biridir.", "detail": ["Guy, renklendirme, sesli film denemeleri ve özel efektlerle de çalıştı. Solax, ABD'de bir kadının kurduğu ilk büyük stüdyolardan biriydi. Son yıllarda belgeseller ve sergilerle yeniden tanındı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai commencé comme secrétaire chez Gaumont, à Paris.", "En 1896, avec « La Fée aux choux », j'ai été l'une des premières personnes à réaliser un film de fiction.", "Partie aux États-Unis, j'ai fondé mon propre studio, Solax ; j'ai réalisé des centaines de films, mais j'ai longtemps été oubliée."], "opts": ["Germaine Dulac", "Lois Weber", "Alice Guy-Blaché", "Musidora"], "exp": "La réponse est Alice Guy-Blaché, première réalisatrice de l'histoire du cinéma et pionnière de la fiction.", "detail": ["Elle a aussi travaillé avec la couleur, des essais de son et des effets spéciaux. Solax a été l'un des premiers grands studios fondés par une femme aux États-Unis. Des documentaires et des expositions l'ont fait redécouvrir."]}, "en": {"q": "Who am I?", "clues": ["I started as a secretary at the Gaumont company in Paris.", "In 1896, with 'The Cabbage Fairy', I became one of the first people to direct a fiction film.", "I moved to the USA and founded my own studio, Solax; I directed hundreds of films but was long forgotten."], "opts": ["Germaine Dulac", "Lois Weber", "Alice Guy-Blaché", "Musidora"], "exp": "The answer is Alice Guy-Blaché, the first woman director in film history and a pioneer of fiction film.", "detail": ["She also worked with colour, early sound tests and special effects. Solax was one of the first major studios founded by a woman in the USA. Documentaries and exhibitions have recently brought her back to light."]}, "id": "x-14-7", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1959, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "europe", "medium": "cinema", "tags": ["cinema", "postwar"], "topics": ["cinema", "postwar"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "1950'lerin sonunda Truffaut ve Godard gibi genç eleştirmen-yönetmenlerle doğan Fransız sinema akımının adı nedir?", "opts": ["Yeni Dalga (Nouvelle Vague)", "İtalyan Yeni Gerçekçiliği", "Dogma 95", "Şiirsel Gerçekçilik"], "exp": "Nouvelle Vague, Cahiers du Cinéma dergisinde yazan genç eleştirmenlerin 1958–60 civarında çektiği ilk filmlerle doğdu.", "detail": ["Truffaut'nun 'Dört Yüz Darbe' (1959) ve Godard'ın 'Serseri Âşıklar' (1960) filmleri, sokakta çekim, el kamerası ve atlama kesme gibi özgür tekniklerle sinema dilini yeniledi. Agnès Varda da bu kuşağın önemli bir ismidir."]}, "fr": {"q": "Comment s'appelle le mouvement du cinéma français né à la fin des années 1950 avec de jeunes critiques-réalisateurs comme Truffaut et Godard ?", "opts": ["La Nouvelle Vague", "Le néoréalisme italien", "Dogme 95", "Le réalisme poétique"], "exp": "La Nouvelle Vague naît des premiers films de jeunes critiques des Cahiers du cinéma, vers 1958–1960.", "detail": ["« Les Quatre Cents Coups » de Truffaut (1959) et « À bout de souffle » de Godard (1960) renouvellent le langage du cinéma : tournage dans la rue, caméra à l'épaule, faux raccords. Agnès Varda est aussi une figure importante de cette génération."]}, "en": {"q": "What is the name of the French film movement born in the late 1950s with young critic-directors such as Truffaut and Godard?", "opts": ["The New Wave (Nouvelle Vague)", "Italian Neorealism", "Dogme 95", "Poetic Realism"], "exp": "The Nouvelle Vague was born from the first films of young critics writing for Cahiers du Cinéma, around 1958–60.", "detail": ["Truffaut's 'The 400 Blows' (1959) and Godard's 'Breathless' (1960) renewed film language with street shooting, hand-held cameras and jump cuts. Agnès Varda was also a key figure of this generation."]}, "id": "x-14-8", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1931, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "europe", "medium": "arch", "tags": ["architecture", "modern", "r-europe"], "topics": ["architecture", "modern", "r-europe"], "search": {"commons": "Villa Savoye Poissy", "wiki": {"en": "Villa Savoye"}}, "answer": 3, "tr": {"q": "Bu yapı hangisi?", "opts": ["Barselona Pavyonu – Mies van der Rohe", "Rietveld Schröder Evi", "Villa Tugendhat – Mies van der Rohe", "Villa Savoye – Le Corbusier"], "exp": "Le Corbusier'nin Poissy'deki Villa Savoye'u (1928–31), onun 'yeni mimarinin beş ilkesi'ni en net biçimde uygulayan yapıdır.", "detail": ["Beş ilke şunlardır: yapıyı yerden kaldıran ince kolonlar (pilotis), çatı bahçesi, serbest plan, serbest cephe ve yatay şerit pencereler. Villa bugün ziyarete açıktır ve Le Corbusier'nin eserleriyle birlikte UNESCO listesindedir."]}, "fr": {"q": "Quel est ce bâtiment ?", "opts": ["Le pavillon de Barcelone – Mies van der Rohe", "La maison Rietveld Schröder", "La villa Tugendhat – Mies van der Rohe", "La villa Savoye – Le Corbusier"], "exp": "La villa Savoye de Le Corbusier à Poissy (1928–1931) applique le plus clairement ses « cinq points de l'architecture moderne ».", "detail": ["Les cinq points sont : les pilotis qui soulèvent le bâtiment, le toit-jardin, le plan libre, la façade libre et la fenêtre en bandeau. La villa se visite et figure, avec d'autres œuvres de Le Corbusier, sur la liste de l'UNESCO."]}, "en": {"q": "Which building is this?", "opts": ["Barcelona Pavilion – Mies van der Rohe", "Rietveld Schröder House", "Villa Tugendhat – Mies van der Rohe", "Villa Savoye – Le Corbusier"], "exp": "Le Corbusier's Villa Savoye in Poissy (1928–31) applies his 'five points of a new architecture' most clearly.", "detail": ["The five points are: thin columns lifting the building (pilotis), a roof garden, a free plan, a free façade and horizontal strip windows. The villa can be visited and is on the UNESCO list with other Le Corbusier works."]}, "id": "x-14-9", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1997, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "arch", "tags": ["architecture", "contemporary", "r-europe"], "topics": ["architecture", "contemporary", "r-europe"], "search": {"commons": "Guggenheim Museum Bilbao", "wiki": {"en": "Guggenheim Museum Bilbao"}}, "answer": 1, "tr": {"q": "Titanyum kaplı kıvrımlı biçimiyle bir şehrin ekonomisini değiştirdiği söylenen ve 'Bilbao etkisi' terimine adını veren müzeyi hangi mimar tasarladı?", "opts": ["Zaha Hadid", "Frank Gehry", "Rem Koolhaas", "Santiago Calatrava"], "exp": "Frank Gehry'nin tasarladığı Guggenheim Bilbao 1997'de açıldı ve sanayisi zayıflamış şehre milyonlarca turist çekti.", "detail": ["'Bilbao etkisi', bir yıldız mimarın çarpıcı bir binasıyla şehrin yeniden canlanması fikrini anlatır. Gehry, karmaşık eğrileri hesaplamak için havacılıkta kullanılan CATIA yazılımından yararlandı."]}, "fr": {"q": "Quel architecte a conçu le musée couvert de titane qui aurait transformé l'économie d'une ville et donné son nom à l'« effet Bilbao » ?", "opts": ["Zaha Hadid", "Frank Gehry", "Rem Koolhaas", "Santiago Calatrava"], "exp": "Le Guggenheim de Bilbao, conçu par Frank Gehry, ouvre en 1997 et attire des millions de touristes dans une ville industrielle en déclin.", "detail": ["L'« effet Bilbao » désigne l'idée qu'un bâtiment spectaculaire d'un architecte star peut relancer une ville. Gehry a utilisé le logiciel CATIA, venu de l'aéronautique, pour calculer les courbes complexes."]}, "en": {"q": "Which architect designed the titanium-clad museum said to have transformed a city's economy and given its name to the 'Bilbao effect'?", "opts": ["Zaha Hadid", "Frank Gehry", "Rem Koolhaas", "Santiago Calatrava"], "exp": "Frank Gehry's Guggenheim Bilbao opened in 1997 and drew millions of tourists to a declining industrial city.", "detail": ["The 'Bilbao effect' means the idea that one spectacular building by a star architect can revive a city. Gehry used CATIA software from the aerospace industry to calculate the complex curves."]}, "id": "x-14-10", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 2004, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "islam", "medium": "arch", "tags": ["architecture", "contemporary", "women"], "topics": ["architecture", "contemporary", "women"], "search": {"commons": "Heydar Aliyev Center Baku", "wiki": {"en": "Heydar Aliyev Center Baku"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Bağdat'ta doğdum ve Londra'da çalıştım.", "2004'te Pritzker Mimarlık Ödülü'nü kazanan ilk kadın oldum.", "Bakü'deki Haydar Aliyev Merkezi gibi akışkan, kıvrımlı yapılarla tanındım."], "opts": ["Zaha Hadid", "Kazuyo Sejima", "Lina Bo Bardi", "Jeanne Gang"], "exp": "Cevap Zaha Hadid'dir. Dekonstrüktivizm ve parametrik tasarımın önde gelen mimarlarından biridir.", "detail": ["Uzun yıllar projeleri 'yapılamaz' bulundu; ilk büyük yapısı Vitra İtfaiye İstasyonu (1993) oldu. Hadid 2016'da öldü; ofisi Zaha Hadid Architects bugün de çalışmaya devam eder."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Bagdad et j'ai travaillé à Londres.", "En 2004, je suis devenue la première femme à recevoir le prix Pritzker d'architecture.", "Je suis connue pour des bâtiments fluides et courbes, comme le Centre Heydar Aliyev à Bakou."], "opts": ["Zaha Hadid", "Kazuyo Sejima", "Lina Bo Bardi", "Jeanne Gang"], "exp": "La réponse est Zaha Hadid, l'une des grandes architectes du déconstructivisme et du design paramétrique.", "detail": ["Pendant longtemps, ses projets ont été jugés « irréalisables » ; son premier grand bâtiment est la caserne de pompiers Vitra (1993). Hadid est morte en 2016 ; son agence, Zaha Hadid Architects, continue de travailler."]}, "en": {"q": "Who am I?", "clues": ["I was born in Baghdad and worked in London.", "In 2004 I became the first woman to win the Pritzker Architecture Prize.", "I am known for fluid, curving buildings such as the Heydar Aliyev Center in Baku."], "opts": ["Zaha Hadid", "Kazuyo Sejima", "Lina Bo Bardi", "Jeanne Gang"], "exp": "The answer is Zaha Hadid, a leading architect of Deconstructivism and parametric design.", "detail": ["For years her projects were called 'unbuildable'; her first major building was the Vitra Fire Station (1993). Hadid died in 2016; her firm, Zaha Hadid Architects, still works today."]}, "id": "x-14-11", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1956, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "arch", "tags": ["architecture", "postwar", "r-latam"], "topics": ["architecture", "postwar", "r-latam"], "search": {"commons": "Brasília Niemeyer Congress", "wiki": {"en": "Brasília Niemeyer Congress"}}, "answer": true, "tr": {"q": "Brezilya'nın yeni başkenti Brasília'nın şehir planını Lúcio Costa, ana yapılarını ise Oscar Niemeyer tasarladı.", "exp": "Doğru. Costa'nın 'Plano Piloto'su yukarıdan bir uçağa ya da kuşa benzer; Niemeyer de Ulusal Kongre ve Katedral gibi yapıları tasarladı.", "detail": ["Şehir 1956–60 arasında, neredeyse sıfırdan, dört yılda kuruldu ve 1960'ta başkent oldu. Modernist şehircilik idealinin en büyük örneklerinden biridir ve 1987'den beri UNESCO Dünya Mirası'dır."]}, "fr": {"q": "Le plan de Brasília, nouvelle capitale du Brésil, est de Lúcio Costa, et ses principaux bâtiments sont d'Oscar Niemeyer.", "exp": "Vrai. Le « Plano Piloto » de Costa ressemble, vu d'en haut, à un avion ou à un oiseau ; Niemeyer a dessiné le Congrès national et la cathédrale.", "detail": ["La ville a été construite presque à partir de rien en quatre ans, de 1956 à 1960, et devient capitale en 1960. C'est l'un des plus grands exemples de l'urbanisme moderniste, classé à l'UNESCO depuis 1987."]}, "en": {"q": "The city plan of Brasília, Brazil's new capital, was by Lúcio Costa, and its main buildings by Oscar Niemeyer.", "exp": "True. Costa's 'Plano Piloto' looks like an aeroplane or a bird from above; Niemeyer designed the National Congress and the Cathedral.", "detail": ["The city was built almost from nothing in four years, 1956–60, and became the capital in 1960. It is one of the greatest examples of modernist planning and a UNESCO World Heritage site since 1987."]}, "id": "x-14-12", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1972, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "americas", "medium": "newmedia", "tags": ["newmedia", "postwar", "performance", "r-namerica"], "topics": ["newmedia", "postwar", "performance", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "Video sanatının öncülerinden olan ve 1970'lerden beri yavaş çekim, su ve ateşle ruhani video yerleştirmeleri yapan ABD'li sanatçı kimdir?", "opts": ["Gary Hill", "Tony Oursler", "Bill Viola", "Bruce Nauman"], "exp": "Bill Viola, 'Selamlaşma' (1995) ve 'Martyrs' (2014) gibi eserlerde yavaşlatılmış görüntülerle doğum, ölüm ve dönüşüm temalarını işledi.", "detail": ["Viola, Nam June Paik'in asistanı olarak çalışmaya başladı. 'Martyrs', Londra'daki St Paul's Katedrali'nde kalıcı olarak gösterilen ilk hareketli görüntü eseridir. Viola 2024'te öldü."]}, "fr": {"q": "Quel artiste américain, pionnier de l'art vidéo, crée depuis les années 1970 des installations spirituelles au ralenti, avec l'eau et le feu ?", "opts": ["Gary Hill", "Tony Oursler", "Bill Viola", "Bruce Nauman"], "exp": "Bill Viola traite de la naissance, de la mort et de la transformation avec des images ralenties, par exemple dans « The Greeting » (1995) et « Martyrs » (2014).", "detail": ["Viola a commencé comme assistant de Nam June Paik. « Martyrs » est la première œuvre en images animées installée de façon permanente dans la cathédrale Saint-Paul de Londres. Viola est mort en 2024."]}, "en": {"q": "Which American artist, a pioneer of video art, has made spiritual slow-motion installations with water and fire since the 1970s?", "opts": ["Gary Hill", "Tony Oursler", "Bill Viola", "Bruce Nauman"], "exp": "Bill Viola explored birth, death and transformation through slowed-down images in works such as 'The Greeting' (1995) and 'Martyrs' (2014).", "detail": ["Viola started as an assistant to Nam June Paik. 'Martyrs' is the first moving-image work permanently installed in St Paul's Cathedral in London. Viola died in 2024."]}, "id": "x-14-13", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 2018, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "asia", "medium": "newmedia", "tags": ["newmedia", "contemporary", "r-fareast"], "topics": ["newmedia", "contemporary", "r-fareast"], "search": {"commons": "teamLab Borderless", "wiki": {"en": "teamLab Borderless"}}, "answer": true, "tr": {"q": "Japon sanat kolektifi teamLab'ın Tokyo'daki dijital sanat müzesi, tek bir sanatçı grubuna adanmış müzeler arasında en çok ziyaret edilenlerden biri olarak Guinness rekoru kırdı.", "exp": "Doğru. 'teamLab Borderless', açılışının ilk yılında yaklaşık 2,3 milyon ziyaretçiyle Guinness rekoru aldı.", "detail": ["teamLab, projeksiyonlar, sensörler ve yazılımla ziyaretçinin hareketine tepki veren, sınırları olmayan immersif ortamlar kurar. Kolektifte sanatçılar, programcılar, mühendisler ve mimarlar birlikte çalışır."]}, "fr": {"q": "Le musée d'art numérique du collectif japonais teamLab à Tokyo a battu un record Guinness comme l'un des musées les plus visités consacrés à un seul groupe d'artistes.", "exp": "Vrai. « teamLab Borderless » a reçu un record Guinness avec environ 2,3 millions de visiteurs la première année.", "detail": ["teamLab crée des environnements immersifs sans limites, avec des projections, des capteurs et des logiciels qui réagissent aux mouvements du public. Le collectif réunit artistes, programmeurs, ingénieurs et architectes."]}, "en": {"q": "The Japanese collective teamLab's digital art museum in Tokyo set a Guinness record as one of the most visited museums dedicated to a single artist group.", "exp": "True. 'teamLab Borderless' received a Guinness record with about 2.3 million visitors in its first year.", "detail": ["teamLab builds borderless immersive environments with projections, sensors and software that react to visitors' movement. The collective brings together artists, programmers, engineers and architects."]}, "id": "x-14-14", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 2003, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "europe", "medium": "newmedia", "tags": ["newmedia", "contemporary", "sculpture"], "topics": ["newmedia", "contemporary", "sculpture"], "search": {"commons": "Olafur Eliasson The Weather Project", "wiki": {"en": "Olafur Eliasson The Weather Project"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Danimarka'da doğdum ve İzlanda kökenliyim; atölyem Berlin'dedir.", "2003'te Tate Modern'in Türbin Salonu'na tek frekanslı lambalardan dev bir yapay güneş ve sis yerleştirdim.", "Işık, su, sis ve renkle algıyı sorgulayan eserler yapıyorum; 'Little Sun' adlı güneş enerjili lamba projesini de kurdum."], "opts": ["Anish Kapoor", "James Turrell", "Ryoji Ikeda", "Olafur Eliasson"], "exp": "Cevap Olafur Eliasson'dur. 'Hava Durumu Projesi' (2003) milyonlarca ziyaretçi çekti; insanlar yere uzanıp tavandaki aynada kendilerini izledi.", "detail": ["Eliasson eserlerinde doğal olayları yapay olarak yeniden kurar ve izleyiciyi deneyimin merkezine koyar. 'Ice Watch' projesinde Grönland buzullarından kopan buz kütlelerini kent meydanlarında eritti."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né au Danemark, d'origine islandaise ; mon atelier est à Berlin.", "En 2003, j'ai installé dans le Turbine Hall de la Tate Modern un immense soleil artificiel fait de lampes monofréquence, et de la brume.", "Je crée des œuvres avec la lumière, l'eau, la brume et la couleur pour interroger la perception ; j'ai aussi lancé « Little Sun », une lampe solaire."], "opts": ["Anish Kapoor", "James Turrell", "Ryoji Ikeda", "Olafur Eliasson"], "exp": "La réponse est Olafur Eliasson. « The Weather Project » (2003) a attiré des millions de visiteurs, qui s'allongeaient au sol pour se voir dans le miroir du plafond.", "detail": ["Eliasson recrée des phénomènes naturels de façon artificielle et place le spectateur au centre de l'expérience. Dans « Ice Watch », il a fait fondre des blocs de glace du Groenland sur des places de villes."]}, "en": {"q": "Who am I?", "clues": ["I was born in Denmark, of Icelandic origin; my studio is in Berlin.", "In 2003 I installed a huge artificial sun of mono-frequency lamps, with mist, in Tate Modern's Turbine Hall.", "I make works with light, water, mist and colour that question perception; I also founded 'Little Sun', a solar lamp project."], "opts": ["Anish Kapoor", "James Turrell", "Ryoji Ikeda", "Olafur Eliasson"], "exp": "The answer is Olafur Eliasson. 'The Weather Project' (2003) drew millions of visitors, who lay on the floor to watch themselves in the ceiling mirror.", "detail": ["Eliasson recreates natural phenomena artificially and puts the viewer at the centre of the experience. In 'Ice Watch' he let blocks of Greenland ice melt in city squares."]}, "id": "x-14-15", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 2006, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "americas", "medium": "sculpture", "tags": ["sculpture", "contemporary", "r-namerica"], "topics": ["sculpture", "contemporary", "r-namerica"], "search": {"commons": "Cloud Gate Chicago", "wiki": {"en": "Cloud Gate"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Jeff Koons – Balon Köpek", "Anish Kapoor – Bulut Kapısı", "Richard Serra – Zamanın Maddesi", "Claes Oldenburg – Kaşık Köprüsü ve Kiraz"], "exp": "Anish Kapoor'un 'Bulut Kapısı' (2006), Chicago'daki Millennium Park'ta, cilalı paslanmaz çelikten yapılmış dev bir ayna heykeldir.", "detail": ["Halk ona biçimi yüzünden 'The Bean' (Fasulye) der. Yüzey, gökyüzünü, şehrin silüetini ve ziyaretçileri yansıtır; altından geçilebilir. 168 çelik levhanın ek yerleri görünmeyecek kadar cilalandı."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Jeff Koons – Balloon Dog", "Anish Kapoor – Cloud Gate", "Richard Serra – The Matter of Time", "Claes Oldenburg – Spoonbridge and Cherry"], "exp": "« Cloud Gate » d'Anish Kapoor (2006) est une immense sculpture-miroir en acier inoxydable poli, dans le Millennium Park de Chicago.", "detail": ["À cause de sa forme, le public l'appelle « The Bean » (le haricot). La surface reflète le ciel, la ville et les visiteurs, et on peut passer dessous. Les 168 plaques d'acier ont été polies jusqu'à faire disparaître les joints."]}, "en": {"q": "Which work is this?", "opts": ["Jeff Koons – Balloon Dog", "Anish Kapoor – Cloud Gate", "Richard Serra – The Matter of Time", "Claes Oldenburg – Spoonbridge and Cherry"], "exp": "Anish Kapoor's 'Cloud Gate' (2006) is a huge mirror sculpture of polished stainless steel in Chicago's Millennium Park.", "detail": ["Because of its shape, people call it 'The Bean'. Its surface reflects the sky, the skyline and visitors, and you can walk under it. Its 168 steel plates were polished until the seams disappeared."]}, "id": "x-14-16", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1999, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "sculpture", "tags": ["sculpture", "contemporary", "women"], "topics": ["sculpture", "contemporary", "women"], "search": {"commons": "Louise Bourgeois Maman spider", "wiki": {"en": "Maman (sculpture)"}}, "answer": 3, "tr": {"q": "Louise Bourgeois'nın dev örümcek heykeli 'Maman' (1999) neyi simgeler?", "opts": ["Korku ve tehlikeyi", "Doğanın yıkıcılığını", "Sanayi çağını", "Sanatçının dokumacı annesini ve koruyuculuğu"], "exp": "Bourgeois, örümceği halı onarımcısı olan annesinin sabrı, zekâsı ve koruyuculuğu ile ilişkilendirdi; örümcek de ağını örer ve onarır.", "detail": ["'Maman' yaklaşık 9 metre yüksekliğindedir ve karnında mermer yumurtalar taşır. İlk kez 2000'de Tate Modern'in Türbin Salonu'nda gösterildi; bronz dökümleri Ottawa, Bilbao, Tokyo ve Seul gibi şehirlerdedir."]}, "fr": {"q": "Que symbolise l'araignée géante « Maman » (1999) de Louise Bourgeois ?", "opts": ["La peur et le danger", "La destruction de la nature", "L'ère industrielle", "La mère de l'artiste, restauratrice de tapisseries, et la protection"], "exp": "Bourgeois associe l'araignée à la patience, à l'intelligence et à la protection de sa mère, restauratrice de tapisseries ; l'araignée, elle aussi, tisse et répare sa toile.", "detail": ["« Maman » mesure environ 9 mètres et porte des œufs de marbre dans son ventre. Elle a été présentée d'abord en 2000 dans le Turbine Hall de la Tate Modern ; des bronzes sont à Ottawa, Bilbao, Tokyo et Séoul."]}, "en": {"q": "What does Louise Bourgeois's giant spider sculpture 'Maman' (1999) symbolise?", "opts": ["Fear and danger", "The destruction of nature", "The industrial age", "The artist's mother, a tapestry restorer, and protection"], "exp": "Bourgeois linked the spider to the patience, cleverness and protection of her mother, a tapestry restorer; the spider also weaves and repairs its web.", "detail": ["'Maman' is about 9 metres tall and carries marble eggs in its belly. It was first shown in 2000 in Tate Modern's Turbine Hall; bronze casts are in Ottawa, Bilbao, Tokyo and Seoul."]}, "id": "x-14-17", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "world", "medium": "sculpture", "tags": ["sculpture", "modern", "postwar", "contemporary"], "topics": ["sculpture", "modern", "postwar", "contemporary"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1907", "1938", "1966", "1999"], "tr": {"q": "Bu modern heykelleri eskiden yeniye sırala.", "items": ["Brâncuși – Öpücük", "Brâncuși – Sonsuz Sütun (Târgu Jiu)", "Carl Andre – Equivalent VIII", "Louise Bourgeois – Maman"], "exp": "Brâncuși'nin Öpücük'ü 1907–08, Sonsuz Sütun 1938, Andre'nin tuğla eseri 1966, Maman 1999 tarihlidir.", "detail": ["Brâncuși, biçimi en sade özüne indirerek modern heykelin yolunu açtı. Romanya'daki Târgu Jiu topluluğu, Birinci Dünya Savaşı kahramanlarına adanmıştır ve 2024'te UNESCO listesine girdi."]}, "fr": {"q": "Classe ces sculptures modernes de la plus ancienne à la plus récente.", "items": ["Brâncuși – Le Baiser", "Brâncuși – La Colonne sans fin (Târgu Jiu)", "Carl Andre – Equivalent VIII", "Louise Bourgeois – Maman"], "exp": "Le Baiser de Brâncuși date de 1907–1908, la Colonne sans fin de 1938, l'œuvre en briques d'Andre de 1966 et Maman de 1999.", "detail": ["Brâncuși ouvre la voie de la sculpture moderne en réduisant la forme à son essence. L'ensemble de Târgu Jiu, en Roumanie, est dédié aux héros de la Première Guerre mondiale et a été inscrit à l'UNESCO en 2024."]}, "en": {"q": "Put these modern sculptures in order, oldest first.", "items": ["Brâncuși – The Kiss", "Brâncuși – Endless Column (Târgu Jiu)", "Carl Andre – Equivalent VIII", "Louise Bourgeois – Maman"], "exp": "Brâncuși's The Kiss dates from 1907–08, the Endless Column from 1938, Andre's brick work from 1966 and Maman from 1999.", "detail": ["Brâncuși opened the road of modern sculpture by reducing form to its essence. The Târgu Jiu ensemble in Romania is dedicated to First World War heroes and joined the UNESCO list in 2024."]}, "id": "x-14-18", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 2010, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "europe", "medium": "performance", "tags": ["performance", "contemporary", "women"], "topics": ["performance", "contemporary", "women"], "search": {"commons": "Marina Abramović The Artist Is Present", "wiki": {"en": "Marina Abramović The Artist Is Present"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Belgrad'da doğdum ve kendimi 'performans sanatının büyükannesi' olarak tanımlarım.", "Uzun yıllar sanatçı Ulay ile birlikte çalıştım; ilişkimizi Çin Seddi'nin iki ucundan yürüyerek ortada vedalaşarak bitirdik.", "2010'da MoMA'da 736 saat boyunca bir masada oturup ziyaretçilerle sessizce göz göze geldim."], "opts": ["Gina Pane", "Carolee Schneemann", "Marina Abramović", "Valie Export"], "exp": "Cevap Marina Abramović'tir. 'Sanatçı Burada' (2010) performansı, MoMA tarihindeki en çok ilgi gören sergilerden biri oldu.", "detail": ["1974'teki 'Ritim 0'da izleyicilere 72 nesneyle bedenine istediklerini yapma izni verdi; bu performans izleyici ile sanatçı arasındaki gücü sorguladı. 2023'te Londra'daki Royal Academy'de ana galerilerde kişisel sergisi açılan ilk kadın sanatçı oldu."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Belgrade et je me présente comme la « grand-mère de la performance ».", "J'ai longtemps travaillé avec l'artiste Ulay ; nous avons terminé notre relation en marchant depuis les deux bouts de la Grande Muraille de Chine pour nous dire adieu au milieu.", "En 2010, au MoMA, je suis restée assise 736 heures à une table pour regarder en silence les visiteurs dans les yeux."], "opts": ["Gina Pane", "Carolee Schneemann", "Marina Abramović", "Valie Export"], "exp": "La réponse est Marina Abramović. « The Artist Is Present » (2010) est l'une des expositions les plus suivies de l'histoire du MoMA.", "detail": ["Dans « Rythme 0 » (1974), elle laisse le public utiliser 72 objets sur son corps comme il veut ; la performance interroge le pouvoir entre public et artiste. En 2023, elle devient la première femme à avoir une exposition personnelle dans les grandes salles de la Royal Academy."]}, "en": {"q": "Who am I?", "clues": ["I was born in Belgrade and call myself the 'grandmother of performance art'.", "For years I worked with the artist Ulay; we ended our relationship by walking from the two ends of the Great Wall of China to say goodbye in the middle.", "In 2010 at MoMA I sat at a table for 736 hours, silently meeting visitors' eyes."], "opts": ["Gina Pane", "Carolee Schneemann", "Marina Abramović", "Valie Export"], "exp": "The answer is Marina Abramović. 'The Artist Is Present' (2010) became one of the most attended shows in MoMA's history.", "detail": ["In 'Rhythm 0' (1974) she let the public use 72 objects on her body as they wished, questioning the power between audience and artist. In 2023 she became the first woman to have a solo show in the main galleries of the Royal Academy in London."]}, "id": "x-14-19", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1959, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "americas", "medium": "performance", "tags": ["performance", "postwar", "r-namerica", "fluxus"], "topics": ["performance", "postwar", "r-namerica", "fluxus"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "'Happening' terimini 1959'daki '6 Bölümde 18 Happening' eseriyle ortaya atan sanatçı kimdir?", "opts": ["John Cage", "Allan Kaprow", "Claes Oldenburg", "Jim Dine"], "exp": "Allan Kaprow, 1959'da New York'taki Reuben Gallery'de izleyicilerin odalar arasında dolaşıp talimatlara katıldığı '18 Happenings in 6 Parts'ı gerçekleştirdi.", "detail": ["Kaprow, Pollock'un aksiyon resminden yola çıkarak sanatı tuvalin dışına, gerçek mekâna ve zamana taşımak istedi. Happening'ler, sanat ile gündelik yaşam arasındaki sınırı bulanıklaştırdı ve performans sanatının temellerinden biri oldu."]}, "fr": {"q": "Quel artiste a inventé le terme « happening » avec son œuvre « 18 Happenings in 6 Parts » en 1959 ?", "opts": ["John Cage", "Allan Kaprow", "Claes Oldenburg", "Jim Dine"], "exp": "En 1959, à la Reuben Gallery de New York, Allan Kaprow réalise « 18 Happenings in 6 Parts » : le public circule entre des pièces et suit des instructions.", "detail": ["Partant de l'action painting de Pollock, Kaprow veut sortir l'art de la toile, dans l'espace et le temps réels. Les happenings brouillent la limite entre l'art et la vie quotidienne et sont une base de la performance."]}, "en": {"q": "Which artist coined the term 'happening' with his 1959 work '18 Happenings in 6 Parts'?", "opts": ["John Cage", "Allan Kaprow", "Claes Oldenburg", "Jim Dine"], "exp": "In 1959 at the Reuben Gallery in New York, Allan Kaprow staged '18 Happenings in 6 Parts', in which the audience moved between rooms and followed instructions.", "detail": ["Starting from Pollock's action painting, Kaprow wanted to take art off the canvas into real space and time. Happenings blurred the line between art and everyday life and became a foundation of performance art."]}, "id": "x-14-20", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1913, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "europe", "medium": "performance", "tags": ["performance", "modern", "design"], "topics": ["performance", "modern", "design"], "search": {"commons": "Rite of Spring 1913 Nijinsky", "wiki": {"en": "Rite of Spring 1913 Nijinsky"}}, "answer": true, "tr": {"q": "Stravinski'nin 'Bahar Ayini' balesinin 1913'teki Paris prömiyeri, seyirciler arasında büyük bir kargaşaya yol açtı.", "exp": "Doğru. Ballets Russes'ün 29 Mayıs 1913'teki gösterisinde Nijinski'nin sert koreografisi ve Stravinski'nin müziği seyirciyi ikiye böldü.", "detail": ["Dekor ve kostümleri Nicholas Roerich tasarladı. Prömiyer, Théâtre des Champs-Élysées'de yapıldı. Bu olay, modern müzik, dans ve sahne tasarımının doğuşunun simgelerinden biri sayılır."]}, "fr": {"q": "La première du « Sacre du printemps » de Stravinsky, à Paris en 1913, a provoqué un grand chahut dans la salle.", "exp": "Vrai. Le 29 mai 1913, lors du spectacle des Ballets russes, la chorégraphie brutale de Nijinski et la musique de Stravinsky divisent le public.", "detail": ["Les décors et costumes sont de Nicolas Roerich. La première a lieu au Théâtre des Champs-Élysées. L'événement est un symbole de la naissance de la musique, de la danse et de la scénographie modernes."]}, "en": {"q": "The 1913 Paris premiere of Stravinsky's ballet 'The Rite of Spring' caused a great uproar in the audience.", "exp": "True. At the Ballets Russes performance on 29 May 1913, Nijinsky's harsh choreography and Stravinsky's music split the audience.", "detail": ["The sets and costumes were designed by Nicholas Roerich. The premiere took place at the Théâtre des Champs-Élysées. The event is a symbol of the birth of modern music, dance and stage design."]}, "id": "x-14-21", "t": 1794800000000}, {"type": "match", "level": 2, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "world", "medium": "design", "tags": ["design", "modern", "postwar"], "topics": ["design", "modern", "postwar"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "Tasarımcıları ikonik tasarımlarıyla eşleştir.", "left": ["Charles ve Ray Eames", "Arne Jacobsen", "Dieter Rams", "Massimo Vignelli"], "right": ["Lounge Chair ve Osmanlı Puf", "Yumurta Sandalye", "Braun ürünleri ve 'İyi tasarımın on ilkesi'", "New York metrosu haritası (1972)"], "exp": "Dördü de 20. yüzyıl modern tasarımının en etkili isimlerindendir.", "detail": ["Eames çiftinin 1956 tarihli Lounge Chair'i hâlâ üretilir. Jacobsen Yumurta Sandalye'yi Kopenhag'daki SAS Royal Hotel için tasarladı. Rams'ın sade tasarımları Apple'ı etkiledi. Vignelli'nin geometrik metro haritası dönemin tartışmalı ama ikonik bir tasarımıdır."]}, "fr": {"q": "Associe chaque designer à sa création emblématique.", "left": ["Charles et Ray Eames", "Arne Jacobsen", "Dieter Rams", "Massimo Vignelli"], "right": ["Le Lounge Chair et son ottoman", "Le fauteuil Œuf (Egg)", "Les produits Braun et les « dix principes du bon design »", "Le plan du métro de New York (1972)"], "exp": "Ce sont quatre des designers les plus influents du design moderne du XXe siècle.", "detail": ["Le Lounge Chair des Eames (1956) est encore produit. Jacobsen a dessiné l'Egg pour le SAS Royal Hotel de Copenhague. Le design sobre de Rams a influencé Apple. Le plan géométrique de Vignelli était discuté, mais il est devenu une icône."]}, "en": {"q": "Match each designer with an iconic design.", "left": ["Charles and Ray Eames", "Arne Jacobsen", "Dieter Rams", "Massimo Vignelli"], "right": ["The Lounge Chair and Ottoman", "The Egg Chair", "Braun products and the 'ten principles of good design'", "The New York subway map (1972)"], "exp": "All four are among the most influential names of 20th-century modern design.", "detail": ["The Eameses' 1956 Lounge Chair is still made. Jacobsen designed the Egg for the SAS Royal Hotel in Copenhagen. Rams's simple designs influenced Apple. Vignelli's geometric subway map was controversial but became an icon."]}, "id": "x-14-22", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1957, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "europe", "medium": "design", "tags": ["design", "postwar"], "topics": ["design", "postwar"], "search": {"commons": "Helvetica typeface", "wiki": {"en": "Helvetica typeface"}}, "answer": true, "tr": {"q": "Helvetica yazı karakteri 1957'de İsviçre'de Max Miedinger ve Eduard Hoffmann tarafından tasarlandı; ilk adı 'Neue Haas Grotesk'ti.", "exp": "Doğru. Font, 1960'ta pazarlama amacıyla Latince'de 'İsviçre' anlamına gelen Helvetia'dan türetilmiş 'Helvetica' adını aldı.", "detail": ["Helvetica, 'Uluslararası Tipografik Stil' ya da 'İsviçre Stili'nin simgesi oldu; temiz, nötr ve okunaklı görünümüyle sayısız kurumsal logoda kullanıldı. 2007'de Gary Hustwit'in 'Helvetica' adlı belgeseli yapıldı."]}, "fr": {"q": "La police Helvetica a été dessinée en Suisse en 1957 par Max Miedinger et Eduard Hoffmann ; elle s'appelait d'abord « Neue Haas Grotesk ».", "exp": "Vrai. En 1960, pour la vente, elle prend le nom d'« Helvetica », dérivé d'Helvetia, « Suisse » en latin.", "detail": ["Helvetica devient le symbole du « style typographique international » ou « style suisse » ; propre, neutre et lisible, elle est utilisée dans d'innombrables logos. Gary Hustwit lui a consacré un documentaire en 2007."]}, "en": {"q": "The Helvetica typeface was designed in Switzerland in 1957 by Max Miedinger and Eduard Hoffmann; it was first called 'Neue Haas Grotesk'.", "exp": "True. In 1960, for marketing, it was renamed 'Helvetica', from Helvetia, Latin for 'Switzerland'.", "detail": ["Helvetica became the symbol of the 'International Typographic Style' or 'Swiss Style'; clean, neutral and readable, it was used in countless logos. Gary Hustwit made a documentary called 'Helvetica' in 2007."]}, "id": "x-14-23", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1895, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "concept", "tags": ["contemporary", "c19"], "topics": ["contemporary", "c19"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "1895'te kurulan ve dünyanın en eski büyük uluslararası sanat bienali sayılan etkinlik hangisidir?", "opts": ["Venedik Bienali", "São Paulo Bienali", "İstanbul Bienali", "Documenta"], "exp": "Venedik Bienali 1895'te kuruldu; ülkelerin kendi pavyonlarında sanatçılarını temsil ettiği yapısıyla bilinir.", "detail": ["São Paulo Bienali 1951'de, Documenta 1955'te Kassel'de, İstanbul Bienali ise 1987'de kuruldu. Venedik'te en iyi ulusal katılıma ve sanatçıya 'Altın Aslan' ödülü verilir."]}, "fr": {"q": "Quelle manifestation, fondée en 1895, est considérée comme la plus ancienne grande biennale d'art internationale ?", "opts": ["La Biennale de Venise", "La Biennale de São Paulo", "La Biennale d'Istanbul", "La documenta"], "exp": "La Biennale de Venise est fondée en 1895 ; elle est connue pour ses pavillons nationaux où chaque pays présente ses artistes.", "detail": ["La Biennale de São Paulo date de 1951, la documenta de Cassel de 1955 et la Biennale d'Istanbul de 1987. À Venise, le « Lion d'or » récompense la meilleure participation nationale et le meilleur artiste."]}, "en": {"q": "Which event, founded in 1895, is considered the oldest major international art biennial?", "opts": ["The Venice Biennale", "The São Paulo Biennial", "The Istanbul Biennial", "Documenta"], "exp": "The Venice Biennale was founded in 1895 and is known for national pavilions where each country presents its artists.", "detail": ["The São Paulo Biennial began in 1951, Documenta in Kassel in 1955 and the Istanbul Biennial in 1987. In Venice the 'Golden Lion' goes to the best national participation and the best artist."]}, "id": "x-15-0", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1987, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "anatolia", "medium": "concept", "tags": ["contemporary", "r-anatolia"], "topics": ["contemporary", "r-anatolia"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "İstanbul Bienali ilk kez 1987'de İstanbul Kültür ve Sanat Vakfı (İKSV) tarafından düzenlendi.", "exp": "Doğru. İlk bienal 1987'de 'Tarihi Mekânlarda Çağdaş Sanat' başlığıyla açıldı.", "detail": ["İstanbul Bienali, şehrin tarihî yapılarını —sarnıçlar, hamamlar, antrepolar— sergi mekânına dönüştürmesiyle tanınır. Zamanla Avrupa ile Asya arasında önemli bir çağdaş sanat buluşma noktası oldu."]}, "fr": {"q": "La Biennale d'Istanbul a été organisée pour la première fois en 1987 par la Fondation d'Istanbul pour la culture et les arts (İKSV).", "exp": "Vrai. La première biennale ouvre en 1987 sous le titre « Art contemporain dans des lieux historiques ».", "detail": ["La Biennale d'Istanbul est connue pour transformer des bâtiments historiques — citernes, hammams, entrepôts — en lieux d'exposition. Elle est devenue un carrefour important de l'art contemporain entre l'Europe et l'Asie."]}, "en": {"q": "The Istanbul Biennial was first organised in 1987 by the Istanbul Foundation for Culture and Arts (İKSV).", "exp": "True. The first biennial opened in 1987 under the title 'Contemporary Art in Traditional Spaces'.", "detail": ["The Istanbul Biennial is known for turning historic buildings — cisterns, baths, warehouses — into exhibition spaces. It became an important meeting point for contemporary art between Europe and Asia."]}, "id": "x-15-1", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 2007, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "anatolia", "medium": "concept", "tags": ["contemporary", "r-anatolia", "conceptual"], "topics": ["contemporary", "r-anatolia", "conceptual"], "search": {"commons": "Sarkis", "wiki": {"en": "Sarkis"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["İstanbul'da doğdum ve 1964'ten beri Paris'te yaşıyorum.", "Eserlerimde neon, vitray, film ve 'hazine' adını verdiğim nesneleri bir araya getirerek bellek üzerine çalışırım.", "2015 Venedik Bienali'nde Türkiye Pavyonu'nda 'Respiro' adlı yerleştirmemi gösterdim."], "opts": ["Ayşe Erkmen", "Kutluğ Ataman", "Sarkis", "Hale Tenger"], "exp": "Cevap Sarkis'tir (Sarkis Zabunyan). Türkiye ve Fransa arasında köprü kuran çağdaş sanatın önemli isimlerindendir.", "detail": ["Sarkis, 1969'daki ünlü 'When Attitudes Become Form' sergisine katılmıştı. Eserlerinde Ermeni kimliği, sürgün ve kolektif bellek temaları da önemli yer tutar. 'Respiro'da gökkuşağı renkli neonlar ve 'hazine' aynalar kullanıldı."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Istanbul et je vis à Paris depuis 1964.", "Dans mes œuvres, je travaille sur la mémoire en réunissant néons, vitraux, films et objets que j'appelle mes « trésors ».", "En 2015, j'ai présenté mon installation « Respiro » au pavillon turc de la Biennale de Venise."], "opts": ["Ayşe Erkmen", "Kutluğ Ataman", "Sarkis", "Hale Tenger"], "exp": "La réponse est Sarkis (Sarkis Zabunyan), une figure importante de l'art contemporain entre la Turquie et la France.", "detail": ["Sarkis a participé en 1969 à la célèbre exposition « Quand les attitudes deviennent forme ». L'identité arménienne, l'exil et la mémoire collective sont aussi présents dans son œuvre. « Respiro » utilisait des néons aux couleurs de l'arc-en-ciel et des miroirs-trésors."]}, "en": {"q": "Who am I?", "clues": ["I was born in Istanbul and have lived in Paris since 1964.", "In my works I explore memory by bringing together neon, stained glass, film and objects I call 'treasures'.", "At the 2015 Venice Biennale I showed my installation 'Respiro' in the Turkish Pavilion."], "opts": ["Ayşe Erkmen", "Kutluğ Ataman", "Sarkis", "Hale Tenger"], "exp": "The answer is Sarkis (Sarkis Zabunyan), an important figure of contemporary art between Turkey and France.", "detail": ["Sarkis took part in the famous 1969 exhibition 'When Attitudes Become Form'. Armenian identity, exile and collective memory are also present in his work. 'Respiro' used rainbow-coloured neon and 'treasure' mirrors."]}, "id": "x-15-2", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1969, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "europe", "medium": "concept", "tags": ["contemporary", "postwar", "conceptual"], "topics": ["contemporary", "postwar", "conceptual"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1969'da Bern Kunsthalle'de 'When Attitudes Become Form' (Tavırlar Biçim Olduğunda) sergisini düzenleyen ve modern küratörlüğün öncüsü sayılan kişi kimdir?", "opts": ["Pontus Hultén", "Harald Szeemann", "Seth Siegelaub", "Okwui Enwezor"], "exp": "İsviçreli Harald Szeemann, bu sergide Kavramsal Sanat, Arte Povera ve Süreç Sanatı'nı bir araya getirdi; sanatçılar eserlerini doğrudan mekânda üretti.", "detail": ["Sergi o kadar tartışma yarattı ki Szeemann Kunsthalle'den ayrıldı ve 'bağımsız küratör' oldu. 1972'de Documenta 5'i yönetti. Bu sergi, küratörün yaratıcı bir 'sergi yazarı' olarak görülmesinin başlangıcı sayılır."]}, "fr": {"q": "Qui a organisé en 1969 l'exposition « Quand les attitudes deviennent forme » à la Kunsthalle de Berne, et est vu comme un pionnier du commissariat moderne ?", "opts": ["Pontus Hultén", "Harald Szeemann", "Seth Siegelaub", "Okwui Enwezor"], "exp": "Le Suisse Harald Szeemann réunit dans cette exposition l'art conceptuel, l'Arte Povera et le Process Art ; les artistes produisent leurs œuvres directement sur place.", "detail": ["L'exposition fait tellement scandale que Szeemann quitte la Kunsthalle et devient « commissaire indépendant ». Il dirige la documenta 5 en 1972. On voit cette exposition comme le début du commissaire « auteur d'expositions »."]}, "en": {"q": "Who organised the 1969 exhibition 'When Attitudes Become Form' at the Kunsthalle Bern and is seen as a pioneer of modern curating?", "opts": ["Pontus Hultén", "Harald Szeemann", "Seth Siegelaub", "Okwui Enwezor"], "exp": "The Swiss Harald Szeemann brought together Conceptual Art, Arte Povera and Process Art; artists made their works directly in the space.", "detail": ["The show caused such controversy that Szeemann left the Kunsthalle and became an 'independent curator'. He directed Documenta 5 in 1972. The show is seen as the beginning of the curator as a creative 'exhibition author'."]}, "id": "x-15-3", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 2014, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "americas", "medium": "painting", "tags": ["contemporary", "painting", "r-namerica"], "topics": ["contemporary", "painting", "r-namerica"], "search": {"commons": "Kehinde Wiley portrait Obama", "wiki": {"en": "Kehinde Wiley portrait Obama"}}, "answer": 0, "tr": {"q": "Bu tarz, çiçekli desenli arka planlar önünde, Avrupa'nın klasik portre pozlarında genç siyah figürleri gösteren hangi sanatçıyı akla getirir?", "opts": ["Kehinde Wiley", "Kerry James Marshall", "Amy Sherald", "Titus Kaphar"], "exp": "Kehinde Wiley, Avrupa sanatının kahramanca portre geleneğini siyah figürlerle yeniden yorumlar; canlı, desenli arka planlar onun imzasıdır.", "detail": ["Wiley, 2018'de Barack Obama'nın resmî portresini yaptı; portre Washington'daki Ulusal Portre Galerisi'ndedir. Aynı yıl Amy Sherald da Michelle Obama'nın portresini yaptı."]}, "fr": {"q": "Ce style, avec de jeunes figures noires dans des poses de portraits classiques européens devant des fonds fleuris, fait penser à quel artiste ?", "opts": ["Kehinde Wiley", "Kerry James Marshall", "Amy Sherald", "Titus Kaphar"], "exp": "Kehinde Wiley réinterprète la tradition européenne du portrait héroïque avec des figures noires ; ses fonds vifs à motifs sont sa signature.", "detail": ["En 2018, Wiley a peint le portrait officiel de Barack Obama, aujourd'hui à la National Portrait Gallery de Washington. La même année, Amy Sherald a peint celui de Michelle Obama."]}, "en": {"q": "This style, with young Black figures in classic European portrait poses against flowery patterned backgrounds, recalls which artist?", "opts": ["Kehinde Wiley", "Kerry James Marshall", "Amy Sherald", "Titus Kaphar"], "exp": "Kehinde Wiley reinterprets the European tradition of heroic portraiture with Black figures; bright patterned backgrounds are his signature.", "detail": ["In 2018 Wiley painted Barack Obama's official portrait, now in the National Portrait Gallery in Washington. That same year Amy Sherald painted Michelle Obama's portrait."]}, "id": "x-15-4", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1986, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "americas", "medium": "sculpture", "tags": ["contemporary", "sculpture", "popart", "r-namerica"], "topics": ["contemporary", "sculpture", "popart", "r-namerica"], "search": {"commons": "Jeff Koons Rabbit", "wiki": {"en": "Jeff Koons Rabbit"}}, "answer": true, "tr": {"q": "Jeff Koons'un paslanmaz çelik 'Tavşan' (1986) heykeli 2019'da açık artırmada yaşayan bir sanatçının en pahalı eseri olarak satıldı.", "exp": "Doğru. 'Tavşan' Mayıs 2019'da Christie's'te yaklaşık 91 milyon dolara satıldı.", "detail": ["Koons, şişme bir oyuncak tavşanı parlak çelikten döküm yaparak kitsch ile yüksek sanat arasındaki sınırı sorguladı. Yüzey ayna gibidir ve izleyiciyi yansıtır. Koons, büyük bir atölyede yardımcılarla çalışan bir sanatçıdır."]}, "fr": {"q": "La sculpture en acier inoxydable « Rabbit » (1986) de Jeff Koons a été vendue en 2019 comme l'œuvre la plus chère d'un artiste vivant aux enchères.", "exp": "Vrai. « Rabbit » a été vendu chez Christie's en mai 2019 pour environ 91 millions de dollars.", "detail": ["Koons reproduit un lapin gonflable en acier brillant et interroge la limite entre kitsch et grand art. Sa surface miroir reflète le spectateur. Koons travaille dans un grand atelier avec de nombreux assistants."]}, "en": {"q": "Jeff Koons's stainless-steel 'Rabbit' (1986) sold in 2019 as the most expensive work by a living artist at auction.", "exp": "True. 'Rabbit' sold at Christie's in May 2019 for about 91 million dollars.", "detail": ["Koons cast an inflatable toy rabbit in shiny steel, questioning the line between kitsch and high art. Its mirror surface reflects the viewer. Koons works in a large studio with many assistants."]}, "id": "x-15-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 2000, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "europe", "medium": "arch", "tags": ["contemporary", "architecture", "r-europe"], "topics": ["contemporary", "architecture", "r-europe"], "search": {"commons": "Tate Modern Bankside power station", "wiki": {"en": "Tate Modern"}}, "answer": 2, "tr": {"q": "Londra'daki Tate Modern hangi yapının dönüştürülmesiyle 2000'de açıldı?", "opts": ["Eski bir tren garı", "Bir askerî kışla", "Bankside Elektrik Santrali", "Bir liman deposu"], "exp": "Tate Modern, Giles Gilbert Scott'ın tasarladığı Bankside Elektrik Santrali'nin İsviçreli mimarlar Herzog & de Meuron tarafından dönüştürülmesiyle 2000'de açıldı.", "detail": ["Eski türbin dairesi, dev yerleştirmelere ev sahipliği yapan 'Türbin Salonu'na dönüştü. Paris'teki Musée d'Orsay da benzer biçimde eski bir tren garının dönüştürülmesiyle 1986'da açılmıştı."]}, "fr": {"q": "La Tate Modern à Londres a ouvert en 2000 dans quel ancien bâtiment transformé ?", "opts": ["Une ancienne gare", "Une caserne militaire", "La centrale électrique de Bankside", "Un entrepôt portuaire"], "exp": "La Tate Modern ouvre en 2000 dans la centrale électrique de Bankside, dessinée par Giles Gilbert Scott et transformée par les architectes suisses Herzog & de Meuron.", "detail": ["L'ancienne salle des turbines devient le « Turbine Hall », qui accueille d'immenses installations. À Paris, le musée d'Orsay avait ouvert de façon semblable en 1986, dans une ancienne gare."]}, "en": {"q": "Tate Modern in London opened in 2000 in which converted building?", "opts": ["A former railway station", "A military barracks", "Bankside Power Station", "A dock warehouse"], "exp": "Tate Modern opened in 2000 in Bankside Power Station, designed by Giles Gilbert Scott and converted by the Swiss architects Herzog & de Meuron.", "detail": ["The old turbine room became the 'Turbine Hall', home to huge installations. In Paris, the Musée d'Orsay had opened in a similar way in 1986, in a former railway station."]}, "id": "x-15-6", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 2012, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "africa", "medium": "photo", "tags": ["contemporary", "photo", "r-africa"], "topics": ["contemporary", "photo", "r-africa"], "search": {"commons": "Zanele Muholi Faces and Phases", "wiki": {"en": "Zanele Muholi Faces and Phases"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Güney Afrika'da doğdum ve kendimi 'görsel aktivist' olarak tanımlarım.", "'Faces and Phases' serisinde Güney Afrika'daki siyah LGBTİ+ toplulukların portrelerini çektim.", "'Somnyama Ngonyama' (Selam, Kara Dişi Aslan) serisinde kendimi gündelik nesnelerle dramatik siyah beyaz otoportrelerde görüntüledim."], "opts": ["Lorna Simpson", "Zanele Muholi", "Mickalene Thomas", "Lebohang Kganye"], "exp": "Cevap Zanele Muholi'dir. Fotoğraflarıyla görünmez kılınan toplulukların görünürlüğü ve haklarını savunur.", "detail": ["'Somnyama Ngonyama'da cildini koyulaştırarak ve sünger, mandal gibi nesnelerle kendini dönüştürerek ırk ve temsil üzerine düşünür. Tate Modern 2020'de büyük bir sergisini düzenledi."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né·e en Afrique du Sud et je me définis comme « activiste visuel·le ».", "Dans la série « Faces and Phases », j'ai photographié des personnes LGBTQI+ noires d'Afrique du Sud.", "Dans « Somnyama Ngonyama » (Salut, lionne noire), je me mets en scène dans des autoportraits en noir et blanc avec des objets quotidiens."], "opts": ["Lorna Simpson", "Zanele Muholi", "Mickalene Thomas", "Lebohang Kganye"], "exp": "La réponse est Zanele Muholi, qui défend par la photo la visibilité et les droits de communautés rendues invisibles.", "detail": ["Dans « Somnyama Ngonyama », Muholi assombrit sa peau et se transforme avec des éponges ou des pinces à linge pour réfléchir à la race et à la représentation. La Tate Modern lui a consacré une grande exposition en 2020."]}, "en": {"q": "Who am I?", "clues": ["I was born in South Africa and call myself a 'visual activist'.", "In the 'Faces and Phases' series I photographed Black LGBTQI+ people in South Africa.", "In 'Somnyama Ngonyama' (Hail the Dark Lioness) I staged dramatic black and white self-portraits with everyday objects."], "opts": ["Lorna Simpson", "Zanele Muholi", "Mickalene Thomas", "Lebohang Kganye"], "exp": "The answer is Zanele Muholi, who uses photography to defend the visibility and rights of communities made invisible.", "detail": ["In 'Somnyama Ngonyama', Muholi darkens their skin and transforms themself with sponges or clothes pegs to think about race and representation. Tate Modern held a major exhibition in 2020."]}, "id": "x-15-7", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 2002, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "europe", "medium": "concept", "tags": ["contemporary"], "topics": ["contemporary"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "2002'de Kassel'deki Documenta 11'in sanat yönetmeni olan ve Avrupa dışından gelen ilk Documenta yönetmeni sayılan küratör kimdir?", "opts": ["Catherine David", "Carolyn Christov-Bakargiev", "Adam Szymczyk", "Okwui Enwezor"], "exp": "Nijeryalı küratör Okwui Enwezor, Documenta 11'i yönetti ve sergiyi Kassel dışında dört 'platform'a yaydı.", "detail": ["Enwezor, sömürgecilik sonrası düşünceyi ve küresel Güney'in sanatçılarını merkeze aldı. 2015'te Venedik Bienali'ni yönetti. 2019'da öldü. 2022'deki Documenta 15'i ise Endonezyalı kolektif ruangrupa yönetti."]}, "fr": {"q": "Quel commissaire a dirigé la documenta 11 à Cassel en 2002, considéré comme le premier directeur de la documenta venu d'en dehors de l'Europe ?", "opts": ["Catherine David", "Carolyn Christov-Bakargiev", "Adam Szymczyk", "Okwui Enwezor"], "exp": "Le commissaire nigérian Okwui Enwezor dirige la documenta 11 et l'étend à quatre « plateformes » hors de Cassel.", "detail": ["Enwezor place la pensée postcoloniale et les artistes du Sud global au centre. Il dirige la Biennale de Venise en 2015 et meurt en 2019. La documenta 15, en 2022, est dirigée par le collectif indonésien ruangrupa."]}, "en": {"q": "Which curator directed Documenta 11 in Kassel in 2002, seen as the first Documenta director from outside Europe?", "opts": ["Catherine David", "Carolyn Christov-Bakargiev", "Adam Szymczyk", "Okwui Enwezor"], "exp": "The Nigerian curator Okwui Enwezor directed Documenta 11 and spread it across four 'platforms' outside Kassel.", "detail": ["Enwezor put postcolonial thought and artists from the Global South at the centre. He directed the Venice Biennale in 2015 and died in 2019. Documenta 15 in 2022 was run by the Indonesian collective ruangrupa."]}, "id": "x-15-8", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 2017, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "islam", "medium": "arch", "tags": ["contemporary", "architecture", "r-islam"], "topics": ["contemporary", "architecture", "r-islam"], "search": {"commons": "Louvre Abu Dhabi dome", "wiki": {"en": "Louvre Abu Dhabi dome"}}, "answer": true, "tr": {"q": "Louvre Abu Dabi'nin, içinden güneş ışığının 'ışık yağmuru' gibi süzüldüğü dev kafes kubbesini Jean Nouvel tasarladı.", "exp": "Doğru. Fransız mimar Jean Nouvel'in tasarladığı müze 2017'de açıldı; yaklaşık 180 metre çaplı kubbe, katmanlı geometrik desenlerden oluşur.", "detail": ["Kubbe, palmiye yapraklarının gölgesinden ve İslam mimarisinin geometrik desenlerinden esinlenir. Müze, Fransa ile Birleşik Arap Emirlikleri arasındaki bir anlaşmayla 'Louvre' adını kullanır ve Fransız müzelerinden ödünç eserler sergiler."]}, "fr": {"q": "L'immense coupole en treillis du Louvre Abu Dhabi, à travers laquelle la lumière tombe comme une « pluie de lumière », a été conçue par Jean Nouvel.", "exp": "Vrai. Le musée, dessiné par l'architecte français Jean Nouvel, ouvre en 2017 ; la coupole d'environ 180 mètres de diamètre est faite de couches de motifs géométriques.", "detail": ["La coupole s'inspire de l'ombre des palmes et des motifs géométriques de l'architecture islamique. Grâce à un accord entre la France et les Émirats arabes unis, le musée utilise le nom « Louvre » et présente des prêts des musées français."]}, "en": {"q": "The huge lattice dome of the Louvre Abu Dhabi, through which sunlight falls like a 'rain of light', was designed by Jean Nouvel.", "exp": "True. The museum, designed by the French architect Jean Nouvel, opened in 2017; the dome, about 180 metres across, is made of layered geometric patterns.", "detail": ["The dome is inspired by the shade of palm leaves and the geometric patterns of Islamic architecture. Through an agreement between France and the UAE, the museum uses the 'Louvre' name and shows loans from French museums."]}, "id": "x-15-9", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1997, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "painting", "tags": ["contemporary", "painting", "r-europe"], "topics": ["contemporary", "painting", "r-europe"], "search": {"commons": "Gerhard Richter abstract squeegee painting", "wiki": {"en": "Gerhard Richter abstract squeegee painting"}}, "answer": 2, "tr": {"q": "Bu tür, büyük bir rakleyle boyanın tuval üzerinde sürüklendiği soyut resimler hangi sanatçıyla özdeşleşir?", "opts": ["Anselm Kiefer", "Sigmar Polke", "Gerhard Richter", "Albert Oehlen"], "exp": "Gerhard Richter, 1980'lerden beri büyük bir rakleyle (squeegee) katman katman boya sürükleyerek 'Soyut Resim' (Abstraktes Bild) serisini yapar.", "detail": ["Richter aynı zamanda fotoğraflardan bulanık gerçekçi resimler yapar; 'Ekim 18, 1977' serisi bunların en ünlülerindendir. Köln Katedrali'nin 2007'de yapılan piksel desenli vitray penceresi de onun eseridir."]}, "fr": {"q": "Ces peintures abstraites, faites en tirant la peinture sur la toile avec une grande raclette, sont associées à quel artiste ?", "opts": ["Anselm Kiefer", "Sigmar Polke", "Gerhard Richter", "Albert Oehlen"], "exp": "Depuis les années 1980, Gerhard Richter réalise ses « Peintures abstraites » (Abstraktes Bild) en tirant des couches de peinture avec une grande raclette.", "detail": ["Richter peint aussi des tableaux réalistes flous d'après des photos ; la série « 18 octobre 1977 » est l'une des plus célèbres. Le vitrail en pixels de la cathédrale de Cologne (2007) est aussi son œuvre."]}, "en": {"q": "These abstract paintings, made by dragging paint across the canvas with a large squeegee, are linked to which artist?", "opts": ["Anselm Kiefer", "Sigmar Polke", "Gerhard Richter", "Albert Oehlen"], "exp": "Since the 1980s Gerhard Richter has made his 'Abstract Paintings' (Abstraktes Bild) by dragging layers of paint with a large squeegee.", "detail": ["Richter also paints blurred realistic pictures from photographs; the 'October 18, 1977' series is one of the best known. The pixel-patterned stained-glass window of Cologne Cathedral (2007) is also his."]}, "id": "x-15-10", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 2005, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "asia", "medium": "painting", "tags": ["contemporary", "painting", "popart", "r-fareast"], "topics": ["contemporary", "painting", "popart", "r-fareast"], "search": {"commons": "Takashi Murakami Superflat", "wiki": {"en": "Takashi Murakami Superflat"}}, "answer": 0, "tr": {"q": "Japon anime, manga ve geleneksel resmin düz yüzeylerini birleştiren 'Superflat' kavramını ortaya atan sanatçı kimdir?", "opts": ["Takashi Murakami", "Yoshitomo Nara", "Hiroshi Sugimoto", "Mariko Mori"], "exp": "Takashi Murakami 2000'de 'Superflat' kavramını tanıttı ve 2005'te New York'ta 'Little Boy' sergisini düzenledi.", "detail": ["Murakami, Edo dönemi resminin düz kompozisyonları ile çağdaş otaku kültürü arasında bağ kurdu. Louis Vuitton ve Kanye West gibi markalar ve müzisyenlerle iş birliği yaparak sanat ile ticaret arasındaki sınırı bilerek bulanıklaştırdı."]}, "fr": {"q": "Quel artiste a lancé le concept de « Superflat », qui mêle l'anime, le manga et les surfaces plates de la peinture japonaise traditionnelle ?", "opts": ["Takashi Murakami", "Yoshitomo Nara", "Hiroshi Sugimoto", "Mariko Mori"], "exp": "Takashi Murakami présente le concept de « Superflat » en 2000 et organise l'exposition « Little Boy » à New York en 2005.", "detail": ["Murakami relie les compositions plates de la peinture d'Edo à la culture otaku contemporaine. En collaborant avec Louis Vuitton ou Kanye West, il brouille volontairement la limite entre art et commerce."]}, "en": {"q": "Which artist launched the 'Superflat' concept, which mixes anime, manga and the flat surfaces of traditional Japanese painting?", "opts": ["Takashi Murakami", "Yoshitomo Nara", "Hiroshi Sugimoto", "Mariko Mori"], "exp": "Takashi Murakami introduced 'Superflat' in 2000 and organised the 'Little Boy' exhibition in New York in 2005.", "detail": ["Murakami linked the flat compositions of Edo painting with contemporary otaku culture. By working with Louis Vuitton and Kanye West, he deliberately blurred the line between art and commerce."]}, "id": "x-15-11", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1993, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "sculpture", "tags": ["contemporary", "sculpture", "yba", "women"], "topics": ["contemporary", "sculpture", "yba", "women"], "search": {"commons": "Rachel Whiteread House 1993", "wiki": {"en": "Rachel Whiteread House 1993"}}, "answer": true, "tr": {"q": "Rachel Whiteread'in 'Ev' (1993) adlı eseri, Londra'da yıkılmak üzere olan bir Viktorya dönemi evinin içinin betonla doldurulup dış duvarlarının sökülmesiyle yapıldı.", "exp": "Doğru. Ortaya evin iç boşluğunun beton bir kalıbı çıktı; eser birkaç ay sonra, 1994'te yerel yönetim kararıyla yıkıldı.", "detail": ["Whiteread, aynı gün hem Turner Ödülü'nü hem de 'en kötü sanatçı' için verilen alaycı bir ödülü aldı. Boşluğun, yokluğun ve belleğin kalıbını alan eserleriyle tanınır; Viyana'daki Holokost Anıtı da onundur."]}, "fr": {"q": "« House » (1993) de Rachel Whiteread a été réalisée en remplissant de béton l'intérieur d'une maison victorienne de Londres destinée à la démolition, puis en enlevant ses murs extérieurs.", "exp": "Vrai. On obtenait ainsi un moulage en béton du vide intérieur de la maison ; l'œuvre a été détruite quelques mois plus tard, en 1994, par décision de la municipalité.", "detail": ["Le même jour, Whiteread a reçu le prix Turner et un prix ironique du « pire artiste ». Elle est connue pour mouler le vide, l'absence et la mémoire ; le mémorial de la Shoah à Vienne est aussi son œuvre."]}, "en": {"q": "Rachel Whiteread's 'House' (1993) was made by filling the inside of a Victorian house due for demolition in London with concrete and removing its outer walls.", "exp": "True. The result was a concrete cast of the house's inner space; the work was demolished a few months later, in 1994, by the local council.", "detail": ["On the same day, Whiteread received both the Turner Prize and a mocking 'worst artist' award. She is known for casting emptiness, absence and memory; the Holocaust Memorial in Vienna is also hers."]}, "id": "x-15-12", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1990, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "world", "medium": "concept", "tags": ["contemporary", "postwar"], "topics": ["contemporary", "postwar"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1895", "1955", "1987", "2002"], "tr": {"q": "Bu uluslararası sanat etkinliklerinin kuruluş ya da önemli tarihlerini eskiden yeniye sırala.", "items": ["Venedik Bienali'nin kuruluşu", "Kassel'de ilk Documenta", "İlk İstanbul Bienali", "Enwezor'un Documenta 11'i"], "exp": "Venedik Bienali 1895'te kuruldu, ilk Documenta 1955'te, ilk İstanbul Bienali 1987'de açıldı, Documenta 11 2002'de yapıldı.", "detail": ["İlk Documenta, Nazilerin 'yozlaşmış' saydığı modern sanatı Almanya'ya geri getirmek amacıyla Arnold Bode tarafından düzenlendi. Documenta beş yılda bir yapılır ve her seferinde farklı bir sanat yönetmeni seçilir."]}, "fr": {"q": "Classe ces dates de grandes manifestations d'art internationales de la plus ancienne à la plus récente.", "items": ["La fondation de la Biennale de Venise", "La première documenta à Cassel", "La première Biennale d'Istanbul", "La documenta 11 d'Enwezor"], "exp": "La Biennale de Venise est fondée en 1895, la première documenta a lieu en 1955, la première Biennale d'Istanbul en 1987 et la documenta 11 en 2002.", "detail": ["La première documenta est organisée par Arnold Bode pour faire revenir en Allemagne l'art moderne que les nazis disaient « dégénéré ». Elle a lieu tous les cinq ans avec un nouveau directeur artistique."]}, "en": {"q": "Put these dates of major international art events in order, oldest first.", "items": ["The founding of the Venice Biennale", "The first Documenta in Kassel", "The first Istanbul Biennial", "Enwezor's Documenta 11"], "exp": "The Venice Biennale was founded in 1895, the first Documenta took place in 1955, the first Istanbul Biennial in 1987 and Documenta 11 in 2002.", "detail": ["The first Documenta was organised by Arnold Bode to bring back to Germany the modern art the Nazis had called 'degenerate'. It takes place every five years with a new artistic director each time."]}, "id": "x-15-13", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 2015, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "europe", "medium": "concept", "tags": ["contemporary", "performance"], "topics": ["contemporary", "performance"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Eserlerimi müzelerde sergilemek yerine, yalnızca canlı insanların sözlü olarak yeniden canlandırdığı 'yapılmış durumlar' üretirim.", "Eserlerimin fotoğrafının çekilmesine, yazılı sözleşme ya da katalog yapılmasına izin vermem.", "2012'de Tate Modern'in Türbin Salonu'nda yüzlerce 'yorumcu'nun ziyaretçilerle konuştuğu 'These Associations'ı yaptım."], "opts": ["Tino Sehgal", "Pierre Huyghe", "Anne Imhof", "Ragnar Kjartansson"], "exp": "Cevap Tino Sehgal'dir. Maddi bir nesne bırakmayan, yalnızca insan etkileşiminden oluşan eserler yapar.", "detail": ["Sehgal'in eserleri müzelere sözlü bir anlaşmayla, tanıklar önünde satılır. 2013'te Venedik Bienali'nde Altın Aslan aldı. Bu yaklaşım, sanat eserinin ne olduğu ve nasıl sahiplenildiği sorusunu yeniden düşündürür."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Au lieu d'exposer des objets, je crée des « situations construites » que seules des personnes vivantes rejouent oralement.", "Je refuse les photos de mes œuvres, les contrats écrits et les catalogues.", "En 2012, j'ai créé « These Associations » dans le Turbine Hall de la Tate Modern, où des centaines d'« interprètes » parlaient aux visiteurs."], "opts": ["Tino Sehgal", "Pierre Huyghe", "Anne Imhof", "Ragnar Kjartansson"], "exp": "La réponse est Tino Sehgal. Ses œuvres ne laissent aucun objet matériel et ne sont faites que d'interactions humaines.", "detail": ["Ses œuvres sont vendues aux musées par accord oral, devant des témoins. Il a reçu le Lion d'or à la Biennale de Venise en 2013. Cette approche fait repenser ce qu'est une œuvre d'art et comment on la possède."]}, "en": {"q": "Who am I?", "clues": ["Instead of showing objects, I create 'constructed situations' that on
