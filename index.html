tail": ["Courbet and Millet painted French peasants, Daumier the urban poor and the middle class, Repin Russian workers. Daumier was also a sharp caricaturist."]}, "id": "x-02-14", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1852, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "painting", "tags": ["prerafaelite", "c19", "painting"], "topics": ["prerafaelite", "c19", "painting"], "search": {"commons": "John Everett Millais Ophelia", "wiki": {"en": "Ophelia (painting)"}}, "answer": 1, "tr": {"q": "Bu eser hangisi?", "opts": ["Waterhouse – Shalott Leydisi", "Millais – Ophelia", "Rossetti – Beata Beatrix", "Hunt – Dünyanın Işığı"], "exp": "John Everett Millais'nin Ophelia'sı (1851–52), Hamlet'teki Ophelia'nın derede boğulmadan önceki anını gösterir.", "detail": ["Millais, bitkileri gerçek bir derenin kenarında aylarca, yaprak yaprak resmetti. Model Elizabeth Siddal'dı; poz verirken su dolu bir küvette saatlerce yattı. Tablo Tate Britain'dadır."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Waterhouse – La Dame de Shalott", "Millais – Ophélie", "Rossetti – Beata Beatrix", "Hunt – La Lumière du monde"], "exp": "L'Ophélie de John Everett Millais (1851–1852) montre Ophélie, personnage de Hamlet, juste avant sa noyade dans un ruisseau.", "detail": ["Millais a peint les plantes au bord d'une vraie rivière, feuille par feuille, pendant des mois. Le modèle, Elizabeth Siddal, a posé des heures dans une baignoire pleine d'eau. Le tableau est à la Tate Britain."]}, "en": {"q": "Which work is this?", "opts": ["Waterhouse – The Lady of Shalott", "Millais – Ophelia", "Rossetti – Beata Beatrix", "Hunt – The Light of the World"], "exp": "John Everett Millais's Ophelia (1851–52) shows Ophelia from Hamlet just before she drowns in a stream.", "detail": ["Millais painted the plants beside a real river, leaf by leaf, for months. The model, Elizabeth Siddal, lay for hours in a bathtub full of water. The painting is in Tate Britain."]}, "id": "x-03-0", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1848, "era": {"tr": "1840'ler", "fr": "Années 1840", "en": "1840s"}, "region": "europe", "medium": "painting", "tags": ["prerafaelite", "c19", "painting"], "topics": ["prerafaelite", "c19", "painting"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "'Prerafaelit Kardeşliği' adı neyi ifade eder?", "opts": ["Raffaello'yu en büyük usta kabul eden bir okulu", "Raffaello'nun öğrencilerinden oluşan bir grubu", "Raffaello'dan önceki sanatın sadeliğine dönmek isteyen bir grubu", "Raffaello'nun eserlerini kopyalayan bir atölyeyi"], "exp": "1848'de Londra'da kurulan grup, Akademi'nin Raffaello sonrası kalıplarını reddetti ve erken Rönesans ile ortaçağ sanatının dürüstlüğüne dönmek istedi.", "detail": ["Kurucular Dante Gabriel Rossetti, William Holman Hunt ve John Everett Millais'ydi. Parlak renkler, doğaya sadakat ve edebî ya da dinî konular tercih ettiler. Eleştirmen John Ruskin onları savundu."]}, "fr": {"q": "Que signifie le nom de « confrérie préraphaélite » ?", "opts": ["Une école qui voit Raphaël comme le plus grand maître", "Un groupe formé par les élèves de Raphaël", "Un groupe qui veut revenir à la simplicité de l'art d'avant Raphaël", "Un atelier qui copie les œuvres de Raphaël"], "exp": "Fondé à Londres en 1848, le groupe refuse les modèles académiques venus après Raphaël et veut revenir à la sincérité de l'art médiéval et du début de la Renaissance.", "detail": ["Les fondateurs sont Dante Gabriel Rossetti, William Holman Hunt et John Everett Millais. Ils aiment les couleurs vives, la fidélité à la nature et les sujets littéraires ou religieux. Le critique John Ruskin les a défendus."]}, "en": {"q": "What does the name 'Pre-Raphaelite Brotherhood' mean?", "opts": ["A school that saw Raphael as the greatest master", "A group made up of Raphael's pupils", "A group that wanted to return to the simplicity of art before Raphael", "A workshop that copied Raphael's works"], "exp": "Founded in London in 1848, the group rejected the academic models that came after Raphael and wanted to return to the honesty of medieval and early Renaissance art.", "detail": ["The founders were Dante Gabriel Rossetti, William Holman Hunt and John Everett Millais. They liked bright colours, truth to nature and literary or religious subjects. The critic John Ruskin defended them."]}, "id": "x-03-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1888, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "painting", "tags": ["prerafaelite", "c19", "painting"], "topics": ["prerafaelite", "c19", "painting"], "search": {"commons": "Waterhouse The Lady of Shalott 1888", "wiki": {"en": "Waterhouse The Lady of Shalott 1888"}}, "answer": false, "tr": {"q": "John William Waterhouse, 1848'de Prerafaelit Kardeşliği'ni kuran üç sanatçıdan biridir.", "exp": "Yanlış. Waterhouse 1849'da doğdu; Kardeşlik kurulduğunda bebekti. Daha sonra Prerafaelit konuları ve üslubunu benimsedi.", "detail": ["Waterhouse'un 'Shalott Leydisi' (1888), Tennyson'ın şiirinden esinlenir ve Tate Britain'ın en sevilen tablolarındandır. Kardeşliğin kurucuları Rossetti, Hunt ve Millais'ydi."]}, "fr": {"q": "John William Waterhouse fait partie des trois fondateurs de la confrérie préraphaélite en 1848.", "exp": "Faux. Waterhouse est né en 1849 : il n'était pas encore né quand la confrérie a été fondée. Il a adopté plus tard ses sujets et son style.", "detail": ["« La Dame de Shalott » de Waterhouse (1888), inspirée d'un poème de Tennyson, est l'un des tableaux les plus aimés de la Tate Britain. Les fondateurs étaient Rossetti, Hunt et Millais."]}, "en": {"q": "John William Waterhouse was one of the three founders of the Pre-Raphaelite Brotherhood in 1848.", "exp": "False. Waterhouse was born in 1849, after the Brotherhood was founded. He later took up Pre-Raphaelite subjects and style.", "detail": ["Waterhouse's 'The Lady of Shalott' (1888), inspired by a poem by Tennyson, is one of Tate Britain's best-loved paintings. The founders were Rossetti, Hunt and Millais."]}, "id": "x-03-2", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1864, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "painting", "tags": ["prerafaelite", "c19", "painting"], "topics": ["prerafaelite", "c19", "painting"], "search": {"commons": "Rossetti Beata Beatrix", "wiki": {"en": "Rossetti Beata Beatrix"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Hem ressam hem şairdim; babam İtalyan bir sürgündü.", "Ölen eşim Elizabeth Siddal'ı 'Beata Beatrix'te Dante'nin Beatrice'i olarak resmettim.", "Şiirlerimi eşimin tabutuna gömdüm, yıllar sonra mezarı açtırıp geri aldım."], "opts": ["Dante Gabriel Rossetti", "William Morris", "Edward Burne-Jones", "Ford Madox Brown"], "exp": "Cevap Dante Gabriel Rossetti'dir. Prerafaelit Kardeşliği'nin kurucularındandı.", "detail": ["Rossetti'nin sonraki eserlerinde uzun saçlı, dolgun dudaklı kadın figürleri hâkimdir. Beata Beatrix (yaklaşık 1864–70) Tate Britain'dadır."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'étais peintre et poète ; mon père était un exilé italien.", "J'ai peint ma femme morte, Elizabeth Siddal, en Béatrice de Dante dans « Beata Beatrix ».", "J'ai enterré mes poèmes dans son cercueil, puis j'ai fait ouvrir la tombe des années plus tard pour les reprendre."], "opts": ["Dante Gabriel Rossetti", "William Morris", "Edward Burne-Jones", "Ford Madox Brown"], "exp": "La réponse est Dante Gabriel Rossetti, l'un des fondateurs de la confrérie préraphaélite.", "detail": ["Ses œuvres tardives montrent souvent des femmes aux longs cheveux et aux lèvres pleines. Beata Beatrix (vers 1864–1870) est à la Tate Britain."]}, "en": {"q": "Who am I?", "clues": ["I was both a painter and a poet; my father was an Italian exile.", "I painted my dead wife, Elizabeth Siddal, as Dante's Beatrice in 'Beata Beatrix'.", "I buried my poems in her coffin, then had the grave opened years later to get them back."], "opts": ["Dante Gabriel Rossetti", "William Morris", "Edward Burne-Jones", "Ford Madox Brown"], "exp": "The answer is Dante Gabriel Rossetti, one of the founders of the Pre-Raphaelite Brotherhood.", "detail": ["His later works are dominated by women with long hair and full lips. Beata Beatrix (around 1864–70) is in Tate Britain."]}, "id": "x-03-3", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1906, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "anatolia", "medium": "painting", "tags": ["orientalism", "c19", "painting", "r-anatolia"], "topics": ["orientalism", "c19", "painting", "r-anatolia"], "search": {"commons": "Osman Hamdi Bey The Tortoise Trainer", "wiki": {"en": "The Tortoise Trainer"}}, "answer": 2, "tr": {"q": "Bu eser hangisi?", "opts": ["Gérôme – Yılan Oynatıcısı", "Fausto Zonaro – Galata Köprüsü", "Osman Hamdi Bey – Kaplumbağa Terbiyecisi", "Delacroix – Cezayirli Kadınlar"], "exp": "Osman Hamdi Bey'in Kaplumbağa Terbiyecisi'nin ilk versiyonu 1906 tarihlidir; kaplumbağaları eğitmeye çalışan yaşlı bir derviş görülür.", "detail": ["Tablo sık sık reformların yavaşlığına yapılan ironik bir gönderme olarak yorumlanır. 2004'te Pera Müzesi tarafından satın alındı ve bugün İstanbul'da sergilenir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Gérôme – Le Charmeur de serpents", "Fausto Zonaro – Le Pont de Galata", "Osman Hamdi Bey – Le Dresseur de tortues", "Delacroix – Femmes d'Alger"], "exp": "La première version du Dresseur de tortues d'Osman Hamdi Bey date de 1906 : un vieux derviche essaie de dresser des tortues.", "detail": ["On lit souvent le tableau comme une allusion ironique à la lenteur des réformes. Le musée Pera l'a acheté en 2004 ; il est exposé à Istanbul."]}, "en": {"q": "Which work is this?", "opts": ["Gérôme – The Snake Charmer", "Fausto Zonaro – The Galata Bridge", "Osman Hamdi Bey – The Tortoise Trainer", "Delacroix – Women of Algiers"], "exp": "The first version of Osman Hamdi Bey's Tortoise Trainer dates from 1906; an old dervish tries to train tortoises.", "detail": ["The painting is often read as an ironic comment on the slowness of reform. The Pera Museum bought it in 2004 and shows it in Istanbul."]}, "id": "x-03-4", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1978, "era": {"tr": "1970'ler", "fr": "Années 1970", "en": "1970s"}, "region": "world", "medium": "concept", "tags": ["orientalism", "contemporary", "c19"], "topics": ["orientalism", "contemporary", "c19"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1978'de yayımlanan ve 'Oryantalizm' kavramını Batı'nın Doğu'yu temsil etme biçimi olarak eleştiren kitabın yazarı kimdir?", "opts": ["Frantz Fanon", "Edward Said", "Homi Bhabha", "Linda Nochlin"], "exp": "Edward Said'in 'Oryantalizm' (1978) kitabı, Batı'nın Doğu'yu egzotik ve geri olarak kurgulamasını eleştirir.", "detail": ["Said'in fikirleri sanat tarihine de taşındı: Linda Nochlin 1983'te 'Hayali Doğu' makalesinde Gérôme gibi ressamları bu açıdan inceledi. Bugün Oryantalist resimler hem estetik hem siyasi açıdan tartışılır."]}, "fr": {"q": "Qui a écrit le livre de 1978 qui critique l'« orientalisme » comme une façon occidentale de représenter l'Orient ?", "opts": ["Frantz Fanon", "Edward Said", "Homi Bhabha", "Linda Nochlin"], "exp": "Dans « L'Orientalisme » (1978), Edward Said critique la manière dont l'Occident imagine l'Orient comme exotique et arriéré.", "detail": ["Ses idées passent ensuite à l'histoire de l'art : en 1983, Linda Nochlin étudie des peintres comme Gérôme dans « L'Orient imaginaire ». Aujourd'hui, la peinture orientaliste est discutée sur le plan esthétique et politique."]}, "en": {"q": "Who wrote the 1978 book that criticised 'Orientalism' as a Western way of representing the East?", "opts": ["Frantz Fanon", "Edward Said", "Homi Bhabha", "Linda Nochlin"], "exp": "In 'Orientalism' (1978), Edward Said criticised the way the West imagined the East as exotic and backward.", "detail": ["His ideas moved into art history: in 1983 Linda Nochlin studied painters such as Gérôme in 'The Imaginary Orient'. Today Orientalist painting is debated on both aesthetic and political grounds."]}, "id": "x-03-5", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1834, "era": {"tr": "1830'ler", "fr": "Années 1830", "en": "1830s"}, "region": "europe", "medium": "painting", "tags": ["orientalism", "romanticism", "c19", "painting"], "topics": ["orientalism", "romanticism", "c19", "painting"], "search": {"commons": "Delacroix Women of Algiers in their Apartment", "wiki": {"en": "Delacroix Women of Algiers in their Apartment"}}, "answer": true, "tr": {"q": "Delacroix, 1832'de Fas ve Cezayir'e yaptığı yolculuktan sonra 'Cezayirli Kadınlar'ı (1834) yaptı.", "exp": "Doğru. Delacroix 1832'de diplomatik bir heyetle Kuzey Afrika'ya gitti ve orada yüzlerce eskiz yaptı.", "detail": ["Bu yolculuk Delacroix'nın renk anlayışını değiştirdi. 'Cezayirli Kadınlar' daha sonra Picasso'yu da etkiledi: Picasso 1954–55'te bu tablonun on beş çeşitlemesini yaptı."]}, "fr": {"q": "Delacroix a peint « Femmes d'Alger dans leur appartement » (1834) après un voyage au Maroc et en Algérie en 1832.", "exp": "Vrai. En 1832, Delacroix accompagne une mission diplomatique en Afrique du Nord et y fait des centaines de croquis.", "detail": ["Ce voyage a changé sa façon de voir la couleur. Le tableau a ensuite inspiré Picasso, qui en a peint quinze variations en 1954–1955."]}, "en": {"q": "Delacroix painted 'Women of Algiers in their Apartment' (1834) after a journey to Morocco and Algeria in 1832.", "exp": "True. In 1832 Delacroix went to North Africa with a diplomatic mission and made hundreds of sketches there.", "detail": ["The journey changed his sense of colour. The painting later inspired Picasso, who made fifteen variations of it in 1954–55."]}, "id": "x-03-6", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1879, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "europe", "medium": "painting", "tags": ["orientalism", "c19", "painting"], "topics": ["orientalism", "c19", "painting"], "search": {"commons": "Jean-Léon Gérôme The Snake Charmer", "wiki": {"en": "The Snake Charmer (painting)"}}, "answer": 3, "tr": {"q": "Edward Said'in 'Oryantalizm' kitabının bazı baskılarının kapağında kullanılan 'Yılan Oynatıcısı' tablosu kime aittir?", "opts": ["Eugène Fromentin", "John Frederick Lewis", "Ludwig Deutsch", "Jean-Léon Gérôme"], "exp": "Yılan Oynatıcısı (yaklaşık 1879) Jean-Léon Gérôme'un eseridir ve Massachusetts'teki Clark Art Institute'tadır.", "detail": ["Gérôme, fotoğraf gibi ayrıntılı bir üslupla 'gerçekçi' görünen ama aslında kurgu olan sahneler yaptı. Linda Nochlin bu tabloyu, Batılı izleyicinin bakışını gizleyen bir 'şeffaflık' örneği olarak inceledi."]}, "fr": {"q": "Qui a peint « Le Charmeur de serpents », utilisé sur la couverture de certaines éditions de « L'Orientalisme » d'Edward Said ?", "opts": ["Eugène Fromentin", "John Frederick Lewis", "Ludwig Deutsch", "Jean-Léon Gérôme"], "exp": "Le Charmeur de serpents (vers 1879) est de Jean-Léon Gérôme ; il se trouve au Clark Art Institute, dans le Massachusetts.", "detail": ["Gérôme peint avec une précision presque photographique des scènes qui semblent « vraies » mais sont imaginées. Linda Nochlin l'a étudié comme un exemple de regard occidental caché."]}, "en": {"q": "Who painted 'The Snake Charmer', used on the cover of some editions of Edward Said's 'Orientalism'?", "opts": ["Eugène Fromentin", "John Frederick Lewis", "Ludwig Deutsch", "Jean-Léon Gérôme"], "exp": "The Snake Charmer (around 1879) is by Jean-Léon Gérôme and is in the Clark Art Institute in Massachusetts.", "detail": ["Gérôme painted, with almost photographic detail, scenes that look 'real' but are invented. Linda Nochlin studied it as an example of a hidden Western gaze."]}, "id": "x-03-7", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1881, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "anatolia", "medium": "concept", "tags": ["orientalism", "c19", "r-anatolia", "painting"], "topics": ["orientalism", "c19", "r-anatolia", "painting"], "search": {"commons": "Osman Hamdi Bey", "wiki": {"en": "Osman Hamdi Bey"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Paris'te hukuk okumaya gittim ama resim eğitimi aldım ve Gérôme'un atölyesine yakın oldum.", "1881'de İmparatorluk Müzesi'nin müdürü oldum ve Sayda'daki kral lahitlerini kazdım.", "1882'de Sanayi-i Nefise Mektebi'ni kurdum."], "opts": ["Şeker Ahmed Paşa", "Osman Hamdi Bey", "Hoca Ali Rıza", "Halil Paşa"], "exp": "Cevap Osman Hamdi Bey'dir: ressam, arkeolog ve müzeci. İstanbul Arkeoloji Müzeleri ile bugünkü Mimar Sinan Güzel Sanatlar Üniversitesi'nin kurucusu sayılır.", "detail": ["Resimlerinde Osmanlı yaşamını Batılı Oryantalistlerden farklı, içeriden bir bakışla gösterdi. İskender Lahdi de onun Sayda kazılarında bulundu."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis allé à Paris pour étudier le droit, mais j'ai étudié la peinture, près de l'atelier de Gérôme.", "En 1881, je suis devenu directeur du Musée impérial et j'ai fouillé les sarcophages royaux de Sidon.", "En 1882, j'ai fondé l'École des beaux-arts d'Istanbul."], "opts": ["Şeker Ahmed Paşa", "Osman Hamdi Bey", "Hoca Ali Rıza", "Halil Paşa"], "exp": "La réponse est Osman Hamdi Bey : peintre, archéologue et directeur de musée. Il a fondé les Musées archéologiques d'Istanbul et l'école qui est aujourd'hui l'université Mimar Sinan.", "detail": ["Dans ses tableaux, il montre la vie ottomane de l'intérieur, autrement que les orientalistes occidentaux. Le sarcophage d'Alexandre a été trouvé lors de ses fouilles à Sidon."]}, "en": {"q": "Who am I?", "clues": ["I went to Paris to study law but studied painting instead, close to Gérôme's studio.", "In 1881 I became director of the Imperial Museum and excavated the royal sarcophagi of Sidon.", "In 1882 I founded the Istanbul School of Fine Arts."], "opts": ["Şeker Ahmed Paşa", "Osman Hamdi Bey", "Hoca Ali Rıza", "Halil Paşa"], "exp": "The answer is Osman Hamdi Bey: painter, archaeologist and museum director. He founded the Istanbul Archaeology Museums and the school that is today Mimar Sinan University.", "detail": ["His paintings show Ottoman life from the inside, differently from Western Orientalists. The Alexander Sarcophagus was found during his excavations at Sidon."]}, "id": "x-03-8", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1893, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "painting", "tags": ["symbolism", "expressionism", "c19", "painting"], "topics": ["symbolism", "expressionism", "c19", "painting"], "search": {"commons": "Edvard Munch The Scream 1893", "wiki": {"en": "The Scream"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Munch – Çığlık", "Ensor – İsa'nın Brüksel'e Girişi", "Böcklin – Ölüler Adası", "Klimt – Öpücük"], "exp": "Edvard Munch'un Çığlık'ı (1893), modern insanın kaygısının simgesi olmuştur. Sembolizm ile Ekspresyonizm arasında bir köprüdür.", "detail": ["Munch, Oslo'da gün batımında 'doğanın içinden geçen sonsuz bir çığlık' hissettiğini yazdı. Birkaç versiyonu vardır; boyalı versiyonlar Oslo'daki Ulusal Müze'de ve Munch Müzesi'ndedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Munch – Le Cri", "Ensor – L'Entrée du Christ à Bruxelles", "Böcklin – L'Île des morts", "Klimt – Le Baiser"], "exp": "Le Cri d'Edvard Munch (1893) est devenu le symbole de l'angoisse moderne. C'est un pont entre le symbolisme et l'expressionnisme.", "detail": ["Munch écrit qu'au coucher du soleil, à Oslo, il a senti « un cri infini traverser la nature ». Il existe plusieurs versions ; les versions peintes sont au Musée national d'Oslo et au musée Munch."]}, "en": {"q": "Which work is this?", "opts": ["Munch – The Scream", "Ensor – Christ's Entry into Brussels", "Böcklin – Isle of the Dead", "Klimt – The Kiss"], "exp": "Edvard Munch's The Scream (1893) has become the symbol of modern anxiety. It is a bridge between Symbolism and Expressionism.", "detail": ["Munch wrote that at sunset in Oslo he felt 'an infinite scream passing through nature'. There are several versions; the painted ones are in the National Museum and the Munch Museum in Oslo."]}, "id": "x-03-9", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1886, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "concept", "tags": ["symbolism", "c19"], "topics": ["symbolism", "c19"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "1886'da Le Figaro'da 'Sembolizm Manifestosu'nu yayımlayan şair kimdir?", "opts": ["Stéphane Mallarmé", "Charles Baudelaire", "Paul Verlaine", "Jean Moréas"], "exp": "Yunan asıllı şair Jean Moréas, 18 Eylül 1886'da Le Figaro'da manifestoyu yayımladı ve akıma adını verdi.", "detail": ["Sembolistler gerçekliği doğrudan anlatmak yerine rüya, mit ve duyguları imgeler aracılığıyla çağrıştırmak istediler. Resimde Gustave Moreau, Odilon Redon ve Puvis de Chavannes bu ruhu temsil etti."]}, "fr": {"q": "Quel poète a publié le « Manifeste du symbolisme » dans Le Figaro en 1886 ?", "opts": ["Stéphane Mallarmé", "Charles Baudelaire", "Paul Verlaine", "Jean Moréas"], "exp": "Le poète d'origine grecque Jean Moréas publie le manifeste dans Le Figaro le 18 septembre 1886 et donne son nom au mouvement.", "detail": ["Les symbolistes veulent suggérer le rêve, le mythe et les émotions par des images, au lieu de décrire la réalité. En peinture, Gustave Moreau, Odilon Redon et Puvis de Chavannes représentent cet esprit."]}, "en": {"q": "Which poet published the 'Symbolist Manifesto' in Le Figaro in 1886?", "opts": ["Stéphane Mallarmé", "Charles Baudelaire", "Paul Verlaine", "Jean Moréas"], "exp": "The Greek-born poet Jean Moréas published the manifesto in Le Figaro on 18 September 1886 and gave the movement its name.", "detail": ["Symbolists wanted to suggest dreams, myths and feelings through images rather than describe reality. In painting, Gustave Moreau, Odilon Redon and Puvis de Chavannes represent this spirit."]}, "id": "x-03-10", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1880, "era": {"tr": "1880'ler", "fr": "Années 1880", "en": "1880s"}, "region": "europe", "medium": "painting", "tags": ["symbolism", "c19", "painting"], "topics": ["symbolism", "c19", "painting"], "search": {"commons": "Arnold Böcklin Isle of the Dead", "wiki": {"en": "Arnold Böcklin Isle of the Dead"}}, "answer": true, "tr": {"q": "Arnold Böcklin'in 'Ölüler Adası' tablosunun beş farklı versiyonu vardır.", "exp": "Doğru. Böcklin 1880 ile 1886 arasında beş versiyon yaptı; biri İkinci Dünya Savaşı'nda yok oldu.", "detail": ["Kayıkla karanlık bir adaya götürülen beyaz örtülü figür, ölüm ve sessizliği çağrıştırır. Tablo 20. yüzyılın başında Almanya'da çok popülerdi; Rahmaninov ona bir senfonik şiir besteledi."]}, "fr": {"q": "Il existe cinq versions de « L'Île des morts » d'Arnold Böcklin.", "exp": "Vrai. Böcklin en a peint cinq entre 1880 et 1886 ; l'une a été détruite pendant la Seconde Guerre mondiale.", "detail": ["Une figure en blanc est conduite en barque vers une île sombre : l'image évoque la mort et le silence. Le tableau était très populaire en Allemagne au début du XXe siècle ; Rachmaninov lui a consacré un poème symphonique."]}, "en": {"q": "There are five versions of Arnold Böcklin's 'Isle of the Dead'.", "exp": "True. Böcklin painted five between 1880 and 1886; one was destroyed in the Second World War.", "detail": ["A white-wrapped figure is rowed towards a dark island, an image of death and silence. The painting was very popular in Germany in the early 20th century; Rachmaninoff wrote a symphonic poem about it."]}, "id": "x-03-11", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1876, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "europe", "medium": "painting", "tags": ["symbolism", "c19", "painting"], "topics": ["symbolism", "c19", "painting"], "search": {"commons": "Gustave Moreau The Apparition", "wiki": {"en": "Gustave Moreau The Apparition"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Salome'yi, havada beliren Vaftizci Yahya'nın başıyla 'Görünüm'de resmettim.", "Mücevher gibi işlenmiş, mitolojik ve dinî sahnelerle tanındım.", "École des Beaux-Arts'ta Matisse ve Rouault'nun hocasıydım; evim bugün Paris'te müzedir."], "opts": ["Odilon Redon", "Pierre Puvis de Chavannes", "Gustave Moreau", "Fernand Khnopff"], "exp": "Cevap Gustave Moreau'dur. Fransız Sembolizminin en önemli ressamlarındandır.", "detail": ["Moreau ölümünden önce evini ve binlerce eserini devlete bıraktı; Musée Gustave Moreau 1903'ten beri açıktır. Öğrencilerine kendi üslubunu dayatmadı; bu yüzden Fovizmin doğuşunda dolaylı bir rolü oldu."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai peint Salomé devant la tête de saint Jean-Baptiste qui apparaît dans l'air, dans « L'Apparition ».", "Je suis connu pour mes scènes mythologiques et religieuses travaillées comme des bijoux.", "J'ai été le professeur de Matisse et de Rouault aux Beaux-Arts ; ma maison est aujourd'hui un musée à Paris."], "opts": ["Odilon Redon", "Pierre Puvis de Chavannes", "Gustave Moreau", "Fernand Khnopff"], "exp": "La réponse est Gustave Moreau, l'un des grands peintres du symbolisme français.", "detail": ["Avant sa mort, il a légué à l'État sa maison et des milliers d'œuvres ; le musée Gustave Moreau est ouvert depuis 1903. Il n'imposait pas son style à ses élèves, ce qui a aidé la naissance du fauvisme."]}, "en": {"q": "Who am I?", "clues": ["I painted Salome before the head of John the Baptist appearing in the air, in 'The Apparition'.", "I am known for mythological and religious scenes worked like jewels.", "I taught Matisse and Rouault at the École des Beaux-Arts; my house is now a museum in Paris."], "opts": ["Odilon Redon", "Pierre Puvis de Chavannes", "Gustave Moreau", "Fernand Khnopff"], "exp": "The answer is Gustave Moreau, one of the leading painters of French Symbolism.", "detail": ["Before his death he left his house and thousands of works to the state; the Musée Gustave Moreau has been open since 1903. He did not force his style on his pupils, which helped the birth of Fauvism."]}, "id": "x-03-12", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1890, "era": {"tr": "1890'ler", "fr": "Années 1890", "en": "1890s"}, "region": "europe", "medium": "print", "tags": ["symbolism", "c19", "painting"], "topics": ["symbolism", "c19", "painting"], "search": {"commons": "Odilon Redon noirs charcoal", "wiki": {"en": "Odilon Redon noirs charcoal"}}, "answer": 0, "tr": {"q": "Odilon Redon'un kariyerinin ilk döneminde karakalem ve taşbaskıyla yaptığı karanlık, rüya gibi eserlere ne ad verilir?", "opts": ["Noirs (Siyahlar)", "Nabiler", "Grisailles", "Sfumato"], "exp": "Redon, uzun yıllar yalnızca siyah tonlarda çalıştı ve bu eserlere 'noirs' adını verdi. Uçan gözler ve tuhaf yaratıklar bu dönemin imgeleridir.", "detail": ["1890'lardan sonra Redon birden pastel ve yağlıboya ile parlak renklere geçti; çiçek buketleri ve mitolojik sahneler yaptı. Sürrealistler onu bir öncü olarak gördü."]}, "fr": {"q": "Comment appelle-t-on les œuvres sombres et rêveuses qu'Odilon Redon a faites au fusain et en lithographie au début de sa carrière ?", "opts": ["Les Noirs", "Les Nabis", "Les grisailles", "Le sfumato"], "exp": "Redon a travaillé pendant des années seulement en noir et il appelait ces œuvres ses « Noirs ». Des yeux volants et des créatures étranges y apparaissent.", "detail": ["Après les années 1890, Redon passe soudain aux couleurs vives du pastel et de l'huile, avec des bouquets de fleurs et des scènes mythologiques. Les surréalistes le voient comme un précurseur."]}, "en": {"q": "What are the dark, dreamlike charcoal drawings and lithographs of Odilon Redon's early career called?", "opts": ["The Noirs (Blacks)", "The Nabis", "Grisailles", "Sfumato"], "exp": "For years Redon worked only in black and called these works his 'noirs'. Floating eyes and strange creatures appear in them.", "detail": ["After the 1890s Redon suddenly moved to the bright colours of pastel and oil, with flower bouquets and mythological scenes. The Surrealists saw him as a forerunner."]}, "id": "x-03-13", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1861, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "design", "tags": ["artsandcrafts", "c19", "design"], "topics": ["artsandcrafts", "c19", "design"], "search": {"commons": "William Morris Strawberry Thief", "wiki": {"en": "William Morris"}}, "answer": 1, "tr": {"q": "Arts and Crafts hareketinin öncüsü olan, duvar kâğıtları ve kumaş desenleriyle ünlü İngiliz tasarımcı kimdir?", "opts": ["Charles Rennie Mackintosh", "William Morris", "Christopher Dresser", "Augustus Pugin"], "exp": "William Morris, 1861'de kendi firmasını kurdu ve el emeğini, doğadan alınan desenleri ve kaliteli malzemeyi savundu.", "detail": ["Morris, sanayi üretiminin çirkin ve ruhsuz ürünlerine karşı çıktı. 'Çilek Hırsızı' gibi desenleri bugün hâlâ üretilir. Londra'daki William Morris Gallery onun hayatını anlatır."]}, "fr": {"q": "Quel designer anglais, pionnier du mouvement Arts and Crafts, est célèbre pour ses papiers peints et ses motifs textiles ?", "opts": ["Charles Rennie Mackintosh", "William Morris", "Christopher Dresser", "Augustus Pugin"], "exp": "William Morris fonde sa propre entreprise en 1861. Il défend le travail à la main, les motifs inspirés de la nature et les matériaux de qualité.", "detail": ["Morris s'oppose aux produits laids et sans âme de l'industrie. Ses motifs, comme « Strawberry Thief », sont encore produits aujourd'hui. La William Morris Gallery à Londres raconte sa vie."]}, "en": {"q": "Which English designer, a pioneer of the Arts and Crafts movement, is famous for his wallpapers and textile patterns?", "opts": ["Charles Rennie Mackintosh", "William Morris", "Christopher Dresser", "Augustus Pugin"], "exp": "William Morris founded his own firm in 1861. He defended handwork, patterns taken from nature and good materials.", "detail": ["Morris opposed the ugly, soulless products of industry. His patterns, such as 'Strawberry Thief', are still made today. The William Morris Gallery in London tells his story."]}, "id": "x-03-14", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1860, "era": {"tr": "1860'ler", "fr": "Années 1860", "en": "1860s"}, "region": "europe", "medium": "arch", "tags": ["artsandcrafts", "c19", "architecture", "design"], "topics": ["artsandcrafts", "c19", "architecture", "design"], "search": {"commons": "Red House Bexleyheath", "wiki": {"en": "Red House Bexleyheath"}}, "answer": true, "tr": {"q": "William Morris'in evi 'Red House', mimar Philip Webb tarafından tasarlandı.", "exp": "Doğru. Red House (1859–60), Londra yakınındaki Bexleyheath'te, Philip Webb tarafından Morris için tasarlandı.", "detail": ["Kırmızı tuğlası ve sade, ortaçağ esintili biçimiyle Arts and Crafts mimarisinin manifestosu sayılır. Morris ve arkadaşları iç mekânı kendileri süsledi; bu deneyim firmanın kuruluşuna yol açtı."]}, "fr": {"q": "La maison de William Morris, la « Red House », a été conçue par l'architecte Philip Webb.", "exp": "Vrai. La Red House (1859–1860), à Bexleyheath près de Londres, a été conçue par Philip Webb pour Morris.", "detail": ["Avec sa brique rouge et ses formes simples d'inspiration médiévale, elle est considérée comme le manifeste de l'architecture Arts and Crafts. Morris et ses amis ont décoré l'intérieur eux-mêmes, ce qui a mené à la création de son entreprise."]}, "en": {"q": "William Morris's home, the 'Red House', was designed by the architect Philip Webb.", "exp": "True. The Red House (1859–60) in Bexleyheath near London was designed by Philip Webb for Morris.", "detail": ["With its red brick and simple medieval-style forms, it is seen as the manifesto of Arts and Crafts architecture. Morris and his friends decorated the interior themselves, which led to the founding of his firm."]}, "id": "x-03-15", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1853, "era": {"tr": "1850'ler", "fr": "Années 1850", "en": "1850s"}, "region": "europe", "medium": "concept", "tags": ["artsandcrafts", "c19", "design"], "topics": ["artsandcrafts", "c19", "design"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "Arts and Crafts hareketini fikirleriyle besleyen, 'Venedik'in Taşları' kitabında Gotik zanaatkârın özgürlüğünü öven eleştirmen kimdir?", "opts": ["Walter Pater", "Oscar Wilde", "John Ruskin", "Thomas Carlyle"], "exp": "John Ruskin, 'Venedik'in Taşları' (1851–53) kitabının 'Gotiğin Doğası' bölümünde ortaçağ zanaatkârının yaratıcı özgürlüğünü, fabrika işçisinin mekanik emeğiyle karşılaştırdı.", "detail": ["Morris bu bölümü kendi Kelmscott Press'inde ayrıca basacak kadar önemsedi. Ruskin, sanatı ahlak ve toplumla bağlantılı gördü ve Prerafaelitleri de savundu."]}, "fr": {"q": "Quel critique, qui a nourri le mouvement Arts and Crafts, a célébré la liberté de l'artisan gothique dans « Les Pierres de Venise » ?", "opts": ["Walter Pater", "Oscar Wilde", "John Ruskin", "Thomas Carlyle"], "exp": "Dans le chapitre « La nature du gothique » des Pierres de Venise (1851–1853), John Ruskin compare la liberté créatrice de l'artisan médiéval au travail mécanique de l'ouvrier d'usine.", "detail": ["Morris a réimprimé ce chapitre à part dans sa Kelmscott Press. Ruskin voit l'art comme lié à la morale et à la société ; il a aussi défendu les préraphaélites."]}, "en": {"q": "Which critic, whose ideas fed the Arts and Crafts movement, praised the freedom of the Gothic craftsman in 'The Stones of Venice'?", "opts": ["Walter Pater", "Oscar Wilde", "John Ruskin", "Thomas Carlyle"], "exp": "In the chapter 'The Nature of Gothic' in The Stones of Venice (1851–53), John Ruskin compared the creative freedom of the medieval craftsman with the mechanical work of the factory worker.", "detail": ["Morris valued this chapter so much that he printed it separately at his Kelmscott Press. Ruskin saw art as linked to morality and society, and he also defended the Pre-Raphaelites."]}, "id": "x-03-16", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1909, "era": {"tr": "1900'ler", "fr": "Années 1900", "en": "1900s"}, "region": "europe", "medium": "arch", "tags": ["artsandcrafts", "artnouveau", "architecture", "design"], "topics": ["artsandcrafts", "artnouveau", "architecture", "design"], "search": {"commons": "Glasgow School of Art Mackintosh building", "wiki": {"en": "Glasgow School of Art Mackintosh building"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Glasgow'da doğdum ve orada çalıştım.", "Eşim Margaret Macdonald ile birlikte 'Glasgow Dörtlüsü'nün üyesiydim.", "Glasgow Sanat Okulu binasını tasarladım; bina 2014 ve 2018'de büyük yangınlar geçirdi."], "opts": ["William Morris", "Philip Webb", "Victor Horta", "Charles Rennie Mackintosh"], "exp": "Cevap Charles Rennie Mackintosh'tur. Arts and Crafts ile Art Nouveau arasında, kendine özgü geometrik bir üslup geliştirdi.", "detail": ["Yüksek arkalıklı sandalyeleri ve stilize gül motifleri en bilinen tasarımlarıdır. Glasgow Sanat Okulu (1897–1909) yangınlardan sonra hâlâ restorasyon sürecindedir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Glasgow et j'y ai travaillé.", "Avec ma femme Margaret Macdonald, je faisais partie des « Glasgow Four ».", "J'ai conçu le bâtiment de la Glasgow School of Art, ravagé par de grands incendies en 2014 et 2018."], "opts": ["William Morris", "Philip Webb", "Victor Horta", "Charles Rennie Mackintosh"], "exp": "La réponse est Charles Rennie Mackintosh. Entre Arts and Crafts et Art nouveau, il a créé un style géométrique très personnel.", "detail": ["Ses chaises à haut dossier et ses roses stylisées sont ses créations les plus connues. La Glasgow School of Art (1897–1909) est encore en restauration après les incendies."]}, "en": {"q": "Who am I?", "clues": ["I was born in Glasgow and worked there.", "With my wife Margaret Macdonald, I was a member of the 'Glasgow Four'.", "I designed the Glasgow School of Art building, which suffered major fires in 2014 and 2018."], "opts": ["William Morris", "Philip Webb", "Victor Horta", "Charles Rennie Mackintosh"], "exp": "The answer is Charles Rennie Mackintosh. Between Arts and Crafts and Art Nouveau, he created a very personal geometric style.", "detail": ["His high-backed chairs and stylised roses are his best-known designs. The Glasgow School of Art (1897–1909) is still being restored after the fires."]}, "id": "x-03-17", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1872, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "europe", "medium": "painting", "tags": ["impressionism", "c19", "painting"], "topics": ["impressionism", "c19", "painting"], "search": {"commons": "Claude Monet Impression Sunrise", "wiki": {"en": "Impression, Sunrise"}}, "answer": 2, "tr": {"q": "Empresyonizm adını hangi tablodan alır?", "opts": ["Renoir – Moulin de la Galette'te Balo", "Degas – Dans Dersi", "Monet – İzlenim, Gün Doğumu", "Pissarro – Montmartre Bulvarı"], "exp": "Eleştirmen Louis Leroy, 1874 sergisinde Monet'nin 'İzlenim, Gün Doğumu' tablosuyla alay ederek grubun tümüne 'izlenimciler' dedi.", "detail": ["Tablo, Le Havre limanını sabah sisinde hızlı fırça darbeleriyle gösterir. Bugün Paris'teki Musée Marmottan Monet'dedir; 1985'te çalınmış, 1990'da bulunmuştur."]}, "fr": {"q": "De quel tableau l'impressionnisme tire-t-il son nom ?", "opts": ["Renoir – Bal du moulin de la Galette", "Degas – La Classe de danse", "Monet – Impression, soleil levant", "Pissarro – Le Boulevard Montmartre"], "exp": "Le critique Louis Leroy se moque de « Impression, soleil levant » de Monet à l'exposition de 1874 et appelle tout le groupe les « impressionnistes ».", "detail": ["Le
