» à la société de consommation.", "detail": ["Ancienne graphiste de magazine, Kruger place de courts slogans en lettres Futura blanches sur des bandes rouges, au-dessus de photos en noir et blanc. Ce style a ensuite été imité par certaines marques de mode."]}, "en": {"q": "Barbara Kruger's slogan 'I shop therefore I am' refers to Descartes's famous phrase.", "exp": "True. The 1987 work adapts 'I think, therefore I am' to consumer society.", "detail": ["With her background in magazine design, Kruger places short slogans in white Futura letters on red bands over black and white photos. This style was later copied by some fashion brands."]}, "id": "x-10-5", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 1991, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "sculpture", "tags": ["yba", "contemporary", "sculpture"], "topics": ["yba", "contemporary", "sculpture"], "search": {"commons": "Damien Hirst The Physical Impossibility of Death", "wiki": {"en": "The Physical Impossibility of Death in the Mind of Someone Living"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Tracey Emin – Yatağım", "Rachel Whiteread – Ev", "Marc Quinn – Öz", "Damien Hirst – Yaşayan Birinin Zihninde Ölümün Fiziksel İmkânsızlığı"], "exp": "Damien Hirst'ün 1991 tarihli eseri, formaldehit dolu bir camekân içindeki kaplan köpekbalığıdır.", "detail": ["Eser Charles Saatchi tarafından sipariş edildi ve 1992'deki 'Young British Artists' sergisinde gösterildi. Köpekbalığı zamanla bozulunca 2006'da yenisiyle değiştirildi; bu da eserin 'aynı' kalıp kalmadığı tartışmasını doğurdu."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Tracey Emin – My Bed", "Rachel Whiteread – House", "Marc Quinn – Self", "Damien Hirst – The Physical Impossibility of Death in the Mind of Someone Living"], "exp": "L'œuvre de Damien Hirst (1991) est un requin-tigre dans une vitrine remplie de formol.", "detail": ["Elle a été commandée par Charles Saatchi et montrée en 1992 dans l'exposition « Young British Artists ». Le requin s'étant abîmé, il a été remplacé en 2006, ce qui a relancé la question : l'œuvre est-elle toujours « la même » ?"]}, "en": {"q": "Which work is this?", "opts": ["Tracey Emin – My Bed", "Rachel Whiteread – House", "Marc Quinn – Self", "Damien Hirst – The Physical Impossibility of Death in the Mind of Someone Living"], "exp": "Damien Hirst's 1991 work is a tiger shark in a glass tank filled with formaldehyde.", "detail": ["It was commissioned by Charles Saatchi and shown in the 1992 'Young British Artists' exhibition. When the shark decayed it was replaced in 2006, raising the question of whether the work is still 'the same'."]}, "id": "x-10-6", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1988, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "europe", "medium": "concept", "tags": ["yba", "contemporary"], "topics": ["yba", "contemporary"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "Damien Hirst'ün 1988'de Londra'da öğrencilerle birlikte düzenlediği ve 'Genç İngiliz Sanatçılar' kuşağının başlangıcı sayılan sergi hangisidir?", "opts": ["Sensation", "Freeze", "Brilliant!", "This Is Tomorrow"], "exp": "Hirst, Goldsmiths öğrencisiyken 1988'de Londra Docklands'te boş bir binada 'Freeze' sergisini düzenledi.", "detail": ["'Sensation' ise 1997'de Royal Academy'de açılan, Saatchi koleksiyonundan YBA eserlerinin büyük sergisiydi ve büyük skandal yarattı. 'This Is Tomorrow' 1956'daki Pop Art öncesi sergidir."]}, "fr": {"q": "Quelle exposition, organisée par Damien Hirst avec des étudiants à Londres en 1988, est vue comme le début des « Young British Artists » ?", "opts": ["Sensation", "Freeze", "Brilliant!", "This Is Tomorrow"], "exp": "Étudiant à Goldsmiths, Hirst organise en 1988 l'exposition « Freeze » dans un bâtiment vide des Docklands de Londres.", "detail": ["« Sensation », en 1997 à la Royal Academy, est la grande exposition des YBA de la collection Saatchi ; elle fait scandale. « This Is Tomorrow » est l'exposition de 1956, avant le pop art."]}, "en": {"q": "Which exhibition, organised by Damien Hirst with fellow students in London in 1988, is seen as the start of the 'Young British Artists'?", "opts": ["Sensation", "Freeze", "Brilliant!", "This Is Tomorrow"], "exp": "As a Goldsmiths student, Hirst organised 'Freeze' in 1988 in an empty building in London's Docklands.", "detail": ["'Sensation' was the big 1997 Royal Academy show of YBA works from the Saatchi collection, and it caused a scandal. 'This Is Tomorrow' was the 1956 show before Pop Art."]}, "id": "x-10-7", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1998, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "sculpture", "tags": ["yba", "contemporary", "sculpture", "women"], "topics": ["yba", "contemporary", "sculpture", "women"], "search": {"commons": "Tracey Emin My Bed", "wiki": {"en": "Tracey Emin My Bed"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Margate'te büyüdüm ve Genç İngiliz Sanatçılar kuşağındayım.", "1999'da dağınık yatağımı, boş şişeler ve kullanılmış eşyalarla birlikte Turner Ödülü sergisinde gösterdim.", "Neon yazılarım ve 'Birlikte Yattığım Herkes 1963–1995' adlı çadırımla tanındım."], "opts": ["Sarah Lucas", "Rachel Whiteread", "Tracey Emin", "Jenny Saville"], "exp": "Cevap Tracey Emin'dir. Kişisel hayatını ve bedenini doğrudan esere dönüştürür.", "detail": ["'Yatağım' (1998) Turner Ödülü'nü kazanmadı ama büyük ilgi gördü. Çadır eseri 2004'te bir depo yangınında yok oldu. Emin bugün Royal Academy üyesidir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["J'ai grandi à Margate et je fais partie des Young British Artists.", "En 1999, j'ai montré mon lit défait, avec des bouteilles vides et des objets usagés, à l'exposition du prix Turner.", "Je suis connue pour mes néons et pour ma tente « Everyone I Have Ever Slept With 1963–1995 »."], "opts": ["Sarah Lucas", "Rachel Whiteread", "Tracey Emin", "Jenny Saville"], "exp": "La réponse est Tracey Emin. Elle transforme directement sa vie et son corps en œuvre.", "detail": ["« My Bed » (1998) n'a pas gagné le prix Turner, mais a eu un énorme écho. La tente a été détruite en 2004 dans l'incendie d'un entrepôt. Emin est aujourd'hui membre de la Royal Academy."]}, "en": {"q": "Who am I?", "clues": ["I grew up in Margate and belong to the Young British Artists.", "In 1999 I showed my unmade bed, with empty bottles and used objects, at the Turner Prize exhibition.", "I am known for my neon texts and my tent 'Everyone I Have Ever Slept With 1963–1995'."], "opts": ["Sarah Lucas", "Rachel Whiteread", "Tracey Emin", "Jenny Saville"], "exp": "The answer is Tracey Emin. She turns her own life and body directly into art.", "detail": ["'My Bed' (1998) did not win the Turner Prize but drew huge attention. The tent was destroyed in a 2004 warehouse fire. Emin is now a member of the Royal Academy."]}, "id": "x-10-8", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1998, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "concept", "tags": ["relational", "contemporary"], "topics": ["relational", "contemporary"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 3, "tr": {"q": "'İlişkisel Estetik' (Esthétique relationnelle, 1998) kitabının yazarı Fransız küratör kimdir?", "opts": ["Hans Ulrich Obrist", "Catherine David", "Harald Szeemann", "Nicolas Bourriaud"], "exp": "Nicolas Bourriaud, sanatın nesne üretmekten çok insanlar arasında ilişki ve karşılaşma ortamları kurduğu eğilimleri 'ilişkisel estetik' olarak tanımladı.", "detail": ["Rirkrit Tiravanija, Liam Gillick, Philippe Parreno ve Félix González-Torres bu kitapta örnek gösterilen sanatçılardır. Claire Bishop gibi eleştirmenler, bu sanatın topluluk fikrini fazla iyimser bulduğu için eleştirdi."]}, "fr": {"q": "Quel commissaire français a écrit « Esthétique relationnelle » (1998) ?", "opts": ["Hans Ulrich Obrist", "Catherine David", "Harald Szeemann", "Nicolas Bourriaud"], "exp": "Nicolas Bourriaud appelle « esthétique relationnelle » les pratiques où l'art crée des relations et des rencontres entre les gens plutôt que des objets.", "detail": ["Rirkrit Tiravanija, Liam Gillick, Philippe Parreno et Félix González-Torres sont cités comme exemples. Des critiques comme Claire Bishop ont trouvé sa vision de la communauté trop optimiste."]}, "en": {"q": "Which French curator wrote 'Relational Aesthetics' (1998)?", "opts": ["Hans Ulrich Obrist", "Catherine David", "Harald Szeemann", "Nicolas Bourriaud"], "exp": "Nicolas Bourriaud called 'relational aesthetics' the practices where art creates relations and encounters between people rather than objects.", "detail": ["Rirkrit Tiravanija, Liam Gillick, Philippe Parreno and Félix González-Torres are given as examples. Critics such as Claire Bishop found its idea of community too optimistic."]}, "id": "x-10-9", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1992, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "asia", "medium": "performance", "tags": ["relational", "contemporary", "performance"], "topics": ["relational", "contemporary", "performance"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": true, "tr": {"q": "Rirkrit Tiravanija, 1992'de New York'taki bir galeride Tay körisi pişirip ziyaretçilere ücretsiz dağıttı.", "exp": "Doğru. 'Başlıksız (Ücretsiz)' adlı eserde galerinin ofisi mutfağa dönüştürüldü ve izleyiciler birlikte yemek yedi.", "detail": ["Eserin asıl konusu yemek değil, ortaya çıkan sohbetler ve paylaşım ortamıdır. Arjantin'de doğup Tayland'da büyüyen Tiravanija, ilişkisel sanatın simge isimlerinden biri oldu."]}, "fr": {"q": "En 1992, Rirkrit Tiravanija a cuisiné du curry thaï dans une galerie de New York et l'a servi gratuitement aux visiteurs.", "exp": "Vrai. Dans « Untitled (Free) », le bureau de la galerie devient une cuisine et le public mange ensemble.", "detail": ["Le vrai sujet de l'œuvre n'est pas la nourriture, mais les conversations et le partage. Né en Argentine et élevé en Thaïlande, Tiravanija est devenu une figure clé de l'art relationnel."]}, "en": {"q": "In 1992 Rirkrit Tiravanija cooked Thai curry in a New York gallery and served it free to visitors.", "exp": "True. In 'Untitled (Free)', the gallery office became a kitchen and visitors ate together.", "detail": ["The real subject is not the food but the conversations and sharing that happen. Born in Argentina and raised in Thailand, Tiravanija became a key figure of relational art."]}, "id": "x-10-10", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1991, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "americas", "medium": "sculpture", "tags": ["relational", "contemporary", "sculpture", "r-namerica"], "topics": ["relational", "contemporary", "sculpture", "r-namerica"], "search": {"commons": "Felix Gonzalez-Torres Untitled Portrait of Ross in L.A.", "wiki": {"en": "Felix Gonzalez-Torres Untitled Portrait of Ross in L.A."}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Küba'da doğdum ve New York'ta yaşadım.", "1991'de AIDS nedeniyle kaybettiğim sevgilimin ideal vücut ağırlığına eşit, yaklaşık 79 kiloluk bir şeker yığını yaptım.", "İzleyiciler şekerlerden alabilir; yığın küçülür ve yeniden doldurulur."], "opts": ["Félix González-Torres", "Ana Mendieta", "Tania Bruguera", "Wilfredo Prieto"], "exp": "Cevap Félix González-Torres'tir. 'Başlıksız (L.A.'deki Ross'un Portresi)' kayıp, sevgi ve paylaşım üzerine bir eserdir.", "detail": ["İzleyicinin her şeker alışı, bedenin hastalıkla erimesini çağrıştırır; yeniden doldurma ise sonsuzluk umudunu. Eser Chicago Sanat Enstitüsü'ndedir. Sanatçı 1996'da AIDS'ten öldü."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Cuba et j'ai vécu à New York.", "En 1991, j'ai fait un tas de bonbons d'environ 79 kilos, le poids idéal de mon compagnon mort du sida.", "Les visiteurs peuvent prendre des bonbons ; le tas diminue puis il est rempli à nouveau."], "opts": ["Félix González-Torres", "Ana Mendieta", "Tania Bruguera", "Wilfredo Prieto"], "exp": "La réponse est Félix González-Torres. « Untitled (Portrait of Ross in L.A.) » est une œuvre sur la perte, l'amour et le partage.", "detail": ["Chaque bonbon pris évoque le corps qui s'efface avec la maladie ; le remplissage, l'espoir d'une continuité. L'œuvre est à l'Art Institute de Chicago. L'artiste est mort du sida en 1996."]}, "en": {"q": "Who am I?", "clues": ["I was born in Cuba and lived in New York.", "In 1991 I made a pile of sweets weighing about 79 kilos, the ideal body weight of my partner who died of AIDS.", "Visitors may take sweets; the pile shrinks and is filled again."], "opts": ["Félix González-Torres", "Ana Mendieta", "Tania Bruguera", "Wilfredo Prieto"], "exp": "The answer is Félix González-Torres. 'Untitled (Portrait of Ross in L.A.)' is a work about loss, love and sharing.", "detail": ["Each sweet taken recalls the body wasting away with illness; the refilling suggests hope of continuity. The work is in the Art Institute of Chicago. The artist died of AIDS in 1996."]}, "id": "x-10-11", "t": 1794800000000}, {"type": "identify", "level": 1, "year": 2005, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "europe", "medium": "painting", "tags": ["streetart", "contemporary", "painting"], "topics": ["streetart", "contemporary", "painting"], "search": {"commons": "Banksy Girl with Balloon", "wiki": {"en": "Girl with Balloon"}}, "answer": 1, "tr": {"q": "Bu eser kime aittir?", "opts": ["Shepard Fairey", "Banksy", "Invader", "JR"], "exp": "Kalp biçimli kırmızı balona uzanan kız figürü, kimliği gizli İngiliz sokak sanatçısı Banksy'nin en ünlü imgelerinden biridir.", "detail": ["2018'de bu imgenin bir versiyonu Sotheby's'te satıldığı anda çerçevesindeki gizli bir mekanizmayla kısmen parçalandı ve 'Aşk Çöpte' adını aldı. 2021'de çok daha yüksek bir fiyata yeniden satıldı."]}, "fr": {"q": "À qui appartient cette œuvre ?", "opts": ["Shepard Fairey", "Banksy", "Invader", "JR"], "exp": "La petite fille qui tend la main vers un ballon rouge en forme de cœur est l'une des images les plus célèbres de Banksy, artiste de rue britannique anonyme.", "detail": ["En 2018, une version a été en partie déchiquetée par un mécanisme caché dans le cadre au moment de sa vente chez Sotheby's ; elle s'appelle désormais « Love is in the Bin ». Elle a été revendue en 2021 beaucoup plus cher."]}, "en": {"q": "Who made this work?", "opts": ["Shepard Fairey", "Banksy", "Invader", "JR"], "exp": "The girl reaching for a red heart-shaped balloon is one of the best-known images by Banksy, the anonymous British street artist.", "detail": ["In 2018 a version was partly shredded by a hidden mechanism in its frame just as it sold at Sotheby's; it was renamed 'Love is in the Bin'. It resold in 2021 for a much higher price."]}, "id": "x-10-12", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 2008, "era": {"tr": "2000'ler", "fr": "Années 2000", "en": "2000s"}, "region": "americas", "medium": "print", "tags": ["streetart", "contemporary", "design", "r-namerica"], "topics": ["streetart", "contemporary", "design", "r-namerica"], "search": {"commons": "Obama Hope poster", "wiki": {"en": "Obama Hope poster"}}, "answer": 0, "tr": {"q": "2008 ABD başkanlık seçimlerinde Barack Obama'nın kırmızı, bej ve mavi tonlu 'Hope' afişini kim tasarladı?", "opts": ["Shepard Fairey", "Keith Haring", "Kehinde Wiley", "KAWS"], "exp": "Sokak sanatçısı Shepard Fairey 2008'de 'Hope' afişini tasarladı; afiş seçim kampanyasının simgesi oldu.", "detail": ["Fairey daha önce 'OBEY Giant' çıkartmalarıyla tanınıyordu. Afişin bir Associated Press fotoğrafına dayanması telif hakkı davasına yol açtı. Bir versiyonu Washington'daki Ulusal Portre Galerisi'ndedir."]}, "fr": {"q": "Qui a créé l'affiche « Hope » de Barack Obama, en rouge, beige et bleu, lors de l'élection présidentielle américaine de 2008 ?", "opts": ["Shepard Fairey", "Keith Haring", "Kehinde Wiley", "KAWS"], "exp": "L'artiste de rue Shepard Fairey crée l'affiche « Hope » en 2008 ; elle devient le symbole de la campagne.", "detail": ["Fairey était déjà connu pour ses autocollants « OBEY Giant ». L'affiche, basée sur une photo de l'Associated Press, a mené à un procès sur les droits d'auteur. Une version est à la National Portrait Gallery de Washington."]}, "en": {"q": "Who designed Barack Obama's red, beige and blue 'Hope' poster in the 2008 US presidential election?", "opts": ["Shepard Fairey", "Keith Haring", "Kehinde Wiley", "KAWS"], "exp": "The street artist Shepard Fairey designed the 'Hope' poster in 2008, and it became the symbol of the campaign.", "detail": ["Fairey was already known for his 'OBEY Giant' stickers. The poster was based on an Associated Press photo, which led to a copyright case. A version is in the National Portrait Gallery in Washington."]}, "id": "x-10-13", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1989, "era": {"tr": "1980'ler", "fr": "Années 1980", "en": "1980s"}, "region": "europe", "medium": "painting", "tags": ["streetart", "contemporary", "painting"], "topics": ["streetart", "contemporary", "painting"], "search": {"commons": "Keith Haring Tuttomondo Pisa", "wiki": {"en": "Keith Haring Tuttomondo Pisa"}}, "answer": true, "tr": {"q": "Keith Haring'in son büyük kamusal duvar resimlerinden 'Tuttomondo' (1989), İtalya'nın Pisa şehrindedir.", "exp": "Doğru. Haring 'Tuttomondo'yu 1989'da Pisa'daki Sant'Antonio Kilisesi'nin dış duvarına yaptı.", "detail": ["Haring, metro istasyonlarındaki boş reklam panolarına tebeşirle çizerek ünlendi. 'Tuttomondo' barış ve uyum temalı 30 figür içerir. Haring 1990'da AIDS'ten öldü."]}, "fr": {"q": "« Tuttomondo » (1989), l'une des dernières grandes fresques publiques de Keith Haring, se trouve à Pise, en Italie.", "exp": "Vrai. Haring peint « Tuttomondo » en 1989 sur le mur extérieur de l'église Sant'Antonio, à Pise.", "detail": ["Haring est devenu célèbre en dessinant à la craie sur les panneaux publicitaires vides du métro. « Tuttomondo » montre 30 figures sur la paix et l'harmonie. Haring est mort du sida en 1990."]}, "en": {"q": "'Tuttomondo' (1989), one of Keith Haring's last large public murals, is in Pisa, Italy.", "exp": "True. Haring painted 'Tuttomondo' in 1989 on the outside wall of the Church of Sant'Antonio in Pisa.", "detail": ["Haring became famous by drawing in chalk on empty advertising panels in the subway. 'Tuttomondo' shows 30 figures about peace and harmony. Haring died of AIDS in 1990."]}, "id": "x-10-14", "t": 1794800000000}, {"type": "mcq", "level": 4, "year": 1994, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "europe", "medium": "newmedia", "tags": ["netart", "contemporary", "newmedia"], "topics": ["netart", "contemporary", "newmedia"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "1990'ların ortasında internet tabanlı sanata ad olan 'net.art' teriminin, okunamayan bir e-postadaki karakter yığınından çıktığı söylenir. Bu hikâyeyi anlatan sanatçı kimdir?", "opts": ["Olia Lialina", "Heath Bunting", "Vuk Ćosić", "JODI"], "exp": "Sloven sanatçı Vuk Ćosić, 1995'te bozulmuş bir anonim e-postada yalnızca 'net.art' kelimesinin okunabildiğini anlattı.", "detail": ["Bu hikâyenin bir kısmı efsane olabilir, ama terim tutundu. Olia Lialina'nın 'My Boyfriend Came Back from the War' (1996) ve JODI'nin bozuk görünen web siteleri bu dönemin klasikleridir."]}, "fr": {"q": "On raconte que le terme « net.art », pour l'art en ligne du milieu des années 1990, est sorti d'un e-mail illisible plein de caractères. Quel artiste raconte cette histoire ?", "opts": ["Olia Lialina", "Heath Bunting", "Vuk Ćosić", "JODI"], "exp": "L'artiste slovène Vuk Ćosić raconte qu'en 1995, dans un e-mail anonyme abîmé, seul le mot « net.art » était lisible.", "detail": ["Une partie de l'histoire est peut-être une légende, mais le terme est resté. « My Boyfriend Came Back from the War » d'Olia Lialina (1996) et les sites « cassés » de JODI sont des classiques de l'époque."]}, "en": {"q": "It is said that the term 'net.art', for mid-1990s internet art, came from an unreadable e-mail full of characters. Which artist tells this story?", "opts": ["Olia Lialina", "Heath Bunting", "Vuk Ćosić", "JODI"], "exp": "The Slovenian artist Vuk Ćosić said that in 1995, in a garbled anonymous e-mail, only the word 'net.art' was readable.", "detail": ["Part of the story may be a legend, but the term stuck. Olia Lialina's 'My Boyfriend Came Back from the War' (1996) and JODI's broken-looking websites are classics of the period."]}, "id": "x-10-15", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 2021, "era": {"tr": "2020'ler", "fr": "Années 2020", "en": "2020s"}, "region": "americas", "medium": "newmedia", "tags": ["netart", "contemporary", "newmedia", "r-namerica"], "topics": ["netart", "contemporary", "newmedia", "r-namerica"], "search": {"commons": "Beeple Everydays", "wiki": {"en": "Beeple Everydays"}}, "answer": true, "tr": {"q": "Beeple'ın dijital kolajı 'Everydays: İlk 5000 Gün', 2021'de Christie's'te NFT olarak yaklaşık 69 milyon dolara satıldı.", "exp": "Doğru. Mart 2021'deki satış, yaşayan bir sanatçının en pahalı eserleri arasına girdi ve NFT çılgınlığının simgesi oldu.", "detail": ["Eser, Mike Winkelmann'ın (Beeple) 2007'den beri her gün yaptığı 5000 dijital görüntünün birleşimidir. Satış, dijital sanatın mülkiyeti ve değeri üzerine büyük tartışma başlattı; NFT piyasası sonra sert biçimde geriledi."]}, "fr": {"q": "Le collage numérique de Beeple « Everydays: The First 5000 Days » a été vendu environ 69 millions de dollars comme NFT chez Christie's en 2021.", "exp": "Vrai. La vente de mars 2021 l'a placé parmi les œuvres les plus chères d'un artiste vivant et a symbolisé la folie des NFT.", "detail": ["L'œuvre réunit 5 000 images numériques que Mike Winkelmann (Beeple) a faites chaque jour depuis 2007. La vente a lancé un grand débat sur la propriété et la valeur de l'art numérique ; le marché des NFT a ensuite fortement baissé."]}, "en": {"q": "Beeple's digital collage 'Everydays: The First 5000 Days' sold as an NFT at Christie's in 2021 for about 69 million dollars.", "exp": "True. The March 2021 sale put it among the most expensive works by a living artist and became the symbol of the NFT craze.", "detail": ["The work combines 5,000 digital images that Mike Winkelmann (Beeple) made every day since 2007. The sale started a big debate on ownership and value in digital art; the NFT market later fell sharply."]}, "id": "x-10-16", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1993, "era": {"tr": "1990'ler", "fr": "Années 1990", "en": "1990s"}, "region": "americas", "medium": "concept", "tags": ["afrofuturism", "contemporary", "r-namerica"], "topics": ["afrofuturism", "contemporary", "r-namerica"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "'Afrofütürizm' terimini 1993'te bir makalede ilk kullanan yazar kimdir?", "opts": ["Kodwo Eshun", "Mark Dery", "Sun Ra", "Octavia Butler"], "exp": "Kültür eleştirmeni Mark Dery, 1993'te 'Black to the Future' adlı makalesinde 'Afrofuturism' terimini kullandı.", "detail": ["Ancak bu estetik çok daha önce vardı: caz müzisyeni Sun Ra'nın uzay temalı dünyası ve Octavia Butler'ın bilimkurgu romanları önemli kaynaklardır. Kodwo Eshun da 1998'de 'More Brilliant than the Sun' kitabıyla akıma katkı yaptı."]}, "fr": {"q": "Quel auteur a utilisé pour la première fois le terme « afrofuturisme », dans un article de 1993 ?", "opts": ["Kodwo Eshun", "Mark Dery", "Sun Ra", "Octavia Butler"], "exp": "Le critique culturel Mark Dery utilise le mot « Afrofuturism » en 1993 dans son article « Black to the Future ».", "detail": ["Mais cette esthétique existait bien avant : l'univers spatial du musicien de jazz Sun Ra et les romans de science-fiction d'Octavia Butler en sont des sources majeures. Kodwo Eshun y contribue en 1998 avec « More Brilliant than the Sun »."]}, "en": {"q": "Which writer first used the term 'Afrofuturism', in a 1993 essay?", "opts": ["Kodwo Eshun", "Mark Dery", "Sun Ra", "Octavia Butler"], "exp": "The cultural critic Mark Dery used 'Afrofuturism' in his 1993 essay 'Black to the Future'.", "detail": ["But the aesthetic existed much earlier: jazz musician Sun Ra's space-themed world and Octavia Butler's science fiction novels are key sources. Kodwo Eshun added to it in 1998 with 'More Brilliant than the Sun'."]}, "id": "x-10-17", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 2018, "era": {"tr": "2010'ler", "fr": "Années 2010", "en": "2010s"}, "region": "africa", "medium": "sculpture", "tags": ["afrofuturism", "contemporary", "sculpture", "women", "r-africa"], "topics": ["afrofuturism", "contemporary", "sculpture", "women", "r-africa"], "search": {"commons": "Wangechi Mutu sculpture", "wiki": {"en": "Wangechi Mutu sculpture"}}, "answer": 3, "tr": {"q": "Ben kimim?", "clues": ["Nairobi'de doğdum ve New York'ta çalıştım.", "Dergi kesikleri, boya ve doğal malzemelerle melez, yarı insan yarı makine kadın figürlerinden oluşan kolajlar yaptım.", "2019'da Metropolitan Müzesi'nin cephesindeki boş nişler için dört bronz kadın heykeli 'The NewOnes, will free Us'ı yaptım."], "opts": ["Njideka Akunyili Crosby", "Julie Mehretu", "Zanele Muholi", "Wangechi Mutu"], "exp": "Cevap Wangechi Mutu'dur. Eserleri sömürgecilik, cinsiyet ve gelecek hayalleri üzerine Afrofütürist bir dille konuşur.", "detail": ["Met'in 1902'den beri boş duran cephe nişleri ilk kez onun heykelleriyle dolduruldu. Mutu'nun kolajları, bilimkurgu ve Afrika mitlerini birleştiren melez bedenler gösterir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis née à Nairobi et j'ai travaillé à New York.", "Avec des découpages de magazines, de la peinture et des matériaux naturels, j'ai créé des collages de femmes hybrides, mi-humaines mi-machines.", "En 2019, j'ai créé quatre sculptures de femmes en bronze, « The NewOnes, will free Us », pour les niches vides de la façade du Metropolitan Museum."], "opts": ["Njideka Akunyili Crosby", "Julie Mehretu", "Zanele Muholi", "Wangechi Mutu"], "exp": "La réponse est Wangechi Mutu. Ses œuvres parlent de colonialisme, de genre et de futurs imaginés avec un langage afrofuturiste.", "detail": ["Les niches de la façade du Met, vides depuis 1902, ont été remplies pour la première fois par ses sculptures. Ses collages montrent des corps hybrides qui mêlent science-fiction et mythes africains."]}, "en": {"q": "Who am I?", "clues": ["I was born in Nairobi and worked in New York.", "With magazine cut-outs, paint and natural materials, I made collages of hybrid women, half human and half machine.", "In 2019 I made four bronze female sculptures, 'The NewOnes, will free Us', for the empty niches on the Metropolitan Museum's façade."], "opts": ["Njideka Akunyili Crosby", "Julie Mehretu", "Zanele Muholi", "Wangechi Mutu"], "exp": "The answer is Wangechi Mutu. Her works speak about colonialism, gender and imagined futures in an Afrofuturist language.", "detail": ["The Met's façade niches, empty since 1902, were filled for the first time with her sculptures. Her collages show hybrid bodies that mix science fiction and African myths."]}, "id": "x-10-18", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1914, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "anatolia", "medium": "painting", "tags": ["kusak1914", "modern", "painting", "r-anatolia"], "topics": ["kusak1914", "modern", "painting", "r-anatolia"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 0, "tr": {"q": "Türk resminde '1914 Kuşağı' ya da 'Çallı Kuşağı' olarak bilinen ressamlar hangi akımdan en çok etkilenmiştir?", "opts": ["Empresyonizm", "Kübizm", "Sürrealizm", "Soyut Ekspresyonizm"], "exp": "İbrahim Çallı, Hikmet Onat, Nazmi Ziya ve Feyhaman Duran gibi ressamlar Paris'te eğitim gördü ve Empresyonist ışık ve renk anlayışını Türkiye'ye getirdi.", "detail": ["Birinci Dünya Savaşı başlayınca 1914'te yurda döndükleri için bu adla anılırlar. Şişli Atölyesi'nde savaş resimleri yaptılar ve Galatasaray Sergileri'nde eser gösterdiler. 'Türk Empresyonistleri' diye de anılırlar."]}, "fr": {"q": "De quel mouvement les peintres turcs de la « Génération 1914 », ou « Génération Çallı », sont-ils le plus influencés ?", "opts": ["L'impressionnisme", "Le cubisme", "Le surréalisme", "L'expressionnisme abstrait"], "exp": "Des peintres comme İbrahim Çallı, Hikmet Onat, Nazmi Ziya et Feyhaman Duran ont étudié à Paris et ont rapporté en Turquie la lumière et la couleur impressionnistes.", "detail": ["Ils doivent leur nom à leur retour en 1914, au début de la Première Guerre mondiale. Ils peignent des scènes de guerre à l'atelier de Şişli et exposent aux expositions de Galatasaray. On les appelle aussi les « impressionnistes turcs »."]}, "en": {"q": "Which movement most influenced the Turkish painters known as the '1914 Generation' or 'Çallı Generation'?", "opts": ["Impressionism", "Cubism", "Surrealism", "Abstract Expressionism"], "exp": "Painters such as İbrahim Çallı, Hikmet Onat, Nazmi Ziya and Feyhaman Duran studied in Paris and brought Impressionist light and colour back to Turkey.", "detail": ["They are named after their return in 1914, when the First World War began. They painted war scenes at the Şişli Studio and showed works at the Galatasaray Exhibitions. They are also called the 'Turkish Impressionists'."]}, "id": "x-11-0", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1914, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "anatolia", "medium": "painting", "tags": ["kusak1914", "modern", "painting", "r-anatolia"], "topics": ["kusak1914", "modern", "painting", "r-anatolia"], "search": {"commons": "İbrahim Çallı", "wiki": {"en": "İbrahim Çallı"}}, "answer": 2, "tr": {"q": "Ben kimim?", "clues": ["Denizli'nin Çal ilçesinde doğdum ve soyadımı oradan aldım.", "Paris'te Fernand Cormon'un atölyesinde çalıştım.", "Sanayi-i Nefise'de uzun yıllar hocalık yaptım; bir kuşak ressama adımı verdim."], "opts": ["Hikmet Onat", "Nazmi Ziya Güran", "İbrahim Çallı", "Avni Lifij"], "exp": "Cevap İbrahim Çallı'dır. Güçlü fırça vuruşları ve canlı renkleriyle tanınır.", "detail": ["Çallı'nın öğrencileri arasında sonradan Müstakiller ve D Grubu'nu kuracak sanatçılar da vardı. 'Zeybekler' ve Mevlevi temalı tabloları en bilinen eserlerindendir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Çal, près de Denizli, et j'en ai tiré mon nom de famille.", "À Paris, j'ai travaillé dans l'atelier de Fernand Cormon.", "J'ai enseigné longtemps à l'École des beaux-arts d'Istanbul ; j'ai donné mon nom à une génération de peintres."], "opts": ["Hikmet Onat", "Nazmi Ziya Güran", "İbrahim Çallı", "Avni Lifij"], "exp": "La réponse est İbrahim Çallı, connu pour ses touches puissantes et ses couleurs vives.", "detail": ["Parmi ses élèves, il y avait de futurs fondateurs des Müstakiller et du Groupe D. Ses « Zeybeks » et ses tableaux sur les Mevlevis sont parmi ses œuvres les plus connues."]}, "en": {"q": "Who am I?", "clues": ["I was born in Çal, near Denizli, and took my surname from it.", "In Paris I worked in Fernand Cormon's studio.", "I taught for many years at the Istanbul School of Fine Arts and gave my name to a generation of painters."], "opts": ["Hikmet Onat", "Nazmi Ziya Güran", "İbrahim Çallı", "Avni Lifij"], "exp": "The answer is İbrahim Çallı, known for strong brushwork and lively colours.", "detail": ["Among his students were artists who later founded the Müstakiller and Group D. His 'Zeybeks' and paintings on Mevlevi themes are among his best-known works."]}, "id": "x-11-1", "t": 1794800000000}, {"type": "tf", "level": 3, "year": 1917, "era": {"tr": "1910'ler", "fr": "Années 1910", "en": "1910s"}, "region": "anatolia", "medium": "painting", "tags": ["kusak1914", "modern", "painting", "women", "r-anatolia"], "topics": ["kusak1914", "modern", "painting", "women", "r-anatolia"], "search": {"commons": "Mihri Müşfik", "wiki": {"en": "Mihri Müşfik"}}, "answer": true, "tr": {"q": "Mihri Müşfik, 1914'te İstanbul'da kadınlar için açılan İnas Sanayi-i Nefise Mektebi'nde öğretmenlik ve müdürlük yaptı.", "exp": "Doğru. Mihri Hanım, kadınlara resim eğitimi veren bu okulun ilk öğretmenlerinden ve yöneticilerindendi.", "detail": ["Mihri Müşfik, Osmanlı'nın ilk profesyonel kadın ressamlarından biri olarak Roma ve Paris'te yaşadı. Sonradan ABD'ye gitti ve orada portreler yaptı. Hayatı ve eserleri son yıllarda yeniden ilgi görüyor."]}, "fr": {"q": "Mihri Müşfik a enseigné et dirigé l'École des beaux-arts pour filles (İnas Sanayi-i Nefise), ouverte à Istanbul en 1914.", "exp": "Vrai. Mihri Hanım a été l'une des premières professeures et directrices de cette école qui formait les femmes à la peinture.", "detail": ["Mihri Müşfik, l'une des premières peintres professionnelles de l'Empire ottoman, a vécu à Rome et à Paris. Elle est ensuite partie aux États-Unis, où elle a peint des portraits. Sa vie et son œuvre suscitent un nouvel intérêt."]}, "en": {"q": "Mihri Müşfik taught at and directed the Fine Arts School for Girls (İnas Sanayi-i Nefise), opened in Istanbul in 1914.", "exp": "True. Mihri Hanım was one of the first teachers and directors of this school, which trained women in painting.", "detail": ["One of the first professional women painters of the Ottoman Empire, Mihri Müşfik lived in Rome and Paris. She later went to the USA and painted portraits there. Her life and work are drawing new interest."]}, "id": "x-11-2", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1933, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "anatolia", "medium": "painting", "tags": ["dgrubu", "modern", "painting", "r-anatolia"], "topics": ["dgrubu", "modern", "painting", "r-anatolia"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 1, "tr": {"q": "1933'te kurulan D Grubu'nun adındaki 'D' harfi neyi ifade eder?", "opts": ["Grubun kurucusunun adını", "Türkiye'deki dördüncü sanat topluluğu olmasını", "'Devrim' kelimesini", "Dışavurumculuğu"], "exp": "D Grubu, Osmanlı Ressamlar Cemiyeti, Yeni Resim Cemiyeti ve Müstakiller'den sonra kurulan dördüncü topluluk olduğu için alfabenin dördüncü harfini adı olarak aldı.", "detail": ["Kurucuları Nurullah Berk, Zeki Faik İzer, Elif Naci, Cemal Tollu, Abidin Dino ve heykeltıraş Zühtü Müridoğlu'ydu. Grup Kübizm ve Konstrüktivizmden etkilenerek Türk resmine modern, geometrik bir dil getirdi."]}, "fr": {"q": "Que signifie la lettre « D » dans le nom du Groupe D, fondé en 1933 ?", "opts": ["Le nom de son fondateur", "Le fait que c'est le quatrième groupe d'artistes en Turquie", "Le mot « révolution » (Devrim)", "L'expressionnisme"], "exp": "Le Groupe D prend la quatrième lettre de l'alphabet parce que c'est le quatrième groupe fondé, après la Société des peintres ottomans, la Nouvelle société de peinture et les Müstakiller.", "detail": ["Ses fondateurs sont Nurullah Berk, Zeki Faik İzer, Elif Naci, Cemal Tollu, Abidin Dino et le sculpteur Zühtü Müridoğlu. Influencé par le cubisme et le constructivisme, le groupe apporte un langage moderne et géométrique à la peinture turque."]}, "en": {"q": "What does the letter 'D' stand for in the name of Group D, founded in 1933?", "opts": ["Its founder's name", "Being the fourth artists' group in Turkey", "The word 'revolution' (Devrim)", "Expressionism"], "exp": "Group D took the fourth letter of the alphabet because it was the fourth group founded, after the Ottoman Painters' Society, the New Painting Society and the Müstakiller.", "detail": ["Its founders were Nurullah Berk, Zeki Faik İzer, Elif Naci, Cemal Tollu, Abidin Dino and the sculptor Zühtü Müridoğlu. Influenced by Cubism and Constructivism, the group brought a modern, geometric language to Turkish painting."]}, "id": "x-11-3", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1933, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "anatolia", "medium": "painting", "tags": ["dgrubu", "modern", "painting", "r-anatolia"], "topics": ["dgrubu", "modern", "painting", "r-anatolia"], "search": {"commons": "Zeki Faik İzer İnkılap Yolunda", "wiki": {"en": "Zeki Faik İzer İnkılap Yolunda"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Bedri Rahmi – Karagöz", "Fikret Mualla – Paris Kafesi", "Abidin Dino – Kayseri Halısı", "Zeki Faik İzer – İnkılap Yolunda"], "exp": "Zeki Faik İzer'in 'İnkılap Yolunda' (1933) tablosu, Cumhuriyet'in 10. yılı için yapıldı; Delacroix'nın 'Halka Yol Gösteren Özgürlük'ünü hatırlatan bir kompozisyonla Cumhuriyet ideallerini anlatır.", "detail": ["Tablonun merkezinde bayrak taşıyan bir kadın figürü ve ilerleyen bir kalabalık vardır. Eser İstanbul Resim ve Heykel Müzesi koleksiyonundadır ve D Grubu döneminin simgelerinden biridir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Bedri Rahmi – Karagöz", "Fikret Mualla – Café parisien", "Abidin Dino – Tapis de Kayseri", "Zeki Faik İzer – Sur la voie de la révolution"], "exp": "« Sur la voie de la révolution » (İnkılap Yolunda, 1933) de Zeki Faik İzer a été peint pour le 10e anniversaire de la République ; sa composition rappelle « La Liberté guidant le peuple » de Delacroix.", "detail": ["Au centre, une femme porte un drapeau devant une foule qui avance. L'œuvre appartient au musée de peinture et de sculpture d'Istanbul et symbolise l'époque du Groupe D."]}, "en": {"q": "Which work is this?", "opts": ["Bedri Rahmi – Karagöz", "Fikret Mualla – Paris Café", "Abidin Dino – Kayseri Carpet", "Zeki Faik İzer – On the Road to Revolution"], "exp": "Zeki Faik İzer's 'On the Road to Revolution' (İnkılap Yolunda, 1933) was painted for the Republic's 10th anniversary; its composition recalls Delacroix's 'Liberty Leading the People'.", "detail": ["At the centre a woman carries a flag in front of an advancing crowd. The work belongs to the Istanbul Museum of Painting and Sculpture and is a symbol of the Group D period."]}, "id": "x-11-4", "t": 1794800000000}, {"type": "clues", "level": 2, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "anatolia", "medium": "painting", "tags": ["dgrubu", "modern", "painting", "r-anatolia"], "topics": ["dgrubu", "modern", "painting", "r-anatolia"], "search": {"commons": "Bedri Rahmi Eyüboğlu", "wiki": {"en": "Bedri Rahmi Eyüboğlu"}}, "answer": 0, "tr": {"q": "Ben kimim?", "clues": ["Trabzon'da doğdum; hem ressam hem şairdim.", "D Grubu'na katıldım ve sonra halk sanatından, kilim desenlerinden ve Karagöz'den beslenen bir üslup geliştirdim.", "Eşim Eren Eyüboğlu da ressamdı; 1958 Brüksel Dünya Fuarı'ndaki Türkiye pavyonu için dev bir mozaik yaptım."], "opts": ["Bedri Rahmi Eyüboğlu", "Nurullah Berk", "Cemal Tollu", "Turgut Zaim"], "exp": "Cevap Bedri Rahmi Eyüboğlu'dur. Türk modernizmini yerel kaynaklarla birleştiren en etkili sanatçılardandır.", "detail": ["Güzel Sanatlar Akademisi'nde yetiştirdiği öğrenciler 'Bedri Rahmi Atölyesi' adıyla anılır. Brüksel mozaiği bugün Ankara'dadır. Şiirleri de çok sevilir."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Trabzon ; j'étais peintre et poète.", "J'ai rejoint le Groupe D, puis j'ai développé un style nourri de l'art populaire, des motifs de kilims et du théâtre d'ombres Karagöz.", "Ma femme, Eren Eyüboğlu, était aussi peintre ; j'ai réalisé une immense mosaïque pour le pavillon turc de l'Exposition universelle de Bruxelles en 1958."], "opts": ["Bedri Rahmi Eyüboğlu", "Nurullah Berk", "Cemal Tollu", "Turgut Zaim"], "exp": "La réponse est Bedri Rahmi Eyüboğlu, l'un des artistes qui ont le plus uni le modernisme turc aux sources locales.", "detail": ["Ses élèves de l'Académie des beaux-arts sont connus comme « l'atelier Bedri Rahmi ». La mosaïque de Bruxelles est aujourd'hui à Ankara. Ses poèmes sont aussi très aimés."]}, "en": {"q": "Who am I?", "clues": ["I was born in Trabzon; I was both a painter and a poet.", "I joined Group D, then developed a style fed by folk art, kilim patterns and Karagöz shadow theatre.", "My wife Eren Eyüboğlu was also a painter; I made a huge mosaic for the Turkish pavilion at the 1958 Brussels World's Fair."], "opts": ["Bedri Rahmi Eyüboğlu", "Nurullah Berk", "Cemal Tollu", "Turgut Zaim"], "exp": "The answer is Bedri Rahmi Eyüboğlu, one of the artists who most joined Turkish modernism with local sources.", "detail": ["His students at the Academy of Fine Arts are known as the 'Bedri Rahmi Studio'. The Brussels mosaic is now in Ankara. His poems are also much loved."]}, "id": "x-11-5", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1941, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "anatolia", "medium": "painting", "tags": ["yeniler", "modern", "painting", "r-anatolia"], "topics": ["yeniler", "modern", "painting", "r-anatolia"], "search": {"commons": "", "wiki": {"en": ""}}, "answer": 2, "tr": {"q": "1940'larda 'Yeniler Grubu'nun sanatçıları resimlerinde en çok hangi temaya yöneldi?", "opts": ["Saray yaşamı ve Osmanlı tarihine", "Saf geometrik soyutlamaya", "İşçiler, balıkçılar ve halkın gündelik hayatına", "Dinî ve mistik konulara"], "exp": "Yeniler Grubu (1940–41'de ilk sergisini açtı), toplumcu gerçekçi bir yaklaşımla halkın emeğini ve gündelik yaşamını konu aldı.", "detail": ["Grubun önde gelen isimleri arasında Nuri İyem, Selim Turan, Avni Arbaş, Turgut Atalay ve Haşmet Akal vardı. Hocaları Leopold Levy'nin etkisiyle yerel konuları modern bir dille ele aldılar."]}, "fr": {"q": "Dans les années 1940, vers quel thème les artistes du « Groupe des Nouveaux » (Yeniler) se sont-ils surtout tournés ?", "opts": ["La vie du palais et l'histoire ottomane", "L'abstraction géométrique pure", "Les ouvriers, les pêcheurs et la vie quotidienne du peuple", "Les sujets religieux et mystiques"], "exp": "Le Groupe des Nouveaux (première exposition en 1940–1941) montre le travail et la vie quotidienne du peuple, avec une approche réaliste et sociale.", "detail": ["Nuri İyem, Selim Turan, Avni Arbaş, Turgut Atalay et Haşmet Akal en font partie. Influencés par leur professeur Léopold Lévy, ils traitent des sujets locaux avec un langage moderne."]}, "en": {"q": "In the 1940s, which theme did the artists of the 'Group of the New' (Yeniler) mostly turn to?", "opts": ["Palace life and Ottoman history", "Pure geometric abstraction", "Workers, fishermen and people's everyday life", "Religious and mystical subjects"], "exp": "The Group of the New (first exhibition in 1940–41) showed people's labour and everyday life with a socially realist approach.", "detail": ["Its leading members included Nuri İyem, Selim Turan, Avni Arbaş, Turgut Atalay and Haşmet Akal. Influenced by their teacher Léopold Lévy, they treated local subjects in a modern language."]}, "id": "x-11-6", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1960, "era": {"tr": "1960'ler", "fr": "Années 1960", "en": "1960s"}, "region": "anatolia", "medium": "painting", "tags": ["yeniler", "postwar", "painting", "r-anatolia"], "topics": ["yeniler", "postwar", "painting", "r-anatolia"], "search": {"commons": "Nuri İyem", "wiki": {"en": "Nuri İyem"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Yeniler Grubu'nun kurucularından biriyim.", "Gerçekçi resmin ve soyutlamanın tartışıldığı yıllarda halktan figürleri resmetmeyi sürdürdüm.", "En çok, büyük ve hüzünlü gözlü 'kadın portreleri'mle tanındım."], "opts": ["Neşet Günal", "Nuri İyem", "Avni Arbaş", "Cihat Burak"], "exp": "Cevap Nuri İyem'dir. Toplumcu gerçekçi Türk resminin önemli temsilcilerindendir.", "detail": ["İyem bir dönem soyut resim de yaptı, ama sonra figüre döndü. Büyük gözlü, Anadolulu kadın yüzleri onun imzası hâline geldi; bu eserler çok sayıda koleksiyonda bulunur."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis l'un des fondateurs du Groupe des Nouveaux (Yeniler).", "À une époque où l'on discutait entre réalisme et abstraction, j'ai continué à peindre des figures du peuple.", "Je suis surtout connu pour mes portraits de femmes aux grands yeux mélancoliques."], "opts": ["Neşet Günal", "Nuri İyem", "Avni Arbaş", "Cihat Burak"], "exp": "La réponse est Nuri İyem, un représentant important de la peinture réaliste sociale en Turquie.", "detail": ["İyem a aussi fait de la peinture abstraite pendant un temps, puis il est revenu à la figure. Ses visages de femmes anatoliennes aux grands yeux sont devenus sa signature."]}, "en": {"q": "Who am I?", "clues": ["I am one of the founders of the Group of the New (Yeniler).", "In years when realism and abstraction were debated, I kept painting figures of ordinary people.", "I am best known for my portraits of women with large, melancholy eyes."], "opts": ["Neşet Günal", "Nuri İyem", "Avni Arbaş", "Cihat Burak"], "exp": "The answer is Nuri İyem, an important representative of socially realist Turkish painting.", "detail": ["İyem also made abstract paintings for a time, but then returned to the figure. His large-eyed Anatolian women's faces became his signature."]}, "id": "x-11-7", "t": 1794800000000}, {"type": "order", "level": 3, "year": 1935, "era": {"tr": "1930'ler", "fr": "Années 1930", "en": "1930s"}, "region": "anatolia", "medium": "painting", "tags": ["turkgroups", "modern", "painting", "r-anatolia"], "topics": ["turkgroups", "modern", "painting", "r-anatolia"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["1909", "1929", "1933", "1940"], "tr": {"q": "Türk resim topluluklarını kuruluş tarihine göre eskiden yeniye sırala.", "items": ["Osmanlı Ressamlar Cemiyeti", "Müstakil Ressamlar ve Heykeltıraşlar Birliği", "D Grubu", "Yeniler Grubu"], "exp": "Osmanlı Ressamlar Cemiyeti 1909, Müstakiller 1929, D Grubu 1933, Yeniler Grubu 1940 civarında kuruldu.", "detail": ["Bu topluluklar Türk resminin Empresyonizmden Kübizme, sonra yerel ve toplumcu konulara geçişini gösterir. Müstakiller, Çallı Kuşağı'ndan bağımsız olmak isteyen genç sanatçılardı."]}, "fr": {"q": "Classe ces groupes de peintres turcs selon leur date de fondation, du plus ancien au plus récent.", "items": ["La Société des peintres ottomans", "L'Union des peintres et sculpteurs indépendants (Müstakiller)", "Le Groupe D", "Le Groupe des Nouveaux (Yeniler)"], "exp": "La Société des peintres ottomans date de 1909, les Müstakiller de 1929, le Groupe D de 1933 et les Yeniler d'environ 1940.", "detail": ["Ces groupes montrent le passage de la peinture turque de l'impressionnisme au cubisme, puis aux sujets locaux et sociaux. Les Müstakiller étaient de jeunes artistes qui voulaient s'éloigner de la génération Çallı."]}, "en": {"q": "Put these Turkish artists' groups in order of their founding, oldest first.", "items": ["The Ottoman Painters' Society", "The Union of Independent Painters and Sculptors (Müstakiller)", "Group D", "The Group of the New (Yeniler)"], "exp": "The Ottoman Painters' Society dates from 1909, the Müstakiller from 1929, Group D from 1933 and the Yeniler from around 1940.", "detail": ["These groups show Turkish painting moving from Impressionism to Cubism, then to local and social subjects. The Müstakiller were young artists who wanted independence from the Çallı Generation."]}, "id": "x-11-8", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1878, "era": {"tr": "1870'ler", "fr": "Années 1870", "en": "1870s"}, "region": "anatolia", "medium": "painting", "tags": ["turkgroups", "c19", "painting", "r-anatolia"], "topics": ["turkgroups", "c19", "painting", "r-anatolia"], "search": {"commons": "Osman Hamdi Bey Kuran Okuyan Kız", "wiki": {"en": "Osman Hamdi Bey"}}, "answer": 2, "tr": {"q": "Bu eser kime aittir?", "opts": ["Şeker Ahmed Paşa", "Halil Paşa", "Osman Hamdi Bey", "Süleyman Seyyid"], "exp": "Bu, Osman Hamdi Bey'in 'Kuran Okuyan Kız' (1880) gibi iç mekân sahnelerinin tipik bir örneğidir: zengin çiniler, halılar ve okuyan bir figür.", "detail": ["Osman Hamdi, Osmanlı yaşamını Batılı Oryantalistlerin abartılı egzotizminden farklı olarak, bilgi ve okuma gibi temalarla gösterdi. Bu tablo 2019'da açık artırmada Türk resmi için rekor fiyata satıldı."]}, "fr": {"q": "À qui appartient cette œuvre ?", "opts": ["Şeker Ahmed Paşa", "Halil Paşa", "Osman Hamdi Bey", "Süleyman Seyyid"], "exp": "C'est un exemple typique des scènes d'intérieur d'Osman Hamdi Bey, comme « La jeune fille lisant le Coran » (1880) : riches céramiques, tapis et figure qui lit.", "detail": ["Osman Hamdi montre la vie ottomane avec des thèmes comme le savoir et la lecture, loin de l'exotisme exagéré des orientalistes occidentaux. Ce tableau a été vendu en 2019 à un prix record pour la peinture turque."]}, "en": {"q": "Who made this work?", "opts": ["Şeker Ahmed Paşa", "Halil Paşa", "Osman Hamdi Bey", "Süleyman Seyyid"], "exp": "This is a typical example of Osman Hamdi Bey's interior scenes, like 'Girl Reading the Quran' (1880): rich tiles, carpets and a reading figure.", "detail": ["Osman Hamdi showed Ottoman life through themes such as knowledge and reading, unlike the exaggerated exoticism of Western Orientalists. The painting sold at auction in 2019 for a record price for Turkish painting."]}, "id": "x-11-9", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 1950, "era": {"tr": "1950'ler", "fr": "Années 1950", "en": "1950s"}, "region": "anatolia", "medium": "painting", "tags": ["turkgroups", "postwar", "painting", "women", "r-anatolia"], "topics": ["turkgroups", "postwar", "painting", "women", "r-anatolia"], "search": {"commons": "Fahrelnissa Zeid My Hell", "wiki": {"en": "Fahrelnissa Zeid My Hell"}}, "answer": 3, "tr": {"q": "Kaleydoskop gibi renkli dev soyut tablolarıyla tanınan, 1940'larda 'Yeni Grup' ile sergi açan ve Londra ile Paris'te uluslararası üne kavuşan Türk kadın ressam kimdir?", "opts": ["Aliye Berger", "Hale Asaf", "Eren Eyüboğlu", "Fahrelnissa Zeid"], "exp": "Fahrelnissa Zeid, 1950'lerde Paris'te Nouvelle École de Paris çevresinde sergiler açtı; 'Benim Cehennemim' (1951) gibi dev soyut tablolar yaptı.", "detail": ["Zeid, Irak'ın Londra büyükelçisi Prens Zeid ile evlendi ve hayatının sonunda Ürdün'de yaşadı. 2017'de Tate Modern büyük bir retrospektifini düzenledi. Kız kardeşi Aliye Berger de önemli bir gravürcü ve ressamdı."]}, "fr": {"q": "Quelle peintre turque, connue pour ses immenses toiles abstraites colorées comme un kaléidoscope, a exposé avec le « Nouveau groupe » dans les années 1940 et a connu un succès international à Londres et à Paris ?", "opts": ["Aliye Berger", "Hale Asaf", "Eren Eyüboğlu", "Fahrelnissa Zeid"], "exp": "Fahrelnissa Zeid expose à Paris dans les années 1950, dans le milieu de la Nouvelle École de Paris, avec d'immenses toiles abstraites comme « Mon enfer » (1951).", "detail": ["Elle épouse le prince Zeid, ambassadeur d'Irak à Londres, et finit sa vie en Jordanie. En 2017, la Tate Modern lui consacre une grande rétrospective. Sa sœur, Aliye Berger, était une graveuse et peintre importante."]}, "en": {"q": "Which Turkish woman painter, known for huge kaleidoscope-like abstract canvases, showed with the 'New Group' in the 1940s and became internationally known in London and Paris?", "opts": ["Aliye Berger", "Hale Asaf", "Eren Eyüboğlu", "Fahrelnissa Zeid"], "exp": "Fahrelnissa Zeid showed in Paris in the 1950s among the New School of Paris and painted huge abstract canvases such as 'My Hell' (1951).", "detail": ["She married Prince Zeid, Iraq's ambassador in London, and spent her last years in Jordan. In 2017 Tate Modern held a major retrospective. Her sister Aliye Berger was an important printmaker and painter."]}, "id": "x-11-10", "t": 1794800000000}, {"type": "tf", "level": 2, "year": 1949, "era": {"tr": "1940'ler", "fr": "Années 1940", "en": "1940s"}, "region": "anatolia", "medium": "painting", "tags": ["turkgroups", "postwar", "painting", "r-anatolia"], "topics": ["turkgroups", "postwar", "painting", "r-anatolia"], "search": {"commons": "Fikret Mualla", "wiki": {"en": "Fikret Mualla"}}, "answer": true, "tr": {"q": "Fikret Mualla hayatının büyük bölümünü Paris'te yoksulluk içinde geçirdi ve kafe, sokak ve sirk sahnelerini canlı renklerle resmetti.", "exp": "Doğru. Mualla 1939'da Paris'e yerleşti; guaş ve suluboya ile kafeleri, müzisyenleri ve sokak hayatını hızlı ve renkli bir üslupla resmetti.", "detail": ["Galerici Karl Flinker ve koleksiyoncu Madame Angles onu destekledi. Mualla 1967'de Fransa'nın Reillanne kasabasında öldü; kemikleri 1974'te İstanbul'a getirildi. Hayatı roman ve filmlere konu oldu."]}, "fr": {"q": "Fikret Mualla a passé la plus grande partie de sa vie à Paris dans la pauvreté et a peint des cafés, des rues et des scènes de cirque avec des couleurs vives.", "exp": "Vrai. Installé à Paris en 1939, Mualla peint à la gouache et à l'aquarelle les cafés, les musiciens et la vie des rues, dans un style rapide et coloré.", "detail": ["Le galeriste Karl Flinker et la collectionneuse Madame Angles l'ont soutenu. Il meurt en 1967 à Reillanne, en Provence ; ses restes sont ramenés à Istanbul en 1974. Sa vie a inspiré des romans et des films."]}, "en": {"q": "Fikret Mualla spent most of his life in Paris in poverty and painted cafés, streets and circus scenes in bright colours.", "exp": "True. Settled in Paris in 1939, Mualla painted cafés, musicians and street life in gouache and watercolour, in a quick, colourful style.", "detail": ["The dealer Karl Flinker and the collector Madame Angles supported him. He died in 1967 in Reillanne, in Provence; his remains were brought to Istanbul in 1974. His life inspired novels and films."]}, "id": "x-11-11", "t": 1794800000000}, {"type": "mcq", "level": 1, "year": 1557, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "anatolia", "medium": "arch", "tags": ["r-anatolia", "renaissance", "architecture"], "topics": ["r-anatolia", "renaissance", "architecture"], "search": {"commons": "Süleymaniye Mosque Istanbul", "wiki": {"en": "Süleymaniye Mosque"}}, "answer": 0, "tr": {"q": "Mimar Sinan'ın 'çıraklık eserim' dediği yapı hangisidir?", "opts": ["Şehzade Camii", "Süleymaniye Camii", "Selimiye Camii", "Mihrimah Sultan Camii (Edirnekapı)"], "exp": "Sinan, Şehzade Camii'ni (1548) 'çıraklık', Süleymaniye'yi (1557) 'kalfalık', Selimiye'yi (1575) 'ustalık' eseri olarak tanımladı.", "detail": ["Bu sınıflandırma Sinan'ın anılarına dayanan 'Tezkiretü'l-Bünyan' metninden gelir. Şehzade Camii, Kanuni Sultan Süleyman'ın genç yaşta ölen oğlu Şehzade Mehmed için yapıldı."]}, "fr": {"q": "Quel bâtiment l'architecte Sinan a-t-il appelé son « œuvre d'apprenti » ?", "opts": ["La mosquée Şehzade", "La mosquée Süleymaniye", "La mosquée Selimiye", "La mosquée Mihrimah Sultan (Edirnekapı)"], "exp": "Sinan décrit la mosquée Şehzade (1548) comme son œuvre d'apprenti, la Süleymaniye (1557) comme celle de compagnon et la Selimiye (1575) comme celle de maître.", "detail": ["Cette classification vient du « Tezkiretü'l-Bünyan », un texte basé sur ses souvenirs. La mosquée Şehzade a été construite pour Şehzade Mehmed, le fils de Soliman le Magnifique, mort jeune."]}, "en": {"q": "Which building did the architect Sinan call his 'apprentice work'?", "opts": ["The Şehzade Mosque", "The Süleymaniye Mosque", "The Selimiye Mosque", "The Mihrimah Sultan Mosque (Edirnekapı)"], "exp": "Sinan called the Şehzade Mosque (1548) his apprentice work, the Süleymaniye (1557) his journeyman work and the Selimiye (1575) his masterwork.", "detail": ["This classification comes from the 'Tezkiretü'l-Bünyan', a text based on his memories. The Şehzade Mosque was built for Şehzade Mehmed, the son of Suleiman the Magnificent, who died young."]}, "id": "x-11-12", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1229, "era": {"tr": "13. yüzyıl", "fr": "13e siècle", "en": "13th century"}, "region": "anatolia", "medium": "arch", "tags": ["r-anatolia", "medieval", "architecture", "r-islam"], "topics": ["r-anatolia", "medieval", "architecture", "r-islam"], "search": {"commons": "Divriği Great Mosque portal", "wiki": {"en": "Great Mosque of Divriği"}}, "answer": 1, "tr": {"q": "Bu yapı hangisi?", "opts": ["Sivas Gök Medrese", "Divriği Ulu Camii ve Darüşşifası", "Konya İnce Minareli Medrese", "Erzurum Çifte Minareli Medrese"], "exp": "Divriği Ulu Camii ve Darüşşifası (1228–29), Mengücekliler döneminde yapıldı; taş portalleri olağanüstü yoğun bitkisel ve geometrik oymalarla doludur.", "detail": ["Kuzey portalinin oymaları neredeyse heykel gibi derin ve üç boyutludur. Yapı 1985'te Türkiye'den UNESCO Dünya Mirası Listesi'ne giren ilk eserler arasında yer aldı."]}, "fr": {"q": "Quel est ce monument ?", "opts": ["La Gök Medrese de Sivas", "La Grande Mosquée et l'hôpital de Divriği", "La médersa İnce Minareli de Konya", "La médersa Çifte Minareli d'Erzurum"], "exp": "La Grande Mosquée et l'hôpital (darüşşifa) de Divriği (1228–1229) datent de l'époque des Mengücekides ; leurs portails en pierre sont couverts de sculptures végétales et géométriques d'une densité extraordinaire.", "detail": ["Les sculptures du portail nord sont si profondes qu'elles ressemblent à de la sculpture en ronde-bosse. Le site est entré en 1985 parmi les premiers biens turcs inscrits à l'UNESCO."]}, "en": {"q": "Which building is this?", "opts": ["The Gök Madrasa in Sivas", "The Great Mosque and Hospital of Divriği", "The İnce Minareli Madrasa in Konya", "The Çifte Minareli Madrasa in Erzurum"], "exp": "The Great Mosque and Hospital of Divriği (1228–29) was built under the Mengujekids; its stone portals are covered with extraordinarily dense plant and geometric carving.", "detail": ["The carving on the north portal is so deep it looks almost like free-standing sculpture. In 1985 it became one of the first Turkish sites on the UNESCO World Heritage list."]}, "id": "x-11-13", "t": 1794800000000}, {"type": "tf", "level": 2, "year": -9500, "era": {"tr": "MÖ 95. yüzyıl", "fr": "95e siècle av. J.-C.", "en": "95th century BCE"}, "region": "anatolia", "medium": "sculpture", "tags": ["r-anatolia", "ancient", "sculpture", "architecture"], "topics": ["r-anatolia", "ancient", "sculpture", "architecture"], "search": {"commons": "Göbekli Tepe pillars", "wiki": {"en": "Göbekli Tepe pillars"}}, "answer": true, "tr": {"q": "Şanlıurfa'daki Göbekli Tepe'nin T biçimli dikilitaşları, yaklaşık MÖ 9500'e tarihlenir ve Stonehenge'den binlerce yıl eskidir.", "exp": "Doğru. Göbekli Tepe'nin en eski katmanları yaklaşık MÖ 9500'e, yani tarımın yaygınlaşmasından önceki döneme tarihlenir.", "detail": ["Dikilitaşların üzerinde tilki, yaban domuzu, akbaba ve yılan gibi hayvan kabartmaları vardır. Klaus Schmidt'in 1995'te başlattığı kazılar, avcı-toplayıcıların anıtsal yapılar inşa edebildiğini gösterdi. Alan 2018'de UNESCO listesine girdi."]}, "fr": {"q": "Les piliers en forme de T de Göbekli Tepe, à Şanlıurfa, datent d'environ 9500 av. J.-C. et sont plusieurs milliers d'années plus anciens que Stonehenge.", "exp": "Vrai. Les couches les plus anciennes de Göbekli Tepe datent d'environ 9500 av. J.-C., avant la diffusion de l'agriculture.", "detail": ["Les piliers portent des reliefs d'animaux : renards, sangliers, vautours et serpents. Les fouilles de Klaus Schmidt, commencées en 1995, montrent que des chasseurs-cueilleurs pouvaient bâtir des monuments. Le site est inscrit à l'UNESCO depuis 2018."]}, "en": {"q": "The T-shaped pillars of Göbekli Tepe in Şanlıurfa date from about 9500 BCE and are thousands of years older than Stonehenge.", "exp": "True. The oldest layers of Göbekli Tepe date from about 9500 BCE, before farming spread.", "detail": ["The pillars carry reliefs of animals such as foxes, boars, vultures and snakes. Klaus Schmidt's excavations, begun in 1995, showed that hunter-gatherers could build monuments. The site joined the UNESCO list in 2018."]}, "id": "x-11-14", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": 1572, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "anatolia", "medium": "design", "tags": ["r-anatolia", "r-islam", "renaissance", "design"], "topics": ["r-anatolia", "r-islam", "renaissance", "design"], "search": {"commons": "Iznik tiles Rüstem Pasha Mosque", "wiki": {"en": "Iznik tiles Rüstem Pasha Mosque"}}, "answer": 2, "tr": {"q": "16. yüzyıl İznik çinilerinde 1550'lerden itibaren kullanılmaya başlanan ve çok değerli sayılan kabarık kırmızı renge ne ad verilir?", "opts": ["Lacivert", "Firuze", "Mercan kırmızısı (Bolus kırmızısı)", "Fıstık yeşili"], "exp": "1550'lerden itibaren İznik ustaları, demir oksitli bir kil ile elde edilen kabarık 'mercan kırmızısı'nı (Ermeni bolusu) kullanmaya başladı.", "detail": ["Bu renk, Rüstem Paşa Camii ve Süleymaniye gibi yapılarda görülür ve İznik'in klasik döneminin işaretidir. Lale, karanfil, sümbül ve 'saz yaprağı' motifleri bu dönemin tipik desenleridir."]}, "fr": {"q": "Comment appelle-t-on le rouge en relief, très précieux, utilisé dans les céramiques d'Iznik à partir des années 1550 ?", "opts": ["Le bleu nuit", "Le turquoise", "Le rouge corail (rouge bol)", "Le vert pistache"], "exp": "À partir des années 1550, les potiers d'Iznik utilisent un « rouge corail » en relief, obtenu avec une argile riche en oxyde de fer (bol d'Arménie).", "detail": ["On voit cette couleur dans la mosquée de Rüstem Pacha et à la Süleymaniye ; elle marque la période classique d'Iznik. Tulipes, œillets, jacinthes et feuilles « saz » sont les motifs typiques de l'époque."]}, "en": {"q": "What is the name of the precious raised red used in Iznik tiles from the 1550s onwards?", "opts": ["Navy blue", "Turquoise", "Coral red (bole red)", "Pistachio green"], "exp": "From the 1550s Iznik potters began to use a raised 'coral red' made from an iron-oxide-rich clay (Armenian bole).", "detail": ["This colour appears in the Rüstem Pasha Mosque and the Süleymaniye and marks Iznik's classic period. Tulips, carnations, hyacinths and 'saz' leaves are typical motifs of the time."]}, "id": "x-11-15", "t": 1794800000000}, {"type": "clues", "level": 3, "year": 1720, "era": {"tr": "18. yüzyıl", "fr": "18e siècle", "en": "18th century"}, "region": "anatolia", "medium": "painting", "tags": ["r-anatolia", "r-islam", "baroque", "painting"], "topics": ["r-anatolia", "r-islam", "baroque", "painting"], "search": {"commons": "Levni miniature Surname-i Vehbi", "wiki": {"en": "Levni miniature Surname-i Vehbi"}}, "answer": 1, "tr": {"q": "Ben kimim?", "clues": ["Edirne'de doğdum ve Lale Devri'nde saray nakkaşı oldum.", "III. Ahmed döneminde şehzadelerin sünnet şenliklerini anlatan 'Surname-i Vehbi'nin minyatürlerini yaptım.", "Tek figürlü, zarif kadın ve erkek portreleriyle Osmanlı minyatürüne yeni bir canlılık getirdim."], "opts": ["Nakkaş Osman", "Levni", "Matrakçı Nasuh", "Siyah Kalem"], "exp": "Cevap Levni'dir. Lale Devri'nin en önemli minyatür ressamıdır.", "detail": ["Levni, Osmanlı minyatürüne daha canlı renkler, hareketli figürler ve gündelik hayatın neşesini taşıdı. 'Surname-i Vehbi' bugün Topkapı Sarayı Müzesi Kütüphanesi'nde korunur."]}, "fr": {"q": "Qui suis-je ?", "clues": ["Je suis né à Edirne et je suis devenu peintre du palais pendant l'ère des Tulipes.", "Sous Ahmed III, j'ai peint les miniatures du « Surname-i Vehbi », qui raconte les fêtes de circoncision des princes.", "Avec mes portraits élégants d'une seule figure, homme ou femme, j'ai donné une nouvelle vie à la miniature ottomane."], "opts": ["Nakkaş Osman", "Levni", "Matrakçı Nasuh", "Siyah Kalem"], "exp": "La réponse est Levni, le plus grand peintre de miniatures de l'ère des Tulipes.", "detail": ["Levni apporte à la miniature ottomane des couleurs plus vives, des figures en mouvement et la joie de la vie quotidienne. Le « Surname-i Vehbi » est conservé à la bibliothèque du palais de Topkapı."]}, "en": {"q": "Who am I?", "clues": ["I was born in Edirne and became a court painter in the Tulip Era.", "Under Ahmed III, I painted the miniatures of the 'Surname-i Vehbi', which describes the princes' circumcision festivities.", "With my elegant single-figure portraits of men and women, I gave new life to Ottoman miniature painting."], "opts": ["Nakkaş Osman", "Levni", "Matrakçı Nasuh", "Siyah Kalem"], "exp": "The answer is Levni, the most important miniature painter of the Tulip Era.", "detail": ["Levni brought brighter colours, moving figures and the joy of everyday life to Ottoman miniature. The 'Surname-i Vehbi' is kept in the Topkapı Palace Museum Library."]}, "id": "x-11-16", "t": 1794800000000}, {"type": "match", "level": 3, "year": 1600, "era": {"tr": "16. yüzyıl", "fr": "16e siècle", "en": "16th century"}, "region": "islam", "medium": "arch", "tags": ["r-islam", "architecture", "medieval"], "topics": ["r-islam", "architecture", "medieval"], "search": {"commons": "", "wiki": {"en": ""}}, "tr": {"q": "İslam mimarisinin bu yapılarını bulundukları şehirlerle eşleştir.", "left": ["Kubbetü's-Sahra", "Kurtuba Ulu Camii", "Şah Camii (İmam Camii)", "Tac Mahal"], "right": ["Kudüs", "Kurtuba (Córdoba)", "İsfahan", "Agra"], "exp": "Bu dört yapı, İslam mimarisinin farklı bölge ve dönemlerdeki zirvelerini temsil eder.", "detail": ["Kubbetü's-Sahra 691–92'de tamamlandı ve en eski İslam anıtlarındandır. Kurtuba Camii'nin çift katlı kemerleri ünlüdür. İsfahan'daki Şah Camii Safevi dönemine, Tac Mahal ise Babür dönemine (1632–1653 civarı) aittir."]}, "fr": {"q": "Associe ces monuments de l'architecture islamique à leur ville.", "left": ["Le Dôme du Rocher", "La Grande Mosquée de Cordoue", "La mosquée du Shah (mosquée de l'Imam)", "Le Taj Mahal"], "right": ["Jérusalem", "Cordoue", "Ispahan", "Agra"], "exp": "Ces quatre monuments représentent des sommets de l'architecture islamique dans différentes régions et époques.", "detail": ["Le Dôme du Rocher, achevé en 691–692, est l'un des plus anciens monuments islamiques. La mosquée de Cordoue est célèbre pour ses arcs superposés. La mosquée du Shah à Ispahan est safavide, et le Taj Mahal moghol (vers 1632–1653)."]}, "en": {"q": "Match these monuments of Islamic architecture with their cities.", "left": ["The Dome of the Rock", "The Great Mosque of Córdoba", "The Shah Mosque (Imam Mosque)", "The Taj Mahal"], "right": ["Jerusalem", "Córdoba", "Isfahan", "Agra"], "exp": "These four buildings represent peaks of Islamic architecture in different regions and periods.", "detail": ["The Dome of the Rock, finished in 691–92, is one of the oldest Islamic monuments. The Córdoba mosque is famous for its double-tiered arches. The Shah Mosque in Isfahan is Safavid, and the Taj Mahal is Mughal (about 1632–1653)."]}, "id": "x-11-17", "t": 1794800000000}, {"type": "identify", "level": 1, "year": -1327, "era": {"tr": "MÖ 14. yüzyıl", "fr": "14e siècle av. J.-C.", "en": "14th century BCE"}, "region": "africa", "medium": "sculpture", "tags": ["ancient", "r-africa", "sculpture"], "topics": ["ancient", "r-africa", "sculpture"], "search": {"commons": "Tutankhamun gold mask", "wiki": {"en": "Mask of Tutankhamun"}}, "answer": 0, "tr": {"q": "Bu eser hangisi?", "opts": ["Tutankamon'un altın maskesi", "Nefertiti büstü", "Ramses II heykeli", "Ebu Simbel kabartması"], "exp": "Tutankamon'un altın mumya maskesi, 1922'de Howard Carter'ın bulduğu mezardan çıkmıştır ve yaklaşık MÖ 1327'ye tarihlenir.", "detail": ["Maske yaklaşık 10 kg altından yapılmıştır ve lacivert taşı, akik ve camla süslenmiştir. Mezar, Krallar Vadisi'nde neredeyse bozulmadan bulunan tek firavun mezarıdır. Maske Kahire'dedir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Le masque d'or de Toutânkhamon", "Le buste de Néfertiti", "Une statue de Ramsès II", "Un relief d'Abou Simbel"], "exp": "Le masque funéraire en or de Toutânkhamon vient de la tombe découverte par Howard Carter en 1922 ; il date d'environ 1327 av. J.-C.", "detail": ["Le masque est fait d'environ 10 kg d'or et décoré de lapis-lazuli, de cornaline et de verre. C'est la seule tombe de pharaon trouvée presque intacte dans la Vallée des Rois. Le masque est au Caire."]}, "en": {"q": "Which work is this?", "opts": ["The gold mask of Tutankhamun", "The bust of Nefertiti", "A statue of Ramesses II", "A relief from Abu Simbel"], "exp": "Tutankhamun's gold funerary mask comes from the tomb found by Howard Carter in 1922 and dates from about 1327 BCE.", "detail": ["It is made of about 10 kg of gold, inlaid with lapis lazuli, carnelian and glass. It is the only pharaoh's tomb found almost intact in the Valley of the Kings. The mask is in Cairo."]}, "id": "x-12-0", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": -210, "era": {"tr": "MÖ 3. yüzyıl", "fr": "3e siècle av. J.-C.", "en": "3th century BCE"}, "region": "asia", "medium": "sculpture", "tags": ["ancient", "r-fareast", "sculpture"], "topics": ["ancient", "r-fareast", "sculpture"], "search": {"commons": "Terracotta Army Xi'an", "wiki": {"en": "Terracotta Army"}}, "answer": 2, "tr": {"q": "Çin'deki Terakota Ordusu hangi imparatorun mezarını korumak için yapıldı?", "opts": ["Han Wudi", "Tang Taizong", "Qin Shi Huang", "Kubilay Han"], "exp": "Terakota Ordusu, Çin'i ilk kez birleştiren imparator Qin Shi Huang'ın (MÖ 3. yüzyıl) Xi'an yakınındaki mezar kompleksinin parçasıdır.", "detail": ["1974'te köylüler kuyu kazarken buldu. Binlerce asker, at ve araba vardır; yüzlerin her biri farklıdır ve heykeller aslında boyalıydı. İmparatorun asıl mezar odası hâlâ kazılmadı."]}, "fr": {"q": "L'Armée de terre cuite en Chine a été faite pour protéger la tombe de quel empereur ?", "opts": ["Han Wudi", "Tang Taizong", "Qin Shi Huang", "Kubilai Khan"], "exp": "L'Armée de terre cuite fait partie du complexe funéraire de Qin Shi Huang, premier empereur à unifier la Chine (IIIe siècle av. J.-C.), près de Xi'an.", "detail": ["Des paysans l'ont découverte en 1974 en creusant un puits. Il y a des milliers de soldats, de chevaux et de chars ; chaque visage est différent et les statues étaient peintes. La chambre funéraire de l'empereur n'a pas encore été fouillée."]}, "en": {"q": "The Terracotta Army in China was made to protect the tomb of which emperor?", "opts": ["Han Wudi", "Tang Taizong", "Qin Shi Huang", "Kublai Khan"], "exp": "The Terracotta Army is part of the tomb complex of Qin Shi Huang, the first emperor to unify China (3rd century BCE), near Xi'an.", "detail": ["Farmers found it in 1974 while digging a well. There are thousands of soldiers, horses and chariots; every face is different and the figures were once painted. The emperor's own burial chamber has not yet been excavated."]}, "id": "x-12-1", "t": 1794800000000}, {"type": "tf", "level": 2, "year": -15000, "era": {"tr": "MÖ 150. yüzyıl", "fr": "150e siècle av. J.-C.", "en": "150th century BCE"}, "region": "europe", "medium": "painting", "tags": ["ancient", "painting", "r-europe"], "topics": ["ancient", "painting", "r-europe"], "search": {"commons": "Lascaux cave paintings", "wiki": {"en": "Lascaux cave paintings"}}, "answer": false, "tr": {"q": "Lascaux Mağarası, ziyaretçilere orijinal hâliyle hâlâ açıktır.", "exp": "Yanlış. Lascaux 1963'te ziyaretçilere kapatıldı, çünkü insanların nefesi ve ışık resimlere zarar veriyordu. Ziyaretçiler bugün kopyaları (Lascaux II, IV) gezer.", "detail": ["Mağara 1940'ta dört genç tarafından bulundu ve yaklaşık 17.000 yıllık at, boğa ve geyik resimleri içerir. 2016'da açılan Lascaux IV, mağaranın neredeyse tamamının birebir kopyasıdır."]}, "fr": {"q": "La grotte de Lascaux est toujours ouverte aux visiteurs dans son état d'origine.", "exp": "Faux. Lascaux est fermée au public depuis 1963, car la respiration et la lumière abîmaient les peintures. Les visiteurs voient aujourd'hui des copies (Lascaux II, IV).", "detail": ["La grotte a été découverte en 1940 par quatre adolescents ; elle contient des chevaux, des taureaux et des cerfs peints il y a environ 17 000 ans. Lascaux IV, ouvert en 2016, reproduit presque toute la grotte."]}, "en": {"q": "Lascaux Cave is still open to visitors in its original state.", "exp": "False. Lascaux was closed to the public in 1963 because people's breath and light were damaging the paintings. Visitors now see copies (Lascaux II, IV).", "detail": ["The cave was found in 1940 by four teenagers and holds horses, bulls and deer painted about 17,000 years ago. Lascaux IV, opened in 2016, reproduces almost the whole cave."]}, "id": "x-12-2", "t": 1794800000000}, {"type": "order", "level": 2, "year": -1000, "era": {"tr": "MÖ 10. yüzyıl", "fr": "10e siècle av. J.-C.", "en": "10th century BCE"}, "region": "world", "medium": "arch", "tags": ["ancient", "architecture"], "topics": ["ancient", "architecture"], "search": {"commons": "", "wiki": {"en": ""}}, "years": ["c. 2560 BCE", "c. 2500 BCE", "432 BCE", "80 CE"], "tr": {"q": "Bu antik yapıları eskiden yeniye sırala.", "items": ["Büyük Giza Piramidi", "Stonehenge'in büyük sarsen taşları", "Atina Parthenon'u", "Roma Kolezyumu"], "exp": "Giza Piramidi yaklaşık MÖ 2560, Stonehenge'in büyük taşları yaklaşık MÖ 2500, Parthenon MÖ 432, Kolezyum MS 80 tarihlidir.", "detail": ["Stonehenge çok aşamalı bir yapıdır; ilk hendek MÖ 3000 civarına kadar gider, ama büyük sarsen taşları piramitlerle neredeyse aynı dönemde dikildi. Kolezyum İmparator Titus döneminde açıldı."]}, "fr": {"q": "Classe ces monuments antiques du plus ancien au plus récent.", "items": ["La grande pyramide de Gizeh", "Les grands sarsens de Stonehenge", "Le Parthénon d'Athènes", "Le Colisée de Rome"], "exp": "La pyramide de Gizeh date d'environ 2560 av. J.-C., les grands sarsens de Stonehenge d'environ 2500 av. J.-C., le Parthénon de 432 av. J.-C. et le Colisée de 80 apr. J.-C.", "detail": ["Stonehenge a été construit en plusieurs phases : le premier fossé date d'environ 3000 av. J.-C., mais les grandes pierres sont dressées presque en même temps que les pyramides. Le Colisée est inauguré sous l'empereur Titus."]}, "en": {"q": "Put these ancient monuments in order, oldest first.", "items": ["The Great Pyramid of Giza", "The great sarsen stones of Stonehenge", "The Parthenon in Athens", "The Colosseum in Rome"], "exp": "The Giza pyramid dates from about 2560 BCE, Stonehenge's great sarsens from about 2500 BCE, the Parthenon from 432 BCE and the Colosseum from 80 CE.", "detail": ["Stonehenge was built in several phases; the first ditch goes back to about 3000 BCE, but the great sarsens were raised at almost the same time as the pyramids. The Colosseum was opened under Emperor Titus."]}, "id": "x-12-3", "t": 1794800000000}, {"type": "mcq", "level": 3, "year": -175, "era": {"tr": "MÖ 2. yüzyıl", "fr": "2e siècle av. J.-C.", "en": "2th century BCE"}, "region": "anatolia", "medium": "sculpture", "tags": ["ancient", "r-anatolia", "sculpture", "r-europe"], "topics": ["ancient", "r-anatolia", "sculpture", "r-europe"], "search": {"commons": "Laocoön and His Sons", "wiki": {"en": "Laocoön and His Sons"}}, "answer": 1, "tr": {"q": "1506'da Roma'da bulunan ve Michelangelo'nun da kazıda bulunduğu söylenen ünlü Helenistik heykel grubu hangisidir?", "opts": ["Semadirek Nike'si", "Laokoon ve Oğulları", "Belvedere Apollonu", "Ölen Galyalı"], "exp": "Laokoon ve Oğulları, 1506'da Roma'da bir bağda bulundu; Papa II. Julius onu satın aldı ve bugün Vatikan Müzeleri'ndedir.", "detail": ["Heykel, Truva rahibi Laokoon'un ve oğullarının yılanlar tarafından boğulmasını gösterir. Plinius onu Rodoslu üç heykeltıraşa atfetti. Acıyı gösteren güçlü ifadesi Rönesans ve Barok sanatçılarını derinden etkiledi."]}, "fr": {"q": "Quel célèbre groupe sculpté hellénistique a été découvert à Rome en 1506, peut-être en présence de Michel-Ange ?", "opts": ["La Victoire de Samothrace", "Le Laocoon et ses fils", "L'Apollon du Belvédère", "Le Galate mourant"], "exp": "Le Laocoon a été trouvé en 1506 dans une vigne à Rome ; le pape Jules II l'a acheté et il est aujourd'hui aux musées du Vatican.", "detail": ["Il montre le prêtre troyen Laocoon et ses fils étouffés par des serpents. Pline l'attribuait à trois sculpteurs de Rhodes. Son expression puissante de la douleur a beaucoup influencé les artistes de la Renaissance et du baroque."]}, "en": {"q": "Which famous Hellenistic sculpture group was found in Rome in 1506, reportedly with Michelangelo present?", "opts": ["The Winged Victory of Samothrace", "Laocoön and His Sons", "The Apollo Belvedere", "The Dying Gaul"], "exp": "Laocoön and His Sons was found in a vineyard in Rome in 1506; Pope Julius II bought it and it is now in the Vatican Museums.", "detail": ["It shows the Trojan priest Laocoön and his sons strangled by snakes. Pliny attributed it to three sculptors from Rhodes. Its powerful expression of pain deeply influenced Renaissance and Baroque artists."]}, "id": "x-12-4", "t": 1794800000000}, {"type": "identify", "level": 2, "year": 1070, "era": {"tr": "11. yüzyıl", "fr": "11e siècle", "en": "11th century"}, "region": "europe", "medium": "design", "tags": ["medieval", "r-europe", "design", "women"], "topics": ["medieval", "r-europe", "design", "women"], "search": {"commons": "Bayeux Tapestry", "wiki": {"en": "Bayeux Tapestry"}}, "answer": 3, "tr": {"q": "Bu eser hangisi?", "opts": ["Kells Kitabı", "Lindisfarne İncili", "Apokalips Halısı (Angers)", "Bayeux Halısı"], "exp": "Bayeux Halısı, 1066'daki Hastings Savaşı'na giden olayları ve Normanların İngiltere'yi fethini anlatan yaklaşık 70 metrelik işlemeli bir kumaştır.", "detail": ["Aslında dokuma değil, keten üzerine yün iplikle yapılmış bir nakıştır; muhtemelen İngiltere'de, 1070'lerde yapıldı. Normandiya'daki Bayeux kentinde sergilenir."]}, "fr": {"q": "Quelle est cette œuvre ?", "opts": ["Le Livre de Kells", "Les Évangiles de Lindisfarne", "La Tenture de l'Apocalypse (Angers)", "La Tapisserie de Bayeux"], "exp": "La Tapisserie de Bayeux est une broderie d'environ 70 mètres qui raconte les événements menant à la bataille d'Hastings en 1066 et la conquête normande de l'Angleterre.", "detail": ["Ce n'est pas vraiment une tapisserie, mais une broderie de laine sur lin, probablement faite en Angleterre vers 1070. Elle est exposée à Bayeux, en Normandie."]}, "en": {"q": "Which work is this?", "opts": ["The Book of Kells", "The Lindisfarne Gospels", "The Apocalypse Tapestry (Angers)", "The Bayeux Tapestry"], "exp": "The Bayeux Tapestry is an embroidered cloth about 70 metres long telling the events that led to the Battle of Hastings in 1066 and the Norman conquest of England.", "detail": ["It is not really a tapestry but wool embroidery on linen, probably made in England in the 1070s. It is shown in Bayeux, in Normandy."]}, "id": "x-12-5", "t": 1794800000000}, {"type": "mcq", "level": 2, "year": 537, "era": {"tr": "6. yüzyıl", "fr": "6e siècle", "en": "6th century"}, "region": "anatolia", "medium": "arch", "tags": ["medieval", "r-anatolia", "architecture"], "topics": ["medieval", "r-anatolia", "architecture"], "search": {"commons": "Hagia Sophia interior", "wiki": {"en": "Hagia Sophia"}}, "answer": 0, "tr": {"q": "537'de tamamlanan Ayasofya'nın mimarları kimlerdir?", "opts": ["Miletli İsidoros ve Trallesli Anthemios", "Mimar Sinan ve Davut Ağa", "Iktinos ve Kallikrates", "Vitruvius ve Apollodoros"], "exp": "İmparator Iustinianus, Ayasofya'yı matematikçi-mimarlar Trallesli Anthemios ve Miletli İsidoros'a yaptırdı.", "detail": ["Yaklaşık 31 metre çapındaki kubbe, pandantiflerle kare bir planın üzerine oturtuldu; bu, mimarlıkta büyük bir yenilikti. Kubbe 558'de bir depremde çöktü ve daha yüksek biçimde yeniden yapıldı."]}, "fr": {"q": "Qui sont les architectes de Sainte-Sophie, achevée en 537 ?", "opts": ["Isidore de Milet et Anthémios de Tralles", "Sinan et Davut Ağa", "Ictinos et Callicratès", "Vitruve et Apollodore"], "exp": "L'empereur Justinien a confié Sainte-Sophie aux mathématiciens-architectes Anthémios de Tralles et Isidore de Milet.", "detail": ["La coupole d'environ 31 mètres de diamètre repose sur un plan carré grâce à des pendentifs, une grande innovation. Elle s'est effondrée lors d'un séisme en 558, puis a été reconstruite plus haute."]}, "en": {"q": "Who were the architects of Hagia Sophia, completed in 537?", "opts": ["Isidore of Miletus and Anthemius of Tralles", "Sinan and Davut Ağa", "Iktinos and Kallikrates", "Vitruvius and Apollodorus"], "exp": "Emperor Jus
